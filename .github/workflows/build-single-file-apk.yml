name: Build Single File APK & AAB

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'android-wrapper/**'
      - '.github/workflows/build-single-file-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT"

          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools/tmp"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdlinetools.zip
            unzip -q /tmp/cmdlinetools.zip -d "$SDK_ROOT/cmdline-tools/tmp"
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            mv "$SDK_ROOT/cmdline-tools/tmp/cmdline-tools/"* "$SDK_ROOT/cmdline-tools/latest/"
            rm -rf "$SDK_ROOT/cmdline-tools/tmp" /tmp/cmdlinetools.zip
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$SDK_ROOT" > android-wrapper/local.properties

      - name: Copy index.html into Android Assets
        run: |
          mkdir -p android-wrapper/app/src/main/assets
          cp index.html android-wrapper/app/src/main/assets/index.html

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK and Release AAB
        working-directory: android-wrapper
        run: gradle assembleDebug bundleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Droid-AI-Studio-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Droid-AI-Studio-AAB
          path: android-wrapper/app/build/outputs/bundle/release/app-release.aab
