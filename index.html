    <script type="text/babel">
      const { useState, useEffect, useRef, useMemo, useCallback } = React;

      // =========================================================================
      // 1. STRICT PER-USER BYOK STORAGE HELPERS & LOCKED PACKAGE PREFIX
      // =========================================================================
      const LOCKED_PACKAGE_PREFIX = "com.droid.";

      function getUserScopedKeyStorageName(uid) {
        return uid ? `droid_studio_gemini_key_${uid}` : "droid_studio_gemini_key_guest";
      }

      function getUserScopedProjectsStorageName(uid) {
        return uid ? `droid_studio_projects_${uid}` : "droid_studio_projects_guest";
      }

      function getUserScopedHistoryStorageName(uid) {
        return uid ? `droid_studio_history_${uid}` : "droid_studio_history_guest";
      }

      function getUserScopedProjectChatsStorageName(uid) {
        return uid ? `droid_studio_project_chats_${uid}` : "droid_studio_project_chats_guest";
      }

      function getUserScopedProjectAiSettingsStorageName(uid) {
        return uid
          ? `droid_studio_project_ai_settings_${uid}`
          : "droid_studio_project_ai_settings_guest";
      }

      function createInitialProjectChatMessages(projectName) {
        const label = projectName ? `"${projectName}"` : "Droid AI Studio";
        return [
          {
            id: `welcome_${Date.now()}`,
            role: "assistant",
            text: `স্বাগতম ${label} প্রজেক্টে! এই প্রজেক্টটি শূন্য (০টি ফাইল) থেকে শুরু হয়েছে—কোনো ডিফল্ট কোড, টেমপ্লেট বা কালার আগে থেকে সেট করা নেই। বাংলায় চ্যাট করুন, 🎤 কথা বলুন বা স্ক্রিনশট শেয়ার করে আপনার পূর্ণাঙ্গ UI/UX ডিজাইন ও কার্যকর লজিক তৈরি করুন। সম্পূর্ণ প্রজেক্ট তৈরি ও Accept করার পরই প্রিভিউ আনলক হবে।`,
            timestamp: Date.now()
          }
        ];
      }

      function createFreshNewAppBuilderMessages() {
        return [
          {
            id: `new_app_welcome_${Date.now()}`,
            role: "assistant",
            text: "🎤 নতুন অ্যাপ তৈরির লকড সেশন চালু হয়েছে (পুরনো কোনো প্রজেক্ট সিলেক্ট করা নেই)। এখন নিচের 🎤 মাইক্রোফোনে কথা বলে বা টাইপ করে বলুন আপনি কী ধরনের Android অ্যাপ বানাতে চান। সম্পূর্ণ UI/UX ডিজাইন ও লজিক তৈরি এবং ✅ Accept করার পরেই প্রিভিউ আনলক হবে, এবং আপনি 🚪 Exit Project না করা পর্যন্ত AI কেবল এই প্রজেক্টের ওপরই কাজ করবে!",
            timestamp: Date.now()
          }
        ];
      }

      function sanitizeEmailKey(email) {
        return String(email || "")
          .trim()
          .toLowerCase()
          .replace(/[.#$\[\]]/g, "_");
      }

      function sanitizeAppPackageSuffix(rawText) {
        const cleaned = String(rawText || "")
          .toLowerCase()
          .replace(/^com\.droid\./i, "")
          .replace(/[^a-z0-9]/g, "")
          .slice(0, 24);
        return cleaned || "myapp";
      }

      function buildLockedPackageName(suffixOrAppName) {
        const suffix = sanitizeAppPackageSuffix(suffixOrAppName);
        return `${LOCKED_PACKAGE_PREFIX}${suffix}`;
      }

      // =========================================================================
      // 2. GEMINI REST API (v1beta) MODEL DISCOVERY & FILTERING
      // =========================================================================
      const PREFERRED_MODEL_ORDER = [
        "gemini-3.8-flash",
        "gemini-3-flash-preview",
        "gemini-2.5-flash",
        "gemini-2.5-flash-lite",
        "gemini-2.5-pro",
        "gemini-flash-latest",
        "gemini-pro-latest"
      ];

      const EXCLUDED_MODEL_KEYWORDS = [
        "tts",
        "audio",
        "image",
        "imagen",
        "veo",
        "embedding",
        "aqa",
        "bisheng",
        "robotics",
        "computer-use",
        "customtools"
      ];

      function isEligibleTextCodeModel(modelObj) {
        const rawName = String(modelObj?.name || "").toLowerCase();
        const shortId = rawName.replace(/^models\//, "");
        if (!shortId.includes("gemini")) return false;

        const methods = Array.isArray(modelObj?.supportedGenerationMethods)
          ? modelObj.supportedGenerationMethods
          : [];
        if (methods.length > 0 && !methods.includes("generateContent")) {
          return false;
        }

        for (const badWord of EXCLUDED_MODEL_KEYWORDS) {
          if (shortId.includes(badWord)) {
            return false;
          }
        }
        return true;
      }

      function sortModelsByPriority(modelsList) {
        return [...modelsList].sort((a, b) => {
          const idxA = PREFERRED_MODEL_ORDER.indexOf(a.id);
          const idxB = PREFERRED_MODEL_ORDER.indexOf(b.id);
          if (idxA !== -1 && idxB !== -1) return idxA - idxB;
          if (idxA !== -1) return -1;
          if (idxB !== -1) return 1;
          return a.id.localeCompare(b.id);
        });
      }

      async function discoverEligibleGeminiModels(apiKey, externalSignal) {
        const cleanKey = String(apiKey || "").trim();
        if (!cleanKey) {
          throw new Error("অনুগ্রহ করে প্রথমে আপনার নিজস্ব Gemini API Key বসান।");
        }

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 18000);
        if (externalSignal) {
          externalSignal.addEventListener("abort", () => controller.abort(), { once: true });
        }

        try {
          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(
              cleanKey
            )}`,
            {
              method: "GET",
              signal: controller.signal
            }
          );

          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            const errMsg =
              data?.error?.message || `API যাচাই ব্যর্থ হয়েছে (HTTP ${res.status})। সঠিক কী দিন।`;
            throw new Error(errMsg);
          }

          const rawModels = Array.isArray(data?.models) ? data.models : [];
          const filtered = rawModels
            .filter(isEligibleTextCodeModel)
            .map((m) => {
              const id = String(m.name || "").replace(/^models\//, "");
              return {
                id,
                displayName: m.displayName || id,
                description: m.description || ""
              };
            });

          const sorted = sortModelsByPriority(filtered);
          if (sorted.length === 0) {
            return PREFERRED_MODEL_ORDER.map((id) => ({
              id,
              displayName: id,
              description: "Default fallback text/code model"
            }));
          }
          return sorted;
        } finally {
          clearTimeout(timeoutId);
        }
      }

      // =========================================================================
      // 3. SDK OPTIONS & ZERO-DEFAULT PURE RAW PROJECT GENERATOR
      // =========================================================================
      const MIN_SDK_OPTIONS = [
        { api: 21, label: "API 21: Android 5.0 (Lollipop)" },
        { api: 23, label: "API 23: Android 6.0 (Marshmallow)" },
        { api: 24, label: "API 24: Android 7.0 (Nougat)" },
        { api: 26, label: "API 26: Android 8.0 (Oreo)" },
        { api: 28, label: "API 28: Android 9.0 (Pie)" },
        { api: 30, label: "API 30: Android 11 (R)" },
        { api: 33, label: "API 33: Android 13 (Tiramisu)" },
        { api: 34, label: "API 34: Android 14 (UpsideDownCake)" }
      ];

      const TARGET_SDK_OPTIONS = [
        { api: 34, label: "API 34: Android 14 (UpsideDownCake)" },
        { api: 35, label: "API 35: Android 15 (VanillaIceCream)" }
      ];

      function generateAuthenticAndroidProject({
        name,
        packageSuffix,
        codeLang,
        minSdk,
        targetSdk,
        buildConfigDsl,
        useViewBinding,
        customLogoDataUrl,
        customLogoName
      }) {
        const cleanName = String(name || "Droid App").trim();
        const lockedPkg = buildLockedPackageName(packageSuffix || cleanName);
        const isJava = codeLang === "java";
        const isGroovy = buildConfigDsl === "groovy";
        const parsedMinSdk = Number(minSdk) || 24;
        const parsedTargetSdk = Number(targetSdk) || 35;
        const vbEnabled = useViewBinding !== false;
        const hasLogo = Boolean(customLogoDataUrl);
        const now = Date.now();

        // STRICT RULE: Zero default files on creation. Only explicitly uploaded logo asset is included if provided.
        const files = [];
        if (hasLogo) {
          files.push({
            path: "app/src/main/res/drawable/app_logo_custom.png",
            assetDataUrl: customLogoDataUrl,
            content: customLogoDataUrl
          });
        }

        return {
          id: `proj_${now}_${Math.random().toString(36).slice(2, 5)}`,
          name: cleanName,
          packageName: lockedPkg,
          templateId: "raw-custom",
          language: isJava ? "java" : "kotlin",
          minSdk: parsedMinSdk,
          targetSdk: parsedTargetSdk,
          buildConfigDsl: isGroovy ? "groovy" : "kts",
          useViewBinding: vbEnabled,
          logoDataUrl: customLogoDataUrl || "",
          logoFileName: customLogoName || "",
          updatedAt: now,
          files
        };
      }

      // =========================================================================
      // 4. PARSE AI MULTI-FILE CODE & CONVERSATIONAL PROJECT METADATA
      // =========================================================================
      function parseAiFileBlocks(aiResponseText) {
        const text = String(aiResponseText || "");
        const extracted = [];

        const tagRegex = /<<<FILE:\s*([^\n>]+?)\s*>>>\s*\n([\s\S]*?)<<<END_FILE>>>/g;
        let match;
        while ((match = tagRegex.exec(text)) !== null) {
          const filePath = match[1].trim();
          let fileContent = match[2].replace(/^\n+|\n+$/g, "");
          fileContent = fileContent.replace(/^```[a-zA-Z0-9_-]*\n/, "").replace(/\n```$/, "");
          if (filePath && fileContent) {
            extracted.push({ path: filePath, content: fileContent });
          }
        }

        if (extracted.length === 0) {
          const fenceRegex =
            /(?:File|ফাইল|Path|পাথ)\s*:\s*`?([^\n`]+)`?\s*\n```[a-zA-Z0-9_-]*\n([\s\S]*?)```/gi;
          while ((match = fenceRegex.exec(text)) !== null) {
            const filePath = match[1].trim();
            const fileContent = match[2].trim();
            if (filePath && fileContent) {
              extracted.push({ path: filePath, content: fileContent });
            }
          }
        }

        return extracted;
      }

      function parseAiProjectMeta(aiResponseText) {
        const text = String(aiResponseText || "");
        const metaMatch = text.match(/<<<PROJECT_META>>>\s*([\s\S]*?)<<<END_PROJECT_META>>>/);
        if (!metaMatch) return null;
        try {
          const parsed = JSON.parse(metaMatch[1].trim());
          if (parsed && typeof parsed === "object") {
            return parsed;
          }
        } catch (err) {
          console.warn("Could not parse PROJECT_META JSON:", err);
        }
        return null;
      }

      function inferProjectNameFromUserPrompt(promptText) {
        const clean = String(promptText || "")
          .replace(/[^\u0980-\u09FFa-zA-Z0-9\s]/g, " ")
          .trim();
        if (!clean) return "My Droid App";
        const words = clean.split(/\s+/).slice(0, 3).join(" ");
        return words.length > 26 ? words.slice(0, 26) : words;
      }

      function isCompleteBuildProposal(filesList) {
        if (!Array.isArray(filesList) || filesList.length === 0) return false;
        const codeFiles = filesList.filter(
          (f) => !f.assetDataUrl && !f.path.toLowerCase().endsWith(".png")
        );
        if (codeFiles.length === 0) return false;
        const hasLayout = codeFiles.some((f) =>
          f.path.toLowerCase().includes("res/layout/") || f.path.toLowerCase().endsWith(".xml")
        );
        const hasLogic = codeFiles.some(
          (f) => f.path.toLowerCase().endsWith(".kt") || f.path.toLowerCase().endsWith(".java")
        );
        // Either full layout+logic pair OR updating an already-complete project with valid code
        return (hasLayout && hasLogic) || codeFiles.length >= 1;
      }

      function buildDraftProjectFromAiResponse(aiResponseText, userPromptFallback, existingDraft) {
        const meta = parseAiProjectMeta(aiResponseText) || {};
        const fileUpdates = parseAiFileBlocks(aiResponseText);

        const extractedName =
          String(meta.appName || "").trim() ||
          existingDraft?.name ||
          inferProjectNameFromUserPrompt(userPromptFallback);

        const rawSuffix =
          String(meta.packageSuffix || meta.packageName || "").trim() || extractedName;
        const pkgSuffix = sanitizeAppPackageSuffix(rawSuffix);
        const codeLang =
          String(meta.language || existingDraft?.language || "").toLowerCase() === "java"
            ? "java"
            : "kotlin";
        const minSdk = Number(meta.minSdk) || existingDraft?.minSdk || 24;
        const targetSdk = Number(meta.targetSdk) || existingDraft?.targetSdk || 35;

        const baseProject = existingDraft
          ? {
              ...existingDraft,
              name: extractedName,
              packageName: buildLockedPackageName(pkgSuffix),
              language: codeLang,
              minSdk,
              targetSdk,
              updatedAt: Date.now()
            }
          : generateAuthenticAndroidProject({
              name: extractedName,
              packageSuffix: pkgSuffix,
              codeLang,
              minSdk,
              targetSdk,
              buildConfigDsl: "kts",
              useViewBinding: true
            });

        if (fileUpdates.length > 0) {
          baseProject.files = applyFileUpdatesToProject(baseProject, fileUpdates);
        }

        return {
          draftProject: baseProject,
          fileUpdatesCount: fileUpdates.length
        };
      }

      function applyFileUpdatesToProject(project, fileUpdates) {
        if (!project || !Array.isArray(fileUpdates) || fileUpdates.length === 0) {
          return project?.files || [];
        }
        const nextFiles = [...project.files];
        fileUpdates.forEach((upd) => {
          const cleanUpdPath = upd.path.replace(/^\/+/, "");
          const exactIdx = nextFiles.findIndex(
            (f) => f.path.toLowerCase() === cleanUpdPath.toLowerCase()
          );
          if (exactIdx !== -1) {
            nextFiles[exactIdx] = { ...nextFiles[exactIdx], content: upd.content };
          } else {
            const baseName = cleanUpdPath.split("/").pop().toLowerCase();
            const suffixIdx = nextFiles.findIndex(
              (f) => f.path.split("/").pop().toLowerCase() === baseName
            );
            if (suffixIdx !== -1 && !cleanUpdPath.includes("/")) {
              nextFiles[suffixIdx] = { ...nextFiles[suffixIdx], content: upd.content };
            } else {
              nextFiles.push({ path: cleanUpdPath, content: upd.content });
            }
          }
        });
        return nextFiles;
      }

      function formatChatMessageText(rawText) {
        return String(rawText || "")
          .replace(/<<<PROJECT_META>>>[\s\S]*?<<<END_PROJECT_META>>>/g, "")
          .replace(
            /<<<FILE:\s*([^\n>]+?)\s*>>>[\s\S]*?<<<END_FILE>>>/g,
            (_, filePath) => `\n📄 **[ফাইল তৈরি/আপডেট: ${filePath.trim()}]**\n`
          )
          .trim();
      }

      // =========================================================================
      // 5. LIVE ANDROID EMULATOR PARSER (SUPPORTS CARDS, GRIDS, INPUTS & LOGIC)
      // =========================================================================
      function normalizeAndroidHexColor(rawColor, fallback) {
        const val = String(rawColor || "").trim();
        if (!val.startsWith("#")) return fallback;
        if (val.length === 9) {
          return `#${val.slice(3)}${val.slice(1, 3)}`;
        }
        if (val.length === 7 || val.length === 4) return val;
        return fallback;
      }

      function parseProjectForLivePreview(project) {
        const files = Array.isArray(project?.files) ? project.files : [];
        const codeFiles = files.filter(
          (f) => !f.assetDataUrl && !f.path.toLowerCase().endsWith(".png")
        );

        const defaultResult = {
          hasCodeFiles: codeFiles.length > 0,
          hasCompleteUiAndLogic: false,
          appTitle: project?.name || "Droid App",
          subtitle: "",
          bgColor: "#f8fafc",
          headerBg: "#0f172a",
          headerTextColor: "#ffffff",
          accentColor: "#10b981",
          widgets: [],
          cards: [],
          hasRecycler: false,
          isCalculatorLike: false,
          formulaType: "generic"
        };

        if (!project || codeFiles.length === 0) return defaultResult;

        const layoutFiles = codeFiles.filter((f) =>
          f.path.toLowerCase().includes("res/layout/") || f.path.toLowerCase().endsWith(".xml")
        );
        const layoutFile =
          layoutFiles.find((f) => f.path.toLowerCase().includes("activity_main")) ||
          layoutFiles[0];

        const logicFiles = codeFiles.filter(
          (f) =>
            f.path.toLowerCase().endsWith(".kt") || f.path.toLowerCase().endsWith(".java")
        );
        const combinedLogic = logicFiles.map((f) => f.content).join("\n");

        defaultResult.hasCompleteUiAndLogic = Boolean(layoutFile && logicFiles.length > 0);

        const colorsFile = codeFiles.find((f) => f.path.toLowerCase().includes("colors.xml"));
        const colorMap = {};
        if (colorsFile) {
          const colorRegex = /<color\s+name="([^"]+)">([^<]+)<\/color>/g;
          let cm;
          while ((cm = colorRegex.exec(colorsFile.content)) !== null) {
            colorMap[cm[1]] = normalizeAndroidHexColor(cm[2].trim(), null);
          }
        }

        const stringsFile = codeFiles.find((f) =>
          f.path.toLowerCase().includes("strings.xml")
        );
        const stringMap = {};
        if (stringsFile) {
          const strRegex = /<string\s+name="([^"]+)">([^<]+)<\/string>/g;
          let sm;
          while ((sm = strRegex.exec(stringsFile.content)) !== null) {
            stringMap[sm[1]] = sm[2].trim();
          }
        }

        const resolveText = (raw) => {
          if (!raw) return "";
          const strRef = raw.match(/^@string\/(.+)$/);
          if (strRef && stringMap[strRef[1]]) return stringMap[strRef[1]];
          return raw;
        };

        const resolveColor = (raw, fallback) => {
          if (!raw) return fallback;
          const colRef = raw.match(/^@color\/(.+)$/);
          if (colRef && colorMap[colRef[1]]) return colorMap[colRef[1]];
          return normalizeAndroidHexColor(raw, fallback);
        };

        if (stringMap.app_name) defaultResult.appTitle = stringMap.app_name;
        if (colorMap.colorPrimary) defaultResult.accentColor = colorMap.colorPrimary;

        const lowerAll = `${layoutFile?.content || ""}\n${combinedLogic}`.toLowerCase();
        if (lowerAll.includes("sip") || lowerAll.includes("compound") || lowerAll.includes("pow(")) {
          defaultResult.formulaType = "sip";
        } else if (lowerAll.includes("emi") || lowerAll.includes("loan")) {
          defaultResult.formulaType = "emi";
        } else if (lowerAll.includes("bmi")) {
          defaultResult.formulaType = "bmi";
        }

        if (layoutFile) {
          const xml = layoutFile.content;
          const rootBgMatch = xml.match(/android:background="([^"]+)"/);
          if (rootBgMatch) {
            defaultResult.bgColor = resolveColor(rootBgMatch[1], "#f8fafc");
          }

          const widgetRegex =
            /<([a-zA-Z0-9_.]+)\b([^>]*?)(?:\/>|>([\s\S]*?)<\/\1>)/g;
          let wm;
          let idx = 0;
          while ((wm = widgetRegex.exec(xml)) !== null) {
            const fullTag = wm[1];
            const tagName = fullTag.split(".").pop();
            const attrs = wm[2] || "";

            if (
              tagName === "LinearLayout" ||
              tagName === "ConstraintLayout" ||
              tagName === "RelativeLayout" ||
              tagName === "ScrollView" ||
              tagName === "NestedScrollView" ||
              tagName === "FrameLayout" ||
              tagName === "GridLayout"
            ) {
              continue;
            }

            const idMatch = attrs.match(/android:id="@\+id\/([^"]+)"/);
            const textMatch = attrs.match(/android:text="([^"]+)"/);
            const hintMatch = attrs.match(/android:hint="([^"]+)"/);
            const bgMatch = attrs.match(/android:background="([^"]+)"/);
            const bgTintMatch = attrs.match(/app:backgroundTint="([^"]+)"/);
            const textColorMatch = attrs.match(/android:textColor="([^"]+)"/);
            const textSizeMatch = attrs.match(/android:textSize="(\d+)/);
            const inputTypeMatch = attrs.match(/android:inputType="([^"]+)"/);

            const id = idMatch ? idMatch[1] : `widget_${idx++}`;
            const text = resolveText(textMatch ? textMatch[1] : "");
            const hint = resolveText(hintMatch ? hintMatch[1] : "");
            const bg = resolveColor(bgTintMatch?.[1] || bgMatch?.[1], "");
            const textColor = resolveColor(textColorMatch?.[1], "");
            const textSize = textSizeMatch ? Number(textSizeMatch[1]) : 14;
            const inputType = inputTypeMatch ? inputTypeMatch[1] : "text";

            if (tagName.includes("RecyclerView")) {
              defaultResult.hasRecycler = true;
            } else if (tagName.includes("EditText") || tagName.includes("TextInputEditText")) {
              defaultResult.widgets.push({
                kind: "input",
                id,
                hint: hint || text || "মান লিখুন...",
                text,
                inputType
              });
            } else if (tagName.includes("Button")) {
              defaultResult.widgets.push({
                kind: "button",
                id,
                text: text || "Action",
                bg: bg || defaultResult.accentColor,
                textColor: textColor || "#ffffff"
              });
            } else if (
              tagName.includes("Switch") ||
              tagName.includes("CheckBox") ||
              tagName.includes("RadioButton")
            ) {
              defaultResult.widgets.push({
                kind: "switch",
                id,
                text: text || id
              });
            } else if (tagName.includes("ProgressBar")) {
              defaultResult.widgets.push({
                kind: "progress",
                id
              });
            } else if (tagName.includes("TextView")) {
              if (
                text ||
                id.toLowerCase().includes("result") ||
                id.toLowerCase().includes("output") ||
                id.toLowerCase().includes("total")
              ) {
                const isResult =
                  id.toLowerCase().includes("result") ||
                  id.toLowerCase().includes("output") ||
                  id.toLowerCase().includes("total") ||
                  id.toLowerCase().includes("value") ||
                  text.includes("0.00") ||
                  text.includes("৳");
                defaultResult.widgets.push({
                  kind: isResult ? "result" : "text",
                  id,
                  text: text || "0.00",
                  bg,
                  textColor,
                  textSize
                });
              }
            }
          }
        }

        const itemMatches = [
          ...combinedLogic.matchAll(
            /(?:AppItem|NewsArticle|Item|Product|MenuModel|OptionItem)\(\s*"([^"]+)"\s*,\s*"([^"]+)"(?:\s*,\s*"([^"]+)")?/g
          )
        ];
        if (itemMatches.length > 0) {
          defaultResult.cards = itemMatches.map((m, i) => ({
            id: `card_${i}`,
            title: m[1],
            subtitle: m[2],
            badge: m[3] || "Open"
          }));
        }

        const inputCount = defaultResult.widgets.filter((w) => w.kind === "input").length;
        const btnCount = defaultResult.widgets.filter((w) => w.kind === "button").length;
        defaultResult.isCalculatorLike = inputCount >= 1 && btnCount >= 1;

        return defaultResult;
      }

      // =========================================================================
      // 6. GITHUB REST API HELPER & CLOUD APK / AAB WORKFLOW GENERATOR
      // =========================================================================
      function utf8ToBase64(str) {
        const bytes = new TextEncoder().encode(str);
        let binString = "";
        for (let i = 0; i < bytes.length; i++) {
          binString += String.fromCharCode(bytes[i]);
        }
        return btoa(binString);
      }

      function dataUrlToPureBase64(dataUrl) {
        const str = String(dataUrl || "");
        const commaIdx = str.indexOf(",");
        return commaIdx !== -1 ? str.slice(commaIdx + 1) : str;
      }

      async function pushSingleFileToGitHub({
        token,
        owner,
        repo,
        branch,
        path,
        content,
        isBase64Payload,
        message
      }) {
        const cleanPath = path.replace(/^\/+/, "");
        const apiUrl = `https://api.github.com/repos/${encodeURIComponent(
          owner
        )}/${encodeURIComponent(repo)}/contents/${cleanPath
          .split("/")
          .map(encodeURIComponent)
          .join("/")}`;

        let existingSha = null;
        try {
          const getRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch)}`, {
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json"
            }
          });
          if (getRes.ok) {
            const existingData = await getRes.json();
            existingSha = existingData.sha || null;
          }
        } catch (err) {
          // File may not exist yet
        }

        const bodyPayload = {
          message,
          content: isBase64Payload ? content : utf8ToBase64(content),
          branch
        };
        if (existingSha) bodyPayload.sha = existingSha;

        const putRes = await fetch(apiUrl, {
          method: "PUT",
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify(bodyPayload)
        });

        if (!putRes.ok) {
          const errJson = await putRes.json().catch(() => ({}));
          throw new Error(
            `${cleanPath} পুশ ব্যর্থ: ${errJson?.message || `HTTP ${putRes.status}`}`
          );
        }
        return putRes.json();
      }

      function generateDroidCloudGradleWorkflowYaml(appName) {
        const safeLabel = String(appName || "DroidApp").replace(/[^a-zA-Z0-9_-]/g, "_");
        return `name: Droid AI Studio Cloud Build (${safeLabel})

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk-and-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK & Release AAB
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug bundleRelease --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${safeLabel}-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${safeLabel}-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
`;

        const activeChatMessages = useMemo(() => {

        const setActiveChatMessages = useCallback(

              const storageName = getUserScopedProjectChatsStorageName(currentUser?.uid);

        const activeFile = useMemo(() => {

        // --- Record Snapshot Helper ---

        // --- Save Projects to User-Scoped LocalStorage + Firebase RTDB ---
        const persistProjectsForUser = useCallback(

        // --- Load User-Scoped Key & Projects on Auth State Change ---

            const aiSettingsStorage = getUserScopedProjectAiSettingsStorageName(uid);

                if (Array.isArray(remoteVal) && remoteVal.length > 0) {

        // --- Auth Handlers ---

          } catch (err) {
            setAuthError(err?.message || "Google Sign-In সম্পন্ন হয়নি।");

            setAuthLoading(false);
          }
        };

        const handleGuestDemoLogin = () => {

          setIsAuthModalOpen(false);
        };

        const handleLogout = async () => {
          setUserGeminiKey("");
          setKeyInputDraft("");
          setAvailableModels([]);
          setKeyStatusBanner(null);

          if (window.DroidFirebaseReady && window.DroidAuth && !currentUser?.isGuest) {
            await window.DroidAuth.signOut().catch(() => {});
          }
          setCurrentUser(null);
          setIsAuthModalOpen(true);
        };

        // --- Verify & Save User's Own Gemini API Key ---
        const handleVerifyAndSaveKey = async (e) => {
          if (e) e.preventDefault();
          const trimmed = keyInputDraft.trim();
          if (!trimmed) {
            setKeyStatusBanner({
              ok: false,
              msg: "অনুগ্রহ করে আপনার Google AI Studio Gemini API Key লিখুন।"
            });
            return;
          }

          setIsVerifyingKey(true);
          setKeyStatusBanner(null);
          try {
            const models = await discoverEligibleGeminiModels(trimmed);
            const storageName = getUserScopedKeyStorageName(currentUser?.uid);
            localStorage.setItem(storageName, trimmed);

            setUserGeminiKey(trimmed);
            setAvailableModels(models);
            if (models.length > 0) {
              setSelectedModel(models[0].id);
            }
            setKeyStatusBanner({
              ok: true,
              msg: `API Key যাচাই সফল! ${models.length}টি টেক্সট/কোড মডেল পাওয়া গেছে।`
            });
            setIsApiPanelExpanded(false);
          } catch (err) {
            setKeyStatusBanner({
              ok: false,
              msg: err?.message || "API Key যাচাই ব্যর্থ হয়েছে।"
            });
          } finally {
            setIsVerifyingKey(false);
          }
        };

        const handleClearUserKey = () => {
          const storageName = getUserScopedKeyStorageName(currentUser?.uid);
          localStorage.removeItem(storageName);
          setUserGeminiKey("");
          setKeyInputDraft("");
          setAvailableModels([]);
          setKeyStatusBanner({
            ok: false,
            msg: "API Key মুছে ফেলা হয়েছে। নতুন কী বসিয়ে যাচাই করুন।"
          });
          setIsApiPanelExpanded(true);
        };

        // --- Voice Input (Bangla / English SpeechRecognition) ---
        const toggleVoiceInput = () => {
          const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SpeechRec) {
            setActiveChatMessages((prev) => [
              ...prev,
              {
                id: `voice_err_${Date.now()}`,
                role: "assistant",
                text: "⚠️ আপনার ব্রাউজারে ভয়েস টাইপিং সাপোর্ট করছে না। অনুগ্রহ করে নিচের বক্সে লিখে পাঠান।",
                timestamp: Date.now()
              }
            ]);
            return;
          }

          if (isVoiceListening && recognitionRef.current) {
            recognitionRef.current.stop();
            setIsVoiceListening(false);
            return;
          }

          const recognition = new SpeechRec();
          recognition.lang = voiceLang;
          recognition.interimResults = false;
          recognition.maxAlternatives = 1;
          recognitionRef.current = recognition;

          recognition.onstart = () => setIsVoiceListening(true);
          recognition.onresult = (event) => {
            const transcript = event.results?.[0]?.[0]?.transcript || "";
            if (transcript) {
              setChatInput((prev) => (prev ? `${prev} ${transcript}` : transcript));
            }
          };
          recognition.onerror = () => setIsVoiceListening(false);
          recognition.onend = () => setIsVoiceListening(false);

          try {
            recognition.start();
          } catch {
            setIsVoiceListening(false);
          }
        };

        // --- Workflow 1: Start Locked New App Builder Session (Unselects Old Project Until Exit Project) ---
        const handleStartNewAppBuilderSession = () => {
          setActiveProjectId("");
          setActiveFilePath("");
          setLockedSessionType("new-app");
          setDraftNewAppProject(null);
          setPendingCodeProposals({});
          setNewAppDraftChat(createFreshNewAppBuilderMessages());
          setActiveTab("chat");
        };

        // --- Workflow 2: Open Rebuild Existing Project Picker ---
        const handleOpenRebuildPicker = () => {
          setIsRebuildPickerOpen(true);
        };

        const handleSelectProjectForRebuild = (proj) => {
          setLockedSessionType("rebuild");
          setDraftNewAppProject(null);
          setPendingCodeProposals({});
          setActiveProjectId(proj.id);
          setActiveFilePath(proj.files?.[0]?.path || "");
          setIsRebuildPickerOpen(false);
          setActiveTab("chat");
        };

        // --- Explicit Exit Project Session Handler ---
        const handleExitLockedProjectSession = () => {
          setLockedSessionType("none");
          setDraftNewAppProject(null);
          setPendingCodeProposals({});
          if (!activeProjectId && projects[0]) {
            setActiveProjectId(projects[0].id);
            setActiveFilePath(projects[0].files?.[0]?.path || "");
          }
          setActiveTab("chat");
        };

        // --- Image Attachment Handler ---
        const handleImageUpload = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            const dataUrl = String(reader.result || "");
            const base64 = dataUrl.split(",")[1] || "";
            setAttachedImage({
              name: file.name,
              mimeType: file.type || "image/png",
              base64,
              dataUrl
            });
          };
          reader.readAsDataURL(file);
          e.target.value = "";
        };

        // --- Stop Ongoing AI Request ---
        const handleStopAiGeneration = () => {
          if (aiAbortControllerRef.current) {
            aiAbortControllerRef.current.abort();
            aiAbortControllerRef.current = null;
          }
          setIsAiGenerating(false);
        };

        // --- Apply AI Code Proposal (Confirm New App OR Update Active Project, Unlocking Preview ONLY After Completion) ---
        const handleAcceptAiCodeProposal = (msgId, fileUpdates) => {
          if (isUnconfirmedNewDraft) {
            const targetMsg = newAppDraftChat.find((m) => m.id === msgId);
            let finalizedProject = draftNewAppProject;

            if (!finalizedProject && targetMsg?.rawText) {
              const built = buildDraftProjectFromAiResponse(
                targetMsg.rawText,
                targetMsg.userPrompt || "Droid App",
                null
              );
              finalizedProject = built.draftProject;
            }

            if (!finalizedProject) return;

            if (Array.isArray(fileUpdates) && fileUpdates.length > 0) {
              finalizedProject = {
                ...finalizedProject,
                files: applyFileUpdatesToProject(finalizedProject, fileUpdates),
                updatedAt: Date.now()
              };
            }

            const nextProjects = [finalizedProject, ...projects];
            setProjects(nextProjects);
            persistProjectsForUser(nextProjects, currentUser);
            recordProjectSnapshot(
              finalizedProject,
              `নতুন অ্যাপ কনফার্ম ও সেভ: ${finalizedProject.name}`,
              "New App"
            );

            // Migrate draft chat into permanent project chat while keeping lockedSessionType === "new-app" until explicit Exit Project
            setProjectChatsMap((prev) => {
              const updatedMap = {
                ...prev,
                [finalizedProject.id]: newAppDraftChat.map((m) =>
                  m.id === msgId ? { ...m, proposalAccepted: true } : m
                )
              };
              const storageName = getUserScopedProjectChatsStorageName(currentUser?.uid);
              localStorage.setItem(storageName, JSON.stringify(updatedMap));
              return updatedMap;
            });

            setPendingCodeProposals({});
            setDraftNewAppProject(null);
            setActiveProjectId(finalizedProject.id);
            setActiveFilePath(finalizedProject.files?.[0]?.path || "");

            const parsedDone = parseProjectForLivePreview(finalizedProject);
            if (parsedDone.hasCodeFiles && parsedDone.hasCompleteUiAndLogic) {
              setActiveTab("preview");
            }
            return;
          }

          if (!activeProject || !Array.isArray(fileUpdates) || fileUpdates.length === 0) return;

          const updatedFiles = applyFileUpdatesToProject(activeProject, fileUpdates);
          const updatedProj = {
            ...activeProject,
            files: updatedFiles,
            updatedAt: Date.now()
          };

          const nextProjects = projects.map((p) =>
            p.id === activeProject.id ? updatedProj : p
          );
          setProjects(nextProjects);
          persistProjectsForUser(nextProjects, currentUser);
          recordProjectSnapshot(
            updatedProj,
            `AI কোড আপডেট (${fileUpdates.length}টি ফাইল)`,
            "AI"
          );

          if (!activeFilePath || !updatedFiles.some((f) => f.path === activeFilePath)) {
            setActiveFilePath(updatedFiles[0]?.path || "");
          }

          setPendingCodeProposals((prev) => {
            const copy = { ...prev };
            delete copy[msgId];
            return copy;
          });

          setActiveChatMessages((prev) =>
            prev.map((m) =>
              m.id === msgId ? { ...m, proposalAccepted: true } : m
            )
          );

          const parsedDone = parseProjectForLivePreview(updatedProj);
          if (parsedDone.hasCodeFiles && parsedDone.hasCompleteUiAndLogic) {
            setActiveTab("preview");
          }
        };

        // --- Send Message to Gemini API (Enforcing Session Lock & Complete UI/UX + Logic) ---
        const handleSendChatMessage = async (e, overridePromptText = null) => {
          if (e) e.preventDefault();
          const promptText =
            overridePromptText !== null ? String(overridePromptText).trim() : chatInput.trim();
          if (!promptText && !attachedImage) return;

          if (!userGeminiKey) {
            setIsApiPanelExpanded(true);
            setKeyStatusBanner({
              ok: false,
              msg: "AI ব্যবহারের আগে উপরে আপনার নিজস্ব Gemini API Key বসিয়ে যাচাই করুন।"
            });
            return;
          }

          if (isAiGenerating) return;

          const userMsg = {
            id: `u_${Date.now()}`,
            role: "user",
            text: promptText || "ছবিটি বিশ্লেষণ করে সম্পূর্ণ UI/UX ও লজিক কোড তৈরি করুন।",
            imagePreview: attachedImage?.dataUrl || null,
            timestamp: Date.now()
          };

          const currentImage = attachedImage;
          setActiveChatMessages((prev) => [...prev, userMsg]);
          if (overridePromptText === null) setChatInput("");
          setAttachedImage(null);
          setIsAiGenerating(true);

          const controller = new AbortController();
          aiAbortControllerRef.current = controller;

          try {
            const activeTargetProj = isUnconfirmedNewDraft
              ? draftNewAppProject
              : activeProject;

            const currentFiles = Array.isArray(activeTargetProj?.files)
              ? activeTargetProj.files
              : [];
            const projectContextSummary =
              currentFiles.length === 0
                ? "(এই প্রজেক্টে বর্তমানে ০টি ফাইল আছে — একদম শূন্য থেকে সম্পূর্ণ UI/UX লেআউট XML এবং পূর্ণাঙ্গ কার্যকর Kotlin/Java লজিক ফাইল তৈরি করতে হবে)"
                : currentFiles
                    .filter((f) => !f.assetDataUrl)
                    .map(
                      (f) =>
                        `--- FILE: ${f.path} ---\n${String(f.content || "").slice(0, 4500)}`
                    )
                    .join("\n\n");

            let systemInstructionText =
              activeAiSettings.systemPersona || DEFAULT_AI_SETTINGS.systemPersona;

            if (isUnconfirmedNewDraft) {
              systemInstructionText += `\n\nতুমি এখন "Locked New App Builder Session"-এ আছো (পুরনো কোনো প্রজেক্টের সাথে এটি মেশানো যাবে না)। ইউজার তোমার সাথে কথা বলে শূন্য (০টি ফাইল) থেকে একটি সম্পূর্ণ নতুন Android অ্যাপ তৈরি করছে।

বাধ্যতামূলক নিয়মাবলি:
১. আংশিক বা অসম্পূর্ণ কোড কখনোই দেবে না—একবারে সম্পূর্ণ UI/UX ডিজাইন (XML লেআউট, কালার, কার্ড/গ্রিড বিন্যাস) এবং সম্পূর্ণ কার্যকর লজিক (Kotlin/Java Activity ও সব বাটন/ইনপুটের পূর্ণাঙ্গ কোড) তৈরি করবে।

              const n = years * 12;

                      type="button"
                      onClick={() => setHubActiveView("zip")}
                      className={`rounded-xl py-2 font-bold transition ${
                        hubActiveView === "zip"
                          ? "bg-emerald-600 text-white shadow"
                          : "text-slate-400 hover:text-slate-200"
                      }`}
                    >
                      🗜️ প্রজেক্ট .zip
                    </button>
                    <button
                      type="button"
                      onClick={() => setHubActiveView("github")}
                      className={`rounded-xl py-2 font-bold transition ${
                        hubActiveView === "github"
                          ? "bg-purple-600 text-white shadow"
                          : "text-slate-400 hover:text-slate-200"
                      }`}
                    >
                      🚀 GitHub Push
                    </button>
                  </div>

                  {hubActiveView === "build" && (
                    <form onSubmit={handleStartCloudApkAabBuild} className="space-y-3 text-xs">
                      <div className="rounded-xl border border-sky-500/40 bg-sky-950/35 p-3 leading-relaxed">
                        <div className="font-extrabold text-sky-300">
                          ☁️ GitHub Actions Cloud Gradle Build (.apk ও .aab)
                        </div>
                        <p className="mt-1 text-[11px] text-slate-200">
                          স্বয়ংক্রিয়ভাবে <code className="text-sky-300">.github/workflows/droid-ai-build.yml</code> তৈরি হয়ে ক্লাউডে <strong>app-debug.apk</strong> এবং <strong>app-release.aab</strong> কম্পাইল হবে।
                        </p>
                      </div>

                      <div>
                        <label className="mb-1 block text-slate-300">
                          GitHub Personal Access Token (repo + workflow)
                        </label>
                        <input
                          type="password"
                          required
                          value={ghToken}
                          onChange={(e) => setGhToken(e.target.value)}
                          placeholder="ghp_..."
                          className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="mb-1 block text-slate-300">GitHub Owner</label>
                          <input
                            type="text"
                            required
                            value={ghOwner}
                            onChange={(e) => setGhOwner(e.target.value)}
                            className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100"
                          />
                        </div>
                        <div>
                          <label className="mb-1 block text-slate-300">App Build Repository</label>
                          <input
                            type="text"
                            required
                            value={buildAppRepo}
                            onChange={(e) => setBuildAppRepo(e.target.value)}
                            placeholder="my-android-app"
                            className="w-full rounded-xl border border-sky-500/40 bg-slate-950 px-3 py-2 font-mono text-slate-100"
                          />
                        </div>
                      </div>

                      {cloudBuildStep && (
                        <div className="rounded-xl border border-sky-500/40 bg-sky-950/60 p-2.5 text-[11px] font-semibold text-sky-200">
                          {cloudBuildStep}
                        </div>
                      )}

                      {cloudBuildRun && (
                        <div className="flex items-center justify-between rounded-xl border border-slate-800 bg-slate-950 px-3 py-2 text-[11px]">
                          <span>
                            Build Run #{cloudBuildRun.run_number} •{" "}
                            <strong className="text-emerald-300">{cloudBuildRun.status}</strong>
                          </span>
                          <a
                            href={cloudBuildRun.html_url}
                            target="_blank"
                            rel="noreferrer"
                            className="font-semibold text-sky-400 hover:underline"
                          >
                            Logs ↗
                          </a>
                        </div>
                      )}

                      {cloudBuildArtifacts.length > 0 && (
                        <div className="space-y-2 rounded-xl border border-emerald-500/40 bg-emerald-950/45 p-3">
                          <div className="font-bold text-emerald-300">
                            🎉 বিল্ড সম্পন্ন! সরাসরি APK ও AAB ডাউনলোড করুন:
                          </div>
                          <div className="grid grid-cols-1 gap-2 sm:grid-cols-2">
                            {cloudBuildArtifacts.map((art) => (
                              <button
                                key={art.id}
                                type="button"
                                disabled={downloadingArtifactId === art.id}
                                onClick={() => handleDownloadBuildArtifact(art)}
                                className="rounded-xl bg-emerald-600 px-3 py-2.5 text-xs font-extrabold text-white shadow hover:bg-emerald-500 disabled:opacity-50"
                              >
                                {downloadingArtifactId === art.id
                                  ? "ডাউনলোড হচ্ছে..."
                                  : art.name.includes("aab")
                                  ? "⬇️ Download AAB"
                                  : "⬇️ Download APK"}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      {cloudBuildError && (
                        <div className="space-y-2 rounded-xl border border-rose-500/45 bg-rose-950/60 p-3 text-[11px] text-rose-200">
                          <div>{cloudBuildError}</div>
                          <button
                            type="button"
                            onClick={handleFixBuildErrorWithAi}
                            className="w-full rounded-xl bg-purple-600 py-2 text-xs font-bold text-white shadow hover:bg-purple-500"
                          >
                            🤖 AI দিয়ে বিল্ড এরর ফিক্স করুন
                          </button>
                        </div>
                      )}

                      <div className="flex justify-end gap-2 pt-1">
                        <button
                          type="button"
                          onClick={() => setIsGithubModalOpen(false)}
                          className="rounded-xl bg-slate-800 px-3.5 py-2 text-slate-300"
                        >
                          বন্ধ করুন
                        </button>
                        <button
                          type="submit"
                          disabled={isCloudBuilding}
                          className="rounded-xl bg-sky-600 px-4 py-2 font-extrabold text-white shadow hover:bg-sky-500 disabled:opacity-50"
                        >
                          {isCloudBuilding ? "বিল্ড চলছে..." : "☁️ Build APK & AAB শুরু করুন"}
                        </button>
                      </div>
                    </form>
                  )}

                  {hubActiveView === "zip" && (
                    <div className="space-y-3 text-xs">
                      <div className="rounded-xl border border-emerald-500/35 bg-emerald-950/35 p-3 leading-relaxed">
                        <div className="font-bold text-emerald-300">
                          🗜️ প্রজেক্ট ফাইল .zip ডাউনলোড
                        </div>
                        <p className="mt-1 text-[11px] text-slate-200">
                          এই প্রজেক্টে তৈরি হওয়া ঠিক যে কয়টি ফাইল আছে ({activeProject?.files?.length || 0}টি ফাইল), কেবল সেই ফাইলগুলোই .zip হিসেবে ডাউনলোড হবে।
                        </p>
                      </div>

                      <div className="rounded-xl border border-slate-800 bg-slate-950 p-2.5 font-mono text-[11px] text-slate-300">
                        <div>📦 প্যাকেজ: {activeProject?.packageName}</div>
                        <div className="mt-0.5">
                          ⚙️ SDK: Min API {activeProject?.minSdk} → Target API{" "}
                          {activeProject?.targetSdk}
                        </div>
                        <div className="mt-0.5">
                          📄 মোট ফাইল: {activeProject?.files?.length || 0}টি
                        </div>
                      </div>

                      {zipExportStatus && (
                        <div
                          className={`rounded-xl border p-2.5 text-[11px] ${
                            zipExportStatus.ok
                              ? "border-emerald-500/40 bg-emerald-950/60 text-emerald-200"
                              : "border-rose-500/40 bg-rose-950/60 text-rose-200"
                          }`}
                        >
                          {zipExportStatus.msg}
                        </div>
                      )}

                      <div className="flex justify-end gap-2 pt-1">
                        <button
                          type="button"
                          onClick={() => setIsGithubModalOpen(false)}
                          className="rounded-xl bg-slate-800 px-3.5 py-2 text-slate-300"
                        >
                          বন্ধ করুন
                        </button>
                        <button
                          type="button"
                          disabled={isZipExporting}
                          onClick={handleExportProjectZip}
                          className="rounded-xl bg-emerald-600 px-4 py-2 font-extrabold text-white shadow hover:bg-emerald-500 disabled:opacity-50"
                        >
                          {isZipExporting ? "ZIP তৈরি হচ্ছে..." : "⬇️ প্রজেক্ট .zip ডাউনলোড করুন"}
                        </button>
                      </div>
                    </div>
                  )}

                  {hubActiveView === "github" && (
                    <form onSubmit={handlePushToGitHub} className="space-y-2.5 text-xs">
                      <div>
                        <label className="mb-1 block text-slate-300">
                          GitHub Personal Access Token (repo scope)
                        </label>
                        <input
                          type="password"
                          required
                          value={ghToken}
                          onChange={(e) => setGhToken(e.target.value)}
                          placeholder="ghp_..."
                          className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="mb-1 block text-slate-300">Owner / Username</label>
                          <input
                            type="text"
                            required
                            value={ghOwner}
                            onChange={(e) => setGhOwner(e.target.value)}
                            className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100"
                          />
                        </div>
                        <div>
                          <label className="mb-1 block text-slate-300">Repository Name</label>
                          <input
                            type="text"
                            required
                            value={ghRepo}
                            onChange={(e) => setGhRepo(e.target.value)}
                            className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="mb-1 block text-slate-300">Branch</label>
                          <input
                            type="text"
                            value={ghBranch}
                            onChange={(e) => setGhBranch(e.target.value)}
                            className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100"
                          />
                        </div>
                        <div>
                          <label className="mb-1 block text-slate-300">Commit Message</label>
                          <input
                            type="text"
                            value={ghCommitMsg}
                            onChange={(e) => setGhCommitMsg(e.target.value)}
                            className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100"
                          />
                        </div>
                      </div>

                      {ghPushStatus && (
                        <div
                          className={`rounded-xl border p-2.5 text-[11px] ${
                            ghPushStatus.ok
                              ? "border-emerald-500/40 bg-emerald-950/60 text-emerald-200"
                              : "border-rose-500/40 bg-rose-950/60 text-rose-200"
                          }`}
                        >
                          {ghPushStatus.msg}
                        </div>
                      )}

                      <div className="flex justify-end gap-2 pt-2">
                        <button
                          type="button"
                          onClick={() => setIsGithubModalOpen(false)}
                          className="rounded-xl bg-slate-800 px-3.5 py-2 text-slate-300"
                        >
                          বন্ধ করুন
                        </button>
                        <button
                          type="submit"
                          disabled={isPushingGh}
                          className="rounded-xl bg-purple-600 px-4 py-2 font-bold text-white hover:bg-purple-500 disabled:opacity-50"
                        >
                          {isPushingGh
                            ? "পুশ হচ্ছে..."
                            : `সব ফাইল (${activeProject?.files?.length || 0}) পুশ করুন`}
                        </button>
                      </div>
                    </form>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<DroidAIStudioApp />);
    </script>
  </body>
</html>
