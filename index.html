    <script type="text/babel">
      const { useState, useEffect, useRef, useMemo, useCallback } = React;

      // =========================================================================
      // 1. STRICT PER-USER BYOK STORAGE HELPERS & LOCKED PACKAGE PREFIX
      // =========================================================================
      const LOCKED_PACKAGE_PREFIX = "com.droid.";

      function getUserScopedKeyStorageName(uid) {
        return uid ? `droid_studio_gemini_key_${uid}` : "droid_studio_gemini_key_guest";
      }

      function getUserScopedProjectsStorageName(uid) {

      }

      function getUserScopedHistoryStorageName(uid) {

      }

      function getUserScopedProjectChatsStorageName(uid) {

      }

      function getUserScopedProjectAiSettingsStorageName(uid) {
        return uid
          ? `droid_studio_project_ai_settings_${uid}`
          : "droid_studio_project_ai_settings_guest";
      }

      function createInitialProjectChatMessages(projectName) {
        const label = projectName ? `"${projectName}"` : "Droid AI Studio";
        return [
          {
            id: `welcome_${Date.now()}`,
            role: "assistant",
            text: `স্বাগতম ${label} প্রজেক্টে! এই প্রজেক্টটি শূন্য (০টি ফাইল) থেকে শুরু হয়েছে—কোনো ডিফল্ট কোড বা কালার আগে থেকে সেট করা নেই। বাংলায় চ্যাট করুন, 🎤 কথা বলুন বা স্ক্রিনশট শেয়ার করে আপনার প্রয়োজনীয় ফাইল তৈরি করুন এবং ✅ Accept চাপুন।`,
            timestamp: Date.now()
          }
        ];
      }

      function createFreshNewAppBuilderMessages() {
        return [
          {
            id: `new_app_welcome_${Date.now()}`,
            role: "assistant",
            text: "🎤 নতুন অ্যাপ তৈরির সেশন চালু হয়েছে (পুরনো কোনো প্রজেক্ট সিলেক্ট করা নেই)। এখন নিচের 🎤 মাইক্রোফোনে কথা বলে বা টাইপ করে বলুন আপনি কী ধরনের Android অ্যাপ বানাতে চান—তৈরি হওয়ার পর আগে প্রিভিউ দেখে যখন ✅ Accept ও প্রজেক্ট কনফার্ম করবেন, তখনই সেটি আপনার সেভড প্রজেক্টে যুক্ত হবে!",
            timestamp: Date.now()
          }
        ];
      }

      function sanitizeEmailKey(email) {
        return String(email || "")
          .trim()
          .toLowerCase()
          .replace(/[.#$\[\]]/g, "_");
      }

      function sanitizeAppPackageSuffix(rawText) {
        const cleaned = String(rawText || "")
          .toLowerCase()
          .replace(/^com\.droid\./i, "")
          .replace(/[^a-z0-9]/g, "")
          .slice(0, 24);
        return cleaned || "myapp";
      }

      function buildLockedPackageName(suffixOrAppName) {
        const suffix = sanitizeAppPackageSuffix(suffixOrAppName);
        return `${LOCKED_PACKAGE_PREFIX}${suffix}`;
      }

      // =========================================================================
      // 2. GEMINI REST API (v1beta) MODEL DISCOVERY & FILTERING
      // =========================================================================
      const PREFERRED_MODEL_ORDER = [
        "gemini-3.8-flash",
        "gemini-3-flash-preview",
        "gemini-2.5-flash",
        "gemini-2.5-flash-lite",
        "gemini-2.5-pro",
        "gemini-flash-latest",
        "gemini-pro-latest"
      ];

      const EXCLUDED_MODEL_KEYWORDS = [
        "tts",
        "audio",
        "image",
        "imagen",
        "veo",
        "embedding",
        "aqa",
        "bisheng",
        "robotics",
        "computer-use",
        "customtools"
      ];

      function isEligibleTextCodeModel(modelObj) {
        const rawName = String(modelObj?.name || "").toLowerCase();
        const shortId = rawName.replace(/^models\//, "");
        if (!shortId.includes("gemini")) return false;

        const methods = Array.isArray(modelObj?.supportedGenerationMethods)
          ? modelObj.supportedGenerationMethods
          : [];
        if (methods.length > 0 && !methods.includes("generateContent")) {
          return false;
        }

        for (const badWord of EXCLUDED_MODEL_KEYWORDS) {
          if (shortId.includes(badWord)) {
            return false;
          }
        }
        return true;
      }

      function sortModelsByPriority(modelsList) {
        return [...modelsList].sort((a, b) => {
          const idxA = PREFERRED_MODEL_ORDER.indexOf(a.id);
          const idxB = PREFERRED_MODEL_ORDER.indexOf(b.id);
          if (idxA !== -1 && idxB !== -1) return idxA - idxB;
          if (idxA !== -1) return -1;
          if (idxB !== -1) return 1;
          return a.id.localeCompare(b.id);
        });
      }

      async function discoverEligibleGeminiModels(apiKey, externalSignal) {
        const cleanKey = String(apiKey || "").trim();
        if (!cleanKey) {
          throw new Error("অনুগ্রহ করে প্রথমে আপনার নিজস্ব Gemini API Key বসান।");
        }

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 18000);
        if (externalSignal) {
          externalSignal.addEventListener("abort", () => controller.abort(), { once: true });
        }

        try {
          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(
              cleanKey
            )}`,
            {
              method: "GET",
              signal: controller.signal
            }
          );

          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            const errMsg =
              data?.error?.message || `API যাচাই ব্যর্থ হয়েছে (HTTP ${res.status})। সঠিক কী দিন।`;
            throw new Error(errMsg);
          }

          const rawModels = Array.isArray(data?.models) ? data.models : [];
          const filtered = rawModels
            .filter(isEligibleTextCodeModel)
            .map((m) => {
              const id = String(m.name || "").replace(/^models\//, "");
              return {
                id,
                displayName: m.displayName || id,
                description: m.description || ""
              };
            });

          const sorted = sortModelsByPriority(filtered);
          if (sorted.length === 0) {
            return PREFERRED_MODEL_ORDER.map((id) => ({
              id,
              displayName: id,
              description: "Default fallback text/code model"
            }));
          }
          return sorted;
        } finally {
          clearTimeout(timeoutId);
        }
      }

      // =========================================================================
      // 3. SDK OPTIONS & ZERO-DEFAULT PURE RAW PROJECT GENERATOR
      // =========================================================================
      const MIN_SDK_OPTIONS = [
        { api: 21, label: "API 21: Android 5.0 (Lollipop)" },
        { api: 23, label: "API 23: Android 6.0 (Marshmallow)" },
        { api: 24, label: "API 24: Android 7.0 (Nougat)" },
        { api: 26, label: "API 26: Android 8.0 (Oreo)" },
        { api: 28, label: "API 28: Android 9.0 (Pie)" },
        { api: 30, label: "API 30: Android 11 (R)" },
        { api: 33, label: "API 33: Android 13 (Tiramisu)" },
        { api: 34, label: "API 34: Android 14 (UpsideDownCake)" }
      ];

      const TARGET_SDK_OPTIONS = [
        { api: 34, label: "API 34: Android 14 (UpsideDownCake)" },
        { api: 35, label: "API 35: Android 15 (VanillaIceCream)" }
      ];

      function generateAuthenticAndroidProject({
        name,
        packageSuffix,
        codeLang,
        minSdk,
        targetSdk,
        buildConfigDsl,
        useViewBinding,
        useMaterial3,
        accentHex,
        customLogoDataUrl,
        customLogoName
      }) {
        const cleanName = String(name || "Droid App").trim();
        const lockedPkg = buildLockedPackageName(packageSuffix || cleanName);
        const isJava = codeLang === "java";
        const isGroovy = buildConfigDsl === "groovy";
        const parsedMinSdk = Number(minSdk) || 24;
        const parsedTargetSdk = Number(targetSdk) || 35;
        const vbEnabled = useViewBinding !== false;
        const m3Enabled = useMaterial3 !== false;
        const colorHex =
          typeof accentHex === "string" && /^#[0-9A-Fa-f]{6}$/.test(accentHex.trim())
            ? accentHex.trim()
            : "";
        const hasLogo = Boolean(customLogoDataUrl);
        const now = Date.now();

        // STRICT RULE: Zero default files on creation. Only explicitly uploaded logo asset is included if provided.
        const files = [];
        if (hasLogo) {
          files.push({
            path: "app/src/main/res/drawable/app_logo_custom.png",
            assetDataUrl: customLogoDataUrl,
            content: customLogoDataUrl
          });
        }

        return {
          id: `proj_${now}_${Math.random().toString(36).slice(2, 5)}`,
          name: cleanName,
          packageName: lockedPkg,
          templateId: "raw-custom",
          language: isJava ? "java" : "kotlin",
          minSdk: parsedMinSdk,
          targetSdk: parsedTargetSdk,
          buildConfigDsl: isGroovy ? "groovy" : "kts",
          useViewBinding: vbEnabled,
          useMaterial3: m3Enabled,
          accentColor: colorHex,
          logoDataUrl: customLogoDataUrl || "",
          logoFileName: customLogoName || "",
          updatedAt: now,
          files
        };
      }

      // =========================================================================
      // 4. ROBUST MULTI-FORMAT AI CODE EXTRACTION PARSER & SMART PATH MATCHING
      // =========================================================================
      function stripAccidentalOuterCodeFences(rawBody) {
        let text = String(rawBody || "").replace(/\r\n/g, "\n").trim();
        const fenced = text.match(/^```[a-zA-Z0-9_-]*\n([\s\S]*?)\n```$/);
        if (fenced) {
          return fenced[1].trim();
        }
        return text;
      }

      function resolveMatchedProjectFilePath(candidatePath, existingFiles = []) {
        const normalized = String(candidatePath || "")
          .trim()
          .replace(/^['"`]+|['"`]+$/g, "")
          .replace(/^\.?\//, "");
        if (!normalized) return "";

        const exact = existingFiles.find((f) => f.path === normalized);
        if (exact) return exact.path;

        const suffixMatch = existingFiles.find(
          (f) => f.path.endsWith(`/${normalized}`) || normalized.endsWith(`/${f.path}`)
        );
        if (suffixMatch) return suffixMatch.path;

        const baseName = normalized.split("/").pop();
        if (baseName) {
          const baseMatches = existingFiles.filter((f) => f.path.split("/").pop() === baseName);
          if (baseMatches.length === 1) {
            return baseMatches[0].path;
          }
        }

        return normalized;
      }

      function extractFileUpdatesFromAiResponse(rawResponseText, existingFiles = []) {
        const text = String(rawResponseText || "").replace(/\r\n/g, "\n");
        const extractedMap = new Map();

        // Format A: Explicit <<<FILE:path>>> ... <<<END_FILE>>> (even if truncated at end)
        const explicitRegex = /<<<FILE:\s*([^\r\n>]+?)\s*>>>\s*\n([\s\S]*?)(?:<<<END_FILE>>>|$)/g;
        let match;
        while ((match = explicitRegex.exec(text)) !== null) {
          const cleanPath = resolveMatchedProjectFilePath(match[1], existingFiles);
          const codeBody = stripAccidentalOuterCodeFences(match[2]);
          if (cleanPath && codeBody) {
            extractedMap.set(cleanPath, codeBody);
          }
        }

        // Format B: Standard Markdown fenced code blocks (captures mixed or untitled blocks too)
        const mdFenceRegex =
          /(?:(?:^|\n)(?:#{1,4}\s*|\*\*\s*|File:\s*|Path:\s*|ফাইল:\s*)?`?([A-Za-z0-9_./-]+\.(?:kt|java|xml|gradle|kts|json|properties))`?\s*\**\s*\n)?```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g;
        let mdMatch;
        while ((mdMatch = mdFenceRegex.exec(text)) !== null) {
          let candidatePath = (mdMatch[1] || "").trim();
          const fenceLang = (mdMatch[2] || "").trim().toLowerCase();
          const body = stripAccidentalOuterCodeFences(mdMatch[3] || "");
          if (!body) continue;

          if (!candidatePath) {
            const firstLines = body.split("\n").slice(0, 4).join("\n");
            const commentPathMatch = firstLines.match(
              /(?:\/\/|<!--|#)\s*(?:file:\s*)?([A-Za-z0-9_./-]+\.(?:kt|java|xml|gradle|kts|json|properties))/i
            );
            if (commentPathMatch) {
              candidatePath = commentPathMatch[1].trim();
            } else if (
              (fenceLang === "xml" || body.startsWith("<")) &&
              (body.includes("layout_width") || body.includes("android:id="))
            ) {
              candidatePath = "app/src/main/res/layout/activity_main.xml";
            } else if (
              (fenceLang === "kotlin" || fenceLang === "java") &&
              body.includes("class MainActivity")
            ) {
              const existingMain = existingFiles.find(
                (f) => f.path.endsWith("/MainActivity.kt") || f.path.endsWith("/MainActivity.java")
              );
              if (existingMain) candidatePath = existingMain.path;
            }
          }

          if (candidatePath) {
            const finalPath = resolveMatchedProjectFilePath(candidatePath, existingFiles);
            if (finalPath && !extractedMap.has(finalPath)) {
              extractedMap.set(finalPath, body);
            }
          }
        }

        const updates = [];
        extractedMap.forEach((content, path) => {
          const existing = existingFiles.find((f) => f.path === path);
          updates.push({
            path,
            content,
            isNew: !existing,
            lineCount: content.split("\n").length
          });
        });
        return updates;
      }

      function buildDraftProjectFromAiResponse(rawResponseText, fallbackPrompt = "") {
        const text = String(rawResponseText || "").replace(/\r\n/g, "\n");
        let meta = {};

        const metaMatch = text.match(/<<<PROJECT_META>>>\s*\n([\s\S]*?)<<<END_PROJECT_META>>>/i);
        if (metaMatch) {
          try {
            const cleanedJson = stripAccidentalOuterCodeFences(metaMatch[1]);
            meta = JSON.parse(cleanedJson);
          } catch {}
        }

        const extractedName = String(
          meta.appName ||
            meta.name ||
            fallbackPrompt.replace(/[^\p{L}\p{N}\s]/gu, "").trim().slice(0, 26) ||
            "Droid AI App"
        ).trim();

        const pkgSuffix = sanitizeAppPackageSuffix(
          meta.packageSuffix || meta.packageName || extractedName
        );
        const codeLang = String(meta.language || "").toLowerCase() === "java" ? "java" : "kotlin";
        const minSdk = Number(meta.minSdk) || 24;
        const targetSdk = Number(meta.targetSdk) || 35;
        const accentHex =
          typeof meta.accentColor === "string" && /^#[0-9A-Fa-f]{6}$/.test(meta.accentColor.trim())
            ? meta.accentColor.trim()
            : "";

        const baseProject = generateAuthenticAndroidProject({
          name: extractedName,
          packageSuffix: pkgSuffix,
          codeLang,
          minSdk,
          targetSdk,
          buildConfigDsl: "kts",
          useViewBinding: true,
          useMaterial3: true,
          accentHex
        });

        const aiFileUpdates = extractFileUpdatesFromAiResponse(text, baseProject.files);
        if (aiFileUpdates.length === 0) {
          return null;
        }

        const mergedFiles = [...baseProject.files];
        aiFileUpdates.forEach((upd) => {
          const resolvedPath = resolveMatchedProjectFilePath(upd.path, mergedFiles);
          if (!resolvedPath) return;
          const idx = mergedFiles.findIndex((f) => f.path === resolvedPath);
          if (idx !== -1) {
            mergedFiles[idx] = { ...mergedFiles[idx], content: upd.content };
          } else {
            mergedFiles.push({ path: resolvedPath, content: upd.content });
          }
        });

        return {
          ...baseProject,
          id: `proj_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`,
          updatedAt: Date.now(),
          files: mergedFiles,
          aiUpdatedCount: aiFileUpdates.length
        };
      }

      // =========================================================================
      // 5. LIVE ANDROID EMULATOR & MULTI-LAYOUT PARSER (NO FAKE HELLO WORLD)
      // =========================================================================
      function parseProjectForLivePreview(project, selectedLayoutPath) {
        const files = Array.isArray(project?.files) ? project.files : [];
        const codeAndXmlFiles = files.filter((f) => !f.assetDataUrl);
        const hasAnyCodeFiles = codeAndXmlFiles.length > 0;
        const stringsXml = files.find((f) => f.path.endsWith("strings.xml"))?.content || "";
        const colorsXml = files.find((f) => f.path.endsWith("colors.xml"))?.content || "";

        const layoutFiles = files.filter(
          (f) =>
            (f.path.includes("/res/layout/") || f.path.endsWith(".xml")) &&
            !f.path.endsWith("AndroidManifest.xml") &&
            !f.path.endsWith("strings.xml") &&
            !f.path.endsWith("colors.xml") &&
            !f.path.split("/").pop().startsWith("item_")
        );

        const activeLayoutFile =
          layoutFiles.find((f) => f.path === selectedLayoutPath) ||
          layoutFiles.find((f) => f.path.endsWith("activity_main.xml")) ||
          layoutFiles[0] ||
          null;

        const layoutXml = activeLayoutFile?.content || "";
        const allCodeFiles = files.filter(
          (f) => f.path.endsWith(".kt") || f.path.endsWith(".java")
        );
        const combinedCode = allCodeFiles.map((f) => f.content).join("\n\n");
        const logoFile = files.find((f) => f.path.endsWith("app_logo_custom.png"));

        const logoDataUrl =
          project?.logoDataUrl ||
          logoFile?.assetDataUrl ||
          (logoFile?.content?.match(/(data:image\/[^\s]+)/)?.[1] || "");

        const stringMap = {};
        const strRegex = /<string\s+name="([^"]+)">([\s\S]*?)<\/string>/g;
        let sm;
        while ((sm = strRegex.exec(stringsXml)) !== null) {
          stringMap[sm[1]] = sm[2].trim();
        }

        const colorMap = {};
        const colRegex = /<color\s+name="([^"]+)">(#[0-9A-Fa-f]{6,8})<\/color>/g;
        let cm;
        while ((cm = colRegex.exec(colorsXml)) !== null) {
          colorMap[cm[1]] = cm[2].trim();
        }

        const resolveXmlAttr = (val) => {
          if (!val) return "";
          if (val.startsWith("@string/")) {
            return stringMap[val.replace("@string/", "")] || val;
          }
          if (val.startsWith("@color/")) {
            return colorMap[val.replace("@color/", "")] || val;
          }
          return val;
        };

        const codeTextOverrides = {};
        const propTextRegex =
          /(?:binding\.)?([A-Za-z0-9_]+)\s*\.\s*(?:text\s*=|setText\s*\()\s*"([^"]*)"/g;
        let ptm;
        while ((ptm = propTextRegex.exec(combinedCode)) !== null) {
          codeTextOverrides[ptm[1]] = ptm[2];
        }

        const findViewTextRegex =
          /findViewById(?:<[^>]+>)?\s*\(\s*R\.id\.([A-Za-z0-9_]+)\s*\)\s*\.\s*(?:text\s*=|setText\s*\()\s*"([^"]*)"/g;
        let fvtm;
        while ((fvtm = findViewTextRegex.exec(combinedCode)) !== null) {
          codeTextOverrides[fvtm[1]] = fvtm[2];
        }

        const rootBgMatch = layoutXml.match(
          /android:background="(#[0-9A-Fa-f]{6,8}|@color\/[^"]+)"/
        );
        const resolvedRootBg = rootBgMatch ? resolveXmlAttr(rootBgMatch[1]) : "";
        const isPureBlackScreen =
          resolvedRootBg.toLowerCase() === "#000000" ||
          resolvedRootBg.toLowerCase() === "#000" ||
          resolvedRootBg.toLowerCase() === "#ff000000";

        const hexInLayout = layoutXml.match(/android:backgroundTint="(#[0-9A-Fa-f]{6,8})"/);
        const accentColor =
          colorMap.primary_accent ||
          (hexInLayout ? hexInLayout[1] : null) ||
          project?.accentColor ||
          "#334155";

        const widgets = [];
        const tagRegex =
          /<(TextView|Button|com\.google\.android\.material\.button\.MaterialButton|ImageButton|com\.google\.android\.material\.floatingactionbutton\.FloatingActionButton|EditText|com\.google\.android\.material\.textfield\.TextInputEditText|SearchView|androidx\.appcompat\.widget\.SearchView|Switch|androidx\.appcompat\.widget\.SwitchCompat|com\.google\.android\.material\.materialswitch\.MaterialSwitch|CheckBox|RecyclerView|androidx\.recyclerview\.widget\.RecyclerView)\b([\s\S]*?)(?:\/>|<\/\1>)/g;

        let wm;
        let autoIdx = 0;
        while ((wm = tagRegex.exec(layoutXml)) !== null) {
          autoIdx++;
          const rawTag = wm[1];
          const attrs = wm[2] || "";
          const idMatch = attrs.match(/android:id="@\+id\/([^"]+)"/);
          const id = idMatch ? idMatch[1] : `widget_${autoIdx}`;
          const textMatch = attrs.match(/android:text="([^"]+)"/);
          const hintMatch = attrs.match(/android:(?:hint|queryHint)="([^"]+)"/);
          const inputTypeMatch = attrs.match(/android:inputType="([^"]+)"/);
          const checkedMatch = attrs.match(/android:checked="(true|false)"/);
          const tintMatch = attrs.match(/android:backgroundTint="([^"]+)"/);
          const textColorMatch = attrs.match(/android:textColor="([^"]+)"/);

          const xmlText = textMatch ? resolveXmlAttr(textMatch[1]) : "";
          const text = codeTextOverrides[id] !== undefined ? codeTextOverrides[id] : xmlText;
          const hint = hintMatch ? resolveXmlAttr(hintMatch[1]) : "";
          const inputType = inputTypeMatch ? inputTypeMatch[1] : "text";
          const checked = checkedMatch ? checkedMatch[1] === "true" : false;
          const bgTint = tintMatch ? resolveXmlAttr(tintMatch[1]) : accentColor;
          const textColor = textColorMatch ? resolveXmlAttr(textColorMatch[1]) : "";

          let kind = "text";
          if (
            rawTag.endsWith("Button") ||
            rawTag.endsWith("MaterialButton") ||
            rawTag.endsWith("ImageButton") ||
            rawTag.endsWith("FloatingActionButton")
          ) {
            kind = "button";
          } else if (
            rawTag.endsWith("EditText") ||
            rawTag.endsWith("TextInputEditText") ||
            rawTag.endsWith("SearchView")
          ) {
            kind = "input";
          } else if (
            rawTag.endsWith("Switch") ||
            rawTag.endsWith("SwitchCompat") ||
            rawTag.endsWith("MaterialSwitch") ||
            rawTag.endsWith("CheckBox")
          ) {
            kind = "toggle";
          } else if (rawTag.endsWith("RecyclerView")) {
            kind = "recyclerview";
          }

          widgets.push({
            id,
            rawTag,
            kind,
            text,
            hint,
            inputType,
            checked,
            bgTint,
            textColor
          });
        }

        const clickHandlers = {};
        const toastRegex =
          /(?:binding\.)?([A-Za-z0-9_]+)\.setOnClickListener[\s\S]{0,420}?Toast\.makeText\([^,]+,\s*"([^"]+)"/g;
        let tm;
        while ((tm = toastRegex.exec(combinedCode)) !== null) {
          clickHandlers[tm[1]] = tm[2];
        }

        const parsedItems = [];
        const kotlinItemRegex =
          /(?:AppItem|NewsArticle|NewsItem|Item)\s*\(\s*\d+\s*,\s*"([^"]+)"\s*,\s*"([^"]+)"\s*,\s*"([^"]+)"(?:\s*,\s*"([^"]+)")?\s*\)/g;
        let kim;
        while ((kim = kotlinItemRegex.exec(combinedCode)) !== null) {
          parsedItems.push({
            category: kim[1],
            title: kim[2],
            summary: kim[3],
            time: kim[4] || "এইমাত্র"
          });
        }

        const appTitleWidget = widgets.find((w) => w.id === "tvAppTitle");
        const appTitle =
          appTitleWidget?.text || stringMap.app_name || project?.name || "Android App";

        const bodyWidgets = widgets.filter((w) => w.id !== "tvAppTitle");
        const isCenteredSingleTextLayout =
          hasAnyCodeFiles &&
          layoutXml.includes("ConstraintLayout") &&
          bodyWidgets.length === 1 &&
          bodyWidgets[0].kind === "text";

        return {
          hasAnyCodeFiles,
          appTitle,
          accentColor,
          logoDataUrl,
          isPureBlackScreen,
          resolvedRootBg,
          isCenteredSingleTextLayout,
          minSdk: project?.minSdk || 24,
          targetSdk: project?.targetSdk || 35,
          layoutFiles,
          activeLayoutPath: activeLayoutFile?.path || "",
          widgets: bodyWidgets,
          allWidgets: widgets,
          clickHandlers,
          combinedCode,
          items: parsedItems
        };
      }

          const numericValues = inputWidgets
            .map((iw) => parseFloat(emuInputValues[iw.id]))
            .filter((n) => !Number.isNaN(n));

          if (
            inputWidgets.length > 0 &&
            (lowerId.includes("calc") ||
              lowerId.includes("submit") ||
              lowerId.includes("btn") ||
              lowerLabel.includes("হিসাব") ||
              lowerLabel.includes("গণনা") ||
              lowerLabel.includes("যোগ") ||
              lowerLabel.includes("সাবমিট"))

            const outputTextWidgets = livePreviewData.widgets.filter(
              (w) =>

                  w.id.toLowerCase().includes("total") ||
                  w.id.toLowerCase().includes("output") ||
                  w.text.includes(":") ||
                  w.text.includes("০"))
            );

            if (numericValues.length >= 2) {
              const sum = numericValues.reduce((a, b) => a + b, 0);
              const product = numericValues.reduce((a, b) => a * b, 1);
              const calcSummary = `ফলাফল: যোগফল = ${sum} | গুণফল = ${product}`;

বাধ্যতামূলক কোডিং নিয়ম (Deep Analysis-Before-Code & Zero Default Boilerplate):
১. নতুন প্রজেক্ট ০টি ফাইল দিয়ে শুরু হয়—আগে থেকে কোনো ডিফল্ট ফাইল, ডিফল্ট কালার বা ডিফল্ট লোগো কোড ধরে নেবে না।
২. প্রথমে \`### 🔍 প্রজেক্ট বিশ্লেষণ ও পরিকল্পনা\` শিরোনামে ৩–৫ লাইনে লিখবে কী বিশ্লেষণ করা হলো এবং ঠিক কোন কোন ফাইল তৈরি বা আপডেট করা হচ্ছে।
৩. এরপর শুধুমাত্র প্রয়োজনীয় প্রতিটি ফাইলের সম্পূর্ণ শুরু থেকে শেষ পর্যন্ত রানযোগ্য কোড (কোনো TODO বা সংক্ষেপণ ছাড়া) নিচের ফরম্যাটে দেবে যাতে ইউজার Accept বাটনে ক্লিক করলেই ঠিক ওই ফাইলগুলো প্রজেক্টে যুক্ত হয় ও প্রিভিউতে দেখায়:
<<<FILE:app/src/main/path/FileName.ext>>>
সম্পূর্ণ কোড
<<<END_FILE>>>`;
              }

              composedUserPrompt = `বর্তমান প্রজেক্টের ফাইলসমূহ:\n${projectSummaryFiles}\n\nইউজারের নির্দেশনা:\n${promptText}`;
            }

            const recentHistory = chatMessages
              .slice(-6)
              .filter((m) => m.role === "user" || m.role === "assistant")
              .map((m) => ({
                role: m.role === "assistant" ? "model" : "user",
                parts: [{ text: String(m.text || "").slice(0, 2000) }]
              }));

            const currentUserParts = [{ text: composedUserPrompt }];
            pendingAttachments.forEach((att) => {
              if (att.base64Data) {
                currentUserParts.push({
                  inline_data: {
                    mime_type: att.mimeType || "image/png",
                    data: att.base64Data
                  }
                });
              }
            });

            const contentsPayload = [
              ...recentHistory,
              { role: "user", parts: currentUserParts }
            ];

            let finalResponseText = "";
            let succeededModel = "";
            let lastErrMessage = "";

            for (const modelId of prioritizedQueue) {
              if (masterController.signal.aborted) {
                throw new DOMException("Aborted", "AbortError");
              }

              const perAttemptController = new AbortController();
              const timeoutHandle = setTimeout(() => perAttemptController.abort(), 30000);
              const onMasterAbort = () => perAttemptController.abort();
              masterController.signal.addEventListener("abort", onMasterAbort, { once: true });

              try {
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(
                  modelId
                )}:generateContent?key=${encodeURIComponent(cleanKey)}`;

                const resp = await fetch(endpoint, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  signal: perAttemptController.signal,
                  body: JSON.stringify({
                    systemInstruction: {
                      parts: [{ text: systemInstructionText }]
                    },
                    contents: contentsPayload,
                    generationConfig: {
                      temperature: isFastChatOnly
                        ? Number(aiSettings.temperature) || 0.3
                        : Math.min(Number(aiSettings.temperature) || 0.15, 0.15),
                      maxOutputTokens: isFastChatOnly
                        ? 1024
                        : Math.max(Number(aiSettings.maxOutputTokens) || 8192, 8192)
                    }
                  })
                });

                const json = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                  const status = resp.status;
                  const apiErr = json?.error?.message || `HTTP ${status}`;
                  lastErrMessage = `${modelId}: ${apiErr}`;
                  if (status === 400 && apiErr.toLowerCase().includes("api key")) {
                    throw new Error("আপনার Gemini API Key-টি সঠিক নয়। নতুন কী বসিয়ে যাচাই করুন।");
                  }
                  continue;
                }

                const textCandidate =
                  json?.candidates?.[0]?.content?.parts
                    ?.map((p) => p.text || "")
                    .join("")
                    .trim() || "";

                if (!textCandidate) {
                  lastErrMessage = `${modelId}: খালি উত্তর এসেছে`;
                  continue;
                }

                finalResponseText = textCandidate;
                succeededModel = modelId;
                setActiveModelId(modelId);
                break;
              } catch (attemptErr) {
                if (masterController.signal.aborted) {
                  throw attemptErr;
                }
                lastErrMessage = attemptErr?.message || "নেটওয়ার্ক টাইমআউট";
              } finally {
                clearTimeout(timeoutHandle);
                masterController.signal.removeEventListener("abort", onMasterAbort);
              }
            }

            if (!finalResponseText) {
              throw new Error(
                lastErrMessage ||
                  "সব সক্রিয় মডেলে চেষ্টা করেও উত্তর পাওয়া যায়নি। কিছুক্ষণ পর আবার চেষ্টা করুন।"
              );
            }

            const extractedUpdates = isNewAppBuilderMode
              ? []
              : extractFileUpdatesFromAiResponse(finalResponseText, activeProject?.files || []);

            const builtDraftProject = isNewAppBuilderMode
              ? buildDraftProjectFromAiResponse(finalResponseText, promptText)
              : null;

            if (builtDraftProject) {
              setStagedDraftProject(builtDraftProject);
              setPreviewRefreshTick((t) => t + 1);
            }

            let reviewStatus = "none";
            if (extractedUpdates.length > 0) {
              if (aiSettings.autoApplyCodeUpdates) {
                applyFileUpdatesToActiveProject(
                  extractedUpdates,
                  `Auto-Update (${succeededModel})`
                );
                reviewStatus = "accepted";
              } else {
                reviewStatus = "pending";
              }
            }

            const assistantMsg = {
              id: `ai_${Date.now()}`,
              role: "assistant",
              text: finalResponseText,
              modelUsed: succeededModel,
              stagedUpdates: extractedUpdates,
              reviewStatus,
              draftProject: builtDraftProject,
              draftStatus: builtDraftProject ? "pending" : "none",
              timestamp: Date.now()
            };

            updateActiveProjectChatMessages((prev) => [...prev, assistantMsg]);
          } catch (err) {
            if (err?.name === "AbortError") {
              updateActiveProjectChatMessages((prev) => [
                ...prev,
                {
                  id: `stop_${Date.now()}`,
                  role: "assistant",
                  text: "⏹ জেনারেশন থামানো হয়েছে।",
                  timestamp: Date.now()
                }
              ]);
            } else {
              updateActiveProjectChatMessages((prev) => [
                ...prev,
                {
                  id: `err_${Date.now()}`,
                  role: "assistant",
                  text: `⚠️ ত্রুটি: ${err?.message || "উত্তর তৈরি করা সম্ভব হয়নি।"}`,
                  timestamp: Date.now()
                }
              ]);
            }
          } finally {
            setIsGenerating(false);
            abortControllerRef.current = null;
          }
        };

        // =========================================================================
        // NEW PROJECT WIZARD HANDLERS (ZERO DEFAULT FILES, ZERO DEFAULT COLORS, OPTIONAL LOGO)
        // =========================================================================
        const handleLogoFileUpload = (e) => {
          setNewProjLogoError("");
          const file = e.target.files?.[0];
          if (!file) return;
          if (file.size > 450 * 1024) {
            setNewProjLogoError("লোগো ফাইলটি ৪৫০ KB-এর নিচে রাখুন (দ্রুত সিঙ্কের জন্য)।");
            return;
          }
          const reader = new FileReader();
          reader.onload = () => {
            setNewProjLogoDataUrl(String(reader.result || ""));
            setNewProjLogoName(file.name);
          };
          reader.readAsDataURL(file);
        };

        const handleCreateNewProject = (e) => {
          e.preventDefault();
          const finalName = newProjName.trim() || "Droid App";
          const created = generateAuthenticAndroidProject({
            name: finalName,
            packageSuffix: newProjPkgSuffix,
            codeLang: newProjLang,
            minSdk: newProjMinSdk,
            targetSdk: newProjTargetSdk,
            buildConfigDsl: newProjDsl,
            useViewBinding: newProjViewBinding,
            useMaterial3: newProjMaterial3,
            accentHex: newProjAccent,
            customLogoDataUrl: newProjLogoDataUrl,
            customLogoName: newProjLogoName
          });

          const updatedList = [created, ...projects];
          persistProjectList(updatedList, created);
          setIsNewAppSessionActive(false);
          setStagedDraftProject(null);
          setActiveProjectId(created.id);
          setSelectedFilePath(created.files[0]?.path || "");

          const freshChat = createInitialProjectChatMessages(created.name);
          const freshSettings = { ...DEFAULT_AI_SETTINGS, preferredModel: activeModelId };
          const uid = currentUser?.uid;

          setProjectChatMap((prev) => {
            const nextMap = { ...prev, [created.id]: freshChat };
            try {
              localStorage.setItem(
                getUserScopedProjectChatsStorageName(uid),
                JSON.stringify(nextMap)
              );
            } catch {}
            return nextMap;
          });

          setProjectAiSettingsMap((prev) => {
            const nextMap = { ...prev, [created.id]: freshSettings };
            try {
              localStorage.setItem(
                getUserScopedProjectAiSettingsStorageName(uid),
                JSON.stringify(nextMap)
              );
            } catch {}
            return nextMap;
          });

          if (uid && window.DroidDB) {
            window.DroidDB.ref(`users/${uid}/projectChats/${created.id}`)
              .set(freshChat)
              .catch(() => {});
            window.DroidDB.ref(`users/${uid}/projectAiSettings/${created.id}`)
              .set(freshSettings)
              .catch(() => {});
          }

          recordProjectSnapshot(created, "নতুন প্রজেক্ট তৈরি (০ ডিফল্ট ফাইল)", "Created");
          setPreviewRefreshTick((t) => t + 1);
          setIsNewProjectModalOpen(false);
          setNewProjName("");
          setNewProjPkgSuffix("myapp");
          setNewProjPkgManual(false);
          setNewProjAccent("");
          setNewProjLogoDataUrl("");
          setNewProjLogoName("");
        };

        // =========================================================================
        // CODE EDITOR HANDLERS (UNDO/REDO, SEARCH/REPLACE, COPY/DOWNLOAD, DELETE FILE)
        // =========================================================================
        const showEditorNotice = (msg) => {
          setEditorActionMsg(msg);
          setTimeout(() => setEditorActionMsg(""), 2200);
        };

        const handleUpdateActiveFileContent = (newContent) => {
          if (!activeProject || !activeFile) return;
          const fileKey = `${activeProject.id}::${activeFile.path}`;
          setEditorUndoStack((prev) => ({
            ...prev,
            [fileKey]: [...(prev[fileKey] || []).slice(-30), activeFile.content]
          }));
          setEditorRedoStack((prev) => ({ ...prev, [fileKey]: [] }));

          const updatedFiles = activeProject.files.map((f) =>
            f.path === activeFile.path ? { ...f, content: newContent } : f
          );
          const updatedProject = {
            ...activeProject,
            updatedAt: Date.now(),
            files: updatedFiles
          };
          const updatedList = projects.map((p) =>
            p.id === updatedProject.id ? updatedProject : p
          );
          setProjects(updatedList);
        };

        const handleEditorUndo = () => {
          if (!activeProject || !activeFile) return;
          const fileKey = `${activeProject.id}::${activeFile.path}`;
          const stack = editorUndoStack[fileKey] || [];
          if (stack.length === 0) return;
          const previousText = stack[stack.length - 1];
          setEditorUndoStack((prev) => ({ ...prev, [fileKey]: stack.slice(0, -1) }));
          setEditorRedoStack((prev) => ({
            ...prev,
            [fileKey]: [...(prev[fileKey] || []), activeFile.content]
          }));

          const updatedProject = {
            ...activeProject,
            updatedAt: Date.now(),
            files: activeProject.files.map((f) =>
              f.path === activeFile.path ? { ...f, content: previousText } : f
            )
          };
          setProjects(projects.map((p) => (p.id === updatedProject.id ? updatedProject : p)));
        };

        const handleEditorRedo = () => {
          if (!activeProject || !activeFile) return;
          const fileKey = `${activeProject.id}::${activeFile.path}`;
          const stack = editorRedoStack[fileKey] || [];
          if (stack.length === 0) return;
          const nextText = stack[stack.length - 1];
          setEditorRedoStack((prev) => ({ ...prev, [fileKey]: stack.slice(0, -1) }));
          setEditorUndoStack((prev) => ({
            ...prev,
            [fileKey]: [...(prev[fileKey] || []), activeFile.content]
          }));

          const updatedProject = {
            ...activeProject,
            updatedAt: Date.now(),
            files: activeProject.files.map((f) =>
              f.path === activeFile.path ? { ...f, content: nextText } : f
            )
          };
          setProjects(projects.map((p) => (p.id === updatedProject.id ? updatedProject : p)));
        };

        const handleEditorReplaceAll = (e) => {
          e.preventDefault();
          if (!activeProject || !activeFile || !editorFindText) return;
          if (!activeFile.content.includes(editorFindText)) {
            showEditorNotice("⚠️ টেক্সট পাওয়া যায়নি");
            return;
          }
          const updatedText = activeFile.content.split(editorFindText).join(editorReplaceText);
          handleUpdateActiveFileContent(updatedText);
          showEditorNotice("✅ রিপ্লেস সম্পন্ন");
        };

        const handleCopyActiveFileCode = () => {
          if (!activeFile?.content) return;
          try {
            const ta = document.createElement("textarea");
            ta.value = activeFile.content;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            showEditorNotice("📋 কোড কপি হয়েছে");
          } catch {
            showEditorNotice("⚠️ কপি ব্যর্থ");
          }
        };

        const handleDownloadSingleFile = () => {
          if (!activeFile) return;
          const blob = new Blob([activeFile.content || ""], { type: "text/plain;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = activeFile.path.split("/").pop() || "file.txt";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 2000);
        };

        const handleDeleteSingleFile = (targetPath) => {
          if (!activeProject || !targetPath) return;
          const nextFiles = activeProject.files.filter((f) => f.path !== targetPath);
          const updatedProject = {
            ...activeProject,
            updatedAt: Date.now(),
            files: nextFiles
          };
          const updatedList = projects.map((p) =>
            p.id === updatedProject.id ? updatedProject : p
          );
          persistProjectList(updatedList, updatedProject);
          if (selectedFilePath === targetPath) {
            setSelectedFilePath(nextFiles[0]?.path || "");
          }
          setPreviewRefreshTick((t) => t + 1);
          showEditorNotice("🗑️ ফাইল ডিলিট হয়েছে");
        };

        const handleManualSaveCode = () => {
          if (!activeProject) return;
          persistProjectList(projects, activeProject);
          recordProjectSnapshot(activeProject, "কোড এডিটর থেকে ম্যানুয়াল সেভ", "Saved");
          setPreviewRefreshTick((t) => t + 1);
          setCodeSavedToast(true);
          setTimeout(() => setCodeSavedToast(false), 2000);
        };

        const handleAddNewFile = (e) => {
          e.preventDefault();
          if (!activeProject) return;
          let rawPath = newFilePathInput.trim();
          if (!rawPath) return;

          if (!rawPath.includes("/")) {
            const pkgPath = (activeProject.packageName || "com.droid.app").replace(/\./g, "/");
            if (rawPath.endsWith(".kt") || rawPath.endsWith(".java")) {
              rawPath = `app/src/main/java/${pkgPath}/${rawPath}`;
            } else if (rawPath.endsWith(".xml")) {
              rawPath = `app/src/main/res/layout/${rawPath}`;
            } else {
              rawPath = `app/src/main/${rawPath}`;
            }
          }

          if (activeProject.files.some((f) => f.path === rawPath)) {
            setSelectedFilePath(rawPath);
            setIsNewFileModalOpen(false);
            setNewFilePathInput("");
            return;
          }

          // Pure raw empty content for manually added files (no pre-filled stubs)
          const updatedProject = {
            ...activeProject,
            updatedAt: Date.now(),
            files: [...activeProject.files, { path: rawPath, content: "" }]
          };
          const updatedList = projects.map((p) =>
            p.id === updatedProject.id ? updatedProject : p
          );
          persistProjectList(updatedList, updatedProject);
          setSelectedFilePath(rawPath);
          setIsNewFileModalOpen(false);
          setNewFilePathInput("");
        };

        // =========================================================================
        // SHARED GITHUB FILE UPSERT HELPER
        // =========================================================================
        const upsertFileToGitHubRepo = async ({
          token,
          owner,
          repo,
          branch,
          path,
          base64Content,
          message
        }) => {
          const apiUrl = `https://api.github.com/repos/${encodeURIComponent(
            owner
          )}/${encodeURIComponent(repo)}/contents/${path
            .split("/")
            .map(encodeURIComponent)
            .join("/")}`;

          let existingSha = undefined;
          const checkRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch)}`, {
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json"
            }
          });
          if (checkRes.ok) {
            const existingJson = await checkRes.json();
            existingSha = existingJson.sha;
          }

          const putRes = await fetch(apiUrl, {
            method: "PUT",
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message,
              content: base64Content,
              branch,
              ...(existingSha ? { sha: existingSha } : {})
            })
          });

          if (!putRes.ok) {
            const errJson = await putRes.json().catch(() => ({}));
            throw new Error(errJson?.message || `${path} আপলোড ব্যর্থ (${putRes.status})`);
          }
        };

        // =========================================================================
        // GITHUB PUSH, ZIP EXPORT & CLOUD APK/AAB BUILD HANDLERS
        // =========================================================================
        const handlePushToGitHub = async (e) => {
          e.preventDefault();
          if (!activeProject) return;
          const token = ghToken.trim();
          const owner = ghOwner.trim();
          const repo = ghRepo.trim();
          const branch = ghBranch.trim() || "main";

          if (!token || !owner || !repo) {
            setGhPushStatus({ ok: false, msg: "GitHub Token, Owner ও Repository নাম দিন।" });
            return;
          }
          if (activeProject.files.length === 0) {
            setGhPushStatus({ ok: false, msg: "প্রজেক্টে এখনো কোনো ফাইল নেই (০টি ফাইল)।" });
            return;
          }

          localStorage.setItem("droid_gh_token", token);
          localStorage.setItem("droid_gh_owner", owner);
          localStorage.setItem("droid_gh_repo", repo);

          setIsPushingGh(true);
          setGhPushStatus(null);

          try {
            let pushedCount = 0;
            for (const file of activeProject.files) {
              const base64Content = file.assetDataUrl
                ? file.assetDataUrl.split(",")[1] || ""
                : btoa(unescape(encodeURIComponent(file.content || "")));

              await upsertFileToGitHubRepo({
                token,
                owner,
                repo,
                branch,
                path: file.path,
                base64Content,
                message: ghCommitMsg || `Update ${file.path}`
              });
              pushedCount++;
            }

            setGhPushStatus({
              ok: true,
              msg: `✅ সফলভাবে ${pushedCount}টি ফাইল ${owner}/${repo} (${branch})-এ পুশ হয়েছে!`
            });
          } catch (err) {
            setGhPushStatus({
              ok: false,
              msg: `❌ GitHub ত্রুটি: ${err?.message || "পুশ সম্পন্ন হয়নি।"}`
            });
          } finally {
            setIsPushingGh(false);
          }
        };

        const handleExportProjectZip = async () => {
          if (!activeProject) return;
          if (typeof window.JSZip === "undefined") {
            setZipExportStatus({
              ok: false,
              msg: "❌ JSZip লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করে পেজ রিফ্রেশ করুন।"
            });
            return;
          }
          if (activeProject.files.length === 0) {
            setZipExportStatus({
              ok: false,
              msg: "⚠️ প্রজেক্টে এখনো কোনো ফাইল নেই (০টি ফাইল)। আগে AI চ্যাটে কোড তৈরি করুন।"
            });
            return;
          }

          setIsZipExporting(true);
          setZipExportStatus(null);

          try {
            const zip = new window.JSZip();
            const slug = sanitizeAppPackageSuffix(activeProject.name);
            const root = zip.folder(slug);

            const exportFiles = [...activeProject.files];

            for (const f of exportFiles) {
              if (f.assetDataUrl && f.assetDataUrl.includes(",")) {
                root.file(f.path, f.assetDataUrl.split(",")[1], { base64: true });
              } else {
                root.file(f.path, f.content || "");
              }
            }

            const blob = await zip.generateAsync({ type: "blob" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${slug}-android-project.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 4000);

            setZipExportStatus({
              ok: true,
              msg: `✅ ${slug}-android-project.zip ডাউনলোড সম্পন্ন (${exportFiles.length}টি ফাইল)!`
            });
          } catch (err) {
            setZipExportStatus({
              ok: false,
              msg: `❌ ZIP এক্সপোর্ট ব্যর্থ: ${err?.message || "ত্রুটি হয়েছে"}`
            });
          } finally {
            setIsZipExporting(false);
          }
        };

        const fetchArtifactsForRun = async (token, owner, repo, runId) => {
          try {
            const res = await fetch(
              `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(
                repo
              )}/actions/runs/${runId}/artifacts`,
              {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/vnd.github+json"
                }
              }
            );
            if (!res.ok) return;
            const json = await res.json();
            const items = Array.isArray(json?.artifacts)
              ? json.artifacts.filter((a) => !a.expired)
              : [];
            setCloudBuildArtifacts(items);
          } catch {}
        };

        const pollCloudBuildStatus = (token, owner, repo) => {
          if (cloudPollRef.current) clearInterval(cloudPollRef.current);
          let attempts = 0;

          const checkRun = async () => {
            attempts++;
            if (attempts > 60) {
              clearInterval(cloudPollRef.current);
              setIsCloudBuilding(false);
              setCloudBuildStep("⏱️ বিল্ড সময়সীমা শেষ। GitHub Actions পেজ চেক করুন।");
              return;
            }
            try {
              const res = await fetch(
                `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(
                  repo
                )}/actions/runs?per_page=1`,
                {
                  headers: {
                    Authorization: `Bearer ${token}`,
                    Accept: "application/vnd.github+json"
                  }
                }
              );
              if (!res.ok) return;
              const json = await res.json();
              const latest = json?.workflow_runs?.[0];
              if (!latest) return;

              setCloudBuildRun(latest);
              if (latest.status === "completed") {
                clearInterval(cloudPollRef.current);
                setIsCloudBuilding(false);
                if (latest.conclusion === "success") {
                  setCloudBuildStep("✅ APK ও AAB বিল্ড সফলভাবে সম্পন্ন হয়েছে!");
                  await fetchArtifactsForRun(token, owner, repo, latest.id);
                } else {
                  setCloudBuildStep("");
                  setCloudBuildError(
                    `❌ Gradle বিল্ড ব্যর্থ হয়েছে (${latest.conclusion})। নিচের বাটনে ক্লিক করে AI দিয়ে ফিক্স করুন।`
                  );
                }
              } else {
                setCloudBuildStep(
                  `⚙️ GitHub Actions বিল্ড চলছে (${latest.status})... অনুগ্রহ করে অপেক্ষা করুন`
                );
              }
            } catch {}
          };

          checkRun();
          cloudPollRef.current = setInterval(checkRun, 6000);
        };

        const handleStartCloudApkAabBuild = async (e) => {
          e.preventDefault();
          if (!activeProject) return;

          const token = ghToken.trim();
          const owner = ghOwner.trim();
          const targetRepo = buildAppRepo.trim();

          if (!token || !owner || !targetRepo) {
            setCloudBuildError("GitHub Token (repo + workflow পারমিশন), Owner ও App Repo নাম দিন।");
            return;
          }

          if (activeProject.files.length === 0) {
            setCloudBuildError("⚠️ প্রজেক্টে এখনো কোনো ফাইল নেই (০টি ফাইল)। আগে AI চ্যাটে কোড তৈরি করুন।");
            return;
          }

          if (targetRepo.toLowerCase() === "droid-ai.studio") {
            setCloudBuildError(
              "⚠️ সতর্কতা: মূল Droid-AI.Studio রিপোজিটরিতে অ্যাপ বিল্ড করবেন না—প্রতিটি অ্যাপের জন্য আলাদা রিপোজিটরি নাম দিন।"
            );
            return;
          }

          localStorage.setItem("droid_gh_token", token);
          localStorage.setItem("droid_gh_owner", owner);

          setIsCloudBuilding(true);
          setCloudBuildError("");
          setCloudBuildArtifacts([]);
          setCloudBuildRun(null);
          setCloudBuildStep("১/৩: অ্যাপের আলাদা বিল্ড রিপোজিটরি প্রস্তুত হচ্ছে...");

          try {
            const checkRepo = await fetch(
              `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(
                targetRepo
              )}`,
              {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/vnd.github+json"
                }
              }
            );

            if (checkRepo.status === 404) {
              setCloudBuildStep(`নতুন বিল্ড রিপোজিটরি "${targetRepo}" তৈরি হচ্ছে...`);
              const createRes = await fetch("https://api.github.com/user/repos", {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/vnd.github+json",
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  name: targetRepo,
                  description: `${activeProject.name} — Built via Droid AI Studio`,
                  private: false,
                  auto_init: true
                })
              });
              if (!createRes.ok) {
                const errD = await createRes.json().catch(() => ({}));
                throw new Error(
                  errD?.message ||
                    `রিপোজিটরি "${targetRepo}" তৈরি করা যায়নি। GitHub Token-এ repo ও workflow স্কোপ দিন।`
                );
              }
              await new Promise((r) => setTimeout(r, 2000));
            }

            setCloudBuildStep("২/৩: সোর্স কোড ও Gradle Workflow আপলোড হচ্ছে...");

            const filesToBuild = [
              ...activeProject.files,
              {
                path: ".github/workflows/droid-ai-build.yml",
                content: generateDroidAiBuildWorkflowYaml(activeProject)
              }
            ];

            for (const f of filesToBuild) {
              const b64 = f.assetDataUrl
                ? f.assetDataUrl.split(",")[1] || ""
                : btoa(unescape(encodeURIComponent(f.content || "")));

              await upsertFileToGitHubRepo({
                token,
                owner,
                repo: targetRepo,
                branch: "main",
                path: f.path,
                base64Content: b64,
                message: `Droid AI Build: ${f.path}`
              });
            }

            setCloudBuildStep(
              "৩/৩: GitHub Actions Gradle বিল্ড শুরু হয়েছে! ২-৩ মিনিটের মধ্যে APK ও AAB ডাউনলোড বাটন আসবে..."
            );
            pollCloudBuildStatus(token, owner, targetRepo);
          } catch (err) {
            setIsCloudBuilding(false);
            setCloudBuildStep("");
            setCloudBuildError(`❌ Cloud Build ত্রুটি: ${err?.message || "বিল্ড শুরু হয়নি।"}`);
          }
        };

        const handleDownloadBuildArtifact = async (artifact) => {
          const token = ghToken.trim();
          const owner = ghOwner.trim();
          const targetRepo = buildAppRepo.trim();
          if (!token || !owner || !targetRepo || !artifact?.id) return;

          setDownloadingArtifactId(artifact.id);
          try {
            const res = await fetch(
              `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(
                targetRepo
              )}/actions/artifacts/${artifact.id}/zip`,
              {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/vnd.github+json"
                }
              }
            );
            if (!res.ok) {
              throw new Error(`ডাউনলোড ব্যর্থ (HTTP ${res.status})`);
            }
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${artifact.name}.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 4000);
          } catch (err) {
            setCloudBuildError(`❌ ডাউনলোড ত্রুটি: ${err?.message}`);

                          const isNum =

                            w.inputType.toLowerCase().includes("decimal");

                          return (
                            <div key={`${w.id}_${idx}`}>
                              <input
                                type={isPass ? "password" : isNum ? "number" : "text"}
                                value={
                                  isSearch
                                    ? previewSearchQuery
                                    : emuInputValues[w.id] ?? ""
                                }
                                onChange={(e) => {
                                  const val = e.target.value;
                                  if (isSearch) {
                                    setPreviewSearchQuery(val);
                                  } else {
                                    setEmuInputValues((prev) => ({ ...prev, [w.id]: val }));

                          {isPushingGh

                            : `সব ফাইল (${activeProject?.files?.length || 0}) পুশ করুন`}
                        </button>
                      </div>
                    </form>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<DroidAIStudioApp />);
    </script>
  </body>
</html>
