<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Droid AI Studio — Android AI Code Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo, useEffect } = React;

      // Persistent localStorage key preserved so no existing projects are lost
      const STORAGE_KEY = "droid_ai_studio_projects_v1";

      // All 7 Android Studio project language options
      const LANGUAGE_OPTIONS = [
        {
          id: "kotlin-compose",
          label: "Kotlin + Jetpack Compose",
          shortLabel: "Kotlin Compose",
          defaultLang: "kotlin"
        },
        {
          id: "kotlin-xml",
          label: "Kotlin + XML Views",
          shortLabel: "Kotlin XML",
          defaultLang: "kotlin"
        },
        {
          id: "java-xml",
          label: "Java + XML Views",
          shortLabel: "Java XML",
          defaultLang: "java"
        },
        {
          id: "java-compose",
          label: "Java + Compose / Material",
          shortLabel: "Java Compose",
          defaultLang: "java"
        },
        {
          id: "cpp-kotlin",
          label: "C++ Native JNI + Kotlin",
          shortLabel: "C++ Kotlin JNI",
          defaultLang: "kotlin"
        },
        {
          id: "cpp-java",
          label: "C++ Native JNI + Java",
          shortLabel: "C++ Java JNI",
          defaultLang: "java"
        },
        {
          id: "kmp-android",
          label: "Kotlin Multiplatform (Android Target)",
          shortLabel: "KMP Android",
          defaultLang: "kotlin"
        }
      ];

      // Target / Compile SDK options (API 36 down to API 28)
      const TARGET_SDK_OPTIONS = [
        { api: 36, androidVersion: "Android 16", badge: "API 36 (Android 16)" },
        { api: 35, androidVersion: "Android 15", badge: "API 35 (Android 15)" },
        { api: 34, androidVersion: "Android 14", badge: "API 34 (Android 14)" },
        { api: 33, androidVersion: "Android 13", badge: "API 33 (Android 13)" },
        { api: 32, androidVersion: "Android 12L", badge: "API 32 (Android 12L)" },
        { api: 31, androidVersion: "Android 12", badge: "API 31 (Android 12)" },
        { api: 30, androidVersion: "Android 11", badge: "API 30 (Android 11)" },
        { api: 29, androidVersion: "Android 10", badge: "API 29 (Android 10)" },
        { api: 28, androidVersion: "Android 9 Pie", badge: "API 28 (Android 9)" }
      ];

      // Minimum SDK options (API 31 down to API 21) with cumulative device support percentages
      const MIN_SDK_OPTIONS = [
        {
          api: 31,
          androidVersion: "Android 12",
          coverage: "~84.5%",
          label: "API 31 (Android 12) — ~84.5% ফোনে সাপোর্ট"
        },
        {
          api: 29,
          androidVersion: "Android 10",
          coverage: "~94.2%",
          label: "API 29 (Android 10) — ~94.2% ফোনে সাপোর্ট"
        },
        {
          api: 28,
          androidVersion: "Android 9 Pie",
          coverage: "~97.5%",
          label: "API 28 (Android 9) — ~97.5% ফোনে সাপোর্ট"
        },
        {
          api: 26,
          androidVersion: "Android 8.0 Oreo",
          coverage: "~99.0%",
          label: "API 26 (Android 8.0) — ~99.0% ফোনে সাপোর্ট"
        },
        {
          api: 24,
          androidVersion: "Android 7.0 Nougat",
          coverage: "~99.4%",
          label: "API 24 (Android 7.0) — ~99.4% ফোনে সাপোর্ট"
        },
        {
          api: 23,
          androidVersion: "Android 6.0 Marshmallow",
          coverage: "~99.7%",
          label: "API 23 (Android 6.0) — ~99.7% ফোনে সাপোর্ট"
        },
        {
          api: 21,
          androidVersion: "Android 5.0 Lollipop",
          coverage: "~99.8%",
          label: "API 21 (Android 5.0) — ~99.8% ফোনে সাপোর্ট (সর্বোচ্চ)"
        }
      ];

      function getLanguageMeta(languageId) {
        return LANGUAGE_OPTIONS.find((item) => item.id === languageId) || LANGUAGE_OPTIONS[0];
      }

      function getTargetSdkMeta(targetSdk) {
        const numeric = Number(targetSdk) || 36;
        return (
          TARGET_SDK_OPTIONS.find((item) => item.api === numeric) || {
            api: numeric,
            androidVersion: `Android API ${numeric}`,
            badge: `API ${numeric}`
          }
        );
      }

      function getMinSdkMeta(minSdk) {
        const numeric = Number(minSdk) || 21;
        return (
          MIN_SDK_OPTIONS.find((item) => item.api === numeric) || {
            api: numeric,
            androidVersion: `Android API ${numeric}`,
            coverage: numeric <= 21 ? "~99.8%" : "~98.5%",
            label: `API ${numeric} — ${numeric <= 21 ? "~99.8%" : "~98.5%"} ফোনে সাপোর্ট`
          }
        );
      }

      function escapeXmlValue(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      /**
       * Generates app/build.gradle.kts with explicit minSdk, compileSdk, targetSdk, and native CMake block when needed.
       */
      function buildGradleContent(languageId, pkg, targetSdk, minSdk) {
        const isNativeCpp = languageId === "cpp-kotlin" || languageId === "cpp-java";
        const usesKotlin =
          languageId === "kotlin-compose" ||
          languageId === "kotlin-xml" ||
          languageId === "cpp-kotlin" ||
          languageId === "kmp-android";

        const pluginsText = usesKotlin
          ? `plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}`
          : `plugins {
    id("com.android.application")
}`;

        const nativeBlock = isNativeCpp
          ? `
    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            cppFlags += "-std=c++17"
        }
    }
`
          : "";

        return `${pluginsText}

android {
    namespace = "${pkg}"
    compileSdk = ${targetSdk}

    defaultConfig {
        applicationId = "${pkg}"
        minSdk = ${minSdk}
        targetSdk = ${targetSdk}
        versionCode = 1
        versionName = "1.0"
    }
${nativeBlock}}
`;
      }

      /**
       * Generates app/src/main/AndroidManifest.xml bound directly to the uploaded app logo when present.
       */
      function buildManifestContent(safeName, targetSdk, minSdk, hasLogo) {
        const boundLogoAttrs = hasLogo
          ? `\n        android:logo="@drawable/app_logo_base64"`
          : "";
        return `<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <!-- Target SDK: API ${targetSdk} | Min SDK: API ${minSdk} | Bound Logo: ${hasLogo ? "Attached" : "Default"} -->
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.RECORD_AUDIO" />
    <uses-permission android:name="android.permission.CAMERA" />

    <application
        android:allowBackup="true"
        android:label="@string/app_name"
        android:icon="@mipmap/ic_launcher"
        android:roundIcon="@mipmap/ic_launcher_round"${boundLogoAttrs}
        android:supportsRtl="true"
        android:theme="@android:style/Theme.Material.Light.NoActionBar">
        <activity
            android:name=".MainActivity"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
`;
      }

      /**
       * Generates activity_main.xml layout file for XML-based Android projects.
       */
      function buildActivityMainXml(safeName, targetSdk, minSdk) {
        const minMeta = getMinSdkMeta(minSdk);
        return `<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:gravity="center"
    android:orientation="vertical"
    android:padding="24dp">

    <ImageView
        android:id="@+id/appLogoView"
        android:layout_width="72dp"
        android:layout_height="72dp"
        android:contentDescription="@string/app_name"
        android:src="@mipmap/ic_launcher" />

    <TextView
        android:id="@+id/titleText"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:layout_marginTop="16dp"
        android:text="${escapeXmlValue(safeName)}"
        android:textSize="22sp"
        android:textStyle="bold" />

    <TextView
        android:id="@+id/sdkInfoText"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:layout_marginTop="8dp"
        android:text="Target API ${targetSdk} • Min API ${minSdk} (${minMeta.coverage})"
        android:textSize="14sp" />
</LinearLayout>
`;
      }

      /**
       * Generates CMakeLists.txt and native-lib.cpp for C++ Native JNI projects.
       */
      function buildCppNativeFiles(pkg) {
        const jniSymbol = `Java_${pkg.replace(/\./g, "_")}_MainActivity_stringFromJNI`;
        return [
          {
            path: "app/src/main/cpp/CMakeLists.txt",
            language: "cmake",
            content: `cmake_minimum_required(VERSION 3.22.1)
project("droidnative")

add_library(
    droidnative
    SHARED
    native-lib.cpp
)

find_library(
    log-lib
    log
)

target_link_libraries(
    droidnative
    \${log-lib}
)
`
          },
          {
            path: "app/src/main/cpp/native-lib.cpp",
            language: "cpp",
            content: `#include <jni.h>
#include <string>

extern "C" JNIEXPORT jstring JNICALL
${jniSymbol}(JNIEnv* env, jobject /* thiz */) {
    std::string message = "Native C++ JNI active in Droid AI Studio!";
    return env->NewStringUTF(message.c_str());
}
`
          }
        ];
      }

      /**
       * Builds full starter project files based on selected Android Studio language, SDKs, and bound logo.
       */
      function buildDefaultFiles(safeName, pkg, languageId, targetSdk, minSdk, hasLogo) {
        const pkgPath = pkg.replace(/\./g, "/");
        const minMeta = getMinSdkMeta(minSdk);
        const logoComment = hasLogo
          ? "Bound App Logo: app/src/main/res/drawable/app_logo_base64.txt"
          : "Bound App Logo: None uploaded yet";

        const stringsXml = {
          path: "app/src/main/res/values/strings.xml",
          language: "xml",
          content: `<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">${escapeXmlValue(safeName)}</string>
</resources>
`
        };

        const manifestXml = {
          path: "app/src/main/AndroidManifest.xml",
          language: "xml",
          content: buildManifestContent(safeName, targetSdk, minSdk, hasLogo)
        };

        const gradleKts = {
          path: "app/build.gradle.kts",
          language: "kotlin",
          content: buildGradleContent(languageId, pkg, targetSdk, minSdk)
        };

        if (languageId === "kotlin-xml") {
          return [
            {
              path: `app/src/main/java/${pkgPath}/MainActivity.kt`,
              language: "kotlin",
              content: `package ${pkg}

import android.os.Bundle
import androidx.appcompat.app.AppCompatActivity

// ${logoComment}
class MainActivity : AppCompatActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_main)
    }
}
`
            },
            {
              path: "app/src/main/res/layout/activity_main.xml",
              language: "xml",
              content: buildActivityMainXml(safeName, targetSdk, minSdk)
            },
            stringsXml,
            manifestXml,
            gradleKts
          ];
        }

        if (languageId === "java-xml") {
          return [
            {
              path: `app/src/main/java/${pkgPath}/MainActivity.java`,
              language: "java",
              content: `package ${pkg};

import android.os.Bundle;
import androidx.appcompat.app.AppCompatActivity;

// ${logoComment}
public class MainActivity extends AppCompatActivity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);
    }
}
`
            },
            {
              path: "app/src/main/res/layout/activity_main.xml",
              language: "xml",
              content: buildActivityMainXml(safeName, targetSdk, minSdk)
            },
            stringsXml,
            manifestXml,
            gradleKts
          ];
        }

        if (languageId === "java-compose") {
          return [
            {
              path: `app/src/main/java/${pkgPath}/MainActivity.java`,
              language: "java",
              content: `package ${pkg};

import android.os.Bundle;
import android.widget.TextView;
import androidx.activity.ComponentActivity;

// ${logoComment}
public class MainActivity extends ComponentActivity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        TextView composeHostLabel = new TextView(this);
        composeHostLabel.setText("${safeName} • Java Compose / Material • API ${targetSdk} (Min ${minSdk})");
        setContentView(composeHostLabel);
    }
}
`
            },
            stringsXml,
            manifestXml,
            gradleKts
          ];
        }

        if (languageId === "cpp-kotlin") {
          return [
            {
              path: `app/src/main/java/${pkgPath}/MainActivity.kt`,
              language: "kotlin",
              content: `package ${pkg}

import android.os.Bundle
import androidx.activity.ComponentActivity

import androidx.compose.foundation.layout.*
import androidx.compose.material3.*

import androidx.compose.ui.unit.dp

// ${logoComment}
class MainActivity : ComponentActivity() {
    external fun stringFromJNI(): String

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val nativeText = try {

            "Native C++ Ready (Target API ${targetSdk}, Min API ${minSdk})"
        }
        setContent {
            MaterialTheme {
                Surface(modifier = Modifier.fillMaxSize()) {
                    Column(modifier = Modifier.padding(24.dp)) {

                    }
                }

        }

`
            },
            ...buildCppNativeFiles(pkg),
            stringsXml,
            manifestXml,
            gradleKts
          ];
        }

        if (languageId === "cpp-java") {
          return [
            {
              path: `app/src/main/java/${pkgPath}/MainActivity.java`,
              language: "java",
              content: `package ${pkg};

import android.os.Bundle;
import android.widget.TextView;
import androidx.appcompat.app.AppCompatActivity;

    static {
        System.loadLibrary("droidnative");
    }

    public native String stringFromJNI();

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        TextView tv = new TextView(this);
        tv.setText("${safeName} • C++ JNI + Java • API ${targetSdk} (Min ${minSdk})");
        setContentView(tv);
    }

`
            },
            ...buildCppNativeFiles(pkg),
            stringsXml,
            manifestXml,
            gradleKts
          ];
        }

        if (languageId === "kmp-android") {
          return [
            {
              path: `app/src/main/java/${pkgPath}/MainActivity.kt`,
              language: "kotlin",
              content: `package ${pkg}

import android.os.Bundle
import androidx.activity.ComponentActivity

// Kotlin Multiplatform (Android Target) • ${logoComment}
class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContent {

                Surface(modifier = Modifier.fillMaxSize()) {

                    }
                }

            },
            {
              path: "shared/src/commonMain/kotlin/SharedApp.kt",
              language: "kotlin",
              content: `class SharedApp {
    fun summary(appName: String, targetApi: Int, minApi: Int): String =
        "\$appName KMP Shared Module (Target API \$targetApi, Min API \$minApi)"
}

            },
            stringsXml,
            manifestXml,
            gradleKts
          ];
        }

        // Default: kotlin-compose
        return [
          {
            path: `app/src/main/java/${pkgPath}/MainActivity.kt`,
            language: "kotlin",
            content: `package ${pkg}

import android.os.Bundle
import androidx.activity.ComponentActivity
import androidx.activity.compose.setContent
import androidx.compose.foundation.layout.*
import androidx.compose.material3.*

import androidx.compose.ui.Modifier
import androidx.compose.ui.unit.dp

// ${logoComment}
class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContent {
            MaterialTheme {
                Surface(modifier = Modifier.fillMaxSize()) {
                    MainScreen(
                        appName = "${safeName}",
                        sdkLabel = "Target API ${targetSdk} • Min API ${minSdk} (${minMeta.coverage})"

@Composable
fun MainScreen(appName: String, sdkLabel: String) {
    Column(modifier = Modifier.padding(24.dp)) {
        Text(text = appName, style = MaterialTheme.typography.headlineMedium)
        Spacer(modifier = Modifier.height(6.dp))

`
          },
          stringsXml,
          manifestXml,
          gradleKts
        ];
      }

      /**
       * Creates or updates a project while keeping minSdk <= targetSdk and binding logo resources directly.
       */
      function createAndroidProject({
        id,
        name,
        packageName,
        description,
        languageId,
        targetSdk,
        minSdk,
        logoDataUrl,
        logoFileName,
        existingFiles,
        regenerateStarterFiles = false
      }) {
        const safeName = (name || "IMO Studio App").trim();
        const pkg = (packageName || "com.example.imostudio").trim();
        const langMeta = getLanguageMeta(languageId);
        const parsedTargetSdk = Number(targetSdk) || 36;
        const parsedMinSdk = Math.min(Number(minSdk) || 21, parsedTargetSdk);
        const pkgPath = pkg.replace(/\./g, "/");
        const hasLogo = Boolean(logoDataUrl);

        let files =
          !regenerateStarterFiles && Array.isArray(existingFiles) && existingFiles.length > 0
            ? existingFiles.map((f) => {
                if (f.path.endsWith("strings.xml")) {
                  return {
                    ...f,
                    content: `<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">${escapeXmlValue(safeName)}</string>\n</resources>\n`
                  };
                }
                if (f.path.endsWith("AndroidManifest.xml")) {
                  return {
                    ...f,
                    content: buildManifestContent(safeName, parsedTargetSdk, parsedMinSdk, hasLogo)
                  };
                }
                if (f.path.endsWith("build.gradle.kts")) {
                  return {
                    ...f,
                    content: buildGradleContent(langMeta.id, pkg, parsedTargetSdk, parsedMinSdk)
                  };
                }
                if (f.path.endsWith("MainActivity.kt")) {
                  const updatedPkg = f.content.replace(/^package\s+[^\s]+/m, `package ${pkg}`);
                  return {
                    path: `app/src/main/java/${pkgPath}/MainActivity.kt`,
                    language: "kotlin",
                    content: updatedPkg
                  };
                }
                if (f.path.endsWith("MainActivity.java")) {
                  const updatedPkg = f.content.replace(/^package\s+[^\s;]+/m, `package ${pkg}`);
                  return {
                    path: `app/src/main/java/${pkgPath}/MainActivity.java`,
                    language: "java",
                    content: updatedPkg
                  };
                }
                return f;
              })
            : buildDefaultFiles(safeName, pkg, langMeta.id, parsedTargetSdk, parsedMinSdk, hasLogo);

        files = files.filter(
          (f) => f.path !== "app/src/main/res/drawable/app_logo_base64.txt"
        );
        if (hasLogo) {
          files.push({
            path: "app/src/main/res/drawable/app_logo_base64.txt",
            language: "text",
            content: `Bound App Logo File: ${logoFileName || "logo.png"}\nBound To App: ${safeName} (${pkg})\nManifest Icon/Logo: Bound\nData URL:\n${logoDataUrl}`
          });
        }

        return {
          id: id || `proj-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          name: safeName,
          packageName: pkg,
          description: description || `${safeName} Android Project`,
          languageId: langMeta.id,
          targetSdk: parsedTargetSdk,
          minSdk: parsedMinSdk,
          logoDataUrl: logoDataUrl || "",
          logoFileName: logoFileName || "",
          updatedAt: new Date().toLocaleString("bn-BD"),
          files
        };
      }

      /**
       * Validates SDK boundaries, empty files, XML headers, and logo attachment.
       */
      function validateProjectFiles(files, targetSdk = 36, minSdk = 21, hasLogo = false) {
        const issues = [];
        if (!files || files.length === 0) {
          return [{ filePath: "project", message: "প্রজেক্টে কোনো ফাইল নেই।", severity: "error" }];
        }
        if (Number(minSdk) > Number(targetSdk)) {
          issues.push({
            filePath: "app/build.gradle.kts",
            message: `Min SDK (API ${minSdk}) Target SDK (API ${targetSdk})-এর চেয়ে বড় হতে পারে না।`,
            severity: "error"
          });
        }
        if (!hasLogo) {
          issues.push({
            filePath: "app/src/main/AndroidManifest.xml",
            message: "অ্যাপের সাথে কাস্টম লোগো যুক্ত করা হয়নি (ডিফল্ট আইকন ব্যবহৃত হচ্ছে)।",
            severity: "warning"
          });
        }
        for (const f of files) {
          if (!f.content || !f.content.trim()) {
            issues.push({ filePath: f.path, message: "ফাইলটি খালি রয়েছে।", severity: "warning" });
          }
          if (f.path.endsWith(".xml") && !f.content.includes("<?xml")) {
            issues.push({ filePath: f.path, message: "XML ফাইলে <?xml ...?> হেডার রাখা ভালো।", severity: "warning" });
          }
          if (f.path.endsWith("build.gradle.kts") && !f.content.includes(`compileSdk = ${targetSdk}`)) {
            issues.push({
              filePath: f.path,
              message: `Gradle ফাইলে compileSdk = ${targetSdk} থাকা উচিত।`,
              severity: "warning"
            });
          }
        }
        return issues;
      }

      function localFallbackEdit(prompt, project, activeFile) {
        const target = activeFile || project.files[0];
        if (!target) return [];
        const langMeta = getLanguageMeta(project.languageId);
        const comment = target.path.endsWith(".xml")
          ? `<!-- AI Command (${langMeta.shortLabel}, Target API ${project.targetSdk}, Min API ${project.minSdk}): ${prompt} -->\n`
          : `// AI Command (${langMeta.shortLabel}, Target API ${project.targetSdk}, Min API ${project.minSdk}): ${prompt}\n`;
        return [{ ...target, content: `${comment}${target.content}` }];
      }

      async function runAICommand({ prompt, project, activeFile, apiKey }) {
        const langMeta = getLanguageMeta(project.languageId);
        const targetMeta = getTargetSdkMeta(project.targetSdk);
        const minMeta = getMinSdkMeta(project.minSdk);

        if (apiKey && apiKey.trim().length > 10) {
          try {
            const filesContext = project.files
              .map((f) => `=== ${f.path} ===\n${f.content}`)
              .join("\n\n");

            const sysPrompt = `You are Droid AI Studio's Android code generator for "${project.name}" (${project.packageName}).
Project Language: ${langMeta.label}
Target / Compile SDK: ${targetMeta.badge}
Minimum SDK: ${minMeta.label}
Logo Bound Directly to App: ${project.logoDataUrl ? "Yes" : "No"}
Return ONLY valid JSON:
{
  "reply": "Short explanation in Bengali",
  "updatedFiles": [
    { "path": "exact/path", "language": "kotlin", "content": "full updated file content" }
  ]
}`;

            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(
                apiKey.trim()
              )}`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [
                    {
                      role: "user",
                      parts: [
                        {
                          text: `${sysPrompt}\n\nActive file: ${
                            activeFile?.path || "none"
                          }\nCommand: ${prompt}\n\nFiles:\n${filesContext}`
                        }
                      ]
                    }
                  ]
                })
              }
            );

            const data = await response.json();
            const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
            const cleaned = rawText
              .replace(/^```json\s*/i, "")
              .replace(/^```\s*/i, "")
              .replace(/```$/i, "")
              .trim();

            const parsed = JSON.parse(cleaned);
            if (Array.isArray(parsed.updatedFiles) && parsed.updatedFiles.length > 0) {
              return {
                reply: parsed.reply || "ফাইলগুলো আপডেট করা হয়েছে।",
                updatedFiles: parsed.updatedFiles
              };
            }
          } catch (err) {
            return {
              reply: `Gemini API ত্রুটি (${String(err)})। লোকাল আপডেট প্রয়োগ করা হয়েছে।`,
              updatedFiles: localFallbackEdit(prompt, project, activeFile)
            };
          }
        }

        return {
          reply:
            "API Key দেওয়া নেই, তাই বর্তমান ফাইলে কমান্ড অনুযায়ী কোড যুক্ত করা হয়েছে। পূর্ণ AI কোডিংয়ের জন্য Gemini API Key যুক্ত করুন।",
          updatedFiles: localFallbackEdit(prompt, project, activeFile)
        };
      }

      function toBase64Utf8(text) {
        const bytes = new TextEncoder().encode(text);
        let binary = "";
        for (let i = 0; i < bytes.length; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
      }

      async function getFileSha({ owner, repo, path, branch, token }) {
        const url = `https://api.github.com/repos/${encodeURIComponent(
          owner
        )}/${encodeURIComponent(repo)}/contents/${path}?ref=${encodeURIComponent(branch)}`;

        const res = await fetch(url, {
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github+json"
          }
        });

        if (res.status === 404) return undefined;
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`GitHub read failed (${res.status}): ${errText}`);
        }
        const json = await res.json();
        return json?.sha;
      }

      async function pushFilesToGitHub(params, onProgress) {
        const prefix = params.pathPrefix
          ? params.pathPrefix.replace(/^\/+|\/+$/g, "") + "/"
          : "";
        let count = 0;

        for (let i = 0; i < params.files.length; i++) {
          const file = params.files[i];
          const fullPath = `${prefix}${file.path.replace(/^\/+/, "")}`;
          onProgress?.(i + 1, params.files.length, fullPath);

          const sha = await getFileSha({
            owner: params.owner,
            repo: params.repo,
            path: fullPath,
            branch: params.branch,
            token: params.token
          });

          const url = `https://api.github.com/repos/${encodeURIComponent(
            params.owner
          )}/${encodeURIComponent(params.repo)}/contents/${fullPath}`;

          const res = await fetch(url, {
            method: "PUT",
            headers: {
              Authorization: `Bearer ${params.token}`,
              Accept: "application/vnd.github+json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: params.commitMessage || `Push ${fullPath} via Droid AI Studio`,
              content: toBase64Utf8(file.content),
              branch: params.branch || "main",
              ...(sha ? { sha } : {})
            })
          });

          if (!res.ok) {
            const errText = await res.text();
            throw new Error(`Push failed for ${fullPath} (${res.status}): ${errText}`);
          }
          count++;
        }

        return count;
      }

              logoDataUrl: setupLogoUrl || undefined,
              logoFileName: setupLogoName || undefined,
              existingFiles: oldProj?.files,
              regenerateStarterFiles: setupRegenerateStarter
            });
            setProjects((prev) => prev.map((p) => (p.id === editingProjectId ? updated : p)));
            setActiveProjectId(editingProjectId);
            setSelectedPath(updated.files[0]?.path || "");
            setGhPrefix(`generated-projects/${updated.name.toLowerCase().replace(/\s+/g, "-")}`);
            setIsSetupOpen(false);
            setMessages((prev) => [
              ...prev,
              {
                id: `m-${Date.now()}`,
                role: "assistant",
                content: `"${updated.name}" আপডেট হয়েছে — ভাষা: ${chosenLang.label}, Target API ${updated.targetSdk}, Min API ${updated.minSdk} (${chosenMin.coverage} সাপোর্ট)।`
              }
            ]);
          } else {
            const created = createAndroidProject({
              name: setupName,
              packageName: setupPkg,
              description: setupDesc,
              languageId: setupLanguage,
              targetSdk: setupTargetSdk,
              minSdk: setupMinSdk,
              logoDataUrl: setupLogoUrl || undefined,
              logoFileName: setupLogoName || undefined
            });
            setProjects((prev) => [created, ...prev]);
            setActiveProjectId(created.id);
            setSelectedPath(created.files[0]?.path || "");
            setGhPrefix(`generated-projects/${created.name.toLowerCase().replace(/\s+/g, "-")}`);
            setIsSetupOpen(false);
            setMessages((prev) => [
              ...prev,
              {
                id: `m-${Date.now()}`,
                role: "assistant",
                content: `নতুন প্রজেক্ট "${created.name}" (${created.packageName}) তৈরি হয়েছে — ভাষা: ${chosenLang.label}, Target API ${created.targetSdk}, Min API ${created.minSdk} (${chosenMin.coverage} সাপোর্ট)।${
                  created.logoFileName ? ` লোগো: ${created.logoFileName}` : ""
                }`
              }
            ]);
          }
        };

        const handleSelectHistoryProject = (proj) => {
          setActiveProjectId(proj.id);
          setSelectedPath(proj.files[0]?.path || "");
          setFileSearchQuery("");
          setGhPrefix(`generated-projects/${proj.name.toLowerCase().replace(/\s+/g, "-")}`);
          setIsHistoryOpen(false);
        };

        const handleDeleteHistoryProject = (e, targetId) => {
          e.stopPropagation();
          if (projects.length <= 1) return;
          const remaining = projects.filter((p) => p.id !== targetId);
          setProjects(remaining);
          if (activeProjectId === targetId) {
            setActiveProjectId(remaining[0].id);
            setSelectedPath(remaining[0].files[0]?.path || "");
          }
        };

        const handleCodeEdit = (val) => {
          if (!activeFile) return;
          updateCurrentProject((prev) => ({
            ...prev,
            files: prev.files.map((f) =>
              f.path === activeFile.path ? { ...f, content: val } : f
            )
          }));
        };

        const handleSendAI = async (e) => {
          e.preventDefault();
          if (!promptInput.trim() || isAILoading) return;
          const text = promptInput.trim();
          setPromptInput("");
          setMessages((prev) => [...prev, { id: `u-${Date.now()}`, role: "user", content: text }]);
          setIsAILoading(true);

          try {
            const res = await runAICommand({
              prompt: text,
              project,
              activeFile,
              apiKey
            });

            updateCurrentProject((prev) => {
              const map = new Map();
              for (const f of prev.files) map.set(f.path, f);
              for (const u of res.updatedFiles) map.set(u.path, u);
              return { ...prev, files: Array.from(map.values()) };
            });

            if (res.updatedFiles[0]?.path) {
              setSelectedPath(res.updatedFiles[0].path);
            }

            setMessages((prev) => [
              ...prev,
              { id: `a-${Date.now()}`, role: "assistant", content: res.reply }
            ]);
          } finally {
            setIsAILoading(false);
          }
        };

        const handleGitHubPush = async (e) => {
          e.preventDefault();
          if (!ghToken.trim()) {
            setGhStatus("GitHub Personal Access Token দিন।");
            return;
          }
          setIsPushing(true);
          setGhStatus("পুশ শুরু হচ্ছে...");
          try {
            const count = await pushFilesToGitHub(
              {
                owner: ghOwner.trim(),
                repo: ghRepo.trim(),
                branch: ghBranch.trim() || "main",
                pathPrefix: ghPrefix.trim(),
                token: ghToken.trim(),
                commitMessage: ghMsg.trim(),
                files: project.files
              },
              (cur, tot, path) => setGhStatus(`পুশ হচ্ছে (${cur}/${tot}): ${path}`)
            );
            setGhStatus(`সফলভাবে ${count}টি ফাইল GitHub-এ পুশ হয়েছে!`);
          } catch (err) {
            setGhStatus(`পুশ ব্যর্থ: ${String(err)}`);

              </div>

                        <div className="mb-1 text-[10px] text-slate-400">

                    {isAILoading && (

                  <form onSubmit={handleSendAI} className="flex gap-2">

                    <div>
                      <h3 className="text-base font-bold text-amber-300">

                      <p className="text-xs text-slate-400">

                      <button

                  <div className="mb-3">
                    <input

                      onChange={(e) => setHistoryQuery(e.target.value)}
                      placeholder="প্রজেক্টের নাম, প্যাকেজ বা ভাষা দিয়ে খুঁজুন..."

                  <div className="flex-1 space-y-2 overflow-y-auto pr-1">

                      <div className="rounded-xl border border-slate-800 bg-slate-950/60 p-6 text-center text-xs text-slate-400">

                        return (
                          <div

                          >

                            {lang.label}
                          </option>
                        ))}
                      </select>
                    </div>

                    {/* SDK Selection with One-Click Max Device Support */}
                    <div className="space-y-2.5 rounded-xl border border-slate-800 bg-slate-950/60 p-3">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <span className="text-xs font-semibold text-emerald-300">
                          Android SDK ও ডিভাইস সাপোর্ট
                        </span>
                        <button
                          type="button"
                          onClick={applyMaxDeviceSupportPreset}
                          className="rounded-lg border border-emerald-500/40 bg-emerald-600/25 px-2.5 py-1 text-[10px] font-semibold text-emerald-300 hover:bg-emerald-600/40"
                        >
                          সর্বোচ্চ সাপোর্ট (সব ফোনে চলার উপযোগী)
                        </button>
                      </div>

                      <div className="grid grid-cols-1 gap-2 sm:grid-cols-2">
                        <div>
                          <label className="mb-1 block text-[11px] text-slate-300">
                            Target / Compile SDK
                          </label>
                          <select
                            value={setupTargetSdk}
                            onChange={(e) => {
                              const nextTarget = Number(e.target.value);
                              setSetupTargetSdk(nextTarget);
                              if (Number(setupMinSdk) > nextTarget) {
                                const validMins = MIN_SDK_OPTIONS.filter((m) => m.api <= nextTarget);
                                setSetupMinSdk(validMins[0]?.api || 21);
                              }
                            }}
                            className="w-full rounded-lg border border-slate-700 bg-slate-800 px-2.5 py-2 text-xs text-slate-100"
                          >
                            {TARGET_SDK_OPTIONS.map((sdk) => (
                              <option key={sdk.api} value={sdk.api}>
                                {sdk.badge}
                              </option>
                            ))}
                          </select>
                        </div>

                        <div>
                          <label className="mb-1 block text-[11px] text-slate-300">
                            Minimum SDK (ফোন সাপোর্ট)
                          </label>
                          <select
                            value={setupMinSdk}
                            onChange={(e) => setSetupMinSdk(Number(e.target.value))}
                            className="w-full rounded-lg border border-slate-700 bg-slate-800 px-2.5 py-2 text-xs text-slate-100"
                          >
                            {MIN_SDK_OPTIONS.filter((m) => m.api <= Number(setupTargetSdk)).map((m) => (
                              <option key={m.api} value={m.api}>
                                {m.label}
                              </option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div className="rounded-lg bg-slate-900 px-2.5 py-1.5 text-[11px] text-emerald-300">
                        নির্বাচিত Min SDK (API {setupMinSdk}) আনুমানিক{" "}
                        <span className="font-bold">{getMinSdkMeta(setupMinSdk).coverage}</span>{" "}
                        Android ফোনে সাপোর্ট করে।
                      </div>
                    </div>

                    <div>
                      <label className="mb-1 block text-xs text-slate-300">বিবরণ</label>
                      <input
                        value={setupDesc}
                        onChange={(e) => setSetupDesc(e.target.value)}
                        className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-xs text-slate-100"
                      />
                    </div>

                    {editingProjectId && (
                      <label className="flex items-center gap-2 rounded-lg border border-slate-800 bg-slate-950/60 p-2.5 text-xs text-slate-300">
                        <input
                          type="checkbox"
                          checked={setupRegenerateStarter}
                          onChange={(e) => setSetupRegenerateStarter(e.target.checked)}
                          className="rounded border-slate-600"
                        />
                        <span>স্টার্টার ফাইলগুলো নতুন ভাষা ও SDK অনুযায়ী রিসেট করুন</span>
                      </label>
                    )}

                    {/* Direct App Logo Binding */}
                    <div className="rounded-xl border border-slate-800 bg-slate-950/60 p-3">
                      <label className="mb-1 block text-xs font-semibold text-amber-300">
                        অ্যাপ লোগো (সরাসরি অ্যাপে যুক্ত হবে)
                      </label>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={handleLogoUpload}
                        className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-xs text-slate-100"
                      />
                      {setupLogoUrl && (
                        <div className="mt-2.5 flex items-center justify-between gap-2 rounded-lg border border-slate-800 bg-slate-900 p-2">
                          <div className="flex min-w-0 items-center gap-2.5">
                            <img
                              src={setupLogoUrl}
                              alt="Preview"
                              className="h-11 w-11 shrink-0 rounded-xl border border-emerald-500/40 object-cover"
                            />
                            <div className="min-w-0">
                              <div className="truncate text-xs font-semibold text-emerald-300">
                                {setupLogoName || "app_logo"}
                              </div>
                              <div className="text-[10px] text-slate-400">
                                Manifest, Drawable ও Live Runner-এ যুক্ত হবে
                              </div>
                            </div>
                          </div>
                          <button
                            type="button"
                            onClick={() => {
                              setSetupLogoUrl("");
                              setSetupLogoName("");
                            }}
                            className="shrink-0 rounded-lg bg-rose-950/70 px-2.5 py-1 text-[11px] font-semibold text-rose-300 hover:bg-rose-900"
                          >
                            সরান
                          </button>
                        </div>
                      )}
                    </div>

                    <div className="flex justify-end gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setIsSetupOpen(false)}
                        className="rounded-lg bg-slate-800 px-3 py-2 text-xs hover:bg-slate-700"
                      >
                        বাতিল
                      </button>
                      <button
                        type="submit"
                        className="rounded-lg bg-emerald-600 px-4 py-2 text-xs font-semibold text-white hover:bg-emerald-500"
                      >
                        {editingProjectId ? "আপডেট করুন" : "তৈরি করুন"}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Code Review Modal */}
            {isReviewOpen && (
              <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-950 p-4">
                <div className="mx-auto max-w-4xl">
                  <div className="mb-4 flex items-center justify-between border-b border-slate-800 pb-3">
                    <h3 className="text-lg font-bold">কোড রিভিউ ও চেক</h3>
                    <button
                      type="button"
                      onClick={() => setIsReviewOpen(false)}
                      className="rounded-lg bg-slate-800 px-3 py-1.5 text-xs hover:bg-slate-700"
                    >
                      ফিরে যান
                    </button>
                  </div>
                  <div className="mb-4 space-y-2">
                    {issues.length === 0 ? (
                      <div className="rounded-lg border border-emerald-800 bg-emerald-950/40 p-3 text-xs text-emerald-300">
                        কোনো সমস্যা পাওয়া যায়নি।
                      </div>
                    ) : (
                      issues.map((it, i) => (
                        <div key={i} className="rounded-lg border border-slate-800 bg-slate-900 p-3 text-xs">
                          <span className="font-mono text-amber-300">{it.filePath}</span>: {it.message}
                        </div>
                      ))
                    )}
                  </div>
                  <div className="space-y-3">
                    {project.files.map((f) => (
                      <div key={f.path} className="rounded-xl border border-slate-800 bg-slate-900 p-3">
                        <div className="mb-1 font-mono text-xs text-emerald-400">{f.path}</div>
                        <pre className="max-h-56 overflow-auto rounded-lg bg-slate-950 p-3 text-xs">
                          <code>{f.content}</code>
                        </pre>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* GitHub Push Modal */}
            {isPushOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4">
                <div className="w-full max-w-md rounded-xl border border-slate-800 bg-slate-900 p-5">
                  <div className="mb-3 flex items-center justify-between">
                    <h3 className="text-base font-bold">GitHub-এ পুশ করুন</h3>
                    <button
                      type="button"
                      onClick={() => setIsPushOpen(false)}
                      className="text-slate-400 hover:text-white"
                    >
                      ✕
                    </button>
                  </div>
                  <form onSubmit={handleGitHubPush} className="space-y-3">
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Owner</label>
                        <input
                          value={ghOwner}
                          onChange={(e) => setGhOwner(e.target.value)}
                          className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs text-slate-100"
                          required
                        />
                      </div>
                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Repo</label>
                        <input
                          value={ghRepo}
                          onChange={(e) => setGhRepo(e.target.value)}
                          className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs text-slate-100"
                          required
                        />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Branch</label>
                        <input
                          value={ghBranch}
                          onChange={(e) => setGhBranch(e.target.value)}
                          className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs text-slate-100"
                          required
                        />
                      </div>
                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Folder Prefix</label>
                        <input
                          value={ghPrefix}
                          onChange={(e) => setGhPrefix(e.target.value)}
                          className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs text-slate-100"
                        />
                      </div>
                    </div>
                    <div>
                      <label className="mb-1 block text-xs text-slate-300">GitHub Token</label>
                      <input
                        type="password"
                        value={ghToken}
                        onChange={(e) => setGhToken(e.target.value)}
                        placeholder="ghp_..."
                        className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs text-slate-100"
                        required
                      />
                    </div>
                    <div>
                      <label className="mb-1 block text-xs text-slate-300">Commit Message</label>
                      <input
                        value={ghMsg}
                        onChange={(e) => setGhMsg(e.target.value)}
                        className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs text-slate-100"
                      />
                    </div>
                    {ghStatus && (
                      <div className="rounded-lg bg-slate-800 p-2.5 text-xs text-emerald-300">
                        {ghStatus}
                      </div>
                    )}
                    <div className="flex justify-end gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setIsPushOpen(false)}
                        className="rounded-lg bg-slate-800 px-3 py-2 text-xs hover:bg-slate-700"
                      >
                        বন্ধ
                      </button>
                      <button
                        type="submit"
                        disabled={isPushing}
                        className="rounded-lg bg-blue-600 px-4 py-2 text-xs font-semibold text-white hover:bg-blue-500 disabled:opacity-50"
                      >
                        {isPushing ? "পুশ হচ্ছে..." : "Push Now"}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
