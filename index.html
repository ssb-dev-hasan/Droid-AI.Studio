      // ErrorBoundary to catch any runtime error cleanly
      class ErrorBoundary extends Component {
        constructor(props) {
          super(props);
          this.state = { error: null };
        }
        static getDerivedStateFromError(error) {
          return { error };
        }
        render() {
          if (this.state.error) {
            return (
              <div className="flex min-h-screen items-center justify-center bg-slate-950 p-6 text-slate-100">
                <div className="max-w-lg rounded-2xl border border-rose-500/40 bg-slate-900 p-6 shadow-2xl">

      // Check whether hardcoded FIREBASE_CONFIG has real credentials
      function isFirebaseConfigured() {
        return Boolean(
          typeof FIREBASE_CONFIG !== "undefined" &&
            FIREBASE_CONFIG &&
            FIREBASE_CONFIG.apiKey &&
            FIREBASE_CONFIG.authDomain &&
            FIREBASE_CONFIG.projectId &&
            FIREBASE_CONFIG.appId &&
            !String(FIREBASE_CONFIG.apiKey).includes("YOUR_")
        );
      }

      let firebaseServicesCache = null;
      function getFirebaseServices() {
        if (!isFirebaseConfigured()) return null;
        if (firebaseServicesCache) return firebaseServicesCache;
        try {
          if (!window.firebase) return null;
          const app =
            window.firebase.apps && window.firebase.apps.length > 0
              ? window.firebase.app()
              : window.firebase.initializeApp(FIREBASE_CONFIG);
          const auth = window.firebase.auth ? window.firebase.auth() : null;
          const rtdb = window.firebase.database ? window.firebase.database() : null;
          firebaseServicesCache = { app, auth, rtdb };
          return firebaseServicesCache;
        } catch (err) {
          console.error("Firebase init error:", err);
          return null;
        }
      }

      function normalizeEmail(email) {
        return String(email || "").trim().toLowerCase();
      }

      function emailToDocKey(email) {
        return normalizeEmail(email).replace(/[^a-z0-9]/g, "_");
      }

      function readLocalUsers() {
        try {
          const raw = localStorage.getItem(STORAGE_AUTH_USERS_KEY);
          const parsed = raw ? JSON.parse(raw) : {};
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch (_) {
          return {};
        }
      }

      function writeLocalUsers(usersMap) {
        try {
          localStorage.setItem(STORAGE_AUTH_USERS_KEY, JSON.stringify(usersMap));
        } catch (_) {}
      }

      function getMinSdkInfo(api) {
        return MIN_SDK_OPTIONS.find((m) => m.api === Number(api)) || MIN_SDK_OPTIONS[0];
      }

      function getLanguageInfo(langId) {
        return ANDROID_LANGUAGES.find((l) => l.id === langId) || ANDROID_LANGUAGES[0];
      }

      function inferLanguageFromPath(filePath) {
        const ext = String(filePath || "").split(".").pop().toLowerCase();
        if (ext === "kt" || ext === "kts") return "kotlin";
        if (ext === "java") return "java";
        if (ext === "xml") return "xml";
        if (ext === "cpp" || ext === "c" || ext === "h") return "cpp";
        if (ext === "gradle") return "groovy";
        return ext || "text";
      }

        if (!target) return [];
        const note = "\n// [AI Note]: " + String(prompt || "").trim() + "\n";
        return [
          {
            ...target,
            content: String(target.content || "") + note
          }
        ];
      }

      function createAndroidProject({
        id,
        name,
        packageName,
        description,
        languageId,
        minSdk,
        targetSdk,
        logoDataUrl,
        logoFileName,
        existingFiles
      }) {
        const safeName = String(name || "IMO Studio App").trim() || "IMO Studio App";
        const pkg =
          String(packageName || "com.example.imostudio").trim() || "com.example.imostudio";
        const resolvedLang = languageId || "kotlin-compose";
        const resolvedMinSdk = Number(minSdk) || 21;
        const resolvedTargetSdk = Math.max(Number(targetSdk) || 36, resolvedMinSdk);
        const resolvedLogo = logoDataUrl || "";
        const hasLogo = Boolean(resolvedLogo);

        let files =
          Array.isArray(existingFiles) && existingFiles.length > 0
            ? existingFiles.map((f) => {
                if (f.path.endsWith("strings.xml")) {
                  return {
                    ...f,
                    content:
                      '<?xml version="1.0" encoding="utf-8"?>\n' +
                      "<resources>\n" +
                      '    <string name="app_name">' +
                      safeName +
                      "</string>\n" +
                      "</resources>\n"
                  };
                }
                if (f.path.endsWith("build.gradle.kts")) {
                  return {
                    ...f,
                    content: f.content
                      .replace(/namespace\s*=\s*"[^"]*"/, 'namespace = "' + pkg + '"')
                      .replace(/applicationId\s*=\s*"[^"]*"/, 'applicationId = "' + pkg + '"')
                      .replace(/minSdk\s*=\s*\d+/, "minSdk = " + resolvedMinSdk)
                      .replace(/targetSdk\s*=\s*\d+/, "targetSdk = " + resolvedTargetSdk)
                      .replace(/compileSdk\s*=\s*\d+/, "compileSdk = " + resolvedTargetSdk)
                  };
                }
                if (f.path.endsWith("AndroidManifest.xml")) {
                  return {
                    ...f,
                    content: f.content
                      .replace(
                        /android:icon="[^"]*"/,
                        'android:icon="' +
                          (hasLogo ? "@drawable/ic_app_logo" : "@mipmap/ic_launcher") +
                          '"'
                      )
                      .replace(
                        /android:roundIcon="[^"]*"/,
                        'android:roundIcon="' +
                          (hasLogo ? "@drawable/ic_app_logo" : "@mipmap/ic_launcher_round") +
                          '"'
                      )
                  };
                }
                return f;
              })
            : buildDefaultFiles(
                safeName,
                pkg,
                resolvedLang,
                resolvedMinSdk,
                resolvedTargetSdk,
                hasLogo
              );

        files = files.filter((f) => f.path !== "app/src/main/res/drawable/app_logo_base64.txt");
        if (hasLogo) {
          files.push({
            path: "app/src/main/res/drawable/app_logo_base64.txt",
            language: "text",
            content:
              "Logo File: " +
              (logoFileName || "ic_app_logo.png") +
              "\nBound to AndroidManifest (@drawable/ic_app_logo)\n" +
              resolvedLogo
          });
        }

        return {
          id: id || "proj-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
          name: safeName,
          packageName: pkg,
          description: description || safeName + " Android Project",
          languageId: resolvedLang,
          minSdk: resolvedMinSdk,
          targetSdk: resolvedTargetSdk,
          logoDataUrl: resolvedLogo,
          logoFileName: logoFileName || "",
          updatedAt: new Date().toLocaleString("bn-BD"),
          files
        };
      }

      function validateProjectFiles(files) {
        const issues = [];
        if (!files || files.length === 0) {
          return [{ filePath: "project", message: "প্রজেক্টে কোনো ফাইল নেই।", severity: "error" }];
        }
        for (const f of files) {
          if (!f.content || !f.content.trim()) {
            issues.push({ filePath: f.path, message: "ফাইলটি খালি রয়েছে।", severity: "warning" });
          }
          if (f.path.endsWith(".xml") && !f.content.includes("<?xml")) {
            issues.push({
              filePath: f.path,
              message: "XML ফাইলে <?xml ...?> হেডার রাখা ভালো।",
              severity: "warning"
            });
          }
        }
        return issues;
      }

      // Parse structured <<<REPLY>>> (or legacy <<<SUMMARY>>>) and <<<FILE:path>>> blocks safely
      function parseGeminiDelimitedResponse(rawText) {
        const text = String(rawText || "").trim();
        let reply = "";
        const updatedFiles = [];

        const replyMatch =
          text.match(/<<<REPLY>>>([\s\S]*?)<<<END_REPLY>>>/i) ||
          text.match(/<<<SUMMARY>>>([\s\S]*?)<<<END_SUMMARY>>>/i);
        if (replyMatch && replyMatch[1]) {
          reply = replyMatch[1].trim();
        }

        // Match complete <<<FILE:path>>> ... <<<END_FILE>>> blocks
        const fileBlockRegex = /<<<FILE:([^\r\n>]+)>>>\r?\n?([\s\S]*?)<<<END_FILE>>>/gi;
        let match;
        let lastMatchedIndex = 0;
        while ((match = fileBlockRegex.exec(text)) !== null) {
          const path = String(match[1] || "").trim().replace(/^\/+/, "");
          const content = String(match[2] || "").replace(/^\r?\n/, "").replace(/\r?\n$/, "");
          if (path && content) {
            updatedFiles.push({
              path,
              language: inferLanguageFromPath(path),
              content
            });
          }
          lastMatchedIndex = fileBlockRegex.lastIndex;
        }

        // Recover a trailing incomplete <<<FILE:path>>> block if maxOutputTokens cut off the closing tag
        const remainder = text.slice(lastMatchedIndex);
        const openFileMatch = remainder.match(/<<<FILE:([^\r\n>]+)>>>\r?\n?([\s\S]+)$/i);
        if (openFileMatch && openFileMatch[1] && openFileMatch[2]) {
          const partialPath = String(openFileMatch[1]).trim().replace(/^\/+/, "");
          const partialContent = String(openFileMatch[2])
            .replace(/<<<END_FILE[\s\S]*$/i, "")
            .replace(/^\r?\n/, "");
          if (partialPath && partialContent.trim().length > 10) {
            updatedFiles.push({
              path: partialPath,
              language: inferLanguageFromPath(partialPath),
              content: partialContent
            });
            reply =
              (reply ? reply + "\n\n" : "") +
              "⚠️ আউটপুট অনেক বড় হওয়ায় শেষ ফাইলটি (" +
              partialPath +
              ") আংশিক রিকভার করা হয়েছে।";
          }
        }

        // If Gemini replied in natural Bengali prose without delimiters, show the clean text cleanly
        if (!reply && updatedFiles.length === 0 && text) {
          reply = text
            .replace(/<<<\/?(REPLY|END_REPLY|SUMMARY|END_SUMMARY)>>>/gi, "")
            .trim();
        }

        if (!reply && updatedFiles.length > 0) {
          reply = "সফলভাবে " + updatedFiles.length + "টি ফাইল তৈরি/আপডেট করা হয়েছে।";
        }

        return { reply, updatedFiles };
      }

      async function callGeminiConversation({
        apiKey,
        model,
        systemInstructionText,
        contents,
        maxOutputTokens = 8192
      }) {
        const endpoint =
          "https://generativelanguage.googleapis.com/v1beta/models/" +
          encodeURIComponent(model) +
          ":generateContent?key=" +
          encodeURIComponent(apiKey.trim());

        const bodyPayload = {
          contents,
          generationConfig: {
            temperature: 0.4,
            maxOutputTokens
          }
        };

        if (systemInstructionText) {
          bodyPayload.systemInstruction = {
            parts: [{ text: systemInstructionText }]
          };
        }

        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(bodyPayload)
        });

        let data = null;
        try {
          data = await response.json();
        } catch (_) {
          throw new Error("HTTP " + response.status + ": সার্ভার থেকে বৈধ উত্তর পাওয়া যায়নি।");
        }

        if (!response.ok) {
          const apiErrMsg =
            data && data.error && data.error.message
              ? data.error.message
              : "HTTP " + response.status;
          if (response.status === 400 && apiErrMsg.toLowerCase().includes("api key")) {
            throw new Error("ভুল Gemini API Key দেওয়া হয়েছে (400)। সঠিক API Key দিন।");
          }
          if (response.status === 403) {
            throw new Error("API Key অনুমতি নেই বা ব্লক করা (403): " + apiErrMsg);
          }
          if (response.status === 429) {
            throw new Error("API কোটা বা রেট লিমিট শেষ হয়েছে (429)। কিছুক্ষণ পর চেষ্টা করুন।");
          }
          throw new Error("Gemini API ত্রুটি (" + response.status + "): " + apiErrMsg);
        }

        const parts =
          data &&
          data.candidates &&
          data.candidates[0] &&
          data.candidates[0].content &&
          Array.isArray(data.candidates[0].content.parts)
            ? data.candidates[0].content.parts
            : [];
        const rawText = parts.map((p) => (p && p.text ? p.text : "")).join("\n").trim();

        if (!rawText) {
          const finishReason =
            data && data.candidates && data.candidates[0]
              ? data.candidates[0].finishReason
              : "UNKNOWN";
          throw new Error("Gemini খালি উত্তর দিয়েছে (Reason: " + finishReason + ")।");
        }

        return rawText;
      }

      async function verifyGeminiApiKey(apiKey) {
        const cleanKey = String(apiKey || "").trim();
        if (!cleanKey) {
          return { ok: false, message: "আগে Gemini API Key লিখুন।" };
        }
        const models = await getActiveGeminiModels(cleanKey);
        let lastErr = "";
        for (const model of models) {
          try {
            const text = await callGeminiConversation({
              apiKey: cleanKey,
              model,
              contents: [{ role: "user", parts: [{ text: "Reply with exactly: OK" }] }],
              maxOutputTokens: 16
            });
            if (text) {
              return {
                ok: true,
                model,
                message: "কানেকশন ১০০% সফল! সক্রিয় মডেল: " + model
              };
            }
          } catch (err) {
            lastErr = err && err.message ? err.message : String(err);
          }
        }
        return { ok: false, message: lastErr || "API যাচাই ব্যর্থ হয়েছে।" };
      }

      const detectedModelsCache = new Map();

      async function getActiveGeminiModels(apiKey) {
        const cleanKey = String(apiKey || "").trim();
        const strictPrimaryModels = ["gemini-3.8-flash", "gemini-2.5-flash"];
        if (!cleanKey) return strictPrimaryModels;
        if (detectedModelsCache.has(cleanKey)) {
          return detectedModelsCache.get(cleanKey);
        }

        const fallbackPriority = [
          "gemini-3.8-flash",
          "gemini-2.5-flash",
          "gemini-2.5-pro",
          "gemini-flash-latest"
        ];

        try {
          const res = await fetch(
            "https://generativelanguage.googleapis.com/v1beta/models?key=" +
              encodeURIComponent(cleanKey)
          );
          if (res.ok) {
            const json = await res.json();
            const list = Array.isArray(json && json.models) ? json.models : [];
            const supported = list
              .filter((m) => {
                if (!m || typeof m.name !== "string") return false;
                const lowerName = m.name.toLowerCase();
                const methods = Array.isArray(m.supportedGenerationMethods)
                  ? m.supportedGenerationMethods
                  : [];
                return (
                  methods.includes("generateContent") &&
                  !lowerName.includes("gemini-2.0") &&
                  !lowerName.includes("gemini-1.5") &&
                  !lowerName.includes("gemini-1.0") &&
                  !lowerName.includes("gemini-pro-vision") &&
                  !lowerName.includes("embedding") &&
                  !lowerName.includes("imagen") &&
                  !lowerName.includes("veo") &&
                  !lowerName.includes("aqa")
                );
              })
              .map((m) => m.name.replace(/^models\//, ""));

            const ordered = ["gemini-3.8-flash", "gemini-2.5-flash"];
            for (const pref of fallbackPriority) {
              if (supported.includes(pref) && !ordered.includes(pref)) {
                ordered.push(pref);
              }
            }
            for (const mName of supported) {
              if (
                mName.includes("flash") &&
                !mName.includes("2.0") &&
                !ordered.includes(mName)
              ) {
                ordered.push(mName);
              }
            }
            const topModels = ordered.slice(0, 4);
            detectedModelsCache.set(cleanKey, topModels);
            return topModels;
          }
        } catch (_) {}

        return fallbackPriority;
      }

      async function runAICommand({ prompt, project, activeFile, apiKey, chatHistory = [] }) {
        const cleanKey = String(apiKey || "").trim();
        if (cleanKey.length > 10) {
          const fileListSummary = project.files
            .map((f) => "- " + f.path + " (" + (f.content ? f.content.length : 0) + " chars)")
            .join("\n");

          const filesContext = project.files
            .map((f) => {
              const isSelected = activeFile && f.path === activeFile.path;
              const limit = isSelected ? 6000 : 2500;
              const snippet =
                f.content && f.content.length > limit
                  ? f.content.slice(0, limit) + "\n// ... truncated ..."
                  : f.content;
              return "=== " + f.path + (isSelected ? " [ACTIVE FILE]" : "") + " ===\n" + snippet;
            })
            .join("\n\n");

          const sysInstruction =
            'You are Gemini, a friendly, expert Bengali Android Studio AI pair-programmer inside Droid AI Studio for the project "' +
            project.name +
            '" (package: ' +
            project.packageName +
            ", language: " +
            getLanguageInfo(project.languageId).label +
            ", minSdk: " +
            project.minSdk +
            ", targetSdk: " +
            project.targetSdk +
            ").\n\n" +
            "BEHAVIOR & LANGUAGE RULES:\n" +
            "- Always converse warmly and clearly in Bengali (বাংলা) with the user.\n" +
            "- You can answer questions, explain code, write new Android files, or fix/debug bugs in existing files.\n" +
            "- If the user is only chatting or asking a question that does not require modifying code, reply naturally in Bengali inside <<<REPLY>>> ... <<<END_REPLY>>> without emitting any <<<FILE:...>>> blocks.\n" +
            "- Whenever the user asks to write code, add a feature, or fix/debug a file, output a helpful Bengali explanation inside:\n" +
            "<<<REPLY>>>\n" +
            "কী করা হয়েছে বা কীভাবে ফিক্স করা হয়েছে তার পরিষ্কার বাংলা ব্যাখ্যা\n" +
            "<<<END_REPLY>>>\n" +
            "Followed by one or more complete, runnable file blocks in this exact format (NO JSON, NO markdown backticks around the block tags):\n" +
            "<<<FILE:exact/relative/path/FileName.ext>>>\n" +
            "complete updated or new file code\n" +
            "<<<END_FILE>>>\n" +
            "- When fixing an existing file, preserve its exact relative path from the project file list so it overwrites and repairs the file cleanly.";

          // Build multi-turn Gemini conversation history (last 10 turns)
          const recentHistory = Array.isArray(chatHistory) ? chatHistory.slice(-10) : [];
          const contents = [];
          for (const msg of recentHistory) {
            if (!msg || !msg.content || msg.id === "m-1") continue;
            contents.push({
              role: msg.role === "user" ? "user" : "model",
              parts: [{ text: String(msg.content) }]
            });
          }

          const currentTurnText =
            "বর্তমান প্রজেক্ট ফাইল তালিকা:\n" +
            fileListSummary +
            "\n\nবর্তমানে খোলা (Active) ফাইল: " +
            (activeFile && activeFile.path ? activeFile.path : "none") +
            "\n\nপ্রজেক্ট কোড কনটেক্সট:\n" +
            filesContext +
            "\n\nইউজারের বার্তা / নির্দেশ:\n" +
            prompt;

          contents.push({
            role: "user",
            parts: [{ text: currentTurnText }]
          });

          const models = await getActiveGeminiModels(cleanKey);
          let lastErrorMsg = "";

          for (const model of models) {
            try {
              const rawText = await callGeminiConversation({
                apiKey: cleanKey,
                model,
                systemInstructionText: sysInstruction,
                contents,
                maxOutputTokens: 8192
              });

              const parsed = parseGeminiDelimitedResponse(rawText);
              const badge =
                parsed.updatedFiles && parsed.updatedFiles.length > 0
                  ? "\n\n✅ " +
                    parsed.updatedFiles.length +
                    "টি ফাইল আপডেট/ফিক্স করা হয়েছে (" +
                    model +
                    ")"
                  : "";

              return {
                reply: (parsed.reply || "উত্তর প্রস্তুত।") + badge,
                updatedFiles: parsed.updatedFiles || []
              };
            } catch (err) {
              lastErrorMsg = err && err.message ? err.message : String(err);
            }
          }

          return {
            reply:
              "❌ " +
              (lastErrorMsg || "Gemini API সংযোগ ব্যর্থ হয়েছে।") +
              "\n(ফাইল পরিবর্তন করা হয়নি — API Key বা কোটা যাচাই করে আবার চেষ্টা করুন।)",
            updatedFiles: []
          };
        }

        return {
          reply:
            "⚠️ Gemini API Key দেওয়া নেই, তাই বর্তমান ফাইলে লোকাল নোট যুক্ত করা হয়েছে। সরাসরি Gemini-এর সাথে বাংলায় চ্যাটিং, কোড লেখা ও ফাইল ফিক্স করতে উপরে আপনার Gemini API Key দিয়ে 'API টেস্ট' চাপুন।",
          updatedFiles: localFallbackEdit(prompt, project, activeFile)
        };
      }

      function toBase64Utf8(text) {
        const bytes = new TextEncoder().encode(text);
        let binary = "";
        for (let i = 0; i < bytes.length; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
      }

      async function getFileSha({ owner, repo, path, branch, token }) {
        const url =
          "https://api.github.com/repos/" +
          encodeURIComponent(owner) +
          "/" +
          encodeURIComponent(repo) +
          "/contents/" +
          path +
          "?ref=" +
          encodeURIComponent(branch);

        const res = await fetch(url, {
          headers: {
            Authorization: "Bearer " + token,
            Accept: "application/vnd.github+json"
          }
        });

        if (res.status === 404) return undefined;
        if (!res.ok) {
          const errText = await res.text();
          throw new Error("GitHub read failed (" + res.status + "): " + errText);
        }
        const json = await res.json();
        return json ? json.sha : undefined;
      }

      async function pushFilesToGitHub(params, onProgress) {
        const prefix = params.pathPrefix
          ? params.pathPrefix.replace(/^\/+|\/+$/g, "") + "/"
          : "";
        let count = 0;

        for (let i = 0; i < params.files.length; i++) {
          const file = params.files[i];
          const fullPath = prefix + file.path.replace(/^\/+/, "");
          if (onProgress) onProgress(i + 1, params.files.length, fullPath);

          const sha = await getFileSha({
            owner: params.owner,
            repo: params.repo,
            path: fullPath,
            branch: params.branch,
            token: params.token
          });

          const url =
            "https://api.github.com/repos/" +
            encodeURIComponent(params.owner) +
            "/" +
            encodeURIComponent(params.repo) +
            "/contents/" +
            fullPath;

          const payload = {
            message: params.commitMessage || "Push " + fullPath + " via Droid AI Studio",
            content: toBase64Utf8(file.content),
            branch: params.branch || "main"
          };
          if (sha) payload.sha = sha;

          const res = await fetch(url, {
            method: "PUT",
            headers: {
              Authorization: "Bearer " + params.token,
              Accept: "application/vnd.github+json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const errText = await res.text();
            throw new Error("Push failed for " + fullPath + " (" + res.status + "): " + errText);
          }
          count++;
        }

        return count;
      }

      // Sync user profile, email lookup, and projects to Firebase Realtime Database
      async function syncUserAndProjectsToRTDB(rtdb, userRecord, projectsList) {
        if (!rtdb || !userRecord || !userRecord.uid) {
          return { ok: false, error: "Realtime Database অনুপলব্ধ বা ইউজার লগইন নেই।" };
        }
        const nowIso = new Date().toISOString();
        const emailKey = emailToDocKey(userRecord.email);

        try {
          await rtdb.ref("users/" + userRecord.uid).update({
            uid: userRecord.uid,
            email: userRecord.email,
            createdAt: userRecord.createdAt || nowIso,
            lastLoginAt: nowIso,
            loginCount: userRecord.loginCount || 1,
            projectCount: Array.isArray(projectsList) ? projectsList.length : 0
          });

          if (Array.isArray(projectsList)) {
            const projectsMap = {};
            for (const p of projectsList) {
              if (p && p.id) {
                projectsMap[p.id] = {
                  id: p.id,
                  name: p.name,
                  packageName: p.packageName,
                  description: p.description || "",
                  languageId: p.languageId || "kotlin-compose",
                  minSdk: p.minSdk || 21,
                  targetSdk: p.targetSdk || 36,
                  logoDataUrl: p.logoDataUrl || "",
                  logoFileName: p.logoFileName || "",
                  updatedAt: p.updatedAt || nowIso,
                  files: Array.isArray(p.files) ? p.files : []
                };
              }
            }
            await rtdb.ref("users/" + userRecord.uid + "/projects").set(projectsMap);
          }

          if (emailKey) {
            await rtdb.ref("user_emails/" + emailKey).update({
              uid: userRecord.uid,
              email: userRecord.email,
              updatedAt: nowIso
            });
          }
          return { ok: true, syncedAt: new Date().toLocaleTimeString("bn-BD") };
        } catch (err) {
          console.warn("RTDB sync skipped or failed:", err);
          return {
            ok: false,
            error: err && err.message ? err.message : "Realtime Database সিঙ্ক ব্যর্থ হয়েছে।"
          };
        }
      }

      // Load saved projects from Firebase Realtime Database for an existing user
      async function loadUserProjectsFromRTDB(rtdb, uid) {
        if (!rtdb || !uid) return null;
        try {
          const snap = await rtdb.ref("users/" + uid + "/projects").once("value");
          if (snap && snap.exists()) {
            const val = snap.val();
            if (val && typeof val === "object") {
              const list = Object.values(val).filter((item) => item && item.id && Array.isArray(item.files));
              return list.length > 0 ? list : null;
            }
          }
        } catch (err) {
          console.warn("RTDB project load skipped:", err);
        }
        return null;
      }

      // Unified email login / auto-signup with accurate Firebase v10 error handling
      async function authenticateEmailAuto({ email, password, projectsList }) {
        const cleanEmail = normalizeEmail(email);
        const cleanPassword = String(password || "");
        if (!cleanEmail || !cleanEmail.includes("@")) {
          throw new Error("সঠিক ইমেইল ঠিকানা দিন।");
        }
        if (cleanPassword.length < 6) {
          throw new Error("পাসওয়ার্ড অন্তত ৬ অক্ষরের হতে হবে।");
        }

        const fb = getFirebaseServices();
        const nowIso = new Date().toISOString();

        const finalizeExistingUser = async (u) => {
          let prevData = {};
          if (fb.rtdb) {
            try {
              const snap = await fb.rtdb.ref("users/" + u.uid).once("value");
              if (snap && snap.exists()) {
                prevData = snap.val() || {};
              }
            } catch (_) {}
          }
          const cloudProjects = await loadUserProjectsFromRTDB(fb.rtdb, u.uid);
          const mergedProjects = cloudProjects || projectsList;
          const nextRecord = {
            uid: u.uid,
            email: cleanEmail,
            createdAt: prevData.createdAt || nowIso,
            lastLoginAt: nowIso,
            loginCount: (prevData.loginCount || 0) + 1,
            projectCount: Array.isArray(mergedProjects) ? mergedProjects.length : 0,
            mode: "firebase"
          };
          const syncRes = await syncUserAndProjectsToRTDB(fb.rtdb, nextRecord, mergedProjects);
          return {
            user: nextRecord,
            isNewAccount: false,
            syncedProjects: cloudProjects,
            syncResult: syncRes
          };
        };

        if (fb && fb.auth) {
          try {
            const cred = await fb.auth.signInWithEmailAndPassword(cleanEmail, cleanPassword);
            return await finalizeExistingUser(cred.user);
          } catch (signInErr) {
            const code = signInErr && signInErr.code ? signInErr.code : "";
            // Firebase v10+ returns auth/invalid-credential or auth/invalid-login-credentials
            // for BOTH non-existent emails and wrong passwords when Email Enumeration Protection is enabled.
            // So we attempt createUserWithEmailAndPassword first, and ONLY show "already registered" if that throws auth/email-already-in-use!
            const shouldTryAutoCreate =
              code === "auth/user-not-found" ||
              code === "auth/invalid-credential" ||
              code === "auth/invalid-login-credentials" ||
              code === "auth/wrong-password";

            if (shouldTryAutoCreate) {
              try {
                const createdCred = await fb.auth.createUserWithEmailAndPassword(
                  cleanEmail,
                  cleanPassword
                );
                const createdUser = createdCred.user;
                const newRecord = {
                  uid: createdUser.uid,
                  email: cleanEmail,
                  createdAt: nowIso,
                  lastLoginAt: nowIso,
                  loginCount: 1,
                  projectCount: Array.isArray(projectsList) ? projectsList.length : 0,
                  mode: "firebase"
                };
                const syncRes = await syncUserAndProjectsToRTDB(fb.rtdb, newRecord, projectsList);
                return {
                  user: newRecord,
                  isNewAccount: true,
                  syncedProjects: null,
                  syncResult: syncRes
                };
              } catch (createErr) {
                const createCode = createErr && createErr.code ? createErr.code : "";
                if (createCode === "auth/email-already-in-use") {
                  throw new Error(
                    "এই ইমেইলটি আগে থেকেই নিবন্ধিত আছে। নতুন অ্যাকাউন্ট তৈরি করা হয়নি—পুরনো অ্যাকাউন্টে ঢুকতে সঠিক পাসওয়ার্ড দিন।"
                  );
                }
                if (createCode === "auth/operation-not-allowed") {
                  throw new Error(
                    "Firebase Console-এ Email/Password Sign-in চালু নেই (auth/operation-not-allowed)। Build → Authentication → Sign-in method থেকে Email/Password Enable করুন।"
                  );
                }
                if (createCode === "auth/unauthorized-domain") {
                  throw new Error(
                    "এই ডোমেইনটি Firebase-এ অনুমোদিত নয় (auth/unauthorized-domain)। Authentication → Settings → Authorized domains-এ আপনার ডোমেইন যোগ করুন।"
                  );
                }
                throw new Error(
                  "অ্যাকাউন্ট তৈরি ব্যর্থ (" +
                    (createCode || "error") +
                    "): " +
                    (createErr && createErr.message ? createErr.message : "ত্রুটি হয়েছে।")
                );
              }
            }

            if (code === "auth/operation-not-allowed") {
              throw new Error(
                "Firebase Console-এ Email/Password Sign-in চালু নেই (auth/operation-not-allowed)। Build → Authentication → Sign-in method থেকে Email/Password Enable করুন।"
              );
            }
            if (code === "auth/unauthorized-domain") {
              throw new Error(
                "এই ডোমেইনটি Firebase-এ অনুমোদিত নয় (auth/unauthorized-domain)। Authentication → Settings → Authorized domains-এ আপনার ডোমেইন যোগ করুন।"
              );
            }
            throw new Error(
              "লগইন ব্যর্থ (" +
                (code || "error") +
                "): " +
                (signInErr && signInErr.message ? signInErr.message : "লগইন করতে সমস্যা হয়েছে।")
            );
          }
        }

        // Local fallback mode when FIREBASE_CONFIG is empty
        const localUsers = readLocalUsers();
        const existingLocal = localUsers[cleanEmail];
        if (existingLocal) {
          if (existingLocal.password !== cleanPassword) {
            throw new Error(
              "এই ইমেইলটি আগে থেকেই নিবন্ধিত আছে। নতুন অ্যাকাউন্ট তৈরি করা হয়নি—পুরনো অ্যাকাউন্টে লগইন করতে সঠিক পাসওয়ার্ড দিন।"
            );
          }
          const updatedLocal = {
            ...existingLocal,
            lastLoginAt: nowIso,
            loginCount: (existingLocal.loginCount || 1) + 1,
            projectCount: Array.isArray(projectsList) ? projectsList.length : 0,
            mode: "local-sim"
          };
          localUsers[cleanEmail] = updatedLocal;
          writeLocalUsers(localUsers);
          return { user: updatedLocal, isNewAccount: false };
        }

        const generatedUid =
          "uid_" + emailToDocKey(cleanEmail) + "_" + Math.random().toString(36).slice(2, 7);
        const createdLocal = {
          uid: generatedUid,
          password: cleanPassword,
          email: cleanEmail,
          createdAt: nowIso,
          lastLoginAt: nowIso,
          loginCount: 1,
          projectCount: Array.isArray(projectsList) ? projectsList.length : 0,
          mode: "local-sim"
        };
        localUsers[cleanEmail] = createdLocal;
        writeLocalUsers(localUsers);
        return { user: createdLocal, isNewAccount: true };
      }

            }

          return [

              id: "proj-default",

              description: "Android Messaging & Calling App",
              languageId: "kotlin-compose",
              minSdk: 21,
              targetSdk: 36
            })
          ];
        });

        const [currentUser, setCurrentUser] = useState(() => {
          try {
            const raw = localStorage.getItem(STORAGE_SESSION_KEY);
            return raw ? JSON.parse(raw) : null;
          } catch (_) {
            return null;
          }
        });

        const [activeProjectId, setActiveProjectId] = useState(() =>
          projects[0] && projects[0].id ? projects[0].id : ""
        );
        const [rtdbSyncState, setRtdbSyncState] = useState({
          status: "idle",
          label: "RTDB প্রস্তুত",
          detail: ""
        });

        const project = useMemo(
          () => projects.find((p) => p.id === activeProjectId) || projects[0],
          [projects, activeProjectId]
        );

        const triggerRTDBSync = async (userObj, projectsObj) => {
          const fb = getFirebaseServices();
          if (!fb || !fb.rtdb || !userObj) {
            setRtdbSyncState({
              status: "offline",
              label: "লোকাল মোড",
              detail: "RTDB সংযুক্ত নয়"
            });
            return;
          }
          setRtdbSyncState({
            status: "syncing",
            label: "সিঙ্ক হচ্ছে...",
            detail: ""
          });
          const res = await syncUserAndProjectsToRTDB(fb.rtdb, userObj, projectsObj);
          if (res && res.ok) {
            setRtdbSyncState({
              status: "synced",
              label: "RTDB সিঙ্কড (" + res.syncedAt + ")",
              detail: "users/" + userObj.uid
            });
          } else {
            setRtdbSyncState({
              status: "error",
              label: "RTDB সিঙ্ক ত্রুটি",
              detail: res && res.error ? res.error : "Permission বা নেটওয়ার্ক সমস্যা"
            });
          }
        };

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_PROJECTS_KEY, JSON.stringify(projects));
          } catch (_) {}
          if (currentUser) {
            triggerRTDBSync(currentUser, projects);
          }
        }, [projects]);

        useEffect(() => {
          try {
            if (currentUser) {
              localStorage.setItem(STORAGE_SESSION_KEY, JSON.stringify(currentUser));
              triggerRTDBSync(currentUser, projects);
            } else {
              localStorage.removeItem(STORAGE_SESSION_KEY);

          project && project.files && project.files[0] ? project.files[0].path : ""

          };
          reader.readAsDataURL(file);
        };

          e.preventDefault();
          const clampedTarget = Math.max(Number(setupTargetSdk) || 36, Number(setupMinSdk) || 21);

          if (editingProjectId) {
            const oldProj = projects.find((p) => p.id === editingProjectId);
            const updated = createAndroidProject({
              id: editingProjectId,
              name: setupName,
              packageName: setupPkg,
              description: setupDesc,
              languageId: setupLanguage,
              minSdk: setupMinSdk,
              targetSdk: clampedTarget,
              logoDataUrl: setupLogoUrl || "",
              logoFileName: setupLogoName || "",
              existingFiles: oldProj ? oldProj.files : undefined
            });
            setProjects((prev) => prev.map((p) => (p.id === editingProjectId ? updated : p)));
            setActiveProjectId(editingProjectId);
            setSelectedPath(updated.files[0] ? updated.files[0].path : "");
          } else {
            const created = createAndroidProject({
              name: setupName,
              packageName: setupPkg,
              description: setupDesc,
              languageId: setupLanguage,
              minSdk: setupMinSdk,
              targetSdk: clampedTarget,

          const already = project.files.some((f) => f.path === cleanPath);
          if (!already) {
            const starter =
              ext === "xml"
                ? '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'

                ? "package " + project.packageName + ";\n\npublic class NewClass {\n}\n"

            setProjects((prev) =>

                return {

                  files: [...item.files, { path: cleanPath, language: ext, content: starter }]

              role: "assistant",

                "চ্যাট হিস্ট্রি রিসেট করা হয়েছে। এখন নতুন করে বাংলায় প্রশ্ন করুন, কোড লেখান অথবা বর্তমান ফাইল ফিক্স করতে বলুন!"

          if (!text || isAILoading || !project) return;
          const historySnapshot = messages;
          setPromptInput("");
          setMessages((prev) => [...prev, { id: "u-" + Date.now(), role: "user", content: text }]);
          setIsAILoading(true);

          try {
            const res = await runAICommand({
              prompt: text,
              project,
              activeFile,
              apiKey,
              chatHistory: historySnapshot
            });

            if (Array.isArray(res.updatedFiles) && res.updatedFiles.length > 0) {
              setProjects((prev) =>
                prev.map((item) => {
                  if (item.id !== project.id) return item;
                  const map = new Map();
                  for (const f of item.files) map.set(f.path, f);
                  for (const u of res.updatedFiles) {
                    if (u && u.path) map.set(u.path, u);
                  }
                  return {
                    ...item,
                    updatedAt: new Date().toLocaleString("bn-BD"),
                    files: Array.from(map.values())
                  };
                })
              );

              if (res.updatedFiles[0] && res.updatedFiles[0].path) {
                setSelectedPath(res.updatedFiles[0].path);
              }
            }

            setMessages((prev) => [
              ...prev,
              { id: "a-" + Date.now(), role: "assistant", content: res.reply }
            ]);
          } finally {
            setIsAILoading(false);
          }
        };

        const handleSendAI = async (e) => {
          e.preventDefault();
          await sendPromptText(promptInput);
        };

        const handleGitHubPush = async (e) => {
          e.preventDefault();
          if (!ghToken.trim() || !project) {
            setGhStatus("GitHub Personal Access Token দিন।");
            return;
          }
          setIsPushing(true);
          setGhStatus("পুশ শুরু হচ্ছে...");
          try {
            const count = await pushFilesToGitHub(
              {
                owner: ghOwner.trim(),
                repo: ghRepo.trim(),
                branch: ghBranch.trim() || "main",
                pathPrefix: ghPrefix.trim(),
                token: ghToken.trim(),
                commitMessage: ghMsg.trim(),
                files: project.files

            setGhStatus("সফলভাবে " + count + "টি ফাইল GitHub-এ পুশ হয়েছে!");

                        sendPromptText(

                            (activeFile ? activeFile.path : "MainActivity") +
                            ") কোড কীভাবে কাজ করছে তা সহজ বাংলায় বুঝিয়ে দাও।"

                  </div>

                  <div className="mb-2 max-h-[42vh] flex-1 space-y-2 overflow-y-auto rounded-xl border border-slate-800 bg-slate-950/70 p-3">
                    {messages.map((m) => (
                      <div

                        className={

                        value={setupLanguage}
                        onChange={(e) => setSetupLanguage(e.target.value)}
                        className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                      >
                        {ANDROID_LANGUAGES.map((l) => (
                          <option key={l.id} value={l.id}>
                            {l.label}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div className="flex items-center justify-between rounded-xl border border-emerald-500/30 bg-emerald-950/30 p-3">
                      <div className="text-[11px] text-emerald-200">
                        সর্বোচ্চ ডিভাইস কভারেজ: <strong>{selectedMinInfo.coverage}</strong>
                      </div>
                      <button
                        type="button"
                        onClick={applyMaxDeviceSupportPreset}
                        className="rounded-lg bg-emerald-600 px-2.5 py-1 text-[11px] font-semibold text-white hover:bg-emerald-500"
                      >
                        সব ফোনে সাপোর্ট (API 21)
                      </button>
                    </div>

                    <div className="grid grid-cols-1 gap-2 sm:grid-cols-2">
                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Minimum SDK</label>
                        <select
                          value={setupMinSdk}
                          onChange={(e) => setSetupMinSdk(Number(e.target.value))}
                          className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                        >
                          {MIN_SDK_OPTIONS.map((m) => (
                            <option key={m.api} value={m.api}>
                              API {m.api} · {m.coverage} ({m.name})
                            </option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Target / Compile SDK</label>
                        <select
                          value={setupTargetSdk}
                          onChange={(e) => setSetupTargetSdk(Number(e.target.value))}
                          className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                        >
                          {TARGET_SDK_OPTIONS.map((t) => (
                            <option key={t.api} value={t.api}>
                              API {t.api} ({t.name})
                            </option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="mb-1 block text-xs text-slate-300">বিবরণ</label>
                      <input
                        value={setupDesc}
                        onChange={(e) => setSetupDesc(e.target.value)}
                        className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                      />
                    </div>

                    <div>
                      <label className="mb-1 block text-xs text-slate-300">
                        অ্যাপ লোগো (সরাসরি অ্যাপ ও Manifest-এ যুক্ত হবে)
                      </label>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={handleLogoUpload}
                        className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                      />
                      {setupLogoUrl && (
                        <div className="mt-2 flex items-center gap-2">
                          <img
                            src={setupLogoUrl}
                            alt="Preview"
                            className="h-10 w-10 rounded-xl border border-slate-700 bg-white object-cover"
                          />
                          <span className="text-xs text-emerald-400">{setupLogoName}</span>
                        </div>
                      )}
                    </div>

                    <div className="flex justify-end gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setIsSetupOpen(false)}
                        className="rounded-xl bg-slate-800 px-3 py-2 text-xs"
                      >
                        বাতিল
                      </button>
                      <button
                        type="submit"
                        className="rounded-xl bg-emerald-600 px-4 py-2 text-xs font-semibold text-white hover:bg-emerald-500"
                      >
                        {editingProjectId ? "আপডেট করুন" : "তৈরি করুন"}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Full-Screen Code Review Modal */}
            {isReviewOpen && (
              <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-950 p-4">
                <div className="mx-auto max-w-4xl">
                  <div className="mb-4 flex items-center justify-between border-b border-slate-800 pb-3">
                    <div>
                      <h3 className="text-lg font-bold">কোড রিভিউ</h3>
                      <p className="text-xs text-slate-400">
                        মোট সতর্কতা/সমস্যা: {issues.length}টি
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setIsReviewOpen(false)}
                      className="rounded-xl bg-slate-800 px-3 py-1.5 text-xs hover:bg-slate-700"
                    >
                      ফিরে যান
                    </button>
                  </div>

                  {issues.length > 0 && (
                    <div className="mb-4 space-y-2">
                      {issues.map((iss, idx) => (
                        <div
                          key={idx}
                          className="rounded-xl border border-amber-500/40 bg-amber-950/30 p-3 text-xs text-amber-200"
                        >
                          <strong className="font-mono">{iss.filePath}:</strong> {iss.message}
                        </div>
                      ))}
                    </div>
                  )}

                  <div className="space-y-3">
                    {project &&
                      project.files &&
                      project.files.map((f) => (
                        <div
                          key={f.path}
                          className="rounded-2xl border border-slate-800 bg-slate-900 p-3"
                        >
                          <div className="mb-1 font-mono text-xs text-emerald-400">{f.path}</div>
                          <pre className="max-h-56 overflow-auto rounded-xl bg-slate-950 p-3 text-xs">
                            <code>{f.content}</code>
                          </pre>
                        </div>
                      ))}
                  </div>
                </div>
              </div>
            )}

            {/* GitHub Push Modal */}
            {isPushOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4">
                <div className="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-5 shadow-2xl">
                  <div className="mb-3 flex items-center justify-between">
                    <h3 className="text-base font-bold">GitHub-এ পুশ করুন</h3>
                    <button
                      type="button"
                      onClick={() => setIsPushOpen(false)}
                      className="text-slate-400 hover:text-white"
                    >
                      ✕
                    </button>
                  </div>
                  <form onSubmit={handleGitHubPush} className="space-y-3">
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Owner</label>
                        <input
                          value={ghOwner}
                          onChange={(e) => setGhOwner(e.target.value)}
                          className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                          required
                        />
                      </div>
                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Repo</label>
                        <input
                          value={ghRepo}
                          onChange={(e) => setGhRepo(e.target.value)}
                          className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                          required
                        />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Branch</label>
                        <input
                          value={ghBranch}
                          onChange={(e) => setGhBranch(e.target.value)}
                          className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                          required
                        />
                      </div>
                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Folder Prefix</label>
                        <input
                          value={ghPrefix}
                          onChange={(e) => setGhPrefix(e.target.value)}
                          className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                        />
                      </div>
                    </div>
                    <div>
                      <label className="mb-1 block text-xs text-slate-300">GitHub Token</label>
                      <input
                        type="password"
                        value={ghToken}
                        onChange={(e) => setGhToken(e.target.value)}
                        placeholder="ghp_..."
                        className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                        required
                      />
                    </div>
                    <div>
                      <label className="mb-1 block text-xs text-slate-300">Commit Message</label>
                      <input
                        value={ghMsg}
                        onChange={(e) => setGhMsg(e.target.value)}
                        className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                      />
                    </div>
                    {ghStatus && (
                      <div className="rounded-xl bg-slate-800 p-2.5 text-xs text-emerald-300">
                        {ghStatus}
                      </div>
                    )}
                    <div className="flex justify-end gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setIsPushOpen(false)}
                        className="rounded-xl bg-slate-800 px-3 py-2 text-xs"
                      >
                        বন্ধ
                      </button>
                      <button
                        type="submit"
                        disabled={isPushing}
                        className="rounded-xl bg-blue-600 px-4 py-2 text-xs font-semibold text-white hover:bg-blue-500 disabled:opacity-50"
                      >
                        {isPushing ? "পুশ হচ্ছে..." : "Push Now"}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      const rootEl = document.getElementById("root");
      if (rootEl) {
        ReactDOM.createRoot(rootEl).render(
          <ErrorBoundary>
            <App />
          </ErrorBoundary>
        );
      }
    </script>
  </body>
</html>
