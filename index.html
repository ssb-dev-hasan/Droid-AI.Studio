      // ErrorBoundary to catch any runtime error cleanly
      class ErrorBoundary extends Component {
        constructor(props) {
          super(props);
          this.state = { error: null };
        }
        static getDerivedStateFromError(error) {
          return { error };
        }
        render() {
          if (this.state.error) {
            return (
              <div className="flex min-h-screen items-center justify-center bg-slate-950 p-6 text-slate-100">

      // Check whether hardcoded FIREBASE_CONFIG has real credentials
      function isFirebaseConfigured() {
        return Boolean(
          typeof FIREBASE_CONFIG !== "undefined" &&
            FIREBASE_CONFIG &&
            FIREBASE_CONFIG.apiKey &&
            FIREBASE_CONFIG.authDomain &&
            FIREBASE_CONFIG.projectId &&
            FIREBASE_CONFIG.appId &&
            !String(FIREBASE_CONFIG.apiKey).includes("YOUR_")
        );
      }

      let firebaseServicesCache = null;
      function getFirebaseServices() {
        if (!isFirebaseConfigured()) return null;
        if (firebaseServicesCache) return firebaseServicesCache;
        try {
          if (!window.firebase) return null;
          const app =
            window.firebase.apps && window.firebase.apps.length > 0
              ? window.firebase.app()
              : window.firebase.initializeApp(FIREBASE_CONFIG);
          const auth = window.firebase.auth ? window.firebase.auth() : null;
          const rtdb = window.firebase.database ? window.firebase.database() : null;
          firebaseServicesCache = { app, auth, rtdb };
          return firebaseServicesCache;
        } catch (err) {
          console.error("Firebase init error:", err);
          return null;
        }
      }

      function normalizeEmail(email) {
        return String(email || "").trim().toLowerCase();
      }

      function emailToDocKey(email) {
        return normalizeEmail(email).replace(/[^a-z0-9]/g, "_");
      }

      function readLocalUsers() {
        try {
          const raw = localStorage.getItem(STORAGE_AUTH_USERS_KEY);
          const parsed = raw ? JSON.parse(raw) : {};
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch (_) {
          return {};
        }
      }

      function writeLocalUsers(usersMap) {
        try {
          localStorage.setItem(STORAGE_AUTH_USERS_KEY, JSON.stringify(usersMap));
        } catch (_) {}

      function createAndroidProject({
        id,
        name,
        packageName,
        description,
        languageId,
        minSdk,
        targetSdk,
        logoDataUrl,
        logoFileName,
        existingFiles
      }) {
        const safeName = String(name || "IMO Studio App").trim() || "IMO Studio App";
        const pkg =
          String(packageName || "com.example.imostudio").trim() || "com.example.imostudio";
        const resolvedLang = languageId || "kotlin-compose";
        const resolvedMinSdk = Number(minSdk) || 21;
        const resolvedTargetSdk = Math.max(Number(targetSdk) || 36, resolvedMinSdk);
        const resolvedLogo = logoDataUrl || "";
        const hasLogo = Boolean(resolvedLogo);

        let files =
          Array.isArray(existingFiles) && existingFiles.length > 0
            ? existingFiles.map((f) => {
                if (f.path.endsWith("strings.xml")) {
                  return {
                    ...f,
                    content:
                      '<?xml version="1.0" encoding="utf-8"?>\n' +
                      "<resources>\n" +
                      '    <string name="app_name">' +
                      safeName +
                      "</string>\n" +
                      "</resources>\n"
                  };
                }
                if (f.path.endsWith("build.gradle.kts")) {
                  return {
                    ...f,
                    content: f.content
                      .replace(/namespace\s*=\s*"[^"]*"/, 'namespace = "' + pkg + '"')
                      .replace(/applicationId\s*=\s*"[^"]*"/, 'applicationId = "' + pkg + '"')
                      .replace(/minSdk\s*=\s*\d+/, "minSdk = " + resolvedMinSdk)
                      .replace(/targetSdk\s*=\s*\d+/, "targetSdk = " + resolvedTargetSdk)
                      .replace(/compileSdk\s*=\s*\d+/, "compileSdk = " + resolvedTargetSdk)
                  };
                }
                if (f.path.endsWith("AndroidManifest.xml")) {
                  return {
                    ...f,
                    content: f.content
                      .replace(
                        /android:icon="[^"]*"/,
                        'android:icon="' +
                          (hasLogo ? "@drawable/ic_app_logo" : "@mipmap/ic_launcher") +
                          '"'
                      )
                      .replace(
                        /android:roundIcon="[^"]*"/,
                        'android:roundIcon="' +
                          (hasLogo ? "@drawable/ic_app_logo" : "@mipmap/ic_launcher_round") +
                          '"'
                      )
                  };
                }
                return f;
              })
            : buildDefaultFiles(
                safeName,
                pkg,
                resolvedLang,
                resolvedMinSdk,
                resolvedTargetSdk,
                hasLogo
              );

        files = files.filter((f) => f.path !== "app/src/main/res/drawable/app_logo_base64.txt");
        if (hasLogo) {
          files.push({
            path: "app/src/main/res/drawable/app_logo_base64.txt",
            language: "text",
            content:
              "Logo File: " +
              (logoFileName || "ic_app_logo.png") +
              "\nBound to AndroidManifest (@drawable/ic_app_logo)\n" +
              resolvedLogo
          });
        }

        return {
          id: id || "proj-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
          name: safeName,
          packageName: pkg,
          description: description || safeName + " Android Project",
          languageId: resolvedLang,
          minSdk: resolvedMinSdk,
          targetSdk: resolvedTargetSdk,
          logoDataUrl: resolvedLogo,
          logoFileName: logoFileName || "",
          updatedAt: new Date().toLocaleString("bn-BD"),
          files
        };
      }

      function validateProjectFiles(files) {
        const issues = [];
        if (!files || files.length === 0) {
          return [{ filePath: "project", message: "প্রজেক্টে কোনো ফাইল নেই।", severity: "error" }];
        }
        for (const f of files) {
          if (!f.content || !f.content.trim()) {
            issues.push({ filePath: f.path, message: "ফাইলটি খালি রয়েছে।", severity: "warning" });
          }
          if (f.path.endsWith(".xml") && !f.content.includes("<?xml")) {
            issues.push({
              filePath: f.path,
              message: "XML ফাইলে <?xml ...?> হেডার রাখা ভালো।",
              severity: "warning"
            });
          }
        }
        return issues;
      }

      function localFallbackEdit(prompt, project, activeFile) {
        const target = activeFile || project.files[0];
        if (!target) return [];
        const comment = target.path.endsWith(".xml")
          ? "<!-- AI Command: " + prompt + " -->\n"
          : "// AI Command: " + prompt + "\n";
        return [{ ...target, content: comment + target.content }];
      }

      async function runAICommand({ prompt, project, activeFile, apiKey }) {
        if (apiKey && apiKey.trim().length > 10) {
          try {
            const filesContext = project.files
              .map((f) => "=== " + f.path + " ===\n" + f.content)
              .join("\n\n");

            const sysPrompt =
              'You are Droid AI Studio\'s Android code generator for "' +
              project.name +
              '" (' +
              project.packageName +
              '). Return ONLY valid JSON: {"reply":"Short explanation in Bengali","updatedFiles":[{"path":"exact/path","language":"kotlin","content":"full file content"}]}';

            const endpoint =
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" +
              encodeURIComponent(apiKey.trim());

            const response = await fetch(endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [
                  {
                    role: "user",
                    parts: [
                      {
                        text:
                          sysPrompt +
                          "\n\nActive file: " +
                          (activeFile && activeFile.path ? activeFile.path : "none") +
                          "\nCommand: " +
                          prompt +
                          "\n\nFiles:\n" +
                          filesContext
                      }
                    ]
                  }
                ]
              })
            });

            const data = await response.json();
            const rawText =
              data &&
              data.candidates &&
              data.candidates[0] &&
              data.candidates[0].content &&
              data.candidates[0].content.parts &&
              data.candidates[0].content.parts[0]
                ? data.candidates[0].content.parts[0].text || ""
                : "";

            const cleaned = rawText
              .replace(/^```json\s*/i, "")
              .replace(/^```\s*/i, "")
              .replace(/```$/i, "")
              .trim();

            const parsed = JSON.parse(cleaned);
            if (Array.isArray(parsed.updatedFiles) && parsed.updatedFiles.length > 0) {
              return {
                reply: parsed.reply || "ফাইলগুলো আপডেট করা হয়েছে।",
                updatedFiles: parsed.updatedFiles
              };
            }
          } catch (err) {
            return {
              reply: "Gemini API ত্রুটি (" + String(err) + ")। লোকাল আপডেট প্রয়োগ করা হয়েছে।",
              updatedFiles: localFallbackEdit(prompt, project, activeFile)
            };
          }
        }

        return {

          updatedFiles: localFallbackEdit(prompt, project, activeFile)
        };
      }

      function toBase64Utf8(text) {
        const bytes = new TextEncoder().encode(text);
        let binary = "";
        for (let i = 0; i < bytes.length; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
      }

      async function getFileSha({ owner, repo, path, branch, token }) {
        const url =
          "https://api.github.com/repos/" +
          encodeURIComponent(owner) +
          "/" +
          encodeURIComponent(repo) +
          "/contents/" +
          path +
          "?ref=" +
          encodeURIComponent(branch);

        const res = await fetch(url, {
          headers: {
            Authorization: "Bearer " + token,
            Accept: "application/vnd.github+json"
          }
        });

        if (res.status === 404) return undefined;
        if (!res.ok) {
          const errText = await res.text();
          throw new Error("GitHub read failed (" + res.status + "): " + errText);
        }
        const json = await res.json();
        return json ? json.sha : undefined;
      }

      async function pushFilesToGitHub(params, onProgress) {
        const prefix = params.pathPrefix
          ? params.pathPrefix.replace(/^\/+|\/+$/g, "") + "/"
          : "";
        let count = 0;

        for (let i = 0; i < params.files.length; i++) {
          const file = params.files[i];
          const fullPath = prefix + file.path.replace(/^\/+/, "");
          if (onProgress) onProgress(i + 1, params.files.length, fullPath);

          const sha = await getFileSha({
            owner: params.owner,
            repo: params.repo,
            path: fullPath,
            branch: params.branch,
            token: params.token
          });

          const url =
            "https://api.github.com/repos/" +
            encodeURIComponent(params.owner) +
            "/" +
            encodeURIComponent(params.repo) +
            "/contents/" +
            fullPath;

          const payload = {
            message: params.commitMessage || "Push " + fullPath + " via Droid AI Studio",
            content: toBase64Utf8(file.content),
            branch: params.branch || "main"
          };
          if (sha) payload.sha = sha;

          const res = await fetch(url, {
            method: "PUT",
            headers: {
              Authorization: "Bearer " + params.token,
              Accept: "application/vnd.github+json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const errText = await res.text();
            throw new Error("Push failed for " + fullPath + " (" + res.status + "): " + errText);
          }
          count++;
        }

        return count;
      }

      // Sync user profile, email lookup, and projects to Firebase Realtime Database
      async function syncUserAndProjectsToRTDB(rtdb, userRecord, projectsList) {
        if (!rtdb || !userRecord || !userRecord.uid) return;
        const nowIso = new Date().toISOString();
        const emailKey = emailToDocKey(userRecord.email);

        try {
          await rtdb.ref("users/" + userRecord.uid).update({
            uid: userRecord.uid,
            email: userRecord.email,
            createdAt: userRecord.createdAt || nowIso,
            lastLoginAt: nowIso,
            loginCount: userRecord.loginCount || 1,
            projectCount: Array.isArray(projectsList) ? projectsList.length : 0
          });

          if (Array.isArray(projectsList)) {
            const projectsMap = {};
            for (const p of projectsList) {
              if (p && p.id) {
                projectsMap[p.id] = {
                  id: p.id,
                  name: p.name,
                  packageName: p.packageName,
                  description: p.description || "",
                  languageId: p.languageId || "kotlin-compose",
                  minSdk: p.minSdk || 21,
                  targetSdk: p.targetSdk || 36,
                  logoDataUrl: p.logoDataUrl || "",
                  logoFileName: p.logoFileName || "",
                  updatedAt: p.updatedAt || nowIso,
                  files: Array.isArray(p.files) ? p.files : []
                };
              }
            }
            await rtdb.ref("users/" + userRecord.uid + "/projects").set(projectsMap);
          }

          if (emailKey) {
            await rtdb.ref("user_emails/" + emailKey).update({
              uid: userRecord.uid,
              email: userRecord.email,
              updatedAt: nowIso
            });
          }
        } catch (err) {
          console.warn("RTDB sync skipped or failed:", err);
        }
      }

      // Load saved projects from Firebase Realtime Database for an existing user
      async function loadUserProjectsFromRTDB(rtdb, uid) {
        if (!rtdb || !uid) return null;
        try {
          const snap = await rtdb.ref("users/" + uid + "/projects").once("value");
          if (snap && snap.exists()) {
            const val = snap.val();
            if (val && typeof val === "object") {
              const list = Object.values(val).filter((item) => item && item.id && Array.isArray(item.files));
              return list.length > 0 ? list : null;
            }
          }
        } catch (err) {
          console.warn("RTDB project load skipped:", err);
        }
        return null;
      }

      // Unified email login / auto-signup with duplicate prevention
      async function authenticateEmailAuto({ email, password, projectsList }) {
        const cleanEmail = normalizeEmail(email);
        const cleanPassword = String(password || "");
        if (!cleanEmail || !cleanEmail.includes("@")) {
          throw new Error("সঠিক ইমেইল ঠিকানা দিন।");
        }
        if (cleanPassword.length < 6) {
          throw new Error("পাসওয়ার্ড অন্তত ৬ অক্ষরের হতে হবে।");
        }

        const fb = getFirebaseServices();
        const nowIso = new Date().toISOString();

        if (fb && fb.auth) {
          try {
            const cred = await fb.auth.signInWithEmailAndPassword(cleanEmail, cleanPassword);
            const u = cred.user;
            let prevData = {};
            if (fb.rtdb) {
              try {
                const snap = await fb.rtdb.ref("users/" + u.uid).once("value");
                if (snap && snap.exists()) {
                  prevData = snap.val() || {};
                }
              } catch (_) {}
            }
            const cloudProjects = await loadUserProjectsFromRTDB(fb.rtdb, u.uid);
            const mergedProjects = cloudProjects || projectsList;
            const nextRecord = {
              uid: u.uid,
              email: cleanEmail,
              createdAt: prevData.createdAt || nowIso,
              lastLoginAt: nowIso,
              loginCount: (prevData.loginCount || 0) + 1,
              projectCount: Array.isArray(mergedProjects) ? mergedProjects.length : 0,
              mode: "firebase"
            };
            await syncUserAndProjectsToRTDB(fb.rtdb, nextRecord, mergedProjects);
            return { user: nextRecord, isNewAccount: false, syncedProjects: cloudProjects };
          } catch (signInErr) {
            const code = signInErr && signInErr.code ? signInErr.code : "";
            if (code === "auth/wrong-password" || code === "auth/invalid-credential") {
              throw new Error(
                "এই ইমেইলটি আগে থেকেই নিবন্ধিত আছে। নতুন অ্যাকাউন্ট তৈরি করা হয়নি—পুরনো অ্যাকাউন্টে ঢুকতে সঠিক পাসওয়ার্ড দিন।"
              );
            }
            if (code === "auth/user-not-found") {
              const createdCred = await fb.auth.createUserWithEmailAndPassword(
                cleanEmail,
                cleanPassword
              );
              const createdUser = createdCred.user;
              const newRecord = {
                uid: createdUser.uid,
                email: cleanEmail,
                createdAt: nowIso,
                lastLoginAt: nowIso,
                loginCount: 1,
                projectCount: Array.isArray(projectsList) ? projectsList.length : 0,
                mode: "firebase"
              };
              await syncUserAndProjectsToRTDB(fb.rtdb, newRecord, projectsList);
              return { user: newRecord, isNewAccount: true, syncedProjects: null };
            }
            throw new Error(
              signInErr && signInErr.message ? signInErr.message : "লগইন করতে সমস্যা হয়েছে।"
            );
          }
        }

        // Local fallback mode when FIREBASE_CONFIG is empty
        const localUsers = readLocalUsers();
        const existingLocal = localUsers[cleanEmail];
        if (existingLocal) {
          if (existingLocal.password !== cleanPassword) {
            throw new Error(
              "এই ইমেইলটি আগে থেকেই নিবন্ধিত আছে। নতুন অ্যাকাউন্ট তৈরি করা হয়নি—পুরনো অ্যাকাউন্টে লগইন করতে সঠিক পাসওয়ার্ড দিন।"
            );
          }
          const updatedLocal = {
            ...existingLocal,
            lastLoginAt: nowIso,
            loginCount: (existingLocal.loginCount || 1) + 1,
            projectCount: Array.isArray(projectsList) ? projectsList.length : 0,
            mode: "local-sim"
          };
          localUsers[cleanEmail] = updatedLocal;
          writeLocalUsers(localUsers);
          return { user: updatedLocal, isNewAccount: false };
        }

        const generatedUid =
          "uid_" + emailToDocKey(cleanEmail) + "_" + Math.random().toString(36).slice(2, 7);
        const createdLocal = {
          uid: generatedUid,
          password: cleanPassword,
          email: cleanEmail,
          createdAt: nowIso,
          lastLoginAt: nowIso,
          loginCount: 1,
          projectCount: Array.isArray(projectsList) ? projectsList.length : 0,
          mode: "local-sim"
        };
        localUsers[cleanEmail] = createdLocal;
        writeLocalUsers(localUsers);
        return { user: createdLocal, isNewAccount: true };
      }

              role: "assistant",
              content: isNewAccount
                ? "নতুন অ্যাকাউন্ট তৈরি হয়েছে! ইমেইল: " +
                  user.email +
                  " | ইউজার ID: " +
                  user.uid
                : "পুরনো অ্যাকাউন্টে লগইন সম্পন্ন হয়েছে! ইমেইল: " +
                  user.email +
                  " | ইউজার ID: " +
                  user.uid
            }
          ]);
        };

        const handleLogout = async () => {
          const fb = getFirebaseServices();
          if (fb && fb.auth) {
            try {
              await fb.auth.signOut();
            } catch (_) {}
          }
          setCurrentUser(null);
        };

        const applyMaxDeviceSupportPreset = () => {
          setSetupMinSdk(21);
          setSetupTargetSdk(36);
        };

        const openNewProjectModal = () => {
          setEditingProjectId(null);
          setSetupName("");
          setSetupPkg("com.example.newapp");
          setSetupDesc("New Android App");
          setSetupLanguage("kotlin-compose");
          setSetupMinSdk(21);
          setSetupTargetSdk(36);
          setSetupLogoUrl("");
          setSetupLogoName("");
          setIsSetupOpen(true);
        };

        const openEditProjectModal = (targetProj) => {
          setEditingProjectId(targetProj.id);
          setActiveProjectId(targetProj.id);
          setSetupName(targetProj.name);
          setSetupPkg(targetProj.packageName);
          setSetupDesc(targetProj.description);
          setSetupLanguage(targetProj.languageId || "kotlin-compose");
          setSetupMinSdk(targetProj.minSdk || 21);
          setSetupTargetSdk(targetProj.targetSdk || 36);
          setSetupLogoUrl(targetProj.logoDataUrl || "");
          setSetupLogoName(targetProj.logoFileName || "");
          setIsSetupOpen(true);
        };

        const handleLogoUpload = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          setSetupLogoName(file.name);
          const reader = new FileReader();
          reader.onload = () => {
            if (typeof reader.result === "string") {
              setSetupLogoUrl(reader.result);
            }
          };
          reader.readAsDataURL(file);
        };

        const handleSaveProjectForm = (e) => {
          e.preventDefault();
          const clampedTarget = Math.max(Number(setupTargetSdk) || 36, Number(setupMinSdk) || 21);

          if (editingProjectId) {
            const oldProj = projects.find((p) => p.id === editingProjectId);
            const updated = createAndroidProject({
              id: editingProjectId,
              name: setupName,
              packageName: setupPkg,
              description: setupDesc,
              languageId: setupLanguage,
              minSdk: setupMinSdk,
              targetSdk: clampedTarget,
              logoDataUrl: setupLogoUrl || "",
              logoFileName: setupLogoName || "",
              existingFiles: oldProj ? oldProj.files : undefined
            });
            setProjects((prev) => prev.map((p) => (p.id === editingProjectId ? updated : p)));
            setActiveProjectId(editingProjectId);
            setSelectedPath(updated.files[0] ? updated.files[0].path : "");
          } else {
            const created = createAndroidProject({
              name: setupName,
              packageName: setupPkg,
              description: setupDesc,
              languageId: setupLanguage,
              minSdk: setupMinSdk,
              targetSdk: clampedTarget,
              logoDataUrl: setupLogoUrl || "",
              logoFileName: setupLogoName || ""
            });
            setProjects((prev) => [created, ...prev]);
            setActiveProjectId(created.id);
            setSelectedPath(created.files[0] ? created.files[0].path : "");
          }

          setIsSetupOpen(false);
        };

        const handleCreateNewFile = (e) => {
          e.preventDefault();
          const cleanPath = newFilePath.trim().replace(/^\/+/, "");
          if (!cleanPath || !project) return;
          const ext = cleanPath.split(".").pop() || "kt";
          const already = project.files.some((f) => f.path === cleanPath);
          if (!already) {
            const starter =
              ext === "xml"
                ? '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'
                : ext === "java"
                ? "package " + project.packageName + ";\n\npublic class NewClass {\n}\n"
                : "package " + project.packageName + "\n\n// New file created in Droid AI Studio\n";
            setProjects((prev) =>
              prev.map((item) => {
                if (item.id !== project.id) return item;
                return {
                  ...item,
                  updatedAt: new Date().toLocaleString("bn-BD"),
                  files: [...item.files, { path: cleanPath, language: ext, content: starter }]
                };
              })
            );
          }
          setSelectedPath(cleanPath);
          setNewFilePath("");
          setIsNewFileOpen(false);
        };

        const handleCodeEdit = (val) => {
          if (!activeFile || !project) return;
          setProjects((prev) =>
            prev.map((item) => {
              if (item.id !== project.id) return item;
              return {
                ...item,
                updatedAt: new Date().toLocaleString("bn-BD"),
                files: item.files.map((f) =>
                  f.path === activeFile.path ? { ...f, content: val } : f
                )
              };
            })
          );
        };

        const handleSendAI = async (e) => {
          e.preventDefault();
          if (!promptInput.trim() || isAILoading || !project) return;
          const text = promptInput.trim();
          setPromptInput("");
          setMessages((prev) => [...prev, { id: "u-" + Date.now(), role: "user", content: text }]);
          setIsAILoading(true);

          try {
            const res = await runAICommand({
              prompt: text,
              project,
              activeFile,
              apiKey
            });

            setProjects((prev) =>
              prev.map((item) => {
                if (item.id !== project.id) return item;
                const map = new Map();
                for (const f of item.files) map.set(f.path, f);
                for (const u of res.updatedFiles) map.set(u.path, u);
                return {
                  ...item,
                  updatedAt: new Date().toLocaleString("bn-BD"),
                  files: Array.from(map.values())
                };
              })
            );

            if (res.updatedFiles[0] && res.updatedFiles[0].path) {
              setSelectedPath(res.updatedFiles[0].path);
            }

            setMessages((prev) => [
              ...prev,
              { id: "a-" + Date.now(), role: "assistant", content: res.reply }
            ]);
          } finally {
            setIsAILoading(false);
          }
        };

        const handleGitHubPush = async (e) => {
          e.preventDefault();
          if (!ghToken.trim() || !project) {
            setGhStatus("GitHub Personal Access Token দিন।");
            return;
          }
          setIsPushing(true);
          setGhStatus("পুশ শুরু হচ্ছে...");
          try {
            const count = await pushFilesToGitHub(
              {
                owner: ghOwner.trim(),
                repo: ghRepo.trim(),
                branch: ghBranch.trim() || "main",
                pathPrefix: ghPrefix.trim(),
                token: ghToken.trim(),
                commitMessage: ghMsg.trim(),
                files: project.files
              },
              (cur, tot, path) => setGhStatus("পুশ হচ্ছে (" + cur + "/" + tot + "): " + path)
            );
            setGhStatus("সফলভাবে " + count + "টি ফাইল GitHub-এ পুশ হয়েছে!");
          } catch (err) {
            setGhStatus("পুশ ব্যর্থ: " + String(err));
          } finally {
            setIsPushing(false);
          }
        };

        const selectedMinInfo = getMinSdkInfo(setupMinSdk);
        const activeMinInfo = getMinSdkInfo(project ? project.minSdk : 21);

        return (
          <div className="flex min-h-screen flex-col bg-slate-950 text-slate-100">
            {/* Mandatory Entry Email Login / Auto-Signup Popup */}
            {!currentUser && (
              <EmailLoginPopup projectsList={projects} onSuccess={handleAuthSuccess} />
            )}

            {/* Top Header Bar */}
            <header className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 bg-slate-900 px-4 py-3">
              <div className="flex items-center gap-3">
                {project && project.logoDataUrl ? (
                  <img
                    src={project.logoDataUrl}
                    alt="App Logo"
                    className="h-9 w-9 rounded-xl border border-slate-700 bg-white object-cover"
                  />
                ) : (
                  <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-emerald-600 font-bold text-white">
                    AI
                  </div>
                )}
                <div>
                  <h1 className="text-sm font-bold sm:text-base">
                    {project ? project.name : "Droid AI Studio"}
                  </h1>
                  <p className="text-xs text-slate-400">
                    {project ? project.packageName : ""} · {activeMinInfo.coverage} সাপোর্ট
                  </p>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                {currentUser && (
                  <div className="flex items-center gap-2 rounded-xl border border-slate-700 bg-slate-800/80 px-2.5 py-1.5 text-[11px]">
                    <span className="max-w-[140px] truncate text-emerald-300">
                      {currentUser.email}
                    </span>
                    <button
                      type="button"
                      onClick={handleLogout}
                      className="rounded-lg bg-slate-700 px-2 py-0.5 text-[10px] font-medium text-rose-300 hover:bg-slate-600"
                    >
                      লগআউট
                    </button>
                  </div>
                )}

                <button
                  type="button"
                  onClick={() => setIsHistoryOpen(true)}
                  className="rounded-xl border border-amber-500/40 bg-amber-500/15 px-3 py-1.5 text-xs font-semibold text-amber-300 hover:bg-amber-500/25"
                >
                  প্রজেক্ট হিস্ট্রি ({projects.length})
                </button>

                <button
                  type="button"
                  onClick={() => setIsRunnerFolded((v) => !v)}
                  className="rounded-xl bg-amber-500 px-3 py-1.5 text-xs font-semibold text-slate-950 hover:bg-amber-400"
                >
                  {isRunnerFolded ? "▶ Run App" : "▼ Run App"}
                </button>

                <button
                  type="button"
                  onClick={openNewProjectModal}
                  className="rounded-xl bg-emerald-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-emerald-500"
                >
                  + নতুন প্রজেক্ট
                </button>

                {project && (
                  <button
                    type="button"
                    onClick={() => openEditProjectModal(project)}
                    className="rounded-xl bg-slate-800 px-3 py-1.5 text-xs font-semibold text-emerald-300 hover:bg-slate-700"
                  >
                    এডিট
                  </button>
                )}

                <button
                  type="button"
                  onClick={() => setIsReviewOpen(true)}
                  className="rounded-xl bg-slate-800 px-3 py-1.5 text-xs font-semibold hover:bg-slate-700"
                >
                  রিভিউ ({issues.length})
                </button>

                <button
                  type="button"
                  onClick={() => setIsChatOpen((v) => !v)}
                  className="rounded-xl bg-purple-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-purple-500"
                >
                  AI কমান্ড
                </button>

                <button
                  type="button"
                  onClick={() => setIsPushOpen(true)}
                  className="rounded-xl bg-blue-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-blue-500"
                >
                  GitHub Push
                </button>
              </div>
            </header>

            {/* Main IDE Workspace */}
            <div className="grid flex-1 grid-cols-1 lg:grid-cols-12">
              {/* Dedicated Sidebar File Explorer */}
              <aside className="border-b border-slate-800 bg-slate-900/60 p-3 lg:col-span-3 lg:border-b-0 lg:border-r">
                <div className="mb-2 flex items-center justify-between">
                  <span className="text-xs font-semibold uppercase text-slate-400">
                    প্রজেক্ট ফাইলসমূহ ({project && project.files ? project.files.length : 0})
                  </span>
                  <button
                    type="button"
                    onClick={() => setIsNewFileOpen((v) => !v)}
                    className="rounded-lg bg-slate-800 px-2 py-1 text-[11px] font-semibold text-emerald-300 hover:bg-slate-700"
                  >
                    + ফাইল
                  </button>
                </div>

                {isNewFileOpen && (
                  <form onSubmit={handleCreateNewFile} className="mb-2 flex gap-1.5">
                    <input
                      value={newFilePath}
                      onChange={(e) => setNewFilePath(e.target.value)}
                      placeholder="app/src/main/java/Helper.kt"
                      className="min-w-0 flex-1 rounded-lg border border-slate-700 bg-slate-800 px-2.5 py-1.5 font-mono text-[11px] text-white"
                      required
                    />
                    <button
                      type="submit"
                      className="rounded-lg bg-emerald-600 px-2.5 py-1.5 text-[11px] font-semibold text-white hover:bg-emerald-500"
                    >
                      যোগ
                    </button>
                  </form>
                )}

                <input
                  value={fileSearch}
                  onChange={(e) => setFileSearch(e.target.value)}
                  placeholder="ফাইল খুঁজুন..."
                  className="mb-2 w-full rounded-lg border border-slate-800 bg-slate-950/70 px-2.5 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:border-emerald-500 focus:outline-none"
                />

                <div className="max-h-[40vh] space-y-1 overflow-y-auto lg:max-h-[70vh]">
                  {filteredFiles.map((file) => (
                    <button
                      key={file.path}
                      type="button"
                      onClick={() => setSelectedPath(file.path)}
                      className={
                        activeFile && activeFile.path === file.path
                          ? "block w-full truncate rounded-lg border border-emerald-500/40 bg-emerald-600/20 px-3 py-2 text-left font-mono text-xs text-emerald-300"
                          : "block w-full truncate rounded-lg px-3 py-2 text-left font-mono text-xs text-slate-300 hover:bg-slate-800"
                      }
                    >
                      {file.path}
                    </button>
                  ))}
                </div>
              </aside>

              {/* Center Code Editor & Foldable Run App Preview */}
              <main
                className={
                  isChatOpen ? "flex flex-col p-3 lg:col-span-5" : "flex flex-col p-3 lg:col-span-9"
                }
              >
                {!isRunnerFolded && project && (
                  <RunAppDrawer
                    key={project.id}
                    project={project}
                    onFold={() => setIsRunnerFolded(true)}
                  />
                )}

                <div className="mb-2 flex items-center justify-between rounded-xl border border-slate-800 bg-slate-900 px-3 py-2">
                  <span className="truncate font-mono text-xs text-emerald-400">
                    {activeFile ? activeFile.path : "কোনো ফাইল নেই"}
                  </span>
                  <span className="text-[11px] text-slate-400">কোড এডিটর</span>
                </div>

                <textarea
                  value={activeFile ? activeFile.content : ""}
                  onChange={(e) => handleCodeEdit(e.target.value)}
                  spellCheck={false}
                  className="min-h-[55vh] w-full flex-1 rounded-xl border border-slate-800 bg-slate-900 p-3 font-mono text-xs leading-relaxed text-slate-100 focus:border-emerald-500 focus:outline-none"
                />
              </main>

              {/* Right AI Code Generator Panel */}
              {isChatOpen && (
                <section className="flex flex-col border-t border-slate-800 bg-slate-900/80 p-3 lg:col-span-4 lg:border-l lg:border-t-0">
                  <div className="mb-2 flex items-center justify-between">
                    <h2 className="text-xs font-bold uppercase text-purple-300">
                      AI কোড জেনারেটর
                    </h2>
                    <button
                      type="button"
                      onClick={() => setIsChatOpen(false)}
                      className="text-xs text-slate-400 hover:text-white"
                    >
                      লুকান
                    </button>
                  </div>

                  <input
                    type="password"
                    value={apiKey}
                    onChange={(e) => setApiKey(e.target.value)}
                    placeholder="Gemini API Key (ঐচ্ছিক)"
                    className="mb-2 w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                  />

                  <div className="mb-2 max-h-[45vh] flex-1 space-y-2 overflow-y-auto rounded-xl border border-slate-800 bg-slate-950/70 p-3">
                    {messages.map((m) => (
                      <div
                        key={m.id}
                        className={
                          m.role === "user"
                            ? "ml-6 rounded-xl border border-blue-500/40 bg-blue-600/20 p-2.5 text-xs"
                            : "mr-6 rounded-xl border border-slate-800 bg-slate-900 p-2.5 text-xs"
                        }
                      >
                        <div className="mb-1 text-[10px] text-slate-400">
                          {m.role === "user" ? "আপনি" : "AI"}
                        </div>
                        <div className="whitespace-pre-wrap">{m.content}</div>
                      </div>
                    ))}
                    {isAILoading && (
                      <div className="rounded-xl bg-slate-900 p-2.5 text-xs text-emerald-400">
                        ফাইলগুলোতে কোড লেখা হচ্ছে...
                      </div>
                    )}
                  </div>

                  <form onSubmit={handleSendAI} className="flex gap-2">
                    <input
                      value={promptInput}
                      onChange={(e) => setPromptInput(e.target.value)}
                      placeholder="কমান্ড লিখুন..."
                      className="flex-1 rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                    />
                    <button
                      type="submit"
                      disabled={isAILoading}
                      className="rounded-xl bg-emerald-600 px-3.5 py-2 text-xs font-semibold text-white hover:bg-emerald-500 disabled:opacity-50"
                    >
                      পাঠান
                    </button>
                  </form>
                </section>
              )}
            </div>

            {/* Project History Modal */}
            {isHistoryOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4">
                <div className="w-full max-w-lg rounded-2xl border border-slate-800 bg-slate-900 p-5 shadow-2xl">
                  <div className="mb-3 flex items-center justify-between">
                    <h3 className="text-base font-bold text-amber-300">
                      প্রজেক্ট হিস্ট্রি ({projects.length})
                    </h3>
                    <button
                      type="button"
                      onClick={() => setIsHistoryOpen(false)}
                      className="text-slate-400 hover:text-white"
                    >
                      ✕
                    </button>
                  </div>
                  <input
                    value={historySearch}
                    onChange={(e) => setHistorySearch(e.target.value)}
                    placeholder="প্রজেক্ট নাম বা প্যাকেজ খুঁজুন..."
                    className="mb-3 w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                  />
                  <div className="max-h-72 space-y-2 overflow-y-auto">
                    {filteredHistory.map((p) => (
                      <div
                        key={p.id}
                        onClick={() => {
                          setActiveProjectId(p.id);
                          setSelectedPath(p.files[0] ? p.files[0].path : "");
                          setIsHistoryOpen(false);
                        }}
                        className="flex cursor-pointer items-center justify-between rounded-xl border border-slate-800 bg-slate-950/70 p-3 text-xs hover:border-emerald-500/50"
                      >
                        <div className="flex min-w-0 flex-1 items-center gap-2.5">
                          {p.logoDataUrl ? (
                            <img
                              src={p.logoDataUrl}
                              alt="Logo"
                              className="h-8 w-8 rounded-lg border border-slate-700 bg-white object-cover"
                            />
                          ) : (
                            <div className="flex h-8 w-8 items-center justify-center rounded-lg bg-slate-800 text-[10px] font-bold text-emerald-300">
                              {p.name.slice(0, 2).toUpperCase()}
                            </div>
                          )}
                          <div className="min-w-0 flex-1">
                            <div className="truncate font-semibold text-white">{p.name}</div>
                            <div className="truncate font-mono text-[11px] text-slate-400">
                              {p.packageName} · Min API {p.minSdk} ({getMinSdkInfo(p.minSdk).coverage})
                            </div>
                          </div>
                        </div>
                        <button
                          type="button"
                          onClick={(e) => {
                            e.stopPropagation();
                            setIsHistoryOpen(false);
                            openEditProjectModal(p);
                          }}
                          className="ml-2 rounded-lg bg-slate-800 px-2.5 py-1 text-[11px] text-emerald-300 hover:bg-slate-700"
                        >
                          এডিট
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* New / Edit Project Modal */}
            {isSetupOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4">
                <div className="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-2xl border border-slate-800 bg-slate-900 p-5 shadow-2xl">
                  <div className="mb-3 flex items-center justify-between">
                    <h3 className="text-base font-bold">
                      {editingProjectId ? "প্রজেক্ট এডিট করুন" : "নতুন Android প্রজেক্ট"}
                    </h3>
                    <button
                      type="button"
                      onClick={() => setIsSetupOpen(false)}
                      className="text-slate-400 hover:text-white"
                    >
                      ✕
                    </button>
                  </div>

                  <form onSubmit={handleSaveProjectForm} className="space-y-3">
                    <div>
                      <label className="mb-1 block text-xs text-slate-300">অ্যাপের নাম</label>
                      <input
                        value={setupName}
                        onChange={(e) => setSetupName(e.target.value)}
                        className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                        required
                      />
                    </div>

                    <div>
                      <label className="mb-1 block text-xs text-slate-300">Package Name</label>
                      <input
                        value={setupPkg}
                        onChange={(e) => setSetupPkg(e.target.value)}
                        className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                        required
                      />
                    </div>

                    <div>
                      <label className="mb-1 block text-xs text-slate-300">প্রজেক্ট ল্যাঙ্গুয়েজ</label>
                      <select
                        value={setupLanguage}
                        onChange={(e) => setSetupLanguage(e.target.value)}
                        className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                      >
                        {ANDROID_LANGUAGES.map((l) => (
                          <option key={l.id} value={l.id}>
                            {l.label}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div className="flex items-center justify-between rounded-xl border border-emerald-500/30 bg-emerald-950/30 p-3">
                      <div className="text-[11px] text-emerald-200">
                        সর্বোচ্চ ডিভাইস কভারেজ: <strong>{selectedMinInfo.coverage}</strong>
                      </div>
                      <button
                        type="button"
                        onClick={applyMaxDeviceSupportPreset}
                        className="rounded-lg bg-emerald-600 px-2.5 py-1 text-[11px] font-semibold text-white hover:bg-emerald-500"
                      >
                        সব ফোনে সাপোর্ট (API 21)
                      </button>
                    </div>

                    <div className="grid grid-cols-1 gap-2 sm:grid-cols-2">
                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Minimum SDK</label>
                        <select
                          value={setupMinSdk}
                          onChange={(e) => setSetupMinSdk(Number(e.target.value))}
                          className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                        >
                          {MIN_SDK_OPTIONS.map((m) => (
                            <option key={m.api} value={m.api}>
                              API {m.api} · {m.coverage} ({m.name})
                            </option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Target / Compile SDK</label>
                        <select
                          value={setupTargetSdk}
                          onChange={(e) => setSetupTargetSdk(Number(e.target.value))}
                          className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                        >
                          {TARGET_SDK_OPTIONS.map((t) => (
                            <option key={t.api} value={t.api}>
                              API {t.api} ({t.name})
                            </option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="mb-1 block text-xs text-slate-300">বিবরণ</label>
                      <input
                        value={setupDesc}
                        onChange={(e) => setSetupDesc(e.target.value)}
                        className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                      />
                    </div>

                    <div>
                      <label className="mb-1 block text-xs text-slate-300">
                        অ্যাপ লোগো (সরাসরি অ্যাপ ও Manifest-এ যুক্ত হবে)
                      </label>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={handleLogoUpload}
                        className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                      />
                      {setupLogoUrl && (
                        <div className="mt-2 flex items-center gap-2">
                          <img
                            src={setupLogoUrl}
                            alt="Preview"
                            className="h-10 w-10 rounded-xl border border-slate-700 bg-white object-cover"
                          />
                          <span className="text-xs text-emerald-400">{setupLogoName}</span>
                        </div>
                      )}
                    </div>

                    <div className="flex justify-end gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setIsSetupOpen(false)}
                        className="rounded-xl bg-slate-800 px-3 py-2 text-xs"
                      >
                        বাতিল
                      </button>
                      <button
                        type="submit"
                        className="rounded-xl bg-emerald-600 px-4 py-2 text-xs font-semibold text-white hover:bg-emerald-500"
                      >
                        {editingProjectId ? "আপডেট করুন" : "তৈরি করুন"}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Full-Screen Code Review Modal */}
            {isReviewOpen && (
              <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-950 p-4">
                <div className="mx-auto max-w-4xl">
                  <div className="mb-4 flex items-center justify-between border-b border-slate-800 pb-3">
                    <div>
                      <h3 className="text-lg font-bold">কোড রিভিউ</h3>
                      <p className="text-xs text-slate-400">
                        মোট সতর্কতা/সমস্যা: {issues.length}টি
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setIsReviewOpen(false)}
                      className="rounded-xl bg-slate-800 px-3 py-1.5 text-xs hover:bg-slate-700"
                    >
                      ফিরে যান
                    </button>
                  </div>

                  {issues.length > 0 && (
                    <div className="mb-4 space-y-2">
                      {issues.map((iss, idx) => (
                        <div
                          key={idx}
                          className="rounded-xl border border-amber-500/40 bg-amber-950/30 p-3 text-xs text-amber-200"
                        >
                          <strong className="font-mono">{iss.filePath}:</strong> {iss.message}
                        </div>
                      ))}
                    </div>
                  )}

                  <div className="space-y-3">
                    {project &&
                      project.files &&
                      project.files.map((f) => (
                        <div
                          key={f.path}
                          className="rounded-2xl border border-slate-800 bg-slate-900 p-3"
                        >
                          <div className="mb-1 font-mono text-xs text-emerald-400">{f.path}</div>
                          <pre className="max-h-56 overflow-auto rounded-xl bg-slate-950 p-3 text-xs">
                            <code>{f.content}</code>
                          </pre>
                        </div>
                      ))}
                  </div>
                </div>
              </div>
            )}

            {/* GitHub Push Modal */}
            {isPushOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4">
                <div className="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-5 shadow-2xl">
                  <div className="mb-3 flex items-center justify-between">
                    <h3 className="text-base font-bold">GitHub-এ পুশ করুন</h3>
                    <button
                      type="button"
                      onClick={() => setIsPushOpen(false)}
                      className="text-slate-400 hover:text-white"
                    >
                      ✕
                    </button>
                  </div>
                  <form onSubmit={handleGitHubPush} className="space-y-3">
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Owner</label>
                        <input
                          value={ghOwner}
                          onChange={(e) => setGhOwner(e.target.value)}
                          className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                          required
                        />
                      </div>
                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Repo</label>
                        <input
                          value={ghRepo}
                          onChange={(e) => setGhRepo(e.target.value)}
                          className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                          required
                        />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Branch</label>
                        <input
                          value={ghBranch}
                          onChange={(e) => setGhBranch(e.target.value)}
                          className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                          required
                        />
                      </div>
                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Folder Prefix</label>
                        <input
                          value={ghPrefix}
                          onChange={(e) => setGhPrefix(e.target.value)}
                          className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                        />
                      </div>
                    </div>
                    <div>
                      <label className="mb-1 block text-xs text-slate-300">GitHub Token</label>
                      <input
                        type="password"
                        value={ghToken}
                        onChange={(e) => setGhToken(e.target.value)}
                        placeholder="ghp_..."
                        className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                        required
                      />
                    </div>
                    <div>
                      <label className="mb-1 block text-xs text-slate-300">Commit Message</label>
                      <input
                        value={ghMsg}
                        onChange={(e) => setGhMsg(e.target.value)}
                        className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                      />
                    </div>
                    {ghStatus && (
                      <div className="rounded-xl bg-slate-800 p-2.5 text-xs text-emerald-300">
                        {ghStatus}
                      </div>
                    )}
                    <div className="flex justify-end gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setIsPushOpen(false)}
                        className="rounded-xl bg-slate-800 px-3 py-2 text-xs"
                      >
                        বন্ধ
                      </button>
                      <button
                        type="submit"
                        disabled={isPushing}
                        className="rounded-xl bg-blue-600 px-4 py-2 text-xs font-semibold text-white hover:bg-blue-500 disabled:opacity-50"
                      >
                        {isPushing ? "পুশ হচ্ছে..." : "Push Now"}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      const rootEl = document.getElementById("root");
      if (rootEl) {
        ReactDOM.createRoot(rootEl).render(
          <ErrorBoundary>
            <App />
          </ErrorBoundary>
        );
      }
    </script>
  </body>
</html>
