      // =========================================================================
      const LOCKED_PACKAGE_PREFIX = "com.droid.";

      function getUserScopedKeyStorageName(uid) {
        return uid ? `droid_studio_gemini_key_${uid}` : "droid_studio_gemini_key_guest";
      }

      function getUserScopedProjectsStorageName(uid) {
        return uid ? `droid_studio_projects_${uid}` : "droid_studio_projects_guest";
      }

      function getUserScopedHistoryStorageName(uid) {
        return uid ? `droid_studio_history_${uid}` : "droid_studio_history_guest";
      }

      function sanitizeEmailKey(email) {
        return String(email || "")
          .trim()
          .toLowerCase()
          .replace(/[.#$\[\]]/g, "_");
      }

      function sanitizeAppPackageSuffix(rawText) {
        const cleaned = String(rawText || "")
          .toLowerCase()
          .replace(/^com\.droid\./i, "")
          .replace(/[^a-z0-9]/g, "")
          .slice(0, 24);
        return cleaned || "myapp";
      }

      function buildLockedPackageName(suffixOrAppName) {
        const suffix = sanitizeAppPackageSuffix(suffixOrAppName);
        return `${LOCKED_PACKAGE_PREFIX}${suffix}`;
      }

      // =========================================================================
      // 2. GEMINI REST API (v1beta) MODEL DISCOVERY, FILTERING & CASCADING
      // =========================================================================
      const PREFERRED_MODEL_ORDER = [
        "gemini-3.8-flash",
        "gemini-3-flash-preview",
        "gemini-2.5-flash",
        "gemini-2.5-flash-lite",
        "gemini-2.5-pro",
        "gemini-flash-latest",
        "gemini-pro-latest"
      ];

      const EXCLUDED_MODEL_KEYWORDS = [
        "tts",
        "audio",
        "image",
        "imagen",
        "veo",
        "embedding",
        "aqa",
        "bisheng",
        "robotics",
        "computer-use",
        "customtools"
      ];

      function isEligibleTextCodeModel(modelObj) {
        const rawName = String(modelObj?.name || "").toLowerCase();
        const shortId = rawName.replace(/^models\//, "");
        if (!shortId.includes("gemini")) return false;

        const methods = Array.isArray(modelObj?.supportedGenerationMethods)
          ? modelObj.supportedGenerationMethods
          : [];
        if (methods.length > 0 && !methods.includes("generateContent")) {
          return false;
        }

        for (const badWord of EXCLUDED_MODEL_KEYWORDS) {
          if (shortId.includes(badWord)) {
            return false;
          }
        }
        return true;
      }

      function sortModelsByPriority(modelsList) {
        return [...modelsList].sort((a, b) => {
          const idxA = PREFERRED_MODEL_ORDER.indexOf(a.id);
          const idxB = PREFERRED_MODEL_ORDER.indexOf(b.id);
          if (idxA !== -1 && idxB !== -1) return idxA - idxB;
          if (idxA !== -1) return -1;
          if (idxB !== -1) return 1;
          return a.id.localeCompare(b.id);
        });
      }

      async function discoverEligibleGeminiModels(apiKey, externalSignal) {
        const cleanKey = String(apiKey || "").trim();
        if (!cleanKey) {
          throw new Error("অনুগ্রহ করে প্রথমে আপনার নিজস্ব Gemini API Key বসান।");
        }

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 18000);
        if (externalSignal) {
          externalSignal.addEventListener("abort", () => controller.abort(), { once: true });
        }

        try {
          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(
              cleanKey
            )}`,
            {
              method: "GET",
              signal: controller.signal
            }
          );

          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            const errMsg =
              data?.error?.message || `API যাচাই ব্যর্থ হয়েছে (HTTP ${res.status})। সঠিক কী দিন।`;
            throw new Error(errMsg);
          }

          const rawModels = Array.isArray(data?.models) ? data.models : [];
          const filtered = rawModels
            .filter(isEligibleTextCodeModel)
            .map((m) => {
              const id = String(m.name || "").replace(/^models\//, "");
              return {
                id,
                displayName: m.displayName || id,
                description: m.description || ""
              };
            });

          const sorted = sortModelsByPriority(filtered);
          if (sorted.length === 0) {
            return PREFERRED_MODEL_ORDER.map((id) => ({
              id,
              displayName: id,
              description: "Default fallback text/code model"
            }));
          }
          return sorted;
        } finally {
          clearTimeout(timeoutId);
        }
      }

      // =========================================================================

      function extractFileUpdatesFromAiResponse(rawResponseText, existingFiles = []) {
        const text = String(rawResponseText || "");
        const extractedMap = new Map();

        // Format A: Explicit <<<FILE:path>>> ... <<<END_FILE>>>
        const explicitRegex = /<<<FILE:\s*([^\r\n>]+?)\s*>>>\s*\n([\s\S]*?)<<<END_FILE>>>/g;
        let match;
        while ((match = explicitRegex.exec(text)) !== null) {
          const cleanPath = match[1].trim().replace(/^['"`]+|['"`]+$/g, "");
          const codeBody = match[2].replace(/\n$/, "");
          if (cleanPath && codeBody.trim()) {
            extractedMap.set(cleanPath, codeBody);
          }
        }

        // Format B: Standard Markdown fenced code blocks with file path headers or first-line comments
        if (extractedMap.size === 0) {
          const mdFenceRegex =
            /(?:(?:^|\n)(?:#{1,4}\s*|\*\*\s*|File:\s*|Path:\s*)?`?([A-Za-z0-9_./-]+\.(?:kt|java|xml|gradle|kts|json|properties))`?\s*\**\s*\n)?```[a-zA-Z0-9_-]*\n([\s\S]*?)```/g;
          let mdMatch;
          while ((mdMatch = mdFenceRegex.exec(text)) !== null) {
            let candidatePath = (mdMatch[1] || "").trim();
            const body = (mdMatch[2] || "").replace(/\n$/, "");
            if (!body.trim()) continue;

            if (!candidatePath) {
              const firstLines = body.split("\n").slice(0, 3).join("\n");
              const commentPathMatch = firstLines.match(
                /(?:\/\/|<!--|#)\s*(?:file:\s*)?([A-Za-z0-9_./-]+\.(?:kt|java|xml|gradle|kts|json|properties))/i
              );
              if (commentPathMatch) {
                candidatePath = commentPathMatch[1].trim();
              }
            }

            if (candidatePath) {
              const matchedExisting = existingFiles.find(
                (f) =>
                  f.path === candidatePath ||
                  f.path.endsWith(`/${candidatePath}`) ||
                  candidatePath.endsWith(`/${f.path}`)
              );
              const finalPath = matchedExisting ? matchedExisting.path : candidatePath;
              extractedMap.set(finalPath, body);
            }
          }
        }

        const updates = [];
        extractedMap.forEach((content, path) => {
          const existing = existingFiles.find((f) => f.path === path);
          updates.push({
            path,
            content,
            isNew: !existing,
            lineCount: content.split("\n").length
          });
        });
        return updates;
      }

        const isPureBlackScreen =

          const hint = hintMatch ? resolveXmlAttr(hintMatch[1]) : "";

          const checked = checkedMatch ? checkedMatch[1] === "true" : false;

              path: "build.gradle",
              content: `plugins {

    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}`
            }
          : {
              path: "build.gradle.kts",
              content: `plugins {
    id("com.android.application") version "8.5.2" apply false
    id("org.jetbrains.kotlin.android") version "1.9.24" apply false
}`
            };

        const gradleProperties = {
          path: "gradle.properties",
          content: `org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true`
        };

        const existingPaths = new Set((project?.files || []).map((f) => f.path));
        return [rootBuildGradle, gradleProperties].filter((item) => !existingPaths.has(item.path));

        // Persist AI Settings
        useEffect(() => {

        // =========================================================================

        // =========================================================================
        const handleGlobalInteractionCapture = useCallback(

            if (!currentUser && !isAuthModalOpen) {

              setAuthError("");

          [showSplash, authChecked, currentUser, isAuthModalOpen]
        );

        // =========================================================================
        // FIREBASE AUTH LISTENER & STRICT PER-USER DATA / BYOK KEY ISOLATION
        // =========================================================================
        useEffect(() => {
          const auth = window.DroidAuth;
          const db = window.DroidDB;

          if (!auth) {
            setAuthChecked(true);
            return;
          }

          const unsubscribe = auth.onAuthStateChanged(async (user) => {
            // Immediately clear previous user's API key & model state on user switch/logout
            setGeminiApiKey("");
            setAvailableModels([]);
            setApiStatusBanner(null);
            setRtdbSynced(false);

            if (!user) {
              setCurrentUser(null);
              const guestDefault = generateAuthenticAndroidProject({
                name: "Bangla News",
                packageSuffix: "banglanews",
                templateId: "bangla-news",
                codeLang: "kotlin",
                minSdk: 24,
                targetSdk: 35,
                buildConfigDsl: "kts",

                useMaterial3: true,

              setProjects([guestDefault]);
              setActiveProjectId(guestDefault.id);
              setSelectedFilePath(guestDefault.files[0].path);
              setProjectHistoryMap({});
              setAuthChecked(true);
              return;
            }

            setCurrentUser(user);
            setIsAuthModalOpen(false);
            const uid = user.uid;

            // 1. Load user's isolated BYOK Gemini API key
            let loadedKey = localStorage.getItem(getUserScopedKeyStorageName(uid)) || "";
            if (db) {
              try {
                const keySnap = await db.ref(`users/${uid}/private/geminiApiKey`).once("value");
                const cloudKey = keySnap.val();
                if (typeof cloudKey === "string" && cloudKey.trim()) {
                  loadedKey = cloudKey.trim();
                  localStorage.setItem(getUserScopedKeyStorageName(uid), loadedKey);
                }
              } catch (err) {
                console.warn("Could not read private key node:", err);
              }
            }

            setGeminiApiKey(loadedKey);
            if (loadedKey) {
              discoverEligibleGeminiModels(loadedKey)
                .then((models) => {
                  setAvailableModels(models);
                  const preferred =
                    models.find((m) => m.id === aiSettings.preferredModel)?.id || models[0]?.id;
                  if (preferred) setActiveModelId(preferred);
                })
                .catch(() => {});
            }

            // 2. Load user's isolated projects & history
            let userProjects = [];
            try {
              const localRaw = localStorage.getItem(getUserScopedProjectsStorageName(uid));
              if (localRaw) {
                const parsed = JSON.parse(localRaw);
                if (Array.isArray(parsed)) userProjects = parsed;
              }
            } catch {}

            try {
              const histRaw = localStorage.getItem(getUserScopedHistoryStorageName(uid));
              if (histRaw) {
                setProjectHistoryMap(JSON.parse(histRaw) || {});
              } else {
                setProjectHistoryMap({});
              }
            } catch {
              setProjectHistoryMap({});
            }

            if (db) {
              try {
                const projSnap = await db.ref(`users/${uid}/projects`).once("value");
                const cloudObj = projSnap.val();
                if (cloudObj && typeof cloudObj === "object") {
                  const cloudList = Object.values(cloudObj).filter(
                    (p) => p && Array.isArray(p.files) && p.files.length > 0
                  );
                  if (cloudList.length > 0) {
                    cloudList.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
                    userProjects = cloudList;
                    localStorage.setItem(
                      getUserScopedProjectsStorageName(uid),
                      JSON.stringify(userProjects)
                    );
                  }
                }
                setRtdbSynced(true);
              } catch (err) {
                console.warn("RTDB projects fetch warning:", err);

            }

            if (userProjects.length === 0) {

            setActiveProjectId(userProjects[0].id);

          setEmuInputValues({});
          setEmuToggleValues({});
          setEmuDynamicOutputs({});
          setPreviewSearchQuery("");
          setPreviewNavIndex(0);

        };

        const handleEmulatorButtonClick = (btnWidget) => {
          const btnId = btnWidget.id || "button";
          const btnLabel = btnWidget.text || btnId;
          const lowerId = btnId.toLowerCase();
          const lowerLabel = btnLabel.toLowerCase();
          const codeStr = livePreviewData.combinedCode || "";

          // 1. Navigate to another screen if multiple layout XMLs exist
          if (livePreviewData.layoutFiles.length > 1) {
            const otherLayout = livePreviewData.layoutFiles.find(
              (lf) => lf.path !== livePreviewData.activeLayoutPath
            );
            if (
              otherLayout &&
              (lowerId.includes("next") ||
                lowerId.includes("open") ||
                lowerId.includes("login") ||
                lowerId.includes("detail") ||
                lowerLabel.includes("পরবর্তী") ||
                lowerLabel.includes("লগইন") ||
                lowerLabel.includes("সাইন"))
            ) {
              setPreviewLayoutPath(otherLayout.path);
              const navMsg = `✅ Button [${btnId}] → স্ক্রিন পরিবর্তন: ${otherLayout.path
                .split("/")
                .pop()}`;
              appendEmuLog(navMsg);
              showPreviewToast(navMsg);
              return;
            }
          }

          // 2. Interactive Input Processing & Calculations
          const inputWidgets = livePreviewData.widgets.filter((w) => w.kind === "input");
          const numericValues = inputWidgets
            .map((iw) => parseFloat(emuInputValues[iw.id]))
            .filter((n) => !Number.isNaN(n));

          if (
            inputWidgets.length > 0 &&
            (lowerId.includes("calc") ||
              lowerId.includes("submit") ||
              lowerId.includes("btn") ||
              lowerLabel.includes("হিসাব") ||
              lowerLabel.includes("গণনা") ||
              lowerLabel.includes("যোগ") ||
              lowerLabel.includes("সাবমিট"))
          ) {
            const outputTextWidgets = livePreviewData.widgets.filter(
              (w) =>
                w.kind === "text" &&
                (w.id.toLowerCase().includes("result") ||
                  w.id.toLowerCase().includes("total") ||
                  w.id.toLowerCase().includes("output") ||
                  w.text.includes(":") ||
                  w.text.includes("০"))
            );

            if (numericValues.length >= 2) {
              const sum = numericValues.reduce((a, b) => a + b, 0);
              const product = numericValues.reduce((a, b) => a * b, 1);
              const isSip =
                codeStr.toLowerCase().includes("sip") ||
                livePreviewData.appTitle.toLowerCase().includes("sip");

              if (isSip) {
                const monthly = numericValues[0] || 0;
                const rate = numericValues[1] || 12;
                const years = numericValues[2] || 5;
                const months = years * 12;
                const r = rate / 12 / 100;
                const invested = monthly * months;

        const handleSendMessage = async (overridePromptText) => {
          const promptText = String(
            overridePromptText !== undefined ? overridePromptText : chatInput
          ).trim();
          if (!promptText || isGenerating) return;

          const cleanKey = geminiApiKey.trim();
          if (!cleanKey) {
            setApiStatusBanner({
              type: "error",
              text: "⚠️ চ্যাট বা কোড তৈরির আগে উপরে আপনার নিজস্ব Gemini API Key বসিয়ে 'API টেস্ট' করুন।"
            });
            return;

          const userMsg = {
            id: `usr_${Date.now()}`,
            role: "user",
            text: promptText,
            timestamp: Date.now()
          };
          setChatMessages((prev) => [...prev, userMsg]);
          if (overridePromptText === undefined) setChatInput("");
          setIsGenerating(true);

          const masterController = new AbortController();
          abortControllerRef.current = masterController;

          try {
            let candidateModels = availableModels.map((m) => m.id);
            if (candidateModels.length === 0) {
              const discovered = await discoverEligibleGeminiModels(
                cleanKey,
                masterController.signal
              );
              setAvailableModels(discovered);
              candidateModels = discovered.map((m) => m.id);
            }

            const prioritizedQueue = Array.from(
              new Set([activeModelId, ...candidateModels].filter(Boolean))
            );

            const mode = aiSettings.chatMode || "auto";
            const isFastChatOnly =
              mode === "fast-chat" ||
              (mode === "auto" &&
                promptText.length < 70 &&
                !/কোড|ফাইল|ফিক্স|বাগ|তৈরি|বাটন|স্ক্রিন|লগইন|add|fix|code|create|activity|xml|kotlin|java/i.test(
                  promptText
                ));

            let systemInstructionText = aiSettings.systemPersona;
            let composedUserPrompt = promptText;

            if (!isFastChatOnly && activeProject) {
              const projectSummaryFiles = activeProject.files
                .filter((f) => !f.assetDataUrl)
                .slice(0, 8)
                .map((f) => `--- FILE: ${f.path} ---\n${f.content}`)
                .join("\n\n");

              systemInstructionText += `\n\nবর্তমান Android প্রজেক্টের তথ্য:
- App Name: ${activeProject.name}
- Package Name: ${activeProject.packageName}
- Language: ${activeProject.language}
- Min SDK: API ${activeProject.minSdk}, Target SDK: API ${activeProject.targetSdk}
- Template: ${activeProject.templateId}

যখনই তুমি কোনো ফাইল তৈরি বা আপডেট করবে, অবশ্যই নিচের ফরম্যাটে সম্পূর্ণ ফাইল দেবে যাতে ইউজার Accept বাটনে ক্লিক করলেই সরাসরি ফাইল আপডেট হয়:
<<<FILE:app/src/main/path/FileName.ext>>>
সম্পূর্ণ কোড
<<<END_FILE>>>`;

              composedUserPrompt = `বর্তমান প্রজেক্টের ফাইলসমূহ:\n${projectSummaryFiles}\n\nইউজারের নির্দেশনা:\n${promptText}`;
            }

            const recentHistory = chatMessages
              .slice(-6)
              .filter((m) => m.role === "user" || m.role === "assistant")
              .map((m) => ({
                role: m.role === "assistant" ? "model" : "user",
                parts: [{ text: String(m.text || "").slice(0, 2000) }]
              }));

            const contentsPayload = [
              ...recentHistory,
              { role: "user", parts: [{ text: composedUserPrompt }] }
            ];

            let finalResponseText = "";
            let succeededModel = "";
            let lastErrMessage = "";

            for (const modelId of prioritizedQueue) {
              if (masterController.signal.aborted) {
                throw new DOMException("Aborted", "AbortError");
              }

              const perAttemptController = new AbortController();
              const timeoutHandle = setTimeout(() => perAttemptController.abort(), 25000);
              const onMasterAbort = () => perAttemptController.abort();
              masterController.signal.addEventListener("abort", onMasterAbort, { once: true });

              try {
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(
                  modelId
                )}:generateContent?key=${encodeURIComponent(cleanKey)}`;

                const resp = await fetch(endpoint, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  signal: perAttemptController.signal,
                  body: JSON.stringify({
                    systemInstruction: {
                      parts: [{ text: systemInstructionText }]
                    },
                    contents: contentsPayload,
                    generationConfig: {
                      temperature: Number(aiSettings.temperature) || 0.35,
                      maxOutputTokens: isFastChatOnly
                        ? 1024
                        : Number(aiSettings.maxOutputTokens) || 4096
                    }
                  })
                });

                const json = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                  const status = resp.status;
                  const apiErr = json?.error?.message || `HTTP ${status}`;
                  lastErrMessage = `${modelId}: ${apiErr}`;
                  if (status === 400 && apiErr.toLowerCase().includes("api key")) {
                    throw new Error("আপনার Gemini API Key-টি সঠিক নয়। নতুন কী বসিয়ে যাচাই করুন।");
                  }
                  continue;
                }

                const textCandidate =
                  json?.candidates?.[0]?.content?.parts
                    ?.map((p) => p.text || "")
                    .join("")
                    .trim() || "";

                if (!textCandidate) {
                  lastErrMessage = `${modelId}: খালি উত্তর এসেছে`;
                  continue;
                }

                finalResponseText = textCandidate;
                succeededModel = modelId;
                setActiveModelId(modelId);
                break;
              } catch (attemptErr) {
                if (masterController.signal.aborted) {
                  throw attemptErr;
                }
                lastErrMessage = attemptErr?.message || "নেটওয়ার্ক টাইমআউট";
              } finally {
                clearTimeout(timeoutHandle);
                masterController.signal.removeEventListener("abort", onMasterAbort);
              }

          if (!rawPath) return;

          if (!rawPath.includes("/")) {
            const pkgPath = (activeProject.packageName || "com.droid.app").replace(/\./g, "/");
            if (rawPath.endsWith(".kt") || rawPath.endsWith(".java")) {
              rawPath = `app/src/main/java/${pkgPath}/${rawPath}`;
            } else if (rawPath.endsWith(".xml")) {
              rawPath = `app/src/main/res/layout/${rawPath}`;
            } else {
              rawPath = `app/src/main/${rawPath}`;
            }
          }

          if (activeProject.files.some((f) => f.path === rawPath)) {
            setSelectedFilePath(rawPath);
            setIsNewFileModalOpen(false);
            setNewFilePathInput("");
            return;
          }

          const starterContent = rawPath.endsWith(".xml")
            ? `<?xml version="1.0" encoding="utf-8"?>\n<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"\n    android:layout_width="match_parent"\n    android:layout_height="match_parent"\n    android:orientation="vertical"\n    android:padding="16dp">\n\n</LinearLayout>`
            : rawPath.endsWith(".kt")
            ? `package ${activeProject.packageName}\n\n// ${rawPath.split("/").pop()}\n`
            : "";

          const updatedProject = {
            ...activeProject,
            updatedAt: Date.now(),
            files: [...activeProject.files, { path: rawPath, content: starterContent }]
          };
          const updatedList = projects.map((p) =>
            p.id === updatedProject.id ? updatedProject : p
          );
          persistProjectList(updatedList, updatedProject);
          setSelectedFilePath(rawPath);
          setIsNewFileModalOpen(false);
          setNewFilePathInput("");
        };

        // =========================================================================
        // SHARED GITHUB FILE UPSERT HELPER
        // =========================================================================
        const upsertFileToGitHubRepo = async ({
          token,
          owner,
          repo,
          branch,
          path,
          base64Content,
          message
        }) => {
          const apiUrl = `https://api.github.com/repos/${encodeURIComponent(
            owner
          )}/${encodeURIComponent(repo)}/contents/${path
            .split("/")
            .map(encodeURIComponent)
            .join("/")}`;

          let existingSha = undefined;
          const checkRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch)}`, {
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json"
            }
          });
          if (checkRes.ok) {
            const existingJson = await checkRes.json();
            existingSha = existingJson.sha;
          }

          const putRes = await fetch(apiUrl, {
            method: "PUT",
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: "application/vnd.github+json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message,
              content: base64Content,
              branch,
              ...(existingSha ? { sha: existingSha } : {})
            })
          });

          if (!putRes.ok) {
            const errJson = await putRes.json().catch(() => ({}));
            throw new Error(errJson?.message || `${path} আপলোড ব্যর্থ (${putRes.status})`);
          }
        };

        // =========================================================================
        // GITHUB PUSH HANDLER (EXISTING FEATURE PRESERVED 100%)
        // =========================================================================
        const handlePushToGitHub = async (e) => {
          e.preventDefault();
          if (!activeProject) return;
          const token = ghToken.trim();
          const owner = ghOwner.trim();
          const repo = ghRepo.trim();
          const branch = ghBranch.trim() || "main";

          if (!token || !owner || !repo) {
            setGhPushStatus({ ok: false, msg: "GitHub Token, Owner ও Repository নাম দিন।" });
            return;
          }

          localStorage.setItem("droid_gh_token", token);
          localStorage.setItem("droid_gh_owner", owner);
          localStorage.setItem("droid_gh_repo", repo);

          setIsPushingGh(true);
          setGhPushStatus(null);

          try {
            let pushedCount = 0;
            for (const file of activeProject.files) {
              const base64Content = file.assetDataUrl
                ? file.assetDataUrl.split(",")[1] || ""
                : btoa(unescape(encodeURIComponent(file.content || "")));

              await upsertFileToGitHubRepo({
                token,
                owner,
                repo,
                branch,
                path: file.path,
                base64Content,
                message: ghCommitMsg || `Update ${file.path}`
              });
              pushedCount++;
            }

            setGhPushStatus({
              ok: true,
              msg: `✅ সফলভাবে ${pushedCount}টি ফাইল ${owner}/${repo} (${branch})-এ পুশ হয়েছে!`
            });
          } catch (err) {
            setGhPushStatus({
              ok: false,
              msg: `❌ GitHub ত্রুটি: ${err?.message || "পুশ সম্পন্ন হয়নি।"}`
            });
          } finally {
            setIsPushingGh(false);
          }
        };

        // =========================================================================
        // 1-CLICK ANDROID STUDIO PROJECT ZIP EXPORT HANDLER
        // =========================================================================
        const handleExportProjectZip = async () => {
          if (!activeProject) return;
          if (typeof window.JSZip === "undefined") {
            setZipExportStatus({
              ok: false,
              msg: "❌ JSZip লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করে পেজ রিফ্রেশ করুন।"
            });
            return;
          }

          setIsZipExporting(true);
          setZipExportStatus(null);

          try {
            const zip = new window.JSZip();
            const slug = sanitizeAppPackageSuffix(activeProject.name);
            const root = zip.folder(slug);

            const exportFiles = [
              ...activeProject.files,
              ...buildSupplementaryAndroidFiles(activeProject)
            ];

            for (const f of exportFiles) {
              if (f.assetDataUrl && f.assetDataUrl.includes(",")) {
                root.file(f.path, f.assetDataUrl.split(",")[1], { base64: true });
              } else {
                root.file(f.path, f.content || "");
              }
            }

            const blob = await zip.generateAsync({ type: "blob" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${slug}-android-studio.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 4000);

            setZipExportStatus({
              ok: true,
              msg: `✅ ${slug}-android-studio.zip ডাউনলোড সম্পন্ন (${exportFiles.length}টি ফাইল)!`
            });
          } catch (err) {
            setZipExportStatus({
              ok: false,
              msg: `❌ ZIP এক্সপোর্ট ব্যর্থ: ${err?.message || "ত্রুটি হয়েছে"}`
            });
          } finally {
            setIsZipExporting(false);
          }
        };

        // =========================================================================
        // CLOUD BUILD APK & AAB ENGINE (.github/workflows/droid-ai-build.yml)
        // =========================================================================
        const fetchArtifactsForRun = async (token, owner, repo, runId) => {
          try {
            const res = await fetch(
              `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(
                repo
              )}/actions/runs/${runId}/artifacts`,
              {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/vnd.github+json"
                }
              }
            );
            if (!res.ok) return;
            const json = await res.json();
            const items = Array.isArray(json?.artifacts)
              ? json.artifacts.filter((a) => !a.expired)
              : [];
            setCloudBuildArtifacts(items);
          } catch {}
        };

        const pollCloudBuildStatus = (token, owner, repo) => {
          if (cloudPollRef.current) clearInterval(cloudPollRef.current);

          const checkRun = async () => {
            try {
              const res = await fetch(
                `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(
                  repo
                )}/actions/runs?branch=main&per_page=3`,
                {
                  headers: {
                    Authorization: `Bearer ${token}`,
                    Accept: "application/vnd.github+json"
                  }
                }
              );
              if (!res.ok) return;
              const json = await res.json();
              const latest = json?.workflow_runs?.[0];
              if (!latest) return;

              setCloudBuildRun(latest);

              if (latest.status === "completed") {
                if (cloudPollRef.current) {
                  clearInterval(cloudPollRef.current);
                  cloudPollRef.current = null;
                }
                setIsCloudBuilding(false);

                if (latest.conclusion === "success") {
                  setCloudBuildStep("✅ APK ও AAB বিল্ড সফল! নিচ থেকে সরাসরি ডাউনলোড করুন:");
                  await fetchArtifactsForRun(token, owner, repo, latest.id);
                } else {
                  setCloudBuildStep("");
                  setCloudBuildError(
                    `❌ Gradle বিল্ড ব্যর্থ হয়েছে (${latest.conclusion || "failure"})। নিচের AI ফিক্স বাটনে ক্লিক করে কোড ঠিক করুন।`
                  );
                }
              } else {
                setCloudBuildStep(
                  `⏳ ক্লাউড সার্ভারে APK ও AAB কম্পাইল হচ্ছে... (${latest.status})`
                );
              }
            } catch {}
          };

          checkRun();
          cloudPollRef.current = setInterval(checkRun, 6000);
        };

        const handleStartCloudApkAabBuild = async (e) => {
          e.preventDefault();
          if (!activeProject) return;

          const token = ghToken.trim();
          const owner = ghOwner.trim();
          const targetRepo = buildAppRepo.trim();

          if (!token || !owner || !targetRepo) {
            setCloudBuildError("GitHub Token (repo + workflow পারমিশন), Owner ও App Repo নাম দিন।");
            return;
          }

          if (targetRepo.toLowerCase() === "droid-ai.studio") {
            setCloudBuildError(
              "⚠️ সতর্কতা: মূল Droid-AI.Studio রিপোজিটরিতে অ্যাপ বিল্ড করবেন না—প্রতিটি অ্যাপের জন্য আলাদা রিপোজিটরি নাম দিন।"
            );
            return;
          }

          localStorage.setItem("droid_gh_token", token);
          localStorage.setItem("droid_gh_owner", owner);

          setIsCloudBuilding(true);
          setCloudBuildError("");
          setCloudBuildArtifacts([]);
          setCloudBuildRun(null);
          setCloudBuildStep("১/৩: অ্যাপের আলাদা বিল্ড রিপোজিটরি প্রস্তুত হচ্ছে...");

          try {
            const checkRepo = await fetch(
              `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(
                targetRepo
              )}`,
              {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/vnd.github+json"
                }
              }
            );

            if (checkRepo.status === 404) {
              setCloudBuildStep(`নতুন বিল্ড রিপোজিটরি "${targetRepo}" তৈরি হচ্ছে...`);
              const createRes = await fetch("https://api.github.com/user/repos", {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/vnd.github+json",
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  name: targetRepo,
                  description: `${activeProject.name} — Built via Droid AI Studio`,
                  private: false,
                  auto_init: true
                })
              });
              if (!createRes.ok) {
                const errD = await createRes.json().catch(() => ({}));
                throw new Error(
                  errD?.message ||
                    `রিপোজিটরি "${targetRepo}" তৈরি করা যায়নি। GitHub Token-এ repo ও workflow স্কোপ দিন।`
                );
              }
              await new Promise((r) => setTimeout(r, 2000));
            }

            setCloudBuildStep("২/৩: সোর্স কোড, লোগো ও Gradle Workflow আপলোড হচ্ছে...");

            const filesToBuild = [
              ...activeProject.files,
              ...buildSupplementaryAndroidFiles(activeProject),
              {
                path: ".github/workflows/droid-ai-build.yml",
                content: generateDroidAiBuildWorkflowYaml(activeProject)
              }
            ];

            for (const f of filesToBuild) {
              const b64 = f.assetDataUrl
                ? f.assetDataUrl.split(",")[1] || ""
                : btoa(unescape(encodeURIComponent(f.content || "")));

              await upsertFileToGitHubRepo({
                token,
                owner,
                repo: targetRepo,
                branch: "main",
                path: f.path,
                base64Content: b64,
                message: `Droid AI Build: ${f.path}`
              });
            }

            setCloudBuildStep(
              "৩/৩: GitHub Actions Gradle বিল্ড শুরু হয়েছে! ২-৩ মিনিটের মধ্যে APK ও AAB ডাউনলোড বাটন আসবে..."
            );
            pollCloudBuildStatus(token, owner, targetRepo);
          } catch (err) {
            setIsCloudBuilding(false);
            setCloudBuildStep("");
            setCloudBuildError(`❌ Cloud Build ত্রুটি: ${err?.message || "বিল্ড শুরু হয়নি।"}`);
          }
        };

        const handleDownloadBuildArtifact = async (artifact) => {
          const token = ghToken.trim();
          const owner = ghOwner.trim();
          const targetRepo = buildAppRepo.trim();
          if (!token || !owner || !targetRepo || !artifact?.id) return;

          setDownloadingArtifactId(artifact.id);
          try {
            const res = await fetch(
              `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(
                targetRepo
              )}/actions/artifacts/${artifact.id}/zip`,
              {
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/vnd.github+json"
                }
              }
            );
            if (!res.ok) {
              throw new Error(`ডাউনলোড ব্যর্থ (HTTP ${res.status})`);
            }
            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${artifact.name}.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 4000);
          } catch (err) {
            setCloudBuildError(`❌ ডাউনলোড ত্রুটি: ${err?.message}`);
          } finally {
            setDownloadingArtifactId(null);
          }
        };

        const handleFixBuildErrorWithAi = () => {
          setIsGithubModalOpen(false);
          setActiveTab("chat");
          handleSendMessage(
            `আমার "${activeProject?.name}" (${activeProject?.packageName}) অ্যাপটি APK ও AAB বিল্ড করার সময় Gradle এরর এসেছে (${
              cloudBuildError || "Build failed"
            })। সব ফাইল পরীক্ষা করে বিল্ড এরর ফিক্স করে দাও।`
          );
        };

        // =========================================================================
        // RENDER 1: 6-SECOND BRANDED SPLASH SCREEN ("ড্রয়েড এআই স্টুডিও")
        // =========================================================================
        if (showSplash) {
          return (
            <div className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#060912] px-6 text-center">
              <div className="splash-logo-glow mb-6">
                <DroidBrandLogo sizeClass="h-24 w-24" roundedClass="rounded-3xl" />
              </div>
              <h1 className="bg-gradient-to-r from-emerald-300 via-teal-200 to-purple-300 bg-clip-text text-3xl font-black tracking-tight text-transparent sm:text-4xl">
                ড্রয়েড এআই স্টুডিও
              </h1>
              <p className="mt-1.5 font-mono text-xs font-semibold tracking-widest text-emerald-400/90 uppercase">
                DROID AI STUDIO • ANDROID CLOUD IDE
              </p>

              <div className="mt-8 w-full max-w-xs">
                <div className="h-2 w-full overflow-hidden rounded-full bg-slate-800/90 p-0.5">
                  <div
                    style={{ width: `${splashProgress}%` }}
                    className="h-full rounded-full bg-gradient-to-r from-emerald-400 via-teal-400 to-purple-500 transition-all duration-100"
                  />
                </div>
                <div className="mt-2.5 flex items-center justify-between text-[11px] font-medium text-slate-400">
                  <span>অ্যান্ড্রয়েড ইঞ্জিন ও সিকিউরিটি লোড হচ্ছে...</span>
                  <span className="font-mono font-bold text-emerald-400">{splashProgress}%</span>
                </div>
              </div>
            </div>
          );
        }

        // =========================================================================
        // RENDER 2: MAIN WORKSPACE (WITH GLOBAL LOGIN GATE WHEN SIGNED OUT)
        // =========================================================================
        const userDisplayHandle = currentUser?.email
          ? currentUser.email.split("@")[0]
          : "লগইন করুন";

        return (
          <div
            onClickCapture={handleGlobalInteractionCapture}
            className="flex min-h-screen flex-col bg-[#070b14] text-slate-100"
          >
            {/* TOP HEADER BAR — OFFICIAL DROID AI STUDIO BRAND LOGO LOCKED ON LEFT */}
            <header className="sticky top-0 z-30 border-b border-slate-800/90 bg-[#0b1120]/95 px-3 py-2.5 backdrop-blur-md">
              <div className="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-2">
                {/* Brand + Sync + Project Selector */}
                <div className="flex min-w-0 flex-wrap items-center gap-2">
                  <div className="flex items-center gap-2">
                    <DroidBrandLogo sizeClass="h-8 w-8" roundedClass="rounded-xl" />
                    <span className="text-sm font-extrabold tracking-tight text-white">
                      Droid AI Studio
                    </span>
                  </div>

                  <span
                    className={`rounded-full border px-2 py-0.5 text-[10px] font-bold ${
                      rtdbSynced
                        ? "border-emerald-500/40 bg-emerald-950/70 text-emerald-300"

                  >

                  </span>

                  {/* Project Selector */}
                  <select

                    className="max-w-[140px] truncate rounded-xl border border-slate-700 bg-slate-900/90 px-2.5 py-1 text-xs font-semibold text-slate-100 focus:border-purple-500 focus:outline-none"
                  >

                        {p.name}

                  <button

                  >

                  >

                  </button>

                  <button

                    className={`rounded-xl border px-2.5 py-1 text-xs font-bold transition ${

                        ? "border-emerald-500/40 bg-emerald-950/70 text-emerald-300 hover:bg-emerald-900"

              {/* MAIN 3-TAB NAVIGATION */}
              <div className="mx-auto mt-2.5 grid max-w-5xl grid-cols-3 gap-1.5 rounded-2xl border border-slate-800 bg-[#070b14] p-1">

            {/* =================================================================== */}
            {/* TAB 1: GEMINI AI STUDIO CHAT & MANUAL ACCEPT CODE WORKSPACE         */}
            {/* =================================================================== */}
            {activeTab === "chat" && (

                            type="text"
                            required
                            value={ghOwner}
                            onChange={(e) => setGhOwner(e.target.value)}
                            className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100"
                          />
                        </div>
                        <div>
                          <label className="mb-1 block text-slate-300">Repository Name</label>
                          <input
                            type="text"
                            required
                            value={ghRepo}
                            onChange={(e) => setGhRepo(e.target.value)}
                            className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="mb-1 block text-slate-300">Branch</label>
                          <input
                            type="text"
                            value={ghBranch}
                            onChange={(e) => setGhBranch(e.target.value)}
                            className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100"
                          />
                        </div>
                        <div>
                          <label className="mb-1 block text-slate-300">Commit Message</label>
                          <input
                            type="text"
                            value={ghCommitMsg}
                            onChange={(e) => setGhCommitMsg(e.target.value)}
                            className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100"
                          />
                        </div>
                      </div>

                      {ghPushStatus && (
                        <div
                          className={`rounded-xl border p-2.5 text-[11px] ${
                            ghPushStatus.ok
                              ? "border-emerald-500/40 bg-emerald-950/60 text-emerald-200"
                              : "border-rose-500/40 bg-rose-950/60 text-rose-200"
                          }`}
                        >
                          {ghPushStatus.msg}
                        </div>
                      )}

                      <div className="flex justify-end gap-2 pt-2">
                        <button
                          type="button"
                          onClick={() => setIsGithubModalOpen(false)}
                          className="rounded-xl bg-slate-800 px-3.5 py-2 text-slate-300"
                        >
                          বন্ধ করুন
                        </button>
                        <button
                          type="submit"
                          disabled={isPushingGh}
                          className="rounded-xl bg-purple-600 px-4 py-2 font-bold text-white hover:bg-purple-500 disabled:opacity-50"
                        >
                          {isPushingGh
                            ? "পুশ হচ্ছে..."
                            : `সব ফাইল (${activeProject?.files?.length || 0}) পুশ করুন`}
                        </button>
                      </div>
                    </form>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<DroidAIStudioApp />);
    </script>
  </body>
</html>
