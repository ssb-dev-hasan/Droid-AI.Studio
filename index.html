<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Droid AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo } = React;

      function buildProject(name, packageName, description, logoDataUrl, logoFileName) {
        const appName = (name || "IMO App").trim();
        const pkg = (packageName || "com.example.imoapp").trim();
        const pkgFolder = pkg.replace(/\./g, "/");

        const files = [
          {
            path: `app/src/main/java/${pkgFolder}/MainActivity.kt`,
            content: `package ${pkg}

class MainActivity {
    val title = "${appName}"
    val primaryAction = "Start Chat"
    val secondaryAction = "Voice & Video Call"
}
`
          },
          {
            path: "app/src/main/res/values/strings.xml",
            content: `<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">${appName}</string>
</resources>
`
          },
          {
            path: "app/src/main/AndroidManifest.xml",
            content: `<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.RECORD_AUDIO" />
    <uses-permission android:name="android.permission.CAMERA" />
</manifest>
`
          }
        ];

        if (logoDataUrl) {
          files.push({
            path: "app/src/main/res/drawable/logo_info.txt",
            content: `Logo: ${logoFileName || "logo.png"}\n${logoDataUrl}`
          });
        }

        return {
          name: appName,
          packageName: pkg,
          description: (description || "Messaging & Calling App").trim(),
          logoDataUrl: logoDataUrl || "",
          logoFileName: logoFileName || "",
          files
        };
      }

      function parseAppPreview(project) {
        const mainFile = project.files.find((f) => f.path.endsWith("MainActivity.kt"));
        const stringsFile = project.files.find((f) => f.path.endsWith("strings.xml"));

        let title = project.name;
        const xmlTitle = stringsFile?.content.match(/<string name="app_name">([^<]+)<\/string>/);
        if (xmlTitle && xmlTitle[1]) {
          title = xmlTitle[1].trim();
        }

        const actions = [];
        if (mainFile) {
          const matches = [...mainFile.content.matchAll(/val\s+\w+Action\s*=\s*"([^"]+)"/g)];
          for (const item of matches) {
            if (item[1] && !actions.includes(item[1])) {
              actions.push(item[1]);
            }
          }
        }

        return {
          title,
          actions: actions.length > 0 ? actions : ["Start Chat", "Voice & Video Call"]
        };
      }

      function RunAppPage({ project, onClose }) {
        const info = useMemo(() => parseAppPreview(project), [project]);
        const [tab, setTab] = useState("home");
        const [status, setStatus] = useState("");
        const [chatText, setChatText] = useState("");
        const [chats, setChats] = useState([
          { id: 1, from: "Friend", text: "হ্যালো! অ্যাপটি কেমন চলছে?" },
          { id: 2, from: "You", text: "দারুণ! নতুন প্রিভিউ পেজ কাজ করছে।" }
        ]);

        const handleActionClick = (actionName) => {
          setStatus(`${actionName} চালু হয়েছে`);
          if (actionName.toLowerCase().includes("chat")) {
            setTab("chats");
          } else if (actionName.toLowerCase().includes("call")) {
            setTab("calls");
          }
          setTimeout(() => setStatus(""), 2500);
        };

        const handleSendChat = (e) => {
          e.preventDefault();
          if (!chatText.trim()) return;
          setChats((prev) => [...prev, { id: Date.now(), from: "You", text: chatText.trim() }]);
          setChatText("");
        };

        return (
          <div className="fixed inset-0 z-50 flex flex-col bg-slate-950 text-slate-100">
            <div className="flex items-center justify-between border-b border-slate-800 bg-slate-900 px-4 py-3">
              <div className="font-bold text-sm">Run App Preview — {info.title}</div>
              <button
                type="button"
                onClick={onClose}
                className="rounded-lg bg-slate-800 px-3 py-1.5 text-xs font-semibold hover:bg-slate-700"
              >
                ← ফিরে যান
              </button>
            </div>

            <div className="flex flex-1 items-center justify-center overflow-y-auto p-4">
              <div className="w-full max-w-[360px] overflow-hidden rounded-3xl border-4 border-slate-800 bg-slate-900 shadow-2xl">
                <div className="flex items-center gap-3 bg-emerald-600 px-4 py-3 text-white">
                  {project.logoDataUrl ? (
                    <img
                      src={project.logoDataUrl}
                      alt="Logo"
                      className="h-10 w-10 rounded-full bg-white object-cover"
                    />
                  ) : (
                    <div className="flex h-10 w-10 items-center justify-center rounded-full bg-white/20 font-bold text-sm">
                      {info.title.slice(0, 2).toUpperCase()}
                    </div>
                  )}
                  <div className="min-w-0 flex-1">
                    <div className="truncate font-bold text-sm">{info.title}</div>
                    <div className="truncate text-xs text-emerald-100">{project.packageName}</div>
                  </div>
                </div>

                {status && (
                  <div className="bg-amber-500/20 px-3 py-1.5 text-center text-xs text-amber-300">
                    {status}
                  </div>
                )}

                <div className="min-h-[340px] bg-slate-950 p-4">
                  {tab === "home" && (
                    <div className="space-y-3">
                      <div className="rounded-xl border border-slate-800 bg-slate-900 p-3 text-xs text-slate-300">
                        {project.description}
                      </div>
                      <div className="space-y-2">
                        {info.actions.map((act) => (
                          <button
                            key={act}
                            type="button"
                            onClick={() => handleActionClick(act)}
                            className="w-full rounded-xl bg-emerald-600 px-4 py-2.5 text-xs font-semibold text-white hover:bg-emerald-500"
                          >
                            {act}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {tab === "chats" && (
                    <div className="flex h-[300px] flex-col">
                      <div className="mb-2 flex-1 space-y-2 overflow-y-auto rounded-xl border border-slate-800 bg-slate-900 p-2.5">
                        {chats.map((c) => (
                          <div
                            key={c.id}
                            className={`rounded-lg px-3 py-1.5 text-xs ${
                              c.from === "You"
                                ? "ml-8 bg-emerald-600 text-white"
                                : "mr-8 bg-slate-800 text-slate-200"
                            }`}
                          >
                            <div className="text-[10px] opacity-75">{c.from}</div>
                            <div>{c.text}</div>
                          </div>
                        ))}
                      </div>
                      <form onSubmit={handleSendChat} className="flex gap-2">
                        <input
                          value={chatText}
                          onChange={(e) => setChatText(e.target.value)}
                          placeholder="মেসেজ লিখুন..."
                          className="flex-1 rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                        />
                        <button
                          type="submit"
                          className="rounded-lg bg-emerald-600 px-3 py-1.5 text-xs font-semibold text-white"
                        >
                          Send
                        </button>
                      </form>
                    </div>
                  )}

                  {tab === "calls" && (
                    <div className="flex h-[300px] flex-col items-center justify-center gap-3 text-center">
                      <div className="text-3xl">📞</div>
                      <div className="text-sm font-bold">Audio & Video Call</div>
                      <div className="flex gap-2">
                        <button
                          type="button"
                          onClick={() => handleActionClick("Voice Call")}
                          className="rounded-lg bg-emerald-600 px-4 py-2 text-xs font-semibold text-white"
                        >
                          Voice Call
                        </button>
                        <button
                          type="button"
                          onClick={() => handleActionClick("Video Call")}
                          className="rounded-lg bg-blue-600 px-4 py-2 text-xs font-semibold text-white"
                        >
                          Video Call
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                <div className="grid grid-cols-3 border-t border-slate-800 bg-slate-900 py-2 text-center text-xs">
                  <button
                    type="button"
                    onClick={() => setTab("home")}
                    className={`py-1 font-semibold ${tab === "home" ? "text-emerald-400" : "text-slate-400"}`}
                  >
                    Home
                  </button>
                  <button
                    type="button"
                    onClick={() => setTab("chats")}
                    className={`py-1 font-semibold ${tab === "chats" ? "text-emerald-400" : "text-slate-400"}`}
                  >
                    Chats
                  </button>
                  <button
                    type="button"
                    onClick={() => setTab("calls")}
                    className={`py-1 font-semibold ${tab === "calls" ? "text-emerald-400" : "text-slate-400"}`}
                  >
                    Calls
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      function App() {
        const [project, setProject] = useState(() =>
          buildProject("IMO App", "com.example.imoapp", "Messaging & Calling App", "", "")
        );
        const [selectedPath, setSelectedPath] = useState(project.files[0]?.path || "");
        const [isRunOpen, setIsRunOpen] = useState(false);
        const [isSetupOpen, setIsSetupOpen] = useState(false);
        const [isPushOpen, setIsPushOpen] = useState(false);

        const [nameInput, setNameInput] = useState(project.name);
        const [pkgInput, setPkgInput] = useState(project.packageName);
        const [descInput, setDescInput] = useState(project.description);
        const [logoUrl, setLogoUrl] = useState("");
        const [logoName, setLogoName] = useState("");

        const [aiPrompt, setAiPrompt] = useState("");
        const [aiNote, setAiNote] = useState("কমান্ড লিখলে নির্বাচিত ফাইলে কোড যুক্ত হবে।");

        const [ghOwner, setGhOwner] = useState("ssb-dev-hasan");
        const [ghRepo, setGhRepo] = useState("Droid-AI-Studio");
        const [ghBranch, setGhBranch] = useState("main");
        const [ghToken, setGhToken] = useState("");
        const [ghMsg, setGhMsg] = useState("");
        const [isPushing, setIsPushing] = useState(false);

        const activeFile = useMemo(
          () => project.files.find((f) => f.path === selectedPath) || project.files[0],
          [project.files, selectedPath]
        );

        const onLogoPick = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          setLogoName(file.name);
          const reader = new FileReader();
          reader.onload = () => {
            if (typeof reader.result === "string") {
              setLogoUrl(reader.result);
            }
          };
          reader.readAsDataURL(file);
        };

        const onCreateProject = (e) => {
          e.preventDefault();
          const next = buildProject(nameInput, pkgInput, descInput, logoUrl, logoName);
          setProject(next);
          setSelectedPath(next.files[0]?.path || "");
          setIsSetupOpen(false);
        };

        const onFileContentChange = (val) => {
          if (!activeFile) return;
          setProject((prev) => ({
            ...prev,
            files: prev.files.map((f) => (f.path === activeFile.path ? { ...f, content: val } : f))
          }));
        };

        const onRunAiCommand = (e) => {
          e.preventDefault();
          if (!aiPrompt.trim() || !activeFile) return;
          const clean = aiPrompt.trim();
          const line = activeFile.path.endsWith(".xml")
            ? `<!-- ${clean} -->`
            : `// Feature: ${clean}`;

          setProject((prev) => ({
            ...prev,
            files: prev.files.map((f) =>
              f.path === activeFile.path ? { ...f, content: `${f.content}\n${line}\n` } : f
            )
          }));
          setAiNote(`"${clean}" যুক্ত করা হয়েছে। এখন ▶ Run App চাপুন।`);
          setAiPrompt("");
        };

        const toBase64 = (str) => {
          const bytes = new TextEncoder().encode(str);
          let bin = "";
          for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
          return btoa(bin);
        };

        const onPushGitHub = async (e) => {
          e.preventDefault();
          if (!ghToken.trim()) {
            setGhMsg("GitHub Token দিন।");
            return;
          }
          setIsPushing(true);
          setGhMsg("পুশ হচ্ছে...");
          try {
            for (const file of project.files) {
              const targetPath = `apps/${project.name.toLowerCase().replace(/\s+/g, "-")}/${file.path}`;
              const readUrl = `https://api.github.com/repos/${encodeURIComponent(ghOwner)}/${encodeURIComponent(ghRepo)}/contents/${targetPath}?ref=${encodeURIComponent(ghBranch)}`;
              const readRes = await fetch(readUrl, {
                headers: { Authorization: `Bearer ${ghToken}`, Accept: "application/vnd.github+json" }
              });
              const sha = readRes.ok ? (await readRes.json())?.sha : undefined;

              const putUrl = `https://api.github.com/repos/${encodeURIComponent(ghOwner)}/${encodeURIComponent(ghRepo)}/contents/${targetPath}`;
              const putRes = await fetch(putUrl, {
                method: "PUT",
                headers: {
                  Authorization: `Bearer ${ghToken}`,
                  Accept: "application/vnd.github+json",
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  message: `Update ${targetPath}`,
                  content: toBase64(file.content),
                  branch: ghBranch || "main",
                  ...(sha ? { sha } : {})
                })
              });
              if (!putRes.ok) {
                throw new Error(`HTTP ${putRes.status}`);
              }
            }
            setGhMsg("সফলভাবে GitHub-এ পুশ হয়েছে!");
          } catch (err) {
            setGhMsg(`পুশ ব্যর্থ: ${String(err)}`);
          } finally {
            setIsPushing(false);
          }
        };

        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
            <header className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 bg-slate-900 px-4 py-3">
              <div className="flex items-center gap-3">
                {project.logoDataUrl ? (
                  <img src={project.logoDataUrl} alt="Logo" className="h-9 w-9 rounded-lg object-cover bg-white" />
                ) : (
                  <div className="flex h-9 w-9 items-center justify-center rounded-lg bg-emerald-600 font-bold text-sm text-white">
                    AI
                  </div>
                )}
                <div>
                  <div className="font-bold text-sm">{project.name}</div>
                  <div className="text-xs text-slate-400">{project.packageName}</div>
                </div>
              </div>

              <div className="flex flex-wrap gap-2">
                <button
                  type="button"
                  onClick={() => setIsRunOpen(true)}
                  className="rounded-lg bg-amber-500 px-3.5 py-1.5 text-xs font-bold text-slate-950 hover:bg-amber-400"
                >
                  ▶ Run App
                </button>
                <button
                  type="button"
                  onClick={() => setIsSetupOpen(true)}
                  className="rounded-lg bg-emerald-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-emerald-500"
                >
                  + প্রজেক্ট / লোগো
                </button>
                <button
                  type="button"
                  onClick={() => setIsPushOpen(true)}
                  className="rounded-lg bg-blue-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-blue-500"
                >
                  GitHub Push
                </button>
              </div>
            </header>

            <div className="grid flex-1 grid-cols-1 lg:grid-cols-12">
              <aside className="border-b border-slate-800 bg-slate-900/60 p-3 lg:col-span-3 lg:border-b-0 lg:border-r">
                <div className="mb-2 text-xs font-semibold text-slate-400">ফাইলসমূহ</div>
                <div className="space-y-1">
                  {project.files.map((f) => (
                    <button
                      key={f.path}
                      type="button"
                      onClick={() => setSelectedPath(f.path)}
                      className={`block w-full truncate rounded-lg px-3 py-2 text-left font-mono text-xs ${
                        activeFile?.path === f.path
                          ? "bg-emerald-600/20 text-emerald-300 border border-emerald-500/40"
                          : "text-slate-300 hover:bg-slate-800"
                      }`}
                    >
                      {f.path}
                    </button>
                  ))}
                </div>
              </aside>

              <main className="flex flex-col gap-3 p-3 lg:col-span-9">
                <div className="rounded-lg border border-slate-800 bg-slate-900 px-3 py-2 font-mono text-xs text-emerald-400">
                  {activeFile?.path}
                </div>

                <textarea
                  value={activeFile?.content || ""}
                  onChange={(e) => onFileContentChange(e.target.value)}
                  spellCheck={false}
                  className="min-h-[300px] w-full rounded-xl border border-slate-800 bg-slate-900 p-3 font-mono text-xs text-slate-100 focus:border-emerald-500 focus:outline-none"
                />

                <form onSubmit={onRunAiCommand} className="rounded-xl border border-slate-800 bg-slate-900 p-3 space-y-2">
                  <div className="text-xs font-semibold text-purple-300">AI কমান্ড</div>
                  <div className="flex gap-2">
                    <input
                      value={aiPrompt}
                      onChange={(e) => setAiPrompt(e.target.value)}
                      placeholder="যেমন: Group Call বাটন যোগ করো..."
                      className="flex-1 rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                    />
                    <button
                      type="submit"
                      className="rounded-lg bg-purple-600 px-4 py-2 text-xs font-semibold text-white hover:bg-purple-500"
                    >
                      যুক্ত করুন
                    </button>
                  </div>
                  <div className="text-xs text-slate-400">{aiNote}</div>
                </form>
              </main>
            </div>

            {isRunOpen && (
              <RunAppPage project={project} onClose={() => setIsRunOpen(false)} />
            )}

            {isSetupOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4">
                <div className="w-full max-w-md rounded-xl border border-slate-800 bg-slate-900 p-4">
                  <div className="mb-3 flex items-center justify-between">
                    <div className="font-bold text-sm">নতুন প্রজেক্ট ও লোগো</div>
                    <button type="button" onClick={() => setIsSetupOpen(false)} className="text-slate-400">
                      ✕
                    </button>
                  </div>
                  <form onSubmit={onCreateProject} className="space-y-3">
                    <input
                      value={nameInput}
                      onChange={(e) => setNameInput(e.target.value)}
                      placeholder="অ্যাপের নাম"
                      className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                      required
                    />
                    <input
                      value={pkgInput}
                      onChange={(e) => setPkgInput(e.target.value)}
                      placeholder="Package Name"
                      className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                      required
                    />
                    <input
                      value={descInput}
                      onChange={(e) => setDescInput(e.target.value)}
                      placeholder="বিবরণ"
                      className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                    />
                    <input
                      type="file"
                      accept="image/*"
                      onChange={onLogoPick}
                      className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                    />
                    {logoUrl && (
                      <div className="flex items-center gap-2 text-xs text-emerald-400">
                        <img src={logoUrl} alt="Preview" className="h-9 w-9 rounded object-cover" />
                        <span>{logoName}</span>
                      </div>
                    )}
                    <div className="flex justify-end gap-2">
                      <button
                        type="button"
                        onClick={() => setIsSetupOpen(false)}
                        className="rounded-lg bg-slate-800 px-3 py-1.5 text-xs"
                      >
                        বাতিল
                      </button>
                      <button
                        type="submit"
                        className="rounded-lg bg-emerald-600 px-4 py-1.5 text-xs font-semibold text-white"
                      >
                        তৈরি করুন
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {isPushOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4">
                <div className="w-full max-w-md rounded-xl border border-slate-800 bg-slate-900 p-4">
                  <div className="mb-3 flex items-center justify-between">
                    <div className="font-bold text-sm">GitHub Push</div>
                    <button type="button" onClick={() => setIsPushOpen(false)} className="text-slate-400">
                      ✕
                    </button>
                  </div>
                  <form onSubmit={onPushGitHub} className="space-y-3">
                    <input
                      value={ghOwner}
                      onChange={(e) => setGhOwner(e.target.value)}
                      placeholder="GitHub Username"
                      className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                      required
                    />
                    <input
                      value={ghRepo}
                      onChange={(e) => setGhRepo(e.target.value)}
                      placeholder="Repository Name"
                      className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                      required
                    />
                    <input
                      value={ghBranch}
                      onChange={(e) => setGhBranch(e.target.value)}
                      placeholder="Branch (main)"
                      className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                      required
                    />
                    <input
                      type="password"
                      value={ghToken}
                      onChange={(e) => setGhToken(e.target.value)}
                      placeholder="GitHub Token (ghp_...)"
                      className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                      required
                    />
                    {ghMsg && <div className="text-xs text-emerald-300">{ghMsg}</div>}
                    <div className="flex justify-end gap-2">
                      <button
                        type="button"
                        onClick={() => setIsPushOpen(false)}
                        className="rounded-lg bg-slate-800 px-3 py-1.5 text-xs"
                      >
                        বন্ধ
                      </button>
                      <button
                        type="submit"
                        disabled={isPushing}
                        className="rounded-lg bg-blue-600 px-4 py-1.5 text-xs font-semibold text-white"
                      >
                        {isPushing ? "পুশ হচ্ছে..." : "Push"}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
