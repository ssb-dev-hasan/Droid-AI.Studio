      function createAndroidProject({
        id,
        name,
        packageName,
        description,
        logoDataUrl,
        logoFileName,
        existingFiles
      }) {
        const safeName = (name || "IMO Studio App").trim();
        const pkg = (packageName || "com.example.imostudio").trim();
        const pkgPath = pkg.replace(/\./g, "/");

        let files =
          Array.isArray(existingFiles) && existingFiles.length > 0
            ? existingFiles.map((f) => {
                if (f.path.endsWith("strings.xml")) {
                  return {
                    ...f,
                    content: `<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">${safeName}</string>\n</resources>\n`
                  };
                }
                if (f.path.endsWith("build.gradle.kts")) {
                  return {
                    ...f,
                    content: f.content
                      .replace(/namespace\s*=\s*"[^"]*"/, `namespace = "${pkg}"`)
                      .replace(/applicationId\s*=\s*"[^"]*"/, `applicationId = "${pkg}"`)
                  };
                }
                if (f.path.endsWith("MainActivity.kt")) {
                  const updatedPkg = f.content.replace(/^package\s+[^\s]+/m, `package ${pkg}`);
                  return {
                    path: `app/src/main/java/${pkgPath}/MainActivity.kt`,
                    language: "kotlin",
                    content: updatedPkg
                  };
                }
                return f;
              })
            : buildDefaultFiles(safeName, pkg);

        files = files.filter(
          (f) => f.path !== "app/src/main/res/drawable/app_logo_base64.txt"
        );
        if (logoDataUrl) {
          files.push({
            path: "app/src/main/res/drawable/app_logo_base64.txt",
            language: "text",
            content: `Logo File: ${logoFileName || "logo.png"}\nData URL:\n${logoDataUrl}`
          });
        }

        return {
          id: id || `proj-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          name: safeName,
          packageName: pkg,
          description: description || `${safeName} Android Project`,
          logoDataUrl: logoDataUrl || "",
          logoFileName: logoFileName || "",
          updatedAt: new Date().toLocaleString("bn-BD"),
          files
        };
      }

      function validateProjectFiles(files) {
        const issues = [];
        if (!files || files.length === 0) {
          return [{ filePath: "project", message: "প্রজেক্টে কোনো ফাইল নেই।", severity: "error" }];
        }
        for (const f of files) {
          if (!f.content || !f.content.trim()) {
            issues.push({ filePath: f.path, message: "ফাইলটি খালি রয়েছে।", severity: "warning" });
          }
          if (f.path.endsWith(".xml") && !f.content.includes("<?xml")) {
            issues.push({ filePath: f.path, message: "XML ফাইলে <?xml ...?> হেডার রাখা ভালো।", severity: "warning" });
          }
        }
        return issues;
      }

      function localFallbackEdit(prompt, project, activeFile) {
        const target = activeFile || project.files[0];
        if (!target) return [];
        const comment = target.path.endsWith(".xml")
          ? `<!-- AI Command: ${prompt} -->\n`
          : `// AI Command: ${prompt}\n`;
        return [{ ...target, content: `${comment}${target.content}` }];
      }

      async function runAICommand({ prompt, project, activeFile, apiKey }) {
        if (apiKey && apiKey.trim().length > 10) {
          try {
            const filesContext = project.files
              .map((f) => `=== ${f.path} ===\n${f.content}`)
              .join("\n\n");

            const sysPrompt = `You are Droid AI Studio's Android code generator for "${project.name}" (${project.packageName}).
Return ONLY valid JSON:
{
  "reply": "Short explanation in Bengali",
  "updatedFiles": [
    { "path": "exact/path", "language": "kotlin", "content": "full updated file content" }
  ]
}`;

            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(
                apiKey.trim()
              )}`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [
                    {
                      role: "user",
                      parts: [
                        {
                          text: `${sysPrompt}\n\nActive file: ${
                            activeFile?.path || "none"
                          }\nCommand: ${prompt}\n\nFiles:\n${filesContext}`
                        }
                      ]
                    }
                  ]
                })
              }
            );

            const data = await response.json();
            const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
            const cleaned = rawText
              .replace(/^```json\s*/i, "")
              .replace(/^```\s*/i, "")
              .replace(/```$/i, "")
              .trim();

            const parsed = JSON.parse(cleaned);
            if (Array.isArray(parsed.updatedFiles) && parsed.updatedFiles.length > 0) {
              return {
                reply: parsed.reply || "ফাইলগুলো আপডেট করা হয়েছে।",
                updatedFiles: parsed.updatedFiles
              };
            }
          } catch (err) {
            return {
              reply: `Gemini API ত্রুটি (${String(err)})। লোকাল আপডেট প্রয়োগ করা হয়েছে।`,
              updatedFiles: localFallbackEdit(prompt, project, activeFile)
            };
          }
        }

        return {
          reply:
            "API Key দেওয়া নেই, তাই বর্তমান ফাইলে কমান্ড অনুযায়ী কোড যুক্ত করা হয়েছে। পূর্ণ AI কোডিংয়ের জন্য Gemini API Key যুক্ত করুন।",
          updatedFiles: localFallbackEdit(prompt, project, activeFile)
        };
      }

      function toBase64Utf8(text) {
        const bytes = new TextEncoder().encode(text);
        let binary = "";
        for (let i = 0; i < bytes.length; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
      }

      async function getFileSha({ owner, repo, path, branch, token }) {
        const url = `[https://api.github.com/repos/$](https://api.github.com/repos/$){encodeURIComponent(
          owner
        )}/${encodeURIComponent(repo)}/contents/${path}?ref=${encodeURIComponent(branch)}`;

        const res = await fetch(url, {
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github+json"
          }
        });

        if (res.status === 404) return undefined;
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`GitHub read failed (${res.status}): ${errText}`);
        }
        const json = await res.json();
        return json?.sha;
      }

      async function pushFilesToGitHub(params, onProgress) {
        const prefix = params.pathPrefix
          ? params.pathPrefix.replace(/^\/+|\/+$/g, "") + "/"
          : "";
        let count = 0;

        for (let i = 0; i < params.files.length; i++) {
          const file = params.files[i];
          const fullPath = `${prefix}${file.path.replace(/^\/+/, "")}`;
          onProgress?.(i + 1, params.files.length, fullPath);

          const sha = await getFileSha({
            owner: params.owner,
            repo: params.repo,
            path: fullPath,
            branch: params.branch,
            token: params.token
          });

          const url = `[https://api.github.com/repos/$](https://api.github.com/repos/$){encodeURIComponent(
            params.owner
          )}/${encodeURIComponent(params.repo)}/contents/${fullPath}`;

          const res = await fetch(url, {
            method: "PUT",
            headers: {
              Authorization: `Bearer ${params.token}`,
              Accept: "application/vnd.github+json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: params.commitMessage || `Push ${fullPath} via Droid AI Studio`,
              content: toBase64Utf8(file.content),
              branch: params.branch || "main",
              ...(sha ? { sha } : {})
            })
          });

          if (!res.ok) {
            const errText = await res.text();
            throw new Error(`Push failed for ${fullPath} (${res.status}): ${errText}`);
          }
          count++;
        }

        return count;
      }

            }
          } catch (_) {}
          return [
            createAndroidProject({
              id: "proj-imo-default",
              name: "IMO Studio App",
              packageName: "com.example.imostudio",
              description: "Android Messaging & Calling App"
            })

        const [activeProjectId, setActiveProjectId] = useState(() => projects[0]?.id || "");

          () => projects.find((p) => p.id === activeProjectId) || projects[0],

          const file = e.target.files?.[0];
          if (!file) return;
          setSetupLogoName(file.name);
          const reader = new FileReader();
          reader.onload = () => {
            if (typeof reader.result === "string") {
              setSetupLogoUrl(reader.result);
            }
          };
          reader.readAsDataURL(file);
        };

        const handleSaveProjectForm = (e) => {
          e.preventDefault();
          if (editingProjectId) {
            const oldProj = projects.find((p) => p.id === editingProjectId);
            const updated = createAndroidProject({
              id: editingProjectId,
              name: setupName,
              packageName: setupPkg,
              description: setupDesc,
              logoDataUrl: setupLogoUrl || undefined,
              logoFileName: setupLogoName || undefined,
              existingFiles: oldProj?.files
            });
            setProjects((prev) => prev.map((p) => (p.id === editingProjectId ? updated : p)));
            setActiveProjectId(editingProjectId);
            setSelectedPath(updated.files[0]?.path || "");
            setGhPrefix(`generated-projects/${updated.name.toLowerCase().replace(/\s+/g, "-")}`);
            setIsSetupOpen(false);
            setMessages((prev) => [
              ...prev,
              {
                id: `m-${Date.now()}`,
                role: "assistant",
                content: `"${updated.name}" প্রজেক্টের তথ্য আপডেট করা হয়েছে।`
              }
            ]);
          } else {
            const created = createAndroidProject({
              name: setupName,
              packageName: setupPkg,
              description: setupDesc,
              logoDataUrl: setupLogoUrl || undefined,
              logoFileName: setupLogoName || undefined
            });
            setProjects((prev) => [created, ...prev]);
            setActiveProjectId(created.id);
            setSelectedPath(created.files[0]?.path || "");
            setGhPrefix(`generated-projects/${created.name.toLowerCase().replace(/\s+/g, "-")}`);
            setIsSetupOpen(false);
            setMessages((prev) => [
              ...prev,
              {
                id: `m-${Date.now()}`,
                role: "assistant",
                content: `নতুন প্রজেক্ট "${created.name}" (${created.packageName}) হিস্ট্রিতে যুক্ত হয়েছে।${
                  created.logoFileName ? ` লোগো: ${created.logoFileName}` : ""
                }`
              }
            ]);
          }
        };

        const handleSelectHistoryProject = (proj) => {
          setActiveProjectId(proj.id);
          setSelectedPath(proj.files[0]?.path || "");
          setGhPrefix(`generated-projects/${proj.name.toLowerCase().replace(/\s+/g, "-")}`);
        };

        const handleDeleteHistoryProject = (e, targetId) => {
          e.stopPropagation();
          if (projects.length <= 1) return;
          const remaining = projects.filter((p) => p.id !== targetId);
          setProjects(remaining);
          if (activeProjectId === targetId) {
            setActiveProjectId(remaining[0].id);
            setSelectedPath(remaining[0].files[0]?.path || "");
          }
        };

        const handleCodeEdit = (val) => {
          if (!activeFile) return;
          updateCurrentProject((prev) => ({
            ...prev,
            files: prev.files.map((f) =>
              f.path === activeFile.path ? { ...f, content: val } : f
            )
          }));
        };

        const handleSendAI = async (e) => {
          e.preventDefault();
          if (!promptInput.trim() || isAILoading) return;
          const text = promptInput.trim();
          setPromptInput("");
          setMessages((prev) => [...prev, { id: `u-${Date.now()}`, role: "user", content: text }]);
          setIsAILoading(true);

          try {
            const res = await runAICommand({
              prompt: text,
              project,
              activeFile,
              apiKey
            });

            updateCurrentProject((prev) => {
              const map = new Map();
              for (const f of prev.files) map.set(f.path, f);
              for (const u of res.updatedFiles) map.set(u.path, u);
              return { ...prev, files: Array.from(map.values()) };
            });

            if (res.updatedFiles[0]?.path) {
              setSelectedPath(res.updatedFiles[0].path);
            }

            setMessages((prev) => [
              ...prev,
              { id: `a-${Date.now()}`, role: "assistant", content: res.reply }
            ]);
          } finally {
            setIsAILoading(false);
          }
        };

        const handleGitHubPush = async (e) => {
          e.preventDefault();
          if (!ghToken.trim()) {
            setGhStatus("GitHub Personal Access Token দিন।");
            return;
          }
          setIsPushing(true);
          setGhStatus("পুশ শুরু হচ্ছে...");
          try {
            const count = await pushFilesToGitHub(
              {
                owner: ghOwner.trim(),
                repo: ghRepo.trim(),
                branch: ghBranch.trim() || "main",
                pathPrefix: ghPrefix.trim(),
                token: ghToken.trim(),
                commitMessage: ghMsg.trim(),
                files: project.files
              },
              (cur, tot, path) => setGhStatus(`পুশ হচ্ছে (${cur}/${tot}): ${path}`)
            );
            setGhStatus(`সফলভাবে ${count}টি ফাইল GitHub-এ পুশ হয়েছে!`);
          } catch (err) {
            setGhStatus(`পুশ ব্যর্থ: ${String(err)}`);
          } finally {
            setIsPushing(false);
          }
        };

        return (
          <div className="flex min-h-screen flex-col bg-slate-950 text-slate-100">
            <header className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 bg-slate-900 px-4 py-3">
              <div className="flex items-center gap-3">
                {project.logoDataUrl ? (
                  <img
                    src={project.logoDataUrl}
                    alt="App Logo"
                    className="h-9 w-9 rounded-lg border border-slate-700 object-cover"
                  />
                ) : (
                  <div className="flex h-9 w-9 items-center justify-center rounded-lg bg-emerald-600 font-bold text-white">
                    AI
                  </div>
                )}
                <div>
                  <h1 className="text-sm font-bold sm:text-base">{project.name}</h1>
                  <p className="text-xs text-slate-400">{project.packageName}</p>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <button
                  type="button"
                  onClick={() => setIsRunnerFolded((v) => !v)}
                  className={`rounded-lg px-3 py-1.5 text-xs font-semibold transition ${
                    !isRunnerFolded
                      ? "bg-amber-600 text-white hover:bg-amber-500"
                      : "bg-amber-500/90 text-slate-950 hover:bg-amber-400"
                  }`}
                >
                  {isRunnerFolded ? "▶ Run App (ফোল্ড)" : "▼ Run App খোলা"}
                </button>
                <button
                  type="button"
                  onClick={openNewProjectModal}
                  className="rounded-lg bg-emerald-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-emerald-500"
                >
                  + নতুন প্রজেক্ট
                </button>
                <button
                  type="button"
                  onClick={() => openEditProjectModal(project)}
                  className="rounded-lg bg-slate-800 px-3 py-1.5 text-xs font-semibold text-emerald-300 hover:bg-slate-700"
                >
                  এডিট প্রজেক্ট
                </button>
                <button
                  type="button"
                  onClick={() => setIsReviewOpen(true)}
                  className="rounded-lg bg-slate-800 px-3 py-1.5 text-xs font-semibold hover:bg-slate-700"
                >
                  রিভিউ ({issues.length})
                </button>
                <button
                  type="button"
                  onClick={() => setIsChatOpen((v) => !v)}
                  className="rounded-lg bg-purple-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-purple-500"
                >
                  AI কমান্ড
                </button>
                <button
                  type="button"
                  onClick={() => setIsPushOpen(true)}
                  className="rounded-lg bg-blue-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-blue-500"
                >
                  GitHub Push
                </button>
              </div>
            </header>

            <div className="grid flex-1 grid-cols-1 lg:grid-cols-12">
              <aside className="flex flex-col gap-4 border-b border-slate-800 bg-slate-900/60 p-3 lg:col-span-3 lg:border-b-0 lg:border-r">
                <div>
                  <div className="mb-2 flex items-center justify-between text-xs font-semibold uppercase text-amber-300">
                    <span>প্রজেক্ট হিস্ট্রি ({projects.length})</span>
                  </div>
                  <div className="max-h-52 space-y-1.5 overflow-y-auto pr-1">
                    {projects.map((p) => {
                      const isCurrent = p.id === project.id;
                      return (
                        <div
                          key={p.id}
                          onClick={() => handleSelectHistoryProject(p)}
                          className={`flex cursor-pointer items-center justify-between gap-2 rounded-lg border p-2 text-xs transition ${
                            isCurrent
                              ? "border-emerald-500/60 bg-emerald-600/20 text-white"
                              : "border-slate-800 bg-slate-900 text-slate-300 hover:bg-slate-800"
                          }`}
                        >
                          <div className="min-w-0 flex-1">
                            <div className="truncate font-semibold">{p.name}</div>
                            <div className="truncate font-mono text-[10px] text-slate-400">
                              {p.packageName}
                            </div>
                          </div>
                          <div className="flex shrink-0 items-center gap-1">
                            <button
                              type="button"
                              onClick={(e) => {
                                e.stopPropagation();
                                openEditProjectModal(p);
                              }}
                              className="rounded bg-slate-800 px-2 py-1 text-[10px] text-emerald-300 hover:bg-slate-700"
                              title="প্রজেক্ট এডিট করুন"
                            >
                              এডিট
                            </button>
                            {projects.length > 1 && (
                              <button
                                type="button"
                                onClick={(e) => handleDeleteHistoryProject(e, p.id)}
                                className="rounded bg-slate-800 px-1.5 py-1 text-[10px] text-rose-400 hover:bg-rose-950"
                                title="মুছুন"
                              >
                                ✕
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="border-t border-slate-800 pt-3">
                  <div className="mb-2 text-xs font-semibold uppercase text-slate-400">
                    প্রজেক্ট ফাইলসমূহ ({project.files.length})
                  </div>
                  <div className="space-y-1">
                    {project.files.map((file) => (
                      <button
                        key={file.path}
                        type="button"
                        onClick={() => setSelectedPath(file.path)}
                        className={`block w-full truncate rounded-lg px-3 py-2 text-left font-mono text-xs ${
                          activeFile?.path === file.path
                            ? "border border-emerald-500/40 bg-emerald-600/20 text-emerald-300"
                            : "text-slate-300 hover:bg-slate-800"
                        }`}
                      >
                        {file.path}
                      </button>
                    ))}
                  </div>
                </div>
              </aside>

              <main className={`flex flex-col p-3 ${isChatOpen ? "lg:col-span-5" : "lg:col-span-9"}`}>
                {!isRunnerFolded && (
                  <RunAppDrawer key="{project.id}" onFold="{()" project="{project}"> setIsRunnerFolded(true)}
                  />
                )}

                <div className="mb-2 flex items-center justify-between rounded-lg border border-slate-800 bg-slate-900 px-3 py-2">
                  <span className="truncate font-mono text-xs text-emerald-400">
                    {activeFile?.path || "কোনো ফাইল নেই"}
                  </span>
                  <span className="text-[11px] text-slate-400">কোড এডিটর</span>
                </div>
                <textarea
                  value={activeFile?.content || ""}
                  onChange={(e) => handleCodeEdit(e.target.value)}
                  spellCheck={false}
                  className="min-h-[55vh] w-full flex-1 rounded-xl border border-slate-800 bg-slate-900 p-3 font-mono text-xs leading-relaxed text-slate-100 focus:border-emerald-500 focus:outline-none"
                />
              </main>

              {isChatOpen && (
                <section className="flex flex-col border-t border-slate-800 bg-slate-900/80 p-3 lg:col-span-4 lg:border-l lg:border-t-0">
                  <div className="mb-2 flex items-center justify-between">
                    <h2 className="text-xs font-bold uppercase text-purple-300">
                      AI কোড জেনারেটর
                    </h2>
                    <button
                      type="button"
                      onClick={() => setIsChatOpen(false)}
                      className="text-xs text-slate-400 hover:text-white"
                    >
                      লুকান
                    </button>
                  </div>

                  <div className="mb-2">
                    <input
                      type="password"
                      value={apiKey}
                      onChange={(e) => setApiKey(e.target.value)}
                      placeholder="Gemini API Key (ঐচ্ছিক)"
                      className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                    />
                  </div>

                  <div className="mb-2 max-h-[45vh] flex-1 space-y-2 overflow-y-auto rounded-xl border border-slate-800 bg-slate-950/70 p-3">
                    {messages.map((m) => (
                      <div
                        key={m.id}
                        className={`rounded-lg p-2.5 text-xs ${
                          m.role === "user"
                            ? "ml-6 border border-blue-500/40 bg-blue-600/20"
                            : "mr-6 border border-slate-800 bg-slate-900"
                        }`}
                      >
                        <div className="mb-1 text-[10px] text-slate-400">
                          {m.role === "user" ? "আপনি" : "AI"}
                        </div>
                        <div className="whitespace-pre-wrap">{m.content}</div>
                      </div>
                    ))}
                    {isAILoading && (
                      <div className="rounded-lg bg-slate-900 p-2.5 text-xs text-emerald-400">
                        ফাইলগুলোতে কোড লেখা হচ্ছে...
                      </div>
                    )}
                  </div>

                  <form onSubmit={handleSendAI} className="flex gap-2">
                    <input
                      value={promptInput}
                      onChange={(e) => setPromptInput(e.target.value)}
                      placeholder="যেমন: চ্যাট স্ক্রিন ও অডিও কল বাটন যুক্ত করো..."
                      className="flex-1 rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                    />
                    <button
                      type="submit"
                      disabled={isAILoading}
                      className="rounded-lg bg-emerald-600 px-3 py-2 text-xs font-semibold text-white hover:bg-emerald-500 disabled:opacity-50"
                    >
                      পাঠান
                    </button>
                  </form>
                </section>
              )}
            </div>

            {isSetupOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4">
                <div className="w-full max-w-md rounded-xl border border-slate-800 bg-slate-900 p-5">
                  <div className="mb-3 flex items-center justify-between">
                    <h3 className="text-base font-bold">
                      {editingProjectId ? "পুরনো প্রজেক্ট এডিট করুন" : "নতুন প্রজেক্ট ও লোগো"}
                    </h3>
                    <button type="button" onClick={() => setIsSetupOpen(false)} className="text-slate-400">
                      ✕
                    </button>
                  </div>
                  <form onSubmit={handleSaveProjectForm} className="space-y-3">
                    <div>
                      <label className="mb-1 block text-xs text-slate-300">অ্যাপের নাম</label>
                      <input
                        value={setupName}
                        onChange={(e) => setSetupName(e.target.value)}
                        className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                        required
                      />
                    </div>
                    <div>
                      <label className="mb-1 block text-xs text-slate-300">Package Name</label>
                      <input
                        value={setupPkg}
                        onChange={(e) => setSetupPkg(e.target.value)}
                        className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                        required
                      />
                    </div>
                    <div>
                      <label className="mb-1 block text-xs text-slate-300">বিবরণ</label>
                      <input
                        value={setupDesc}
                        onChange={(e) => setSetupDesc(e.target.value)}
                        className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                      />
                    </div>
                    <div>
                      <label className="mb-1 block text-xs text-slate-300">অ্যাপ লোগো</label>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={handleLogoUpload}
                        className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-xs"
                      />
                      {setupLogoUrl && (
                        <div className="mt-2 flex items-center gap-2">
                          <img
                            src={setupLogoUrl}
                            alt="Preview"
                            className="h-10 w-10 rounded-lg border border-slate-700 object-cover"
                          />
                          <span className="text-xs text-emerald-400">{setupLogoName}</span>
                        </div>
                      )}
                    </div>
                    <div className="flex justify-end gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setIsSetupOpen(false)}
                        className="rounded-lg bg-slate-800 px-3 py-2 text-xs"
                      >
                        বাতিল
                      </button>
                      <button
                        type="submit"
                        className="rounded-lg bg-emerald-600 px-4 py-2 text-xs font-semibold text-white"
                      >
                        {editingProjectId ? "আপডেট করুন" : "তৈরি করুন"}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {isReviewOpen && (
              <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-950 p-4">
                <div className="mx-auto max-w-4xl">
                  <div className="mb-4 flex items-center justify-between border-b border-slate-800 pb-3">
                    <h3 className="text-lg font-bold">কোড রিভিউ ও চেক</h3>
                    <button
                      type="button"
                      onClick={() => setIsReviewOpen(false)}
                      className="rounded-lg bg-slate-800 px-3 py-1.5 text-xs"
                    >
                      ফিরে যান
                    </button>
                  </div>
                  <div className="mb-4 space-y-2">
                    {issues.length === 0 ? (
                      <div className="rounded-lg border border-emerald-800 bg-emerald-950/40 p-3 text-xs text-emerald-300">
                        কোনো সমস্যা পাওয়া যায়নি।
                      </div>
                    ) : (
                      issues.map((it, i) => (
                        <div key={i} className="rounded-lg border border-slate-800 bg-slate-900 p-3 text-xs">
                          <span className="font-mono text-amber-300">{it.filePath}</span>: {it.message}
                        </div>
                      ))
                    )}
                  </div>
                  <div className="space-y-3">
                    {project.files.map((f) => (
                      <div key={f.path} className="rounded-xl border border-slate-800 bg-slate-900 p-3">
                        <div className="mb-1 font-mono text-xs text-emerald-400">{f.path}</div>
                        <pre className="max-h-56 overflow-auto rounded-lg bg-slate-950 p-3 text-xs">
                          <code>{f.content}</code>
                        </pre>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {isPushOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4">
                <div className="w-full max-w-md rounded-xl border border-slate-800 bg-slate-900 p-5">
                  <div className="mb-3 flex items-center justify-between">
                    <h3 className="text-base font-bold">GitHub-এ পুশ করুন</h3>
                    <button type="button" onClick={() => setIsPushOpen(false)} className="text-slate-400">
                      ✕
                    </button>
                  </div>
                  <form onSubmit={handleGitHubPush} className="space-y-3">
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Owner</label>
                        <input
                          value={ghOwner}
                          onChange={(e) => setGhOwner(e.target.value)}
                          className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                          required
                        />
                      </div>
                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Repo</label>
                        <input
                          value={ghRepo}
                          onChange={(e) => setGhRepo(e.target.value)}
                          className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                          required
                        />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Branch</label>
                        <input
                          value={ghBranch}
                          onChange={(e) => setGhBranch(e.target.value)}
                          className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                          required
                        />
                      </div>
                      <div>
                        <label className="mb-1 block text-xs text-slate-300">Folder Prefix</label>
                        <input
                          value={ghPrefix}
                          onChange={(e) => setGhPrefix(e.target.value)}
                          className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                        />
                      </div>
                    </div>
                    <div>
                      <label className="mb-1 block text-xs text-slate-300">GitHub Token</label>
                      <input
                        type="password"
                        value={ghToken}
                        onChange={(e) => setGhToken(e.target.value)}
                        placeholder="ghp_..."
                        className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                        required
                      />
                    </div>
                    <div>
                      <label className="mb-1 block text-xs text-slate-300">Commit Message</label>
                      <input
                        value={ghMsg}
                        onChange={(e) => setGhMsg(e.target.value)}
                        className="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs"
                      />
                    </div>
                    {ghStatus && (
                      <div className="rounded-lg bg-slate-800 p-2.5 text-xs text-emerald-300">
                        {ghStatus}
                      </div>
                    )}
                    <div className="flex justify-end gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setIsPushOpen(false)}
                        className="rounded-lg bg-slate-800 px-3 py-2 text-xs"
                      >
                        বন্ধ
                      </button>
                      <button
                        type="submit"
                        disabled={isPushing}
                        className="rounded-lg bg-blue-600 px-4 py-2 text-xs font-semibold text-white disabled:opacity-50"
                      >
                        {isPushing ? "পুশ হচ্ছে..." : "Push Now"}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
    </script>
  </body>
</html>
