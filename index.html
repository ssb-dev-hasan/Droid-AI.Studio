      // =========================================================================
      // 2. GEMINI REST API (v1beta) MODEL DISCOVERY, FILTERING & CASCADING
      // =========================================================================
      const PREFERRED_MODEL_ORDER = [
        "gemini-3.8-flash",
        "gemini-3-flash-preview",
        "gemini-2.5-flash",
        "gemini-2.5-flash-lite",
        "gemini-2.5-pro",
        "gemini-flash-latest",
        "gemini-pro-latest"
      ];

      const EXCLUDED_MODEL_KEYWORDS = [
        "tts",
        "audio",
        "image",
        "imagen",
        "veo",
        "embedding",
        "aqa",
        "robotics",
        "computer-use",
        "customtools"
      ];

      function isEligibleTextCodeModel(modelObj) {
        const rawName = String(modelObj?.name || "").toLowerCase();
        const shortId = rawName.replace(/^models\//, "");
        if (!shortId.includes("gemini")) return false;

        const methods = Array.isArray(modelObj?.supportedGenerationMethods)
          ? modelObj.supportedGenerationMethods
          : [];
        if (methods.length > 0 && !methods.includes("generateContent")) {
          return false;
        }

        for (const badWord of EXCLUDED_MODEL_KEYWORDS) {
          if (shortId.includes(badWord)) {
            return false;
          }
        }
        return true;
      }

      function sortModelsByPriority(modelsList) {
        return [...modelsList].sort((a, b) => {
          const idxA = PREFERRED_MODEL_ORDER.indexOf(a.id);
          const idxB = PREFERRED_MODEL_ORDER.indexOf(b.id);
          if (idxA !== -1 && idxB !== -1) return idxA - idxB;
          if (idxA !== -1) return -1;
          if (idxB !== -1) return 1;
          return a.id.localeCompare(b.id);
        });
      }

      async function discoverEligibleGeminiModels(apiKey, externalSignal) {
        const cleanKey = String(apiKey || "").trim();
        if (!cleanKey) {
          throw new Error("অনুগ্রহ করে প্রথমে আপনার নিজস্ব Gemini API Key বসান।");
        }

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 18000);
        if (externalSignal) {
          externalSignal.addEventListener("abort", () => controller.abort(), { once: true });
        }

        try {
          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(cleanKey)}`,
            {
              method: "GET",
              signal: controller.signal
            }
          );

          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            const errMsg =
              data?.error?.message || `API যাচাই ব্যর্থ হয়েছে (HTTP ${res.status})। সঠিক কী দিন।`;
            throw new Error(errMsg);
          }

          const rawModels = Array.isArray(data?.models) ? data.models : [];
          const filtered = rawModels
            .filter(isEligibleTextCodeModel)
            .map((m) => {
              const id = String(m.name || "").replace(/^models\//, "");
              return {
                id,
                displayName: m.displayName || id,
                description: m.description || ""
              };
            });

          const sorted = sortModelsByPriority(filtered);
          if (sorted.length === 0) {
            return PREFERRED_MODEL_ORDER.map((id) => ({
              id,
              displayName: id,
              description: "Default fallback text/code model"
            }));
          }
          return sorted;
        } finally {
          clearTimeout(timeoutId);
        }
      }

      // =========================================================================
      // 4. MULTI-FORMAT FILE PARSER (<<<FILE:path>>> AND MARKDOWN FENCED BLOCKS)
      // =========================================================================
      function resolveSmartTargetPath(rawHint, existingFiles) {
        const cleanHint = String(rawHint || "")
          .trim()
          .replace(/^['"`*#:\s]+|['"`*#:\s]+$/g, "");
        if (!cleanHint) return null;

        const exact = existingFiles.find((f) => f.path === cleanHint);
        if (exact) return exact.path;

        const baseName = cleanHint.split("/").pop();
        if (baseName) {
          const byBase = existingFiles.find((f) => f.path.split("/").pop() === baseName);
          if (byBase) return byBase.path;
        }

        if (cleanHint.includes("/")) return cleanHint;

        const mainSrc = existingFiles.find((f) => f.path.includes("/java/"));
        const basePkgDir = mainSrc
          ? mainSrc.path.split("/").slice(0, -1).join("/")
          : "app/src/main/java/com/droid/app";

        if (cleanHint.endsWith(".xml")) {
          if (
            cleanHint.startsWith("activity_") ||
            cleanHint.startsWith("fragment_") ||
            cleanHint.startsWith("item_")
          ) {
            return `app/src/main/res/layout/${cleanHint}`;
          }
          if (
            cleanHint === "strings.xml" ||
            cleanHint === "colors.xml" ||
            cleanHint === "themes.xml"
          ) {
            return `app/src/main/res/values/${cleanHint}`;
          }
          if (cleanHint === "AndroidManifest.xml") {
            return "app/src/main/AndroidManifest.xml";
          }
          return `app/src/main/res/layout/${cleanHint}`;
        }
        if (cleanHint.endsWith(".kt") || cleanHint.endsWith(".java")) {
          return `${basePkgDir}/${cleanHint}`;
        }
        if (cleanHint.endsWith(".gradle") || cleanHint.endsWith(".gradle.kts")) {
          return `app/${cleanHint}`;
        }
        return cleanHint;
      }

      function parseGeneratedFiles(replyText, existingFiles = []) {
        const updatesMap = new Map();

        // Pass 1: Strict <<<FILE:path>>> ... <<<END_FILE>>> blocks
        const strictRegex = /<<<FILE:([^\n>]+)>>>\s*\n([\s\S]*?)<<<END_FILE>>>/g;
        let match;
        while ((match = strictRegex.exec(replyText)) !== null) {
          const resolved = resolveSmartTargetPath(match[1], existingFiles);
          const content = match[2].replace(/\n+$/, "");
          if (resolved && content.trim()) {
            updatesMap.set(resolved, content);
          }
        }

        // Pass 2: Fallback Markdown fenced blocks if strict tags were omitted
        if (updatesMap.size === 0) {
          const mdBlockRegex =
            /(?:(?:^|\n)[^\n`]{0,120}?([A-Za-z0-9_./-]+\.(?:kt|java|xml|kts|gradle|json))[^\n`]{0,40}\n)?```(?:[a-zA-Z0-9_-]*)\n([\s\S]*?)```/g;
          let mdMatch;
          while ((mdMatch = mdBlockRegex.exec(replyText)) !== null) {
            let pathCandidate = mdMatch[1] || "";
            let codeBody = mdMatch[2] || "";

            if (!pathCandidate) {
              const firstLine = codeBody.split("\n")[0] || "";
              const commentPathMatch = firstLine.match(
                /^(?:\/\/|<!--|#)\s*([A-Za-z0-9_./-]+\.(?:kt|java|xml|kts|gradle|json))/
              );
              if (commentPathMatch) {
                pathCandidate = commentPathMatch[1];
                codeBody = codeBody.split("\n").slice(1).join("\n");
              }
            }

            const resolved = resolveSmartTargetPath(pathCandidate, existingFiles);
            const trimmedCode = codeBody.replace(/\n+$/, "");
            if (resolved && trimmedCode.trim().length > 12) {
              updatesMap.set(resolved, trimmedCode);
            }
          }
        }

        return Array.from(updatesMap.entries()).map(([path, content]) => ({ path, content }));
      }

      // =========================================================================
      // 5. DYNAMIC LIVE PREVIEW PARSER (PARSES ACTUAL XML, CODE & CUSTOM LOGO)
      // =========================================================================
      function parseProjectForLivePreview(project) {
        const files = Array.isArray(project?.files) ? project.files : [];
        const stringsXml = files.find((f) => f.path.endsWith("strings.xml"))?.content || "";
        const colorsXml = files.find((f) => f.path.endsWith("colors.xml"))?.content || "";
        const layoutXml = files.find((f) => f.path.endsWith("activity_main.xml"))?.content || "";
        const mainCode =
          files.find((f) => f.path.endsWith("MainActivity.kt") || f.path.endsWith("MainActivity.java"))
            ?.content || "";
        const logoFile = files.find((f) => f.path.endsWith("app_logo_custom.png"));

        const logoDataUrl =
          project?.logoDataUrl ||
          logoFile?.assetDataUrl ||
          (logoFile?.content?.match(/(data:image\/[^\s]+)/)?.[1] || "");

        const stringMap = {};
        const strRegex = /<string\s+name="([^"]+)">([\s\S]*?)<\/string>/g;
        let sm;
        while ((sm = strRegex.exec(stringsXml)) !== null) {
          stringMap[sm[1]] = sm[2].trim();
        }

        const colorMap = {};
        const colRegex = /<color\s+name="([^"]+)">(#[0-9A-Fa-f]{6,8})<\/color>/g;
        let cm;
        while ((cm = colRegex.exec(colorsXml)) !== null) {
          colorMap[cm[1]] = cm[2].trim();
        }

        const resolveXmlAttr = (val) => {
          if (!val) return "";
          if (val.startsWith("@string/")) {
            return stringMap[val.replace("@string/", "")] || val;
          }
          if (val.startsWith("@color/")) {
            return colorMap[val.replace("@color/", "")] || val;
          }
          return val;
        };

        const hexInLayout = layoutXml.match(/android:backgroundTint="(#[0-9A-Fa-f]{6,8})"/);
        const accentColor =
          colorMap.primary_accent ||
          (hexInLayout ? hexInLayout[1] : null) ||
          project?.accentColor ||
          "#10B981";

        const textViews = [];
        const tvRegex = /<TextView\b([\s\S]*?)\/>/g;
        let tvm;
        while ((tvm = tvRegex.exec(layoutXml)) !== null) {
          const attrs = tvm[1];
          const textAttr = attrs.match(/android:text="([^"]+)"/);
          const idAttr = attrs.match(/android:id="@\+id\/([^"]+)"/);
          if (textAttr) {
            textViews.push({
              id: idAttr ? idAttr[1] : "",
              text: resolveXmlAttr(textAttr[1])
            });
          }
        }

        const buttons = [];
        const btnRegex = /<(?:Button|com\.google\.android\.material\.button\.MaterialButton)\b([\s\S]*?)\/>/g;
        let bm;
        while ((bm = btnRegex.exec(layoutXml)) !== null) {
          const attrs = bm[1];
          const textAttr = attrs.match(/android:text="([^"]+)"/);
          const idAttr = attrs.match(/android:id="@\+id\/([^"]+)"/);
          if (textAttr) {
            buttons.push({
              id: idAttr ? idAttr[1] : "",
              text: resolveXmlAttr(textAttr[1])
            });
          }
        }

        const inputs = [];
        const etRegex = /<(?:EditText|SearchView|androidx\.appcompat\.widget\.SearchView)\b([\s\S]*?)\/>/g;
        let etm;
        while ((etm = etRegex.exec(layoutXml)) !== null) {
          const attrs = etm[1];
          const hintAttr = attrs.match(/android:(?:hint|queryHint)="([^"]+)"/);
          const inputTypeAttr = attrs.match(/android:inputType="([^"]+)"/);
          inputs.push({
            hint: hintAttr ? resolveXmlAttr(hintAttr[1]) : "এখানে লিখুন...",
            isPassword: Boolean(inputTypeAttr && inputTypeAttr[1].toLowerCase().includes("password"))
          });
        }

        const parsedItems = [];
        const kotlinItemRegex =
          /(?:AppItem|NewsArticle|NewsItem|Item)\s*\(\s*\d+\s*,\s*"([^"]+)"\s*,\s*"([^"]+)"\s*,\s*"([^"]+)"(?:\s*,\s*"([^"]+)")?\s*\)/g;
        let kim;
        while ((kim = kotlinItemRegex.exec(mainCode)) !== null) {
          parsedItems.push({
            category: kim[1],
            title: kim[2],
            summary: kim[3],
            time: kim[4] || "এইমাত্র"
          });
        }

        const appTitle =
          textViews.find((t) => t.id === "tvAppTitle")?.text ||
          stringMap.app_name ||
          project?.name ||
          "Android App";

        const subtitle =
          textViews.find((t) => t.id === "tvHeadlineCount")?.text ||
          textViews[1]?.text ||
          stringMap.subtitle_text ||
          "লাইভ প্রিভিউ সক্রিয়";

        const extraTexts = textViews.filter(
          (t) =>
            t.id !== "tvAppTitle" &&
            t.id !== "tvHeadlineCount" &&
            t.text !== appTitle &&
            t.text !== subtitle
        );

        return {
          appTitle,
          subtitle,
          accentColor,
          logoDataUrl,
          templateId: project?.templateId || "bangla-news",
          minSdk: project?.minSdk || 24,
          targetSdk: project?.targetSdk || 35,
          buttons,
          inputs,
          extraTexts,
          items: parsedItems
        };
      }

        const activeFile = useMemo(() => {

        }, [activeProject, selectedFilePath]);

        const livePreviewData = useMemo(() => {

        const activeProjectHistory = useMemo(() => {

        useEffect(() => {

        }, [aiSettings]);

        useEffect(() => {
          if (activeTab === "chat") {
            chatEndRef.current?.scrollIntoView({ behavior: "smooth" });

        }, [messages, isGenerating, activeTab]);

        useEffect(() => {
          const handleReady = () => setFbReady(true);

        }, []);

        // =========================================================================
        // STRICT PER-USER AUTH & BYOK ISOLATION LIFECYCLE
        // =========================================================================
        useEffect(() => {
          if (!fbReady || !window.DroidFirebase?.auth) return;
          const { auth, db, onAuthStateChanged, ref, get, onValue, off } = window.DroidFirebase;

          let projectsListenerRef = null;

        const syncProjectsToStorageAndCloud = useCallback(

        // =========================================================================
        // BYOK API KEY SAVE, TEST & DELETE HANDLERS
        // =========================================================================

              localStorage.removeItem(getUserScopedKeyStorageName(uid));
            }
          } catch {}

          if (uid && window.DroidFirebase?.db) {
            const { db, ref, set } = window.DroidFirebase;
            try {
              await set(ref(db, `users/${uid}/private/geminiApiKey`), clean || null);
            } catch (err) {
              console.warn("RTDB key save error:", err);
            }

        const handleTestAndLoadModels = async () => {
          const clean = String(apiKeyInput || "").trim();
          if (!clean) {
            setApiTestStatus({

          }

          setIsTestingApi(true);
          setApiTestStatus(null);
          try {
            await handleSaveApiKey(clean);
            const models = await discoverEligibleGeminiModels(clean);
            setAvailableModels(models);
            setAiSettings((prev) => {
              const valid = models.some((m) => m.id === prev.selectedModel);
              return valid ? prev : { ...prev, selectedModel: models[0].id };
            });
            setApiTestStatus({
              ok: true,
              msg: `✅ সংযোগ সফল! ${models.length}টি সক্রিয় টেক্সট/কোড মডেল লোড হয়েছে (অডিও/TTS/ইমেজ মডেল বাদ দেওয়া হয়েছে)।`
            });

            setApiTestStatus({

        const handleDeleteApiKey = async () => {
          setApiKeyInput("");
          setSavedApiKey("");
          setApiTestStatus({
            ok: true,
            msg: "🗑️ আপনার সংরক্ষিত API Key ব্রাউজার ও ক্লাউড প্রোফাইল থেকে মুছে ফেলা হয়েছে।"
          });
          setAvailableModels(PREFERRED_MODEL_ORDER.map((id) => ({ id, displayName: id })));

          const uid = currentUser?.uid || null;
          try {
            localStorage.removeItem(getUserScopedKeyStorageName(uid));
          } catch {}

          if (uid && window.DroidFirebase?.db) {
            const { db, ref, set } = window.DroidFirebase;
            try {
              await set(ref(db, `users/${uid}/private/geminiApiKey`), null);
            } catch {}
          }
        };

        // =========================================================================
        // PROJECT HISTORY & SNAPSHOT MANAGEMENT
        // =========================================================================
        const recordProjectSnapshot = useCallback(
          (projectObj, note, tag = "Snapshot") => {
            if (!projectObj?.id) return;
            const snap = {
              id: "snap_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
              timestamp: Date.now(),
              note: note || "ম্যানুয়াল স্ন্যাপশট",
              tag,
              files: JSON.parse(JSON.stringify(projectObj.files || []))
            };

            setHistoryMap((prev) => {
              const existing = Array.isArray(prev[projectObj.id]) ? prev[projectObj.id] : [];
              const updated = {
                ...prev,
                [projectObj.id]: [snap, ...existing].slice(0, 25)
              };
              try {
                localStorage.setItem(
                  getUserScopedHistoryStorageName(currentUser?.uid || null),
                  JSON.stringify(updated)
                );
              } catch {}
              return updated;
            });
          },
          [currentUser]
        );

        const handleRestoreSnapshot = (snap) => {
          if (!activeProject || !snap || !Array.isArray(snap.files)) return;
          const restoredFiles = JSON.parse(JSON.stringify(snap.files));
          const nextProjects = projects.map((p) =>
            p.id === activeProject.id ? { ...p, files: restoredFiles, updatedAt: Date.now() } : p
          );
          setProjects(nextProjects);
          syncProjectsToStorageAndCloud(nextProjects);
          if (restoredFiles[0]?.path) {
            setSelectedFilePath(restoredFiles[0].path);
          }
          setPreviewRefreshTick((t) => t + 1);
          setIsHistoryModalOpen(false);
        };

        // =========================================================================
        // APPLY STAGED OR AUTO AI CODE UPDATES TO PROJECT, EDITOR, HISTORY & PREVIEW
        // =========================================================================
        const applyFileUpdatesToActiveProject = (fileUpdates, usedModelId, targetProjectId) => {
          const targetProj =
            projects.find((p) => p.id === (targetProjectId || activeProject?.id)) || activeProject;
          if (!targetProj || !Array.isArray(fileUpdates) || fileUpdates.length === 0) return false;

          recordProjectSnapshot(
            targetProj,
            `আপডেটের আগের ব্যাকআপ (${targetProj.files.length} ফাইল)`,
            "Pre-Update"
          );

          const nextFiles = [...targetProj.files];
          fileUpdates.forEach((upd) => {
            const idx = nextFiles.findIndex((f) => f.path === upd.path);
            if (idx >= 0) {
              nextFiles[idx] = { ...nextFiles[idx], content: upd.content };
            } else {
              nextFiles.push({ path: upd.path, content: upd.content });
            }
          });

          const updatedProjectObj = {
            ...targetProj,
            files: nextFiles,
            updatedAt: Date.now()
          };

          const nextProjects = projects.map((proj) =>
            proj.id === targetProj.id ? updatedProjectObj : proj
          );
          setProjects(nextProjects);
          syncProjectsToStorageAndCloud(nextProjects);
          setSelectedFilePath(fileUpdates[0].path);
          setPreviewRefreshTick((t) => t + 1);

          recordProjectSnapshot(
            updatedProjectObj,
            `${fileUpdates.length}টি ফাইল আপডেট (${fileUpdates
              .map((u) => u.path.split("/").pop())
              .join(", ")})`,
            usedModelId || "Gemini AI"
          );

          return true;
        };

        const handleAcceptStagedUpdate = (messageId) => {
          const targetMsg = messages.find((m) => m.id === messageId);
          if (!targetMsg || !targetMsg.stagedFiles || targetMsg.stageStatus === "accepted") return;

          const applied = applyFileUpdatesToActiveProject(
            targetMsg.stagedFiles,
            targetMsg.modelUsed,
            targetMsg.targetProjectId
          );

          if (applied) {
            setMessages((prev) =>
              prev.map((m) =>
                m.id === messageId
                  ? {
                      ...m,
                      stageStatus: "accepted",
                      appliedAt: Date.now()
                    }
                  : m
              )
            );
            showPreviewToast(
              `✅ ${targetMsg.stagedFiles.length}টি ফাইল আপডেট ও প্রিভিউ রিফ্রেশ হয়েছে!`
            );
          }
        };

        const handleRejectStagedUpdate = (messageId) => {
          setMessages((prev) =>
            prev.map((m) =>
              m.id === messageId
                ? {
                    ...m,
                    stageStatus: "rejected"
                  }
                : m
            )
          );
        };

        // =========================================================================
        // INTENT DETECTION & GEMINI REST API CALL WITH 25s TIMEOUT + AUTO FALLBACK
        // =========================================================================
        function detectTurnIntent(userPrompt, selectedMode) {
          if (selectedMode === "chat") return "chat";
          if (selectedMode === "code") return "code";

          const text = String(userPrompt || "").toLowerCase();
          const codeKeywords = [
            "কোড",
            "ফাইল",
            "ফিক্স",
            "fix",
            "error",
            "এরর",
            "বাগ",
            "bug",
            "ফিচার",
            "feature",
            "যোগ কর",
            "তৈরি কর",
            "বানাও",
            "আপডেট",
            "update",
            "xml",
            "kotlin",
            "java",
            "activity",
            "layout",
            "gradle",
            "সার্চ",
            "search",
            "ডার্ক",
            "dark",
            "বাটন",
            "button",
            "স্ক্রিন",
            "screen",
            "recyclerview"
          ];
          return codeKeywords.some((kw) => text.includes(kw)) ? "code" : "chat";
        }

        const handleStopGeneration = () => {
          if (activeAbortControllerRef.current) {
            activeAbortControllerRef.current.abort();
            activeAbortControllerRef.current = null;

          setIsGenerating(false);
          setLiveStatusText("");
        };

        const handleSendMessage = async (overridePrompt) => {
          const promptText = String(overridePrompt ?? chatInput).trim();
          if (!promptText || isGenerating) return;

          const activeKey = String(savedApiKey || apiKeyInput).trim();
          if (!activeKey) {
            setMessages((prev) => [
              ...prev,
              {
                id: "msg_" + Date.now() + "_u",
                role: "user",
                text: promptText
              },
              {
                id: "msg_" + Date.now() + "_err",
                role: "assistant",
                isError: true,
                text: "⚠️ কোনো Gemini API Key পাওয়া যায়নি। উপরে আপনার নিজস্ব Google AI Studio API Key বসিয়ে 'API টেস্ট' চাপুন।"
              }
            ]);
            if (!overridePrompt) setChatInput("");
            return;
          }

          if (!overridePrompt) setChatInput("");
          const userMsg = {
            id: "msg_" + Date.now() + "_u",
            role: "user",
            text: promptText
          };
          setMessages((prev) => [...prev, userMsg]);
          setIsGenerating(true);

          const intent = detectTurnIntent(promptText, chatMode);

          let composedUserContent = promptText;
          if (intent === "code" && activeProject) {
            const fileSummaries = activeProject.files
              .map((f) => {
                // Avoid sending huge base64 strings verbatim in prompt context while informing AI of logo asset
                if (f.assetDataUrl || f.path.endsWith(".png")) {
                  return `--- FILE: ${f.path} ---\n[Binary Image Asset: Custom App Logo embedded at @drawable/app_logo_custom]`;
                }
                return `--- FILE: ${f.path} ---\n${f.content}`;
              })
              .join("\n\n");

            composedUserContent = `প্রজেক্ট মেটাডাটা:
- App Name: ${activeProject.name}
- Package Name: ${activeProject.packageName}
- Template: ${activeProject.templateId || "custom"}
- Language: ${activeProject.language}
- Min SDK: API ${activeProject.minSdk || 24} | Target/Compile SDK: API ${activeProject.targetSdk || 35}
- Custom App Logo: ${activeProject.logoDataUrl ? "যুক্ত আছে (@drawable/app_logo_custom)" : "ডিফল্ট লঞ্চার আইকন"}
- বর্তমানে খোলা ফাইল: ${selectedFilePath || "N/A"}

প্রজেক্টের বর্তমান ফাইলসমূহ:
${fileSummaries}

ব্যবহারকারীর নির্দেশনা:
${promptText}

নির্দেশনা: প্রজেক্টের Package Name ও SDK কনফিগারেশন বজায় রেখে পরিবর্তিত বা নতুন প্রতিটি ফাইল অবশ্যই <<<FILE:path/to/file>>> এবং <<<END_FILE>>> ট্যাগের ভেতরে সম্পূর্ণ রানযোগ্য কোডসহ দেবে।`;
          }

          const recentTurns = messages
            .filter((m) => !m.isError && m.modelUsed !== "system")
            .slice(-6)
            .map((m) => ({
              role: m.role === "assistant" ? "model" : "user",
              parts: [{ text: m.text }]
            }));

          const contentsPayload = [
            ...recentTurns,
            {
              role: "user",
              parts: [{ text: composedUserContent }]
            }
          ];

          const allIds = availableModels.map((m) => m.id);
          const primaryId = aiSettings.selectedModel || allIds[0] || "gemini-3.8-flash";
          const candidateModels = aiSettings.autoSwitch
            ? [primaryId, ...allIds.filter((id) => id !== primaryId)].slice(0, 6)
            : [primaryId];

          const masterController = new AbortController();
          activeAbortControllerRef.current = masterController;

          const attemptedModels = [];
          let finalReplyText = "";
          let usedModelId = primaryId;
          let lastErrorMsg = "";

          try {
            for (let i = 0; i < candidateModels.length; i++) {
              if (masterController.signal.aborted) {
                throw new Error("ব্যবহারকারী অনুরোধটি থামিয়েছেন।");
              }

              const modelId = candidateModels[i];
              attemptedModels.push(modelId);
              setLiveStatusText(
                intent === "chat"
                  ? `💬 ${modelId}-এ বাংলা উত্তর তৈরি হচ্ছে...`
                  : `🛠️ ${modelId}-এ কোড ও ফাইল বিশ্লেষণ হচ্ছে...`
              );

              const perAttemptController = new AbortController();
              const timeoutHandle = setTimeout(() => perAttemptController.abort(), 25000);
              const abortForwarder = () => perAttemptController.abort();
              masterController.signal.addEventListener("abort", abortForwarder, { once: true });

              try {
                const response = await fetch(
                  `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(
                    modelId
                  )}:generateContent?key=${encodeURIComponent(activeKey)}`,
                  {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    signal: perAttemptController.signal,
                    body: JSON.stringify({
                      systemInstruction: {
                        parts: [
                          {
                            text:
                              intent === "chat"
                                ? "তুমি Droid AI Studio-র বন্ধুত্বপূর্ণ ও বুদ্ধিমান বাংলা সহকারী। সংক্ষিপ্ত, সাবলীল ও প্রাসঙ্গিক বাংলায় উত্তর দাও। অপ্রয়োজনীয় কোড ব্লক বা ফাইল ডাম্প দেবে না।"
                                : aiSettings.systemInstruction
                          }
                        ]
                      },
                      contents: contentsPayload,
                      generationConfig: {
                        temperature: Number(aiSettings.temperature) || 0.5,
                        maxOutputTokens:
                          intent === "chat"
                            ? Math.min(1024, Number(aiSettings.maxOutputTokens) || 1024)
                            : Number(aiSettings.maxOutputTokens) || 4096
                      }
                    })
                  }
                );

                clearTimeout(timeoutHandle);
                masterController.signal.removeEventListener("abort", abortForwarder);

                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                  const apiErr = data?.error?.message || `HTTP ${response.status} ত্রুটি`;
                  lastErrorMsg = `(${response.status}): ${apiErr}`;
                  if (
                    aiSettings.autoSwitch &&
                    [400, 404, 429, 500, 502, 503, 504].includes(response.status) &&
                    i < candidateModels.length - 1
                  ) {
                    continue;
                  }
                  throw new Error(lastErrorMsg);
                }

                const candidateText =
                  data?.candidates?.[0]?.content?.parts
                    ?.map((p) => p.text || "")
                    .join("")
                    .trim() || "";

                if (!candidateText) {
                  lastErrorMsg = "মডেল থেকে খালি উত্তর এসেছে।";
                  if (aiSettings.autoSwitch && i < candidateModels.length - 1) continue;
                  throw new Error(lastErrorMsg);
                }

                finalReplyText = candidateText;
                usedModelId = modelId;
                break;
              } catch (attemptErr) {
                clearTimeout(timeoutHandle);
                masterController.signal.removeEventListener("abort", abortForwarder);

                if (masterController.signal.aborted) {
                  throw new Error("অনুরোধটি থামানো হয়েছে।");
                }
                if (attemptErr.name === "AbortError") {
                  lastErrorMsg = `${modelId} ২৫ সেকেন্ডে সাড়া দেয়নি (Timeout)`;
                  if (aiSettings.autoSwitch && i < candidateModels.length - 1) continue;
                }
                if (!lastErrorMsg) {
                  lastErrorMsg = attemptErr.message || "অজানা নেটওয়ার্ক ত্রুটি";
                }
                if (!aiSettings.autoSwitch || i === candidateModels.length - 1) {
                  throw new Error(lastErrorMsg);
                }
              }
            }

            const fileUpdates = parseGeneratedFiles(finalReplyText, activeProject?.files || []);
            const isManualReview = (aiSettings.codeApplyMode || "manual") === "manual";
            let fileSummaryNote = "";
            let stagedPayload = null;

            if (fileUpdates.length > 0 && activeProject) {
              if (isManualReview) {
                stagedPayload = {
                  stagedFiles: fileUpdates,
                  stageStatus: "pending",
                  targetProjectId: activeProject.id,
                  existingPathsSnapshot: activeProject.files.map((f) => f.path)
                };
                fileSummaryNote = `\n\n📋 ${fileUpdates.length}টি ফাইলের কোড প্রস্তুত (${usedModelId}) — নিচের '✅ Accept ও ফাইল আপডেট করুন' বাটনে ক্লিক করলে সম্পূর্ণ ফাইল ও প্রিভিউ আপডেট হবে।`;
              } else {
                applyFileUpdatesToActiveProject(fileUpdates, usedModelId, activeProject.id);
                stagedPayload = {
                  stagedFiles: fileUpdates,
                  stageStatus: "accepted",
                  targetProjectId: activeProject.id,
                  existingPathsSnapshot: activeProject.files.map((f) => f.path),
                  appliedAt: Date.now()
                };
                fileSummaryNote = `\n\n✅ ${fileUpdates.length}টি ফাইল স্বয়ংক্রিয়ভাবে কোড এডিটর ও প্রিভিউতে আপডেট হয়েছে (${usedModelId})`;
              }
            }

            setMessages((prev) => [
              ...prev,
              {
                id: "msg_" + Date.now() + "_ai",
                role: "assistant",
                text: finalReplyText + fileSummaryNote,
                modelUsed: usedModelId,
                ...(stagedPayload || {})
              }
            ]);
          } catch (err) {
            setMessages((prev) => [
              ...prev,
              {
                id: "msg_" + Date.now() + "_err",
                role: "assistant",
                isError: true,
                text: `❌ Gemini API ত্রুটি ${err.message}\n\n(চেষ্টা করা মডেলসমূহ: ${attemptedModels.join(
                  " → "

        // =========================================================================

            return;

            return;

          const reader = new FileReader();
          reader.onload = () => {

            const nextProjects = projects.map((p) =>
              p.id === activeProject.id
                ? {
                    ...p,
                    updatedAt: Date.now(),
                    files: [...p.files, { path: resolved, content: starterContent }]

                : p

            setProjects(nextProjects);
            syncProjectsToStorageAndCloud(nextProjects);
          }
          setSelectedFilePath(resolved);
          setNewFilePathInput("");
          setIsNewFileModalOpen(false);

        const handleDeleteCurrentFile = () => {

        const handleEmailAuthSubmit = async (e) => {
          e.preventDefault();
          if (!window.DroidFirebase?.auth) {
            setAuthError("Firebase SDK এখনো প্রস্তুত নয়।");
            return;
          }
          setAuthLoading(true);
          setAuthError("");
          const {
            auth,
            db,
            ref,
            set,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword
          } = window.DroidFirebase;

          try {
            if (authMode === "signup") {
              const cred = await createUserWithEmailAndPassword(
                auth,
                authEmail.trim(),
                authPassword
              );
              if (db && cred.user) {
                const emailKey = sanitizeEmailKey(cred.user.email);
                await set(ref(db, `user_emails/${emailKey}`), {
                  uid: cred.user.uid,
                  email: cred.user.email
                }).catch(() => {});
              }
            } else {
              await signInWithEmailAndPassword(auth, authEmail.trim(), authPassword);
            }
            setIsAuthModalOpen(false);
            setAuthEmail("");
            setAuthPassword("");
          } catch (err) {
            setAuthError(err.message || "অথেনটিকেশন ব্যর্থ হয়েছে।");
          } finally {
            setAuthLoading(false);
          }
        };

        const handleGoogleSignIn = async () => {
          if (!window.DroidFirebase?.auth) return;
          setAuthLoading(true);
          setAuthError("");
          const { auth, db, ref, set, GoogleAuthProvider, signInWithPopup } = window.DroidFirebase;
          try {
            const provider = new GoogleAuthProvider();
            const cred = await signInWithPopup(auth, provider);
            if (db && cred.user) {
              const emailKey = sanitizeEmailKey(cred.user.email);
              await set(ref(db, `user_emails/${emailKey}`), {
                uid: cred.user.uid,
                email: cred.user.email
              }).catch(() => {});
            }
            setIsAuthModalOpen(false);
          } catch (err) {
            setAuthError(err.message || "Google সাইন-ইন ব্যর্থ হয়েছে।");
          } finally {
            setAuthLoading(false);
          }
        };

        const handleLogout = async () => {

          setApiKeyInput("");

          setIsAuthModalOpen(false);
        };

        const handlePushToGitHub = async (e) => {
          e.preventDefault();
          if (!activeProject || !ghToken.trim() || !ghOwner.trim() || !ghRepo.trim()) {
            setGhPushStatus({ ok: false, msg: "GitHub Token, Owner এবং Repo নাম পূরণ করুন।" });
            return;
          }

          setIsPushingGh(true);
          setGhPushStatus(null);
          try {
            const headers = {
              Authorization: `token ${ghToken.trim()}`,
              Accept: "application/vnd.github.v3+json",
              "Content-Type": "application/json"
            };

            let pushedCount = 0;
            for (const file of activeProject.files) {
              const apiUrl = `https://api.github.com/repos/${ghOwner.trim()}/${ghRepo.trim()}/contents/${file.path}`;
              let existingSha = undefined;
              const checkRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(ghBranch.trim())}`, {
                headers
              });
              if (checkRes.ok) {
                const existingData = await checkRes.json();
                existingSha = existingData.sha;
              }

              let b64Content = "";
              if (file.assetDataUrl && file.assetDataUrl.includes(",")) {
                b64Content = file.assetDataUrl.split(",")[1];
              } else {
                const utf8Bytes = new TextEncoder().encode(file.content);
                let binaryStr = "";
                utf8Bytes.forEach((b) => {
                  binaryStr += String.fromCharCode(b);
                });
                b64Content = btoa(binaryStr);
              }

              const putRes = await fetch(apiUrl, {
                method: "PUT",
                headers,
                body: JSON.stringify({
                  message: ghCommitMsg.trim() || `Update ${file.path}`,
                  content: b64Content,
                  branch: ghBranch.trim() || "main",
                  ...(existingSha ? { sha: existingSha } : {})
                })
              });

              if (!putRes.ok) {
                const errJson = await putRes.json().catch(() => ({}));
                throw new Error(errJson.message || `${file.path} পুশ ব্যর্থ হয়েছে`);
              }
              pushedCount++;
            }

            setGhPushStatus({
              ok: true,
              msg: `✅ সফলভাবে ${pushedCount}টি ফাইল ${ghOwner}/${ghRepo} (${ghBranch})-এ পুশ হয়েছে!`
            });
          } catch (err) {
            setGhPushStatus({ ok: false, msg: `❌ GitHub ত্রুটি: ${err.message}` });
          } finally {
            setIsPushingGh(false);
          }
        };

        const userDisplayBadge = currentUser
          ? currentUser.email?.split("@")[0] || "প্রোফাইল"
          : "লগইন";

        return (

                      {activeProject && (

                      <button

                  {/* BYOK Input Row */}

                      <span className="font-medium text-slate-300">

                        </div>
                        <p className="mt-2 text-[11px] text-slate-300">
                          আপনার API Key এবং প্রজেক্টসমূহ শুধুমাত্র আপনার নিজস্ব UID-এর অধীনে সুরক্ষিত আছে।
                        </p>
                      </div>

                      <button
                        type="button"
                        onClick={handleLogout}
                        className="w-full rounded-xl bg-rose-600 py-2 font-bold text-white hover:bg-rose-500"
                      >
                        লগআউট করুন (কী মেমোরি থেকে মুছবে)
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-3 text-xs">
                      <div className="grid grid-cols-2 gap-1 rounded-xl bg-slate-950 p-1">
                        <button
                          type="button"
                          onClick={() => setAuthMode("login")}
                          className={`rounded-lg py-1.5 font-bold ${
                            authMode === "login"
                              ? "bg-purple-600 text-white"
                              : "text-slate-400"
                          }`}
                        >
                          লগইন
                        </button>
                        <button
                          type="button"
                          onClick={() => setAuthMode("signup")}
                          className={`rounded-lg py-1.5 font-bold ${
                            authMode === "signup"
                              ? "bg-purple-600 text-white"
                              : "text-slate-400"
                          }`}
                        >
                          নতুন অ্যাকাউন্ট
                        </button>
                      </div>

                      {authError && (
                        <div className="rounded-xl border border-rose-500/40 bg-rose-950/60 p-2 text-[11px] text-rose-200">
                          {authError}
                        </div>
                      )}

                      <form onSubmit={handleEmailAuthSubmit} className="space-y-2.5">
                        <input
                          type="email"
                          required
                          value={authEmail}
                          onChange={(e) => setAuthEmail(e.target.value)}
                          placeholder="ইমেইল ঠিকানা"
                          className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100 focus:border-purple-500 focus:outline-none"
                        />
                        <input
                          type="password"
                          required
                          value={authPassword}
                          onChange={(e) => setAuthPassword(e.target.value)}
                          placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)"
                          className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100 focus:border-purple-500 focus:outline-none"
                        />
                        <button
                          type="submit"
                          disabled={authLoading}
                          className="w-full rounded-xl bg-emerald-600 py-2 font-bold text-white hover:bg-emerald-500 disabled:opacity-50"
                        >
                          {authLoading
                            ? "অপেক্ষা করুন..."
                            : authMode === "signup"
                            ? "সাইন-আপ করুন"
                            : "লগইন করুন"}
                        </button>
                      </form>

                      <button
                        type="button"
                        onClick={handleGoogleSignIn}
                        disabled={authLoading}
                        className="w-full rounded-xl border border-slate-700 bg-slate-800 py-2 font-bold text-white hover:bg-slate-700"
                      >
                        🌐 Google দিয়ে সাইন-ইন করুন
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* =================================================================== */}
            {/* MODAL 5: GITHUB REPOSITORY PUSH                                     */}
            {/* =================================================================== */}
            {isGithubModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-3 backdrop-blur-sm">
                <div className="w-full max-w-md rounded-2xl border border-slate-700 bg-[#0d1424] p-4 shadow-2xl">
                  <div className="mb-3 flex items-center justify-between">
                    <h2 className="text-sm font-extrabold text-white">
                      🚀 GitHub রিপোজিটরিতে পুশ করুন
                    </h2>
                    <button
                      type="button"
                      onClick={() => setIsGithubModalOpen(false)}
                      className="rounded-lg bg-slate-800 px-2 py-1 text-xs text-slate-300"
                    >
                      ✕
                    </button>
                  </div>

                  <form onSubmit={handlePushToGitHub} className="space-y-2.5 text-xs">
                    <div>
                      <label className="mb-1 block text-slate-300">
                        GitHub Personal Access Token (repo scope)
                      </label>
                      <input
                        type="password"
                        required
                        value={ghToken}
                        onChange={(e) => setGhToken(e.target.value)}
                        placeholder="ghp_..."
                        className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="mb-1 block text-slate-300">Owner / Username</label>
                        <input
                          type="text"
                          required
                          value={ghOwner}
                          onChange={(e) => setGhOwner(e.target.value)}
                          className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100"
                        />
                      </div>
                      <div>
                        <label className="mb-1 block text-slate-300">Repository Name</label>
                        <input
                          type="text"
                          required
                          value={ghRepo}
                          onChange={(e) => setGhRepo(e.target.value)}
                          className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="mb-1 block text-slate-300">Branch</label>
                        <input
                          type="text"
                          value={ghBranch}
                          onChange={(e) => setGhBranch(e.target.value)}
                          className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100"
                        />
                      </div>
                      <div>
                        <label className="mb-1 block text-slate-300">Commit Message</label>
                        <input
                          type="text"
                          value={ghCommitMsg}
                          onChange={(e) => setGhCommitMsg(e.target.value)}
                          className="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-slate-100"
                        />
                      </div>
                    </div>

                    {ghPushStatus && (
                      <div
                        className={`rounded-xl border p-2 text-[11px] ${
                          ghPushStatus.ok
                            ? "border-emerald-500/40 bg-emerald-950/60 text-emerald-200"
                            : "border-rose-500/40 bg-rose-950/60 text-rose-200"
                        }`}
                      >
                        {ghPushStatus.msg}
                      </div>
                    )}

                    <div className="flex justify-end gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setIsGithubModalOpen(false)}
                        className="rounded-xl bg-slate-800 px-3.5 py-2 text-slate-300"
                      >
                        বন্ধ করুন
                      </button>
                      <button
                        type="submit"
                        disabled={isPushingGh}
                        className="rounded-xl bg-emerald-600 px-4 py-2 font-bold text-white hover:bg-emerald-500 disabled:opacity-50"
                      >
                        {isPushingGh
                          ? "পুশ হচ্ছে..."
                          : `সব ফাইল (${activeProject?.files?.length || 0}) পুশ করুন`}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<DroidAIStudioApp />);
    </script>
  </body>
</html>
