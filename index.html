      // =========================================================================
      // 4. GEMINI REST API ENGINE (v1beta + Active Model Filter + Auto-Cascading)
      // =========================================================================
      const DEFAULT_FALLBACK_MODELS = [
        { id: "gemini-3.8-flash", displayName: "Gemini 3.8 Flash" },
        { id: "gemini-2.5-flash", displayName: "Gemini 2.5 Flash" },
        { id: "gemini-2.5-flash-lite", displayName: "Gemini 2.5 Flash-Lite" },
        { id: "gemini-2.5-pro", displayName: "Gemini 2.5 Pro" },
        { id: "gemini-flash-latest", displayName: "Gemini Flash Latest" }
      ];

      const EXCLUDED_MODEL_PATTERNS = [
        "tts",
        "audio",
        "image",
        "imagen",
        "veo",
        "embedding",
        "aqa",
        "robotics",
        "computer-use",
        "customtools",
        "bisect",
        "learnlm"
      ];

      function isEligibleTextCodeModel(modelId) {
        const lower = String(modelId || "").toLowerCase();
        if (!lower.includes("gemini")) return false;
        return !EXCLUDED_MODEL_PATTERNS.some((bad) => lower.includes(bad));
      }

      const modelsCatalogCache = new Map();

      async function discoverTextCodeModels(apiKey) {
        const cleanKey = sanitizeApiKey(apiKey);
        if (!cleanKey) return DEFAULT_FALLBACK_MODELS;
        if (modelsCatalogCache.has(cleanKey)) {
          return modelsCatalogCache.get(cleanKey);
        }

        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 15000);
        try {
          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(cleanKey)}`,
            { signal: controller.signal }
          );
          clearTimeout(timer);
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData?.error?.message || `HTTP ${res.status}`);
          }
          const data = await res.json();
          const rawModels = Array.isArray(data.models) ? data.models : [];

          const filtered = rawModels
            .filter((m) => {
              const methods = Array.isArray(m.supportedGenerationMethods)
                ? m.supportedGenerationMethods
                : [];
              if (!methods.includes("generateContent")) return false;
              const shortId = String(m.name || "").replace(/^models\//, "");
              return isEligibleTextCodeModel(shortId);
            })
            .map((m) => ({
              id: String(m.name || "").replace(/^models\//, ""),
              displayName: m.displayName || String(m.name || "").replace(/^models\//, "")
            }));

          // Prioritize gemini-3.8-flash, then 2.5-flash, 2.5-flash-lite, 2.5-pro, etc.
          const priorityOrder = [
            "gemini-3.8-flash",
            "gemini-2.5-flash",
            "gemini-2.5-flash-lite",
            "gemini-2.5-pro",
            "gemini-flash-latest",
            "gemini-pro-latest"
          ];

          const sorted = [...filtered].sort((a, b) => {
            const ia = priorityOrder.indexOf(a.id);
            const ib = priorityOrder.indexOf(b.id);
            if (ia !== -1 && ib !== -1) return ia - ib;
            if (ia !== -1) return -1;
            if (ib !== -1) return 1;
            return a.id.localeCompare(b.id);
          });

          // Ensure gemini-3.8-flash is always at the top candidate list
          const has38 = sorted.some((m) => m.id === "gemini-3.8-flash");
          const finalCatalog = has38
            ? sorted
            : [{ id: "gemini-3.8-flash", displayName: "Gemini 3.8 Flash" }, ...sorted];

          modelsCatalogCache.set(cleanKey, finalCatalog);
          return finalCatalog;
        } catch (err) {
          clearTimeout(timer);
          throw err;
        }
      }

      const DEFAULT_AI_SETTINGS = {
        selectedModel: "gemini-3.8-flash",
        autoSwitch: true,
        temperature: 0.5,
        maxOutputTokens: 4096,
        systemInstruction:

      };

      function detectIntentMode(userText, explicitMode) {
        if (explicitMode === "chat" || explicitMode === "code") return explicitMode;
        const t = String(userText || "").toLowerCase();
        const codeKeywords = [
          "কোড",
          "ফাইল",
          "ফিক্স",
          "fix",
          "code",
          "file",
          "feature",
          "ফিচার",
          "activity",
          "xml",
          "kotlin",
          "java",
          "gradle",
          "manifest",
          "তৈরি করো",
          "যোগ করো",
          "বানাও",
          "error",
          "এরর",
          "bug",
          "বাগ",
          "বুঝিয়ে দাও"
        ];
        return codeKeywords.some((kw) => t.includes(kw)) ? "code" : "chat";
      }

      function parseGeneratedFiles(replyText) {
        const updates = [];
        const blockRegex = /<<<FILE:([^\n>]+)>>>\s*\n([\s\S]*?)<<<END_FILE>>>/g;
        let match;
        while ((match = blockRegex.exec(replyText)) !== null) {
          const cleanPath = match[1].trim();
          let codeBody = match[2];
          // Strip optional markdown code fences if model wrapped inside FILE block
          codeBody = codeBody.replace(/^```[a-zA-Z0-9_-]*\n/, "").replace(/\n```$/, "");
          if (cleanPath && codeBody.trim()) {
            updates.push({ path: cleanPath, content: codeBody.trimEnd() });
          }
        }
        return updates;
      }

        const [rtdbStatus, setRtdbStatus] = useState("লোকাল সেভ");

        const [projects, setProjects] = useState(() => {

        const activeProject = useMemo(() => {

        const [selectedFilePath, setSelectedFilePath] = useState(() => {

            const exists = activeProject.files.some((f) => f.path === selectedFilePath);
            if (!exists) {
              setSelectedFilePath(activeProject.files[0].path);

          }
        }, [activeProject, selectedFilePath]);

        const activeFile = useMemo(() => {
          if (!activeProject || !Array.isArray(activeProject.files)) return null;
          return activeProject.files.find((f) => f.path === selectedFilePath) || activeProject.files[0];
        }, [activeProject, selectedFilePath]);

        // --- Primary Mobile Navigation Tabs ---
        const [activeTab, setActiveTab] = useState("chat"); // 'chat' | 'code' | 'preview'

        // --- Strictly Isolated Per-User Gemini API Key (BYOK) ---
        const isHydratingKeyRef = useRef(false);

        const [discoveredModels, setDiscoveredModels] = useState(DEFAULT_FALLBACK_MODELS);

        // --- AI Studio Settings ---
        const [aiSettings, setAiSettings] = useState(() => {

            const recentTurns = updatedHistory.slice(-8).map((m) => ({

            let finalUserContent = promptText;
            if (intent === "code" && activeProject) {

                `<<<FILE:path/to/file>>>\n(সম্পূর্ণ কোড)\n<<<END_FILE>>>\nএবং বাংলায় সংক্ষিপ্ত ব্যাখ্যা দাও।`;

              intent === "chat"
                ? `${aiSettings.systemInstruction}\n[মোড: দ্রুত বাংলা কথোপকথন — সংক্ষিপ্ত, সাবলীল ও সরাসরি বাংলায় উত্তর দাও। অপ্রয়োজনীয় বড় কোড ফাইল ডাম্প কোরো না।]`

            let usedModelId = "";

                }

                const attemptAbort = new AbortController();

                  `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(
                    modelId

                    method: "POST",
                    headers: { "Content-Type": "application/json" },

                        parts: [{ text: systemPrompt }]
                      },
                      contents: recentTurns,
                      generationConfig: {
                        temperature: Number(aiSettings.temperature) || 0.5,
                        maxOutputTokens:
                          intent === "chat"
                            ? Math.min(Number(aiSettings.maxOutputTokens) || 2048, 2048)
                            : Number(aiSettings.maxOutputTokens) || 4096
                      }
                    })
                  }
                );

                clearTimeout(perModelTimer);
                clearTimeout(reqTimeout);
                controller.signal.removeEventListener("abort", onParentAbort);

                  const status = response.status;
                  const msg = errPayload?.error?.message || `HTTP ${status}`;

                    continue;

                  throw new Error(lastErrMessage);

                const data = await response.json();

                  data?.candidates?.[0]?.content?.parts
                    ?.map((p) => p.text || "")
                    .join("")
                    .trim() || "";

                  if (aiSettings.autoSwitch) continue;

                }

                role: "assistant",
                text: replyText + fileSummaryNote,

          } catch (err) {

              ...prev,
              {

              Accept: "application/vnd.github+json",
              "Content-Type": "application/json"
            };
            let uploadedCount = 0;

                : file.path;
              const apiUrl = `https://api.github.com/repos/${encodeURIComponent(
                ghConfig.owner.trim()
              )}/${encodeURIComponent(ghConfig.repo.trim())}/contents/${targetPath}`;

              let existingSha = undefined;
              const checkRes = await fetch(
                `${apiUrl}?ref=${encodeURIComponent(ghConfig.branch.trim() || "main")}`,

                existingSha = checkJson.sha;
              }

              const encodedContent = btoa(unescape(encodeURIComponent(file.content)));

                method: "PUT",
                headers,
                body: JSON.stringify({
                  message: ghConfig.message || `Update ${file.path}`,

                  branch: ghConfig.branch.trim() || "main",

                })
              });

                            ? "bg-blue-600/30 border border-blue-500/40 text-white"
                            : msg.isError
                            ? "bg-rose-950/60 border border-rose-500/40 text-rose-200"
                            : "bg-slate-900 border border-slate-800 text-slate-100"
                        }`}
                      >
                        <div className="mb-1 flex items-center justify-between gap-3 text-[10px] text-slate-400">
                          <span className="font-semibold">
                            {msg.role === "user" ? "আপনি" : "Gemini AI"}
                          </span>
                          {msg.modelUsed && (
                            <span className="rounded bg-slate-800 px-1.5 py-0.5 font-mono text-[9px] text-emerald-300">
                              {msg.modelUsed}
                            </span>
                          )}
                        </div>
                        <div className="whitespace-pre-wrap break-words">{msg.text}</div>
                      </div>
                    </div>
                  ))}

                  {isGenerating && (
                    <div className="flex items-center justify-between gap-2 rounded-2xl border border-emerald-500/30 bg-emerald-950/30 px-3.5 py-2.5 text-xs text-emerald-300">
                      <span className="animate-pulse">{liveStatusText || "Gemini চিন্তা করছে..."}</span>
                      <button
                        type="button"
                        onClick={handleStopGeneration}
                        className="shrink-0 rounded-lg bg-rose-600 px-2.5 py-1 text-[11px] font-bold text-white hover:bg-rose-500"
                      >
                        থামান
                      </button>
                    </div>
                  )}
                  <div ref={chatEndRef} />
                </div>

                {/* Sticky Bottom Chat Composer */}
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    handleSendMessage();
                  }}
                  className="shrink-0 border-t border-slate-800 bg-slate-900 px-3 py-2"
                >
                  <div className="mb-1.5 flex items-center gap-1.5">
                    <span className="text-[10px] text-slate-400">মোড:</span>
                    {[
                      { id: "auto", label: "অটো" },
                      { id: "chat", label: "চ্যাট (দ্রুত)" },
                      { id: "code", label: "কোড-ফিক্স" }
                    ].map((m) => (
                      <button
                        key={m.id}
                        type="button"
                        onClick={() => setChatMode(m.id)}
                        className={`rounded-lg px-2 py-0.5 text-[10px] font-semibold ${
                          chatMode === m.id
                            ? "bg-emerald-600 text-white"
                            : "bg-slate-800 text-slate-400"
                        }`}
                      >
                        {m.label}
                      </button>
                    ))}
                  </div>
                  <div className="flex items-center gap-2">
                    <input
                      type="text"
                      value={chatInput}
                      onChange={(e) => setChatInput(e.target.value)}
                      placeholder="বাংলায় চ্যাট করুন বা কোড/ফিক্স লিখুন..."
                      className="min-w-0 flex-1 rounded-xl border border-slate-700 bg-slate-950 px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:border-emerald-500 focus:outline-none"
                    />
                    <button
                      type="submit"
                      disabled={isGenerating || !chatInput.trim()}
                      className="shrink-0 rounded-xl bg-emerald-600 px-4 py-2.5 text-xs font-bold text-white hover:bg-emerald-500 disabled:opacity-40"
                    >
                      পাঠান
                    </button>
                  </div>
                </form>
              </main>
            )}

            {/* =================================================================
                TAB 2: ANDROID CODE EDITOR & FILE EXPLORER
               ================================================================= */}
            {activeTab === "code" && (
              <main className="flex min-h-0 flex-1 flex-col">
                {/* File Selector Bar */}
                <div className="flex shrink-0 items-center gap-1.5 border-b border-slate-800 bg-slate-900 px-3 py-2">
                  <select
                    value={activeFile?.path || ""}
                    onChange={(e) => setSelectedFilePath(e.target.value)}
                    className="min-w-0 flex-1 rounded-xl border border-slate-700 bg-slate-950 px-2.5 py-1.5 text-xs text-emerald-300 focus:outline-none"
                  >
                    {(activeProject?.files || []).map((f) => (
                      <option key={f.path} value={f.path}>
                        {f.path}
                      </option>
                    ))}
                  </select>
                  <button
                    type="button"
                    onClick={() => setIsNewFileOpen(true)}
                    className="shrink-0 rounded-xl border border-slate-700 bg-slate-800 px-2.5 py-1.5 text-xs font-semibold text-emerald-300 hover:bg-slate-700"
                  >
                    + ফাইল
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      if (!activeFile) return;
                      const ta = document.createElement("textarea");
                      ta.value = activeFile.content;
                      document.body.appendChild(ta);
                      ta.select();
                      try {
                        document.execCommand("copy");
                      } catch (_) {}
                      document.body.removeChild(ta);
                    }}
                    className="shrink-0 rounded-xl border border-slate-700 bg-slate-800 px-2.5 py-1.5 text-xs text-slate-200 hover:bg-slate-700"
                  >
                    কপি
                  </button>
                </div>

                {/* Editable Code Textarea */}
                <div className="min-h-0 flex-1 bg-slate-950 p-2">
                  <textarea
                    value={activeFile?.content || ""}
                    onChange={(e) => handleUpdateActiveFileContent(e.target.value)}
                    spellCheck={false}
                    className="code-font h-full w-full resize-none rounded-xl border border-slate-800 bg-slate-900/70 p-3 text-xs leading-relaxed text-slate-100 focus:border-emerald-500 focus:outline-none"
                  />
                </div>
              </main>
            )}

            {/* =================================================================
                TAB 3: LIVE ANDROID APP RUNNER PREVIEW
               ================================================================= */}
            {activeTab === "preview" && (
              <main className="flex min-h-0 flex-1 flex-col items-center justify-center overflow-y-auto bg-slate-950 p-4">
                {/* Simulated Android Phone Frame */}
                <div
                  className={`flex h-full max-h-[620px] w-full max-w-[360px] flex-col overflow-hidden rounded-[2rem] border-4 border-slate-800 shadow-2xl transition-colors ${
                    previewDarkMode ? "bg-slate-900 text-slate-100" : "bg-slate-100 text-slate-900"
                  }`}
                >
                  {/* Android Status Bar */}
                  <div className="flex items-center justify-between bg-black/30 px-5 py-1.5 text-[10px] font-semibold">
                    <span>12:30</span>
                    <span>{activeProject?.packageName || "com.droid.banglanews"}</span>
                    <span>5G 100%</span>
                  </div>

                  {/* App Toolbar */}
                  <div className="flex items-center justify-between border-b border-slate-700/30 px-4 py-3">
                    <div>
                      <h2 className="text-base font-bold text-emerald-500">
                        {activeProject?.name || "Bangla News"}
                      </h2>
                      <p className="text-[10px] opacity-75">
                        আজকের শীর্ষ সংবাদ ({filteredMockArticles.length}টি)
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => {
                        const next = !previewDarkMode;
                        setPreviewDarkMode(next);
                        showPreviewToast(next ? "ডার্ক মোড চালু" : "লাইট মোড চালু");
                      }}
                      className="rounded-xl bg-emerald-600 px-3 py-1.5 text-[11px] font-bold text-white shadow"
                    >
                      থিম বদলান
                    </button>
                  </div>

                  {/* Category Chips */}
                  <div className="flex gap-1.5 overflow-x-auto px-4 py-2">
                    {["সব", "প্রযুক্তি", "জাতীয়", "খেলাধুলা"].map((cat) => (
                      <button
                        key={cat}
                        type="button"
                        onClick={() => setPreviewCategory(cat)}
                        className={`shrink-0 rounded-full px-3 py-1 text-[11px] font-semibold ${
                          previewCategory === cat
                            ? "bg-emerald-600 text-white"
                            : "bg-slate-700/30 opacity-80"
                        }`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>

                  {/* News Cards RecyclerView Simulation */}
                  <div className="min-h-0 flex-1 space-y-2.5 overflow-y-auto px-4 py-2">
                    {filteredMockArticles.map((art) => (
                      <div
                        key={art.id}
                        onClick={() => showPreviewToast(`খোলা হচ্ছে: ${art.title}`)}
                        className={`cursor-pointer rounded-2xl border p-3 transition hover:scale-[1.01] ${
                          previewDarkMode
                            ? "border-slate-800 bg-slate-950/80"
                            : "border-slate-300 bg-white shadow-sm"
                        }`}
                      >
                        <div className="mb-1 flex items-center justify-between text-[10px]">
                          <span className="rounded bg-emerald-500/20 px-2 py-0.5 font-semibold text-emerald-400">
                            {art.cat}
                          </span>
                          <span className="opacity-60">{art.time}</span>
                        </div>
                        <h3 className="mb-1 text-xs font-bold leading-snug">{art.title}</h3>
                        <p className="text-[11px] leading-relaxed opacity-75">{art.summary}</p>
                      </div>
                    ))}
                  </div>

                  {/* Simulated Android Toast */}
                  {previewToast && (
                    <div className="mx-auto mb-3 rounded-full bg-slate-800 px-4 py-1.5 text-[11px] font-medium text-white shadow-lg">
                      {previewToast}
                    </div>
                  )}
                </div>
              </main>
            )}

            {/* =================================================================
                MODAL 1: FIREBASE AUTHENTICATION (BYOK ISOLATED ACCOUNT)
               ================================================================= */}
            {isAuthModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
                <div className="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-5 shadow-2xl">
                  <div className="mb-3 flex items-center justify-between">
                    <h3 className="text-base font-bold text-white">অ্যাকাউন্ট ও ক্লাউড সিঙ্ক</h3>
                    <button
                      type="button"
                      onClick={() => setIsAuthModalOpen(false)}
                      className="text-slate-400 hover:text-white"
                    >
                      ✕
                    </button>
                  </div>

                  {userSession && !userSession.isGuest ? (
                    <div className="space-y-3 text-xs">
                      <div className="rounded-xl border border-emerald-500/30 bg-emerald-950/40 p-3 text-emerald-200">
                        <p className="font-bold">লগইন সম্পন্ন: {userSession.email}</p>
                        <p className="mt-1 break-all font-mono text-[10px] text-slate-300">
                          UID: {userSession.uid}
                        </p>
                        <p className="mt-1.5 text-[11px] text-emerald-300">
                          🔒 আপনার Gemini API Key ও প্রজেক্ট কেবল আপনার এই UID-এর অধীনে সুরক্ষিত আছে।
                        </p>
                      </div>
                      <button
                        type="button"
                        onClick={handleLogout}
                        className="w-full rounded-xl bg-rose-600 py-2.5 font-bold text-white hover:bg-rose-500"
                      >
                        লগআউট করুন (কী মেমোরি থেকে মুছুন)
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={handleEmailAuth} className="space-y-3 text-xs">
                      <p className="text-[11px] text-slate-400">
                        লগইন করলে আপনার নিজস্ব Gemini API Key ও প্রজেক্ট আলাদাভাবে আপনার অ্যাকাউন্টে সেভ থাকবে।
                      </p>
                      <div>
                        <label className="mb-1 block text-slate-300">ইমেইল</label>
                        <input
                          type="email"
                          required
                          value={authEmail}
                          onChange={(e) => setAuthEmail(e.target.value)}
                          placeholder="you@example.com"
                          className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-white"
                        />
                      </div>
                      <div>
                        <label className="mb-1 block text-slate-300">পাসওয়ার্ড</label>
                        <input
                          type="password"
                          required
                          minLength={6}
                          value={authPassword}
                          onChange={(e) => setAuthPassword(e.target.value)}
                          placeholder="কমপক্ষে ৬ অক্ষর"
                          className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-white"
                        />
                      </div>
                      {authError && (
                        <div className="rounded-xl bg-rose-950/70 p-2 text-rose-200">{authError}</div>
                      )}
                      <button
                        type="submit"
                        disabled={authLoading}
                        className="w-full rounded-xl bg-emerald-600 py-2.5 font-bold text-white hover:bg-emerald-500 disabled:opacity-50"
                      >
                        {authLoading ? "যাচাই হচ্ছে..." : "ইমেইল দিয়ে লগইন / সাইনআপ"}
                      </button>
                      <button
                        type="button"
                        disabled={authLoading}
                        onClick={handleGoogleAuth}
                        className="w-full rounded-xl border border-blue-500/40 bg-blue-950/50 py-2 font-semibold text-blue-200 hover:bg-blue-900/60 disabled:opacity-50"
                      >
                        Google অ্যাকাউন্ট দিয়ে লগইন
                      </button>
                      <button
                        type="button"
                        onClick={handleGuestContinue}
                        className="w-full rounded-xl border border-slate-700 bg-slate-800 py-2 font-semibold text-slate-300 hover:bg-slate-700"
                      >
                        Guest হিসেবে চালিয়ে যান
                      </button>
                    </form>
                  )}
                </div>
              </div>
            )}

            {/* =================================================================
                MODAL 2: NEW ANDROID PROJECT
               ================================================================= */}
            {isNewProjectOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
                <div className="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-5 shadow-2xl">
                  <h3 className="mb-3 text-base font-bold text-white">নতুন Android প্রজেক্ট</h3>
                  <form onSubmit={handleCreateProject} className="space-y-3 text-xs">
                    <div>
                      <label className="mb-1 block text-slate-300">অ্যাপের নাম</label>
                      <input
                        required
                        value={newProjName}
                        onChange={(e) => setNewProjName(e.target.value)}
                        placeholder="যেমন: Islamic Guide"
                        className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-white"
                      />
                    </div>
                    <div>
                      <label className="mb-1 block text-slate-300">Package Name</label>
                      <input
                        required
                        value={newProjPackage}
                        onChange={(e) => setNewProjPackage(e.target.value)}
                        className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-white"
                      />
                    </div>
                    <div className="flex justify-end gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setIsNewProjectOpen(false)}
                        className="rounded-xl bg-slate-800 px-3.5 py-2 text-slate-300"
                      >
                        বাতিল
                      </button>
                      <button
                        type="submit"
                        className="rounded-xl bg-emerald-600 px-4 py-2 font-bold text-white"
                      >
                        তৈরি করুন
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* =================================================================
                MODAL 3: NEW FILE
               ================================================================= */}
            {isNewFileOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
                <div className="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-5 shadow-2xl">
                  <h3 className="mb-3 text-base font-bold text-white">নতুন ফাইল যোগ করুন</h3>
                  <form onSubmit={handleCreateFile} className="space-y-3 text-xs">
                    <input
                      required
                      value={newFilePathInput}
                      onChange={(e) => setNewFilePathInput(e.target.value)}
                      placeholder="app/src/main/java/com/droid/banglanews/DetailActivity.kt"
                      className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-white"
                    />
                    <div className="flex justify-end gap-2">
                      <button
                        type="button"
                        onClick={() => setIsNewFileOpen(false)}
                        className="rounded-xl bg-slate-800 px-3.5 py-2 text-slate-300"
                      >
                        বাতিল
                      </button>
                      <button
                        type="submit"
                        className="rounded-xl bg-emerald-600 px-4 py-2 font-bold text-white"
                      >
                        যোগ করুন
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* =================================================================
                MODAL 4: GITHUB PUSH
               ================================================================= */}
            {isGhModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
                <div className="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-5 shadow-2xl">
                  <div className="mb-3 flex items-center justify-between">
                    <h3 className="text-base font-bold text-white">GitHub-এ পুশ করুন</h3>
                    <button
                      type="button"
                      onClick={() => setIsGhModalOpen(false)}
                      className="text-slate-400 hover:text-white"
                    >
                      ✕
                    </button>
                  </div>
                  <form onSubmit={handlePushGitHub} className="space-y-3 text-xs">
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="mb-1 block text-slate-300">Owner</label>
                        <input
                          required
                          value={ghConfig.owner}
                          onChange={(e) => setGhConfig({ ...ghConfig, owner: e.target.value })}
                          className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-white"
                        />
                      </div>
                      <div>
                        <label className="mb-1 block text-slate-300">Repository</label>
                        <input
                          required
                          value={ghConfig.repo}
                          onChange={(e) => setGhConfig({ ...ghConfig, repo: e.target.value })}
                          className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-white"
                        />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="mb-1 block text-slate-300">Branch</label>
                        <input
                          required
                          value={ghConfig.branch}
                          onChange={(e) => setGhConfig({ ...ghConfig, branch: e.target.value })}
                          className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-white"
                        />
                      </div>
                      <div>
                        <label className="mb-1 block text-slate-300">Folder Prefix</label>
                        <input
                          value={ghConfig.prefix}
                          onChange={(e) => setGhConfig({ ...ghConfig, prefix: e.target.value })}
                          className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-white"
                        />
                      </div>
                    </div>
                    <div>
                      <label className="mb-1 block text-slate-300">GitHub Personal Token</label>
                      <input
                        type="password"
                        required
                        value={ghConfig.token}
                        onChange={(e) => setGhConfig({ ...ghConfig, token: e.target.value })}
                        placeholder="ghp_..."
                        className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-white"
                      />
                    </div>
                    <div>
                      <label className="mb-1 block text-slate-300">Commit Message</label>
                      <input
                        value={ghConfig.message}
                        onChange={(e) => setGhConfig({ ...ghConfig, message: e.target.value })}
                        className="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-white"
                      />
                    </div>
                    {ghStatus && (
                      <div className="rounded-xl bg-slate-800 p-2.5 text-emerald-300">{ghStatus}</div>
                    )}
                    <div className="flex justify-end gap-2 pt-2">
                      <button
                        type="button"
                        onClick={() => setIsGhModalOpen(false)}
                        className="rounded-xl bg-slate-800 px-3.5 py-2 text-slate-300"
                      >
                        বন্ধ
                      </button>
                      <button
                        type="submit"
                        disabled={isPushingGh}
                        className="rounded-xl bg-blue-600 px-4 py-2 font-bold text-white hover:bg-blue-500 disabled:opacity-50"
                      >
                        {isPushingGh ? "পুশ হচ্ছে..." : "Push Now"}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      const rootEl = document.getElementById("root");
      if (rootEl) {
        ReactDOM.createRoot(rootEl).render(
          <ErrorBoundary>
            <App />
          </ErrorBoundary>
        );
      }
    </script>
  </body>
</html>
