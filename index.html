<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Droid AI Studio — Android AI Code Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase v10.14.1 Compat SDKs for Live Email Auth & Firestore User/Project Sync -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo, useEffect } = React;

      // =========================================================================
      // 🔥 MANUAL FIREBASE CONFIGURATION (এখানে আপনার Firebase Config পেস্ট করুন)
      // Firebase Console -> Project Settings -> General -> Your apps -> Web app
      // =========================================================================
      const FIREBASE_CONFIG = {
        apiKey: "YOUR_FIREBASE_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
      };

      /*
       * 🔒 RECOMMENDED FIRESTORE SECURITY RULES (Firebase Console -> Firestore -> Rules):
       *
       * rules_version = '2';
       * service cloud.firestore {
       *   match /databases/{database}/documents {
       *     match /users/{uid} {
       *       allow read, write: if request.auth != null && request.auth.uid == uid;
       *       match /projects/{projectId} {
       *         allow read, write: if request.auth != null && request.auth.uid == uid;
       *       }
       *     }
       *     match /user_emails/{emailKey} {
       *       allow read: if true;
       *       allow write: if request.auth != null;
       *     }
       *   }
       * }
       */
      // =========================================================================

      // Persistent localStorage keys
      const STORAGE_KEY = "droid_ai_studio_projects_v1";
      const SIM_USERS_STORAGE_KEY = "droid_ai_studio_sim_users_v1";
      const SIM_SESSION_STORAGE_KEY = "droid_ai_studio_sim_session_v1";

      function isFirebaseConfigReady(cfg) {
        return Boolean(
          cfg &&
            typeof cfg.apiKey === "string" &&
            cfg.apiKey.trim().length > 10 &&
            !cfg.apiKey.includes("YOUR_FIREBASE_API_KEY") &&
            !cfg.apiKey.includes("YOUR_API_KEY") &&
            typeof cfg.projectId === "string" &&
            cfg.projectId.trim().length > 2 &&
            !cfg.projectId.includes("YOUR_PROJECT_ID")
        );
      }

      function normalizeEmailKey(email) {
        return String(email || "")
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9@._-]/g, "_");
      }

      function generateBackendUid() {
        if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
          return "uid_" + crypto.randomUUID().replace(/-/g, "").slice(0, 24);
        }
        return "uid_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 14);
      }

      function initFirebaseServices(cfg) {
        if (!isFirebaseConfigReady(cfg) || typeof firebase === "undefined") {
          return { mode: "local", app: null, auth: null, db: null };
        }
        try {
          const appName = "droid-studio-" + cfg.projectId.trim() + "-" + cfg.apiKey.trim().slice(-6);
          const existingApp = firebase.apps?.find((a) => a.name === appName);
          const app = existingApp || firebase.initializeApp(cfg, appName);
          const auth = firebase.auth(app);
          const db = firebase.firestore(app);
          return { mode: "firebase", app, auth, db };
        } catch (err) {
          console.error("Firebase initialization failed:", err);
          return { mode: "local", app: null, auth: null, db: null, error: String(err) };
        }
      }

      // All 7 Android Studio Project Language Options
      const LANGUAGE_OPTIONS = [
        {
          id: "kotlin-compose",
          label: "Kotlin (Jetpack Compose — Modern UI)",
          shortLabel: "Kotlin • Compose",
          ext: "kt"
        },
        {
          id: "kotlin-xml",
          label: "Kotlin (XML Views — Traditional)",
          shortLabel: "Kotlin • XML",
          ext: "kt"
        },
        {
          id: "java-xml",
          label: "Java (XML Views — Classic)",
          shortLabel: "Java • XML",
          ext: "java"
        },
        {
          id: "java-compose",
          label: "Java (Jetpack Compose)",
          shortLabel: "Java • Compose",
          ext: "java"
        },
        {
          id: "cpp-kotlin-jni",
          label: "C++ / Native JNI (Kotlin + CMake)",
          shortLabel: "C++ • Kotlin JNI",
          ext: "kt"
        },
        {
          id: "cpp-java-jni",
          label: "C++ / Native JNI (Java + CMake)",
          shortLabel: "C++ • Java JNI",
          ext: "java"
        },
        {
          id: "kmp-android",
          label: "Kotlin Multiplatform (KMP Android Target)",
          shortLabel: "KMP • Android",
          ext: "kt"
        }
      ];

      // Target / Compile SDK Options (API 36 Android 16 down to API 28 Android 9)
      const TARGET_SDK_OPTIONS = [
        { api: 36, label: "API 36 — Android 16 (Baklava / Latest)", version: "16" },
        { api: 35, label: "API 35 — Android 15 (Vanilla Ice Cream)", version: "15" },
        { api: 34, label: "API 34 — Android 14 (Upside Down Cake)", version: "14" },
        { api: 33, label: "API 33 — Android 13 (Tiramisu)", version: "13" },
        { api: 32, label: "API 32 — Android 12L (Sv2)", version: "12L" },
        { api: 31, label: "API 31 — Android 12 (Snow Cone)", version: "12" },
        { api: 30, label: "API 30 — Android 11 (Red Velvet Cake)", version: "11" },
        { api: 29, label: "API 29 — Android 10 (Quince Tart)", version: "10" },
        { api: 28, label: "API 28 — Android 9 (Pie)", version: "9" }
      ];

      // Minimum SDK Options (API 31 down to API 21) with cumulative device support percentages
      const MIN_SDK_OPTIONS = [
        { api: 21, label: "API 21 — Android 5.0 (Lollipop)", coverage: "~99.8%" },
        { api: 22, label: "API 22 — Android 5.1 (Lollipop MR1)", coverage: "~99.7%" },
        { api: 23, label: "API 23 — Android 6.0 (Marshmallow)", coverage: "~99.6%" },
        { api: 24, label: "API 24 — Android 7.0 (Nougat)", coverage: "~99.4%" },
        { api: 25, label: "API 25 — Android 7.1 (Nougat MR1)", coverage: "~99.2%" },
        { api: 26, label: "API 26 — Android 8.0 (Oreo)", coverage: "~99.0%" },
        { api: 27, label: "API 27 — Android 8.1 (Oreo MR1)", coverage: "~98.6%" },
        { api: 28, label: "API 28 — Android 9 (Pie)", coverage: "~97.8%" },
        { api: 29, label: "API 29 — Android 10 (Q)", coverage: "~95.4%" },
        { api: 30, label: "API 30 — Android 11 (R)", coverage: "~91.2%" },
        { api: 31, label: "API 31 — Android 12 (S)", coverage: "~84.5%" }
      ];

      function getLanguageMeta(langId) {
        return LANGUAGE_OPTIONS.find((l) => l.id === langId) || LANGUAGE_OPTIONS[0];
      }

      function getMinSdkMeta(api) {
        return MIN_SDK_OPTIONS.find((m) => m.api === Number(api)) || MIN_SDK_OPTIONS[0];
      }

      function getTargetSdkMeta(api) {
        return TARGET_SDK_OPTIONS.find((t) => t.api === Number(api)) || TARGET_SDK_OPTIONS[0];
      }

      function buildStarterFiles({ safeName, pkg, languageId, minSdk, targetSdk }) {
        const pkgPath = pkg.replace(/\./g, "/");
        const jniPkg = pkg.replace(/\./g, "_");
        const files = [];

        if (languageId === "kotlin-compose" || languageId === "kmp-android") {
          files.push({
            path: `app/src/main/java/${pkgPath}/MainActivity.kt`,
            language: "kotlin",
            content: `package ${pkg}

import android.os.Bundle
import androidx.activity.ComponentActivity
import androidx.activity.compose.setContent
import androidx.compose.foundation.layout.*
import androidx.compose.material3.*
import androidx.compose.runtime.Composable
import androidx.compose.ui.Modifier
import androidx.compose.ui.unit.dp

class MainActivity : ComponentActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContent {
            MaterialTheme {
                Surface(modifier = Modifier.fillMaxSize()) {
                    MainScreen("${safeName}")
                }
            }
        }
    }
}

@Composable
fun MainScreen(appName: String) {
    Column(modifier = Modifier.padding(24.dp)) {
        Text(text = appName, style = MaterialTheme.typography.headlineMedium)
        Spacer(modifier = Modifier.height(8.dp))
        Text(text = "Language: ${getLanguageMeta(languageId).shortLabel} | minSdk ${minSdk}, targetSdk ${targetSdk}")
    }
}
`
          });
        } else if (languageId === "kotlin-xml") {
          files.push({
            path: `app/src/main/java/${pkgPath}/MainActivity.kt`,
            language: "kotlin",
            content: `package ${pkg}

import android.os.Bundle
import android.widget.TextView
import androidx.appcompat.app.AppCompatActivity

class MainActivity : AppCompatActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        setContentView(R.layout.activity_main)
        findViewById<TextView>(R.id.tvAppTitle)?.text = "${safeName}"
    }
}
`
          });
          files.push({
            path: "app/src/main/res/layout/activity_main.xml",
            language: "xml",
            content: `<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:gravity="center"
    android:orientation="vertical"
    android:padding="24dp">

    <ImageView
        android:id="@+id/ivAppLogo"
        android:layout_width="72dp"
        android:layout_height="72dp"
        android:src="@mipmap/ic_launcher"
        android:contentDescription="@string/app_name" />

    <TextView
        android:id="@+id/tvAppTitle"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:layout_marginTop="16dp"
        android:text="@string/app_name"
        android:textSize="22sp"
        android:textStyle="bold" />
</LinearLayout>
`
          });
        } else if (languageId === "java-xml" || languageId === "java-compose") {
          files.push({
            path: `app/src/main/java/${pkgPath}/MainActivity.java`,
            language: "java",
            content: `package ${pkg};

import android.os.Bundle;
import android.widget.TextView;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        if (titleView != null) {
            titleView.setText("${safeName}");
        }
    }
}
`
          });
          files.push({
            path: "app/src/main/res/layout/activity_main.xml",
            language: "xml",
            content: `<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:gravity="center"
    android:orientation="vertical"
    android:padding="24dp">

    <ImageView
        android:id="@+id/ivAppLogo"
        android:layout_width="72dp"
        android:layout_height="72dp"
        android:src="@mipmap/ic_launcher"
        android:contentDescription="@string/app_name" />

    <TextView
        android:id="@+id/tvAppTitle"
        android:layout_width="wrap_content"
        android:layout_height="wrap_content"
        android:layout_marginTop="16dp"
        android:text="@string/app_name"
        android:textSize="22sp"
        android:textStyle="bold" />
</LinearLayout>
`
          });
        } else if (languageId === "cpp-kotlin-jni") {
          files.push({
            path: `app/src/main/java/${pkgPath}/MainActivity.kt`,
            language: "kotlin",
            content: `package ${pkg}

import android.os.Bundle
import androidx.activity.ComponentActivity
import androidx.activity.compose.setContent

import androidx.compose.material3.*

        }

    external fun stringFromJNI(): String

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        val nativeBanner = stringFromJNI()
        setContent {
            MaterialTheme {
                Surface(modifier = Modifier.fillMaxSize()) {
                    Column(modifier = Modifier.padding(24.dp)) {
                        Text(text = "${safeName}", style = MaterialTheme.typography.headlineMedium)
                        Spacer(modifier = Modifier.height(8.dp))
                        Text(text = nativeBanner)
                    }
                }
            }
        }
    }
}
`
          });
          files.push({
            path: "app/src/main/cpp/native-lib.cpp",
            language: "cpp",
            content: `#include <jni.h>
#include <string>

extern "C" JNIEXPORT jstring JNICALL
Java_${jniPkg}_MainActivity_stringFromJNI(JNIEnv* env, jobject /* this */) {
    std::string hello = "C++ JNI Engine Active for ${safeName}";
    return env->NewStringUTF(hello.c_str());
}
`
          });
          files.push({
            path: "app/src/main/cpp/CMakeLists.txt",
            language: "cmake",
            content: `cmake_minimum_required(VERSION 3.22.1)
project("${safeName.replace(/[^a-zA-Z0-9_]/g, "_")}")

add_library(native-lib SHARED native-lib.cpp)

find_library(log-lib log)
target_link_libraries(native-lib \${log-lib})
`
          });
        } else if (languageId === "cpp-java-jni") {
          files.push({
            path: `app/src/main/java/${pkgPath}/MainActivity.java`,
            language: "java",
            content: `package ${pkg};

import android.os.Bundle;
import android.widget.TextView;

`
          });
          files.push({
            path: "app/src/main/cpp/native-lib.cpp",
            language: "cpp",
            content: `#include <jni.h>
#include <string>

extern "C" JNIEXPORT jstring JNICALL
Java_${jniPkg}_MainActivity_stringFromJNI(JNIEnv* env, jobject /* this */) {
    std::string hello = "C++ Java JNI Active for ${safeName}";
    return env->NewStringUTF(hello.c_str());

`
          });
          files.push({
            path: "app/src/main/cpp/CMakeLists.txt",
            language: "cmake",
            content: `cmake_minimum_required(VERSION 3.22.1)
project("${safeName.replace(/[^a-zA-Z0-9_]/g, "_")}")

add_library(native-lib SHARED native-lib.cpp)

find_library(log-lib log)
target_link_libraries(native-lib \${log-lib})
`
          });
        }

        // Common Android resource & build files
        files.push({
          path: "app/src/main/res/values/strings.xml",
          language: "xml",
          content: `<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">${safeName}</string>
</resources>
`
        });

        files.push({
          path: "app/src/main/AndroidManifest.xml",
          language: "xml",
          content: `<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.RECORD_AUDIO" />
    <uses-permission android:name="android.permission.CAMERA" />

    <application
        android:allowBackup="true"
        android:label="@string/app_name"
        android:icon="@mipmap/ic_launcher"
        android:roundIcon="@mipmap/ic_launcher_round"
        android:supportsRtl="true"
        android:theme="@style/Theme.Material3.DayNight.NoActionBar">
        <activity
            android:name=".MainActivity"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
`
        });

        const isCpp = languageId.startsWith("cpp-");
        files.push({
          path: "app/build.gradle.kts",
          language: "kotlin",
          content: `plugins {
    id("com.android.application")
    ${languageId.includes("java") && !languageId.includes("kotlin") ? "" : 'id("org.jetbrains.kotlin.android")'}
}

android {
    namespace = "${pkg}"
    compileSdk = ${targetSdk}

    defaultConfig {
        applicationId = "${pkg}"
        minSdk = ${minSdk}
        targetSdk = ${targetSdk}
        versionCode = 1
        versionName = "1.0"
    }${
      isCpp
        ? `

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }`
        : ""
    }
}
`
        });

        return files;
      }

      function applyLogoBindingToFiles(files, logoDataUrl, logoFileName) {
        let nextFiles = files.filter(
          (f) =>
            f.path !== "app/src/main/res/drawable/app_logo_base64.txt" &&
            f.path !== "app/src/main/res/values/app_logo_config.xml"
        );

        nextFiles = nextFiles.map((f) => {
          if (f.path.endsWith("AndroidManifest.xml")) {
            const updatedManifest = f.content
              .replace(/android:icon="[^"]*"/, 'android:icon="@mipmap/ic_launcher"')
              .replace(/android:roundIcon="[^"]*"/, 'android:roundIcon="@mipmap/ic_launcher_round"');
            return { ...f, content: updatedManifest };
          }
          return f;
        });

        if (logoDataUrl) {
          nextFiles.push({
            path: "app/src/main/res/values/app_logo_config.xml",
            language: "xml",
            content: `<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_logo_filename">${logoFileName || "ic_launcher.png"}</string>
    <bool name="has_custom_app_logo">true</bool>
</resources>
`
          });
          nextFiles.push({
            path: "app/src/main/res/drawable/app_logo_base64.txt",
            language: "text",
            content: `Bound App Logo File: ${logoFileName || "ic_launcher.png"}\nTarget Resource: @mipmap/ic_launcher & @mipmap/ic_launcher_round\nData URL:\n${logoDataUrl}`
          });
        }

        return nextFiles;
      }

      function createAndroidProject({
        id,
        name,
        packageName,
        description,
        languageId = "kotlin-compose",
        minSdk = 21,
        targetSdk = 36,
        logoDataUrl,
        logoFileName,
        existingFiles,
        regenerateStarter = false
      }) {
        const safeName = (name || "IMO Studio App").trim();
        const pkg = (packageName || "com.example.imostudio").trim();
        const safeMinSdk = Math.min(Number(minSdk) || 21, Number(targetSdk) || 36);
        const safeTargetSdk = Math.max(Number(targetSdk) || 36, safeMinSdk);
        const pkgPath = pkg.replace(/\./g, "/");

        let files;
        if (!regenerateStarter && Array.isArray(existingFiles) && existingFiles.length > 0) {
          files = existingFiles.map((f) => {
            if (f.path.endsWith("strings.xml")) {
              return {
                ...f,
                content: `<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">${safeName}</string>\n</resources>\n`
              };
            }
            if (f.path.endsWith("build.gradle.kts")) {
              return {
                ...f,
                content: f.content
                  .replace(/namespace\s*=\s*"[^"]*"/, `namespace = "${pkg}"`)
                  .replace(/applicationId\s*=\s*"[^"]*"/, `applicationId = "${pkg}"`)
                  .replace(/compileSdk\s*=\s*\d+/, `compileSdk = ${safeTargetSdk}`)
                  .replace(/minSdk\s*=\s*\d+/, `minSdk = ${safeMinSdk}`)
                  .replace(/targetSdk\s*=\s*\d+/, `targetSdk = ${safeTargetSdk}`)
              };
            }
            if (f.path.endsWith("MainActivity.kt")) {
              const updatedPkg = f.content.replace(/^package\s+[^\s]+/m, `package ${pkg}`);
              return {
                path: `app/src/main/java/${pkgPath}/MainActivity.kt`,
                language: "kotlin",
                content: updatedPkg
              };
            }
            if (f.path.endsWith("MainActivity.java")) {
              const updatedPkg = f.content.replace(/^package\s+[^;]+;/m, `package ${pkg};`);
              return {
                path: `app/src/main/java/${pkgPath}/MainActivity.java`,
                language: "java",
                content: updatedPkg
              };
            }
            return f;
          });
        } else {
          files = buildStarterFiles({
            safeName,
            pkg,
            languageId,
            minSdk: safeMinSdk,
            targetSdk: safeTargetSdk
          });
        }

        files = applyLogoBindingToFiles(files, logoDataUrl, logoFileName);

        return {
          id: id || `proj-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          name: safeName,
          packageName: pkg,
          description: description || `${safeName} Android Project`,
          languageId,
          minSdk: safeMinSdk,
          targetSdk: safeTargetSdk,
          logoDataUrl: logoDataUrl || "",
          logoFileName: logoFileName || "",
          updatedAt: new Date().toLocaleString("bn-BD"),
          files
        };
      }

      function validateProjectFiles(files) {
        const issues = [];
        if (!files || files.length === 0) {
          return [{ filePath: "project", message: "প্রজেক্টে কোনো ফাইল নেই।", severity: "error" }];
        }
        for (const f of files) {
          if (!f.content || !f.content.trim()) {
            issues.push({ filePath: f.path, message: "ফাইলটি খালি রয়েছে।", severity: "warning" });
          }
          if (f.path.endsWith(".xml") && !f.content.includes("<?xml")) {
            issues.push({ filePath: f.path, message: "XML ফাইলে <?xml ...?> হেডার রাখা ভালো।", severity: "warning" });
          }
        }
        return issues;
      }

      function localFallbackEdit(prompt, project, activeFile) {
        const target = activeFile || project.files[0];
        if (!target) return [];
        const comment = target.path.endsWith(".xml")
          ? `<!-- AI Command: ${prompt} -->\n`
          : target.path.endsWith(".txt")
          ? `# AI Command: ${prompt}\n`
          : `// AI Command: ${prompt}\n`;
        return [{ ...target, content: `${comment}${target.content}` }];
      }

      async function runAICommand({ prompt, project, activeFile, apiKey }) {
        const langMeta = getLanguageMeta(project.languageId);
        const minMeta = getMinSdkMeta(project.minSdk);

        if (apiKey && apiKey.trim().length > 10) {
          try {
            const filesContext = project.files
              .map((f) => `=== ${f.path} ===\n${f.content}`)
              .join("\n\n");

            const sysPrompt = `You are Droid AI Studio's Android code generator for "${project.name}" (${project.packageName}).
Project Language: ${langMeta.label}
Min SDK: API ${project.minSdk} (${minMeta.coverage} device coverage), Target/Compile SDK: API ${project.targetSdk}
Return ONLY valid JSON:
{
  "reply": "Short explanation in Bengali",
  "updatedFiles": [
    { "path": "exact/path", "language": "kotlin", "content": "full updated file content" }
  ]
}`;

            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(
                apiKey.trim()
              )}`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [
                    {
                      role: "user",
                      parts: [
                        {
                          text: `${sysPrompt}\n\nActive file: ${
                            activeFile?.path || "none"
                          }\nCommand: ${prompt}\n\nFiles:\n${filesContext}`
                        }
                      ]
                    }
                  ]
                })
              }
            );

            const data = await response.json();
            const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
            const cleaned = rawText
              .replace(/^```json\s*/i, "")
              .replace(/^```\s*/i, "")
              .replace(/```$/i, "")
              .trim();

            const parsed = JSON.parse(cleaned);
            if (Array.isArray(parsed.updatedFiles) && parsed.updatedFiles.length > 0) {
              return {
                reply: parsed.reply || "ফাইলগুলো আপডেট করা হয়েছে।",
                updatedFiles: parsed.updatedFiles
              };
            }
          } catch (err) {
            return {
              reply: `Gemini API ত্রুটি (${String(err)})। লোকাল আপডেট প্রয়োগ করা হয়েছে।`,
              updatedFiles: localFallbackEdit(prompt, project, activeFile)
            };
          }
        }

        return {
          reply:
            "API Key দেওয়া নেই, তাই বর্তমান ফাইলে কমান্ড অনুযায়ী কোড যুক্ত করা হয়েছে। পূর্ণ AI কোডিংয়ের জন্য Gemini API Key যুক্ত করুন।",
          updatedFiles: localFallbackEdit(prompt, project, activeFile)
        };
      }

      function toBase64Utf8(text) {
        const bytes = new TextEncoder().encode(text);
        let binary = "";
        for (let i = 0; i < bytes.length; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
      }

      async function getFileSha({ owner, repo, path, branch, token }) {
        const url = `https://api.github.com/repos/${encodeURIComponent(
          owner
        )}/${encodeURIComponent(repo)}/contents/${path}?ref=${encodeURIComponent(branch)}`;

        const res = await fetch(url, {
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github+json"
          }
        });

        if (res.status === 404) return undefined;
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`GitHub read failed (${res.status}): ${errText}`);
        }
        const json = await res.json();
        return json?.sha;
      }

      async function pushFilesToGitHub(params, onProgress) {
        const prefix = params.pathPrefix
          ? params.pathPrefix.replace(/^\/+|\/+$/g, "") + "/"
          : "";
        let count = 0;

        for (let i = 0; i < params.files.length; i++) {
          const file = params.files[i];
          const fullPath = `${prefix}${file.path.replace(/^\/+/, "")}`;
          onProgress?.(i + 1, params.files.length, fullPath);

          const sha = await getFileSha({
            owner: params.owner,
            repo: params.repo,
            path: fullPath,
            branch: params.branch,
            token: params.token
          });

          const url = `https://api.github.com/repos/${encodeURIComponent(
            params.owner
          )}/${encodeURIComponent(params.repo)}/contents/${fullPath}`;

          const res = await fetch(url, {
            method: "PUT",
            headers: {
              Authorization: `Bearer ${params.token}`,
              Accept: "application/vnd.github+json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: params.commitMessage || `Push ${fullPath} via Droid AI Studio`,
              content: toBase64Utf8(file.content),
              branch: params.branch || "main",
              ...(sha ? { sha } : {})
            })
          });

          if (!res.ok) {
            const errText = await res.text();
            throw new Error(`Push failed for ${fullPath} (${res.status}): ${errText}`);
          }
          count++;
        }

        return count;
      }

        const loadCloudProjectsForUser = async (uid) => {

          try {
            setCloudSyncStatus("syncing");
            const snap = await firebaseServices.db
              .collection("users")
              .doc(uid)

              .get();

            if (!snap.empty) {
              const cloudProjects = [];
              snap.forEach((doc) => {

                  cloudProjects.push({

                    languageId: data.languageId || "kotlin-compose",
                    minSdk: data.minSdk || 21,
                    targetSdk: data.targetSdk || 36
                  });
                }
              });

              if (cloudProjects.length > 0) {
                setProjects((prev) => {
                  const map = new Map();
                  for (const lp of prev) map.set(lp.id, lp);
                  for (const cp of cloudProjects) map.set(cp.id, cp);
                  return Array.from(map.values());
                });
              }

            setCloudSyncStatus("synced");

            console.warn("Cloud project load warning:", err);
            setCloudSyncStatus("error");

        // Sync Firestore user activity profile (users/{uid} & user_emails/{emailKey})
        const syncUserTrackingRecord = async ({

          incrementLogin = false,
          overrideProjectCount,

          overrideLanguage,
          overrideMinSdk
        }) => {
          const cleanEmail = String(email || "").trim().toLowerCase();

            typeof overrideProjectCount === "number" ? overrideProjectCount : projects.length;

          const prefLang = overrideLanguage || project?.languageId || "kotlin-compose";

          if (firebaseServices.mode === "firebase" && firebaseServices.db) {
            const db = firebaseServices.db;
            const userRef = db.collection("users").doc(uid);
            const emailRef = db.collection("user_emails").doc(emailKey);

            const snap = await userRef.get();
            const existingData = snap.exists ? snap.data() : {};
            const prevLogins = Number(existingData?.loginCount || 0);
            const nextLogins = incrementLogin ? prevLogins + 1 : Math.max(prevLogins, 1);

            const profilePayload = {
              uid,
              email: cleanEmail,
              createdAt: existingData?.createdAt || nowIso,
              lastLoginAt: incrementLogin ? nowIso : existingData?.lastLoginAt || nowIso,

            simMap = JSON.parse(localStorage.getItem(SIM_USERS_STORAGE_KEY) || "{}");

            simMap = {};

            uid: existing.uid || uid,
            email: cleanEmail,

            preferredLanguage: prefLang,

              SIM_SESSION_STORAGE_KEY,

        // Listen to Firebase Auth state or restore local simulation session
        useEffect(() => {
          if (firebaseServices.mode === "firebase" && firebaseServices.auth) {

              if (fbUser && fbUser.email) {

                  await syncUserTrackingRecord({
                    uid: fbUser.uid,
                    email: fbUser.email,
                    incrementLogin: false
                  });
                  await loadCloudProjectsForUser(fbUser.uid);

                  setCurrentUser({
                    uid: fbUser.uid,
                    email: fbUser.email,
                    createdAt: new Date().toISOString(),
                    lastLoginAt: new Date().toISOString(),
                    loginCount: 1,

                    lastActiveProject: project?.name || "IMO Studio App",
                    preferredLanguage: project?.languageId || "kotlin-compose",
                    preferredMinSdk: project?.minSdk || 21
                  });
                }
              } else {
                setCurrentUser(null);
                setCloudSyncStatus("idle");
              }
              setAuthChecked(true);
            });
            return () => unsub();
          } else {
            try {
              const rawSession = localStorage.getItem(SIM_SESSION_STORAGE_KEY);
              if (rawSession) {
                const parsed = JSON.parse(rawSession);
                if (parsed?.email) {
                  const simMap = JSON.parse(

                  const record = simMap[normalizeEmailKey(parsed.email)];

                    const { passwordHash, ...safeRecord } = record;
                    setCurrentUser(safeRecord);

        useEffect(() => {
          if (!currentUser?.uid || !currentUser?.email) return;

            setCloudSyncStatus("syncing");
            const safeFilesForFirestore = project.files.map((f) => {
              if (
                f.path === "app/src/main/res/drawable/app_logo_base64.txt" &&
                f.content.length > 750000
              ) {
                return {
                  ...f,
                  content: `Bound App Logo File: ${project.logoFileName || "ic_launcher.png"} (Stored locally)`
                };
              }
              return f;
            });

            const safeLogoForFirestore =
              project.logoDataUrl && project.logoDataUrl.length <= 200000
                ? project.logoDataUrl
                : "";

            firebaseServices.db
              .collection("users")
              .doc(currentUser.uid)
              .collection("projects")
              .doc(project.id)
              .set(
                {
                  id: project.id,
                  name: project.name,
                  packageName: project.packageName,
                  description: project.description,
                  languageId: project.languageId || "kotlin-compose",
                  minSdk: project.minSdk || 21,
                  targetSdk: project.targetSdk || 36,
                  logoDataUrl: safeLogoForFirestore,
                  logoFileName: project.logoFileName || "",
                  updatedAt: project.updatedAt || new Date().toLocaleString("bn-BD"),
                  files: safeFilesForFirestore
                },
                { merge: true }
              )
              .then(() => setCloudSyncStatus("synced"))
              .catch(() => setCloudSyncStatus("error"));
          }
        }, [
          projects.length,
          project?.id,
          project?.name,
          project?.updatedAt,
          project?.languageId,
          project?.minSdk,
          project?.targetSdk,
          firebaseServices
        ]);

        // Unified Email Auto Sign-Up & Existing Account Login (No Duplicate Accounts)
        const handleUnifiedEmailAuth = async (e) => {
          e.preventDefault();
          const cleanEmail = authEmail.trim().toLowerCase();
          const pass = authPassword;
          setAuthError("");
          setAuthSuccess("");

          if (!cleanEmail || !cleanEmail.includes("@")) {
            setAuthError("অনুগ্রহ করে একটি সঠিক ইমেইল ঠিকানা লিখুন।");
            return;
          }
          if (!pass || pass.length < 6) {
            setAuthError("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।");
            return;
          }

          setAuthBusy(true);
          try {
            if (firebaseServices.mode === "firebase" && firebaseServices.auth && firebaseServices.db) {
              const auth = firebaseServices.auth;
              const db = firebaseServices.db;
              const emailKey = normalizeEmailKey(cleanEmail);

              try {
                // Step 1: Attempt sign-in into existing account first
                const signInCred = await auth.signInWithEmailAndPassword(cleanEmail, pass);
                const profile = await syncUserTrackingRecord({
                  uid: signInCred.user.uid,
                  email: cleanEmail,
                  incrementLogin: true
                });
                await loadCloudProjectsForUser(signInCred.user.uid);
                setAuthSuccess(
                  `পুরনো অ্যাকাউন্টে লগইন সফল! (UID: ${profile.uid.slice(0, 10)}...)`
                );
                setAuthPassword("");
                return;
              } catch (signInErr) {
                const code = signInErr?.code || "";

                // Check Firestore email registry to prevent duplicate sign-up on wrong password
                let emailAlreadyInFirestore = false;
                try {
                  const emailDoc = await db.collection("user_emails").doc(emailKey).get();
                  emailAlreadyInFirestore = emailDoc.exists;
                } catch (_) {}

                if (code === "auth/wrong-password" || emailAlreadyInFirestore) {
                  setAuthError(
                    "এই ইমেইলটি আগে থেকেই নিবন্ধিত আছে। সঠিক পাসওয়ার্ড দিয়ে পুরনো অ্যাকাউন্টে লগইন করুন।"
                  );
                  return;
                }

                // Step 2: New email -> auto-create account with unique backend UID
                if (
                  code === "auth/user-not-found" ||
                  code === "auth/invalid-credential" ||
                  code === "auth/invalid-login-credentials"
                ) {
                  try {
                    const createCred = await auth.createUserWithEmailAndPassword(cleanEmail, pass);
                    const profile = await syncUserTrackingRecord({
                      uid: createCred.user.uid,
                      email: cleanEmail,
                      incrementLogin: true
                    });
                    setAuthSuccess(
                      `নতুন অ্যাকাউন্ট অটো তৈরি হয়েছে! (UID: ${profile.uid.slice(0, 10)}...)`
                    );
                    setAuthPassword("");
                    return;
                  } catch (createErr) {
                    if (createErr?.code === "auth/email-already-in-use") {
                      setAuthError(
                        "এই ইমেইলটি আগে থেকেই নিবন্ধিত আছে। সঠিক পাসওয়ার্ড দিয়ে পুরনো অ্যাকাউন্টে লগইন করুন।"
                      );
                      return;
                    }
                    throw createErr;
                  }
                }

                throw signInErr;
              }
            }

            // Local Simulation Mode (when hardcoded FIREBASE_CONFIG placeholders are still present)
            const emailKey = normalizeEmailKey(cleanEmail);
            let simMap = {};
            try {
              simMap = JSON.parse(localStorage.getItem(SIM_USERS_STORAGE_KEY) || "{}");
            } catch (_) {
              simMap = {};
            }

            const existingAccount = simMap[emailKey];
            if (existingAccount) {
              if (existingAccount.passwordHash !== btoa(unescape(encodeURIComponent(pass)))) {
                setAuthError(
                  "এই ইমেইলটি আগে থেকেই নিবন্ধিত আছে। সঠিক পাসওয়ার্ড দিয়ে পুরনো অ্যাকাউন্টে লগইন করুন।"
                );
                return;
              }
              const profile = await syncUserTrackingRecord({
                uid: existingAccount.uid,
                email: cleanEmail,
                incrementLogin: true
              });
              setAuthSuccess(
                `পুরনো অ্যাকাউন্টে লগইন সফল! (UID: ${profile.uid.slice(0, 12)}...)`
              );
              setAuthPassword("");
              return;
            }

            const newUid = generateBackendUid();
            simMap[emailKey] = {
              uid: newUid,
              email: cleanEmail,
              passwordHash: btoa(unescape(encodeURIComponent(pass))),
              createdAt: new Date().toISOString(),
              lastLoginAt: new Date().toISOString(),
              loginCount: 0,
              projectCount: projects.length,
              lastActiveProject: project?.name || "IMO Studio App",
              preferredLanguage: project?.languageId || "kotlin-compose",
              preferredMinSdk: project?.minSdk || 21

            localStorage.setItem(SIM_USERS_STORAGE_KEY, JSON.stringify(simMap));

            const profile = await syncUserTrackingRecord({
              uid: newUid,
              email: cleanEmail,
              incrementLogin: true
            });
            setAuthSuccess(
              `নতুন অ্যাকাউন্ট অটো তৈরি হয়েছে! (UID: ${profile.uid.slice(0, 12)}...)`
            );
            setAuthPassword("");
          } catch (err) {
            setAuthError(`প্রবেশ ব্যর্থ হয়েছে: ${err?.message || String(err)}`);
          } finally {
            setAuthBusy(false);
          }
        };

        const handleSaveProjectForm = (e) => {

            setProjects((prev) => prev.map((p) => (p.id === editingProjectId ? updated : p)));

            setSelectedPath(updated.files[0]?.path || "");
            setGhPrefix(`generated-projects/${updated.name.toLowerCase().replace(/\s+/g, "-")}`);
            setIsSetupOpen(false);
            setMessages((prev) => [

              {

          } else {

            });
            setProjects((prev) => [created, ...prev]);
            setActiveProjectId(created.id);
            setSelectedPath(created.files[0]?.path || "");
            setGhPrefix(`generated-projects/${created.name.toLowerCase().replace(/\s+/g, "-")}`);
            setIsSetupOpen(false);
            setMessages((prev) => [

        const handleSelectHistoryProject = (proj) => {
          setActiveProjectId(proj.id);
          setSelectedPath(proj.files[0]?.path || "");
          setGhPrefix(`generated-projects/${proj.name.toLowerCase().replace(/\s+/g, "-")}`);
          setIsHistoryModalOpen(false);
        };

        const handleDeleteHistoryProject = (e, targetId) => {
          e.stopPropagation();
          if (projects.length <= 1) return;
          const remaining = projects.filter((p) => p.id !== targetId);
          setProjects(remaining);
          if (activeProjectId === targetId) {
            setActiveProjectId(remaining[0].id);
            setSelectedPath(remaining[0].files[0]?.path || "");
          }
          if (firebaseServices.mode === "firebase" && firebaseServices.db && currentUser?.uid) {
            firebaseServices.db
              .collection("users")
              .doc(currentUser.uid)
              .collection("projects")
              .doc(targetId)
              .delete()
              .catch(() => {});
          }
        };

        const handleCreateNewFile = (e) => {
          e.preventDefault();
          const cleanPath = newFilePath.trim().replace(/^\/+/, "");
          if (!cleanPath) return;
          const exists = project.files.some((f) => f.path === cleanPath);
          if (exists) {
            setSelectedPath(cleanPath);
            setIsNewFileModalOpen(false);
            return;
          }
          const ext = cleanPath.split(".").pop()?.toLowerCase() || "txt";
          const lang =
            ext === "kt"
              ? "kotlin"
              : ext === "java"
              ? "java"
              : ext === "xml"
              ? "xml"
              : ext === "cpp" || ext === "h"
              ? "cpp"
              : "text";
          const starterContent =
            lang === "kotlin"
              ? `package ${project.packageName}\n\n// New Kotlin file\n`
              : lang === "java"
              ? `package ${project.packageName};\n\n// New Java file\n`
              : lang === "xml"
              ? `<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n`
              : `// ${cleanPath}\n`;

          updateCurrentProject((prev) => ({
            ...prev,
            files: [...prev.files, { path: cleanPath, language: lang, content: starterContent }]
          }));
          setSelectedPath(cleanPath);
          setIsNewFileModalOpen(false);
        };

        const handleSyncGradleSdk = () => {
          if (!project) return;
          updateCurrentProject((prev) => ({
            ...prev,
            files: prev.files.map((f) => {
              if (!f.path.endsWith("build.gradle.kts")) return f;
              return {
                ...f,
                content: f.content
                  .replace(/compileSdk\s*=\s*\d+/, `compileSdk = ${prev.targetSdk || 36}`)
                  .replace(/minSdk\s*=\s*\d+/, `minSdk = ${prev.minSdk || 21}`)
                  .replace(/targetSdk\s*=\s*\d+/, `targetSdk = ${prev.targetSdk || 36}`)
              };
            })
          }));
          setMessages((prev) => [
            ...prev,
            {
              id: `m-${Date.now()}`,
              role: "assistant",
              content: `Gradle SDK সিঙ্ক সম্পন্ন: minSdk = ${project.minSdk || 21} (${activeMinSdkMeta.coverage} সাপোর্ট), targetSdk = ${project.targetSdk || 36}।`
            }
          ]);
        };

        const handleCodeEdit = (val) => {
          if (!activeFile) return;
          updateCurrentProject((prev) => ({
            ...prev,
            files: prev.files.map((f) =>
              f.path === activeFile.path ? { ...f, content: val } : f
            )
          }));
        };

        const handleSendAI = async (e) => {
          e.preventDefault();
          if (!promptInput.trim() || isAILoading) return;
          const text = promptInput.trim();
          setPromptInput("");
          setMessages((prev) => [...prev, { id: `u-${Date.now()}`, role: "user", content: text }]);
          setIsAILoading(true);

          try {
            const res = await runAICommand({
              prompt: text,
              project,
              activeFile,
              apiKey
            });

            updateCurrentProject((prev) => {
              const map = new Map();
              for (const f of prev.files) map.set(f.path, f);
              for (const u of res.updatedFiles) map.set(u.path, u);
              return { ...prev, files: Array.from(map.values()) };
            });

            if (res.updatedFiles[0]?.path) {
              setSelectedPath(res.updatedFiles[0].path);
            }

            setMessages((prev) => [

        const handleGitHubPush = async (e) => {
